<div class="path">RecorderLnx/Уставки</div><h1>setTagSetpoint</h1>
<p>Меняет порог и состояние уставки. Изменение записывается в конфигурацию при сохранении проекта.</p><h2>Пример использования</h2>
<pre><code>local успешно = setTagSetpoint(&quot;Температура&quot;, &quot;highAlarm&quot;, 100, 1)</code></pre>
<p class="note">Двойной щелчок по функции в редакторе вставляет заготовку кода.</p>
</body></html>
