<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>while</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="path">Стандартные функции Lua/Циклы</div><h1>while</h1>
<p>Повторяет блок, пока условие истинно.</p><h2>Пример использования</h2>
<pre><code>local i = 1
while i &lt;= 5 do
  i = i + 1
end</code></pre>
<p class="note">Двойной щелчок по функции в редакторе вставляет заготовку кода.</p>
</body></html>
