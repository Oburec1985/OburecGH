<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>string.format</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="path">Стандартные функции Lua/Строки</div><h1>string.format</h1>
<p>Форматирует строку по правилам Lua.</p><h2>Пример использования</h2>
<pre><code>logMessage(string.format(&quot;Значение: %.2f&quot;, {E1}.Value))</code></pre>
<p class="note">Двойной щелчок по функции в редакторе вставляет заготовку кода.</p>
</body></html>
