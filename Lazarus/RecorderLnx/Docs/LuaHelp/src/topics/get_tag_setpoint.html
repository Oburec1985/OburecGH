<html lang="ru"><head><meta charset="utf-8"><title>getTagSetpoint</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="path">RecorderLnx/Уставки</div><h1>getTagSetpoint</h1>
<p>Возвращает порог и признак включения уставки (1 или 0). Типы: highAlarm, highWarning, lowWarning, lowAlarm.</p><h2>Пример использования</h2>
<pre><code>local порог, включена = getTagSetpoint(&quot;Температура&quot;, &quot;highAlarm&quot;)</code></pre>
<p class="note">Двойной щелчок по функции в редакторе вставляет заготовку кода.</p>
</body></html>
