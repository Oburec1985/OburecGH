<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>if ... then</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="path">Стандартные функции Lua/Условия</div><h1>if ... then</h1>
<p>Выполняет блок, когда условие истинно.</p><h2>Пример использования</h2>
<pre><code>if {Температура}.Value &gt; 80 then
  logMessage(&quot;Высокая температура&quot;)
end</code></pre>
<p class="note">Двойной щелчок по функции в редакторе вставляет заготовку кода.</p>
</body></html>
