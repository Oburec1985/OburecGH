<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>repeat ... until</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="path">Стандартные функции Lua/Циклы</div><h1>repeat ... until</h1>
<p>Повторяет блок до выполнения условия.</p><h2>Пример использования</h2>
<pre><code>local i = 1
repeat
  i = i + 1
until i &gt; 5</code></pre>
<p class="note">Двойной щелчок по функции в редакторе вставляет заготовку кода.</p>
</body></html>
