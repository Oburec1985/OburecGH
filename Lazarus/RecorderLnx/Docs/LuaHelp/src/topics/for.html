<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>for</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="path">Стандартные функции Lua/Циклы</div><h1>for</h1>
<p>Повторяет блок заданное число раз.</p><h2>Пример использования</h2>
<pre><code>for i = 1, 5 do
  logMessage(&quot;Шаг &quot; .. tostring(i))
end</code></pre>
<p class="note">Двойной щелчок по функции в редакторе вставляет заготовку кода.</p>
</body></html>
