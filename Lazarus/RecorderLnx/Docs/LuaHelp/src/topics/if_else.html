<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>if ... then ... else</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="path">Стандартные функции Lua/Условия</div><h1>if ... then ... else</h1>
<p>Выбирает один из двух блоков по условию.</p><h2>Пример использования</h2>
<pre><code>if {Давление}.Value &gt; 10 then
  {Состояние} = 1
else
  {Состояние} = 0
end</code></pre>
<p class="note">Двойной щелчок по функции в редакторе вставляет заготовку кода.</p>
</body></html>
