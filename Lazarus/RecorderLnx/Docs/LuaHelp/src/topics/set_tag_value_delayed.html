<div class="path">RecorderLnx/Система</div><h1>SetTagValue</h1>
<p>Записывает значение в тег из отдельного потока после указанной задержки в секундах.</p><h2>Пример использования</h2>
<pre><code>SetTagValue(&quot;Расчёт&quot;, 25.5, 1.0)</code></pre>
<p class="note">Двойной щелчок по функции в редакторе вставляет заготовку кода.</p>
