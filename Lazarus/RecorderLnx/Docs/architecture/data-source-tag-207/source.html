MockSineDataSource.Create(const ASourceId, ATagName: string;\n  AUpdateTimeMs: Cardinal; AAmplitude, AFrequencyHz: Double; APhaseRad: Double);\nbegin\n  if ATagName = '' then\n    raise ERecorderDataSourceError.Create('Mock sine tag name cannot be empty');\n\n  inherited Create(ASourceId, 'Mock sine data source', AUpdateTimeMs);\n  fTagName := ATagName;\n  fAmplitude := AAmplitude;\n  fFrequencyHz := AFrequencyHz;\n  fPhaseRad := APhaseRad;\nend;\n\nprocedure TMockSineDataSource.Start;\nbegin\n  fSampleIndex := 0;\n  fTimeSec := 0;\n  inherited Start;\nend;\n\nfunction TMockSineDataSource.GetTagName: string;\nbegin\n  if fTag <> nil then\n    Result := fTag.Name\n  else\n    Result := fTagName;\nend;\n\nprocedure TMockSineDataSource.DoCreateTags(ARegistry: TRecorderTagRegistry);\nvar\n  I: Integer;\nbegin\n  fTag := nil;\n  for I := 0 to ARegistry.TagCount - 1 do\n    if SameText(ARegistry.Tags[I].SourceId, SourceId) then\n    begin\n      fTag := ARegistry.Tags[I];\n      Break;\n    end;\n\n  if fTag <> nil then\n    fTagName := fTag.Name\n  else\n  begin\n    fTag := ARegistry.FindByName(fTagName);\n    if fTag = nil then\n      fTag := ARegistry.CreateTag(fTagName, 4096, True);\n  end;\n\n  fTag.Address := 'v';\n  fTag.UnitName := 'a.u.';\n  fTag.Description := 'Mock sine signal';\n  fTag.SourceId := SourceId;\n  fTag.IsVirtual := True;\n  fTag.ModuleType := 'virtual';\n  fTag.PollFrequencyHz := 1000.0 / UpdateTimeMs;\nend;\n\nprocedure TMockSineDataSource.DoTick;\nvar\n  lValue: Double;\nbegin\n  lValue := fAmplitude * Sin((2 * Pi * fFrequencyHz * fTimeSec) + fPhaseRad);\n  Registry.PublishValue(TagName, fTimeSec, lValue);\n\n  Inc(fSampleIndex);\n  fTimeSec := fTimeSec + (UpdateTimeMs / 1000.0);\nend;\n\n{ TRecorderDiagnosticsDataSource }\n\nconstructor TRecorderDiagnosticsDataSource.Create(const ASourceId: string;\n  AUpdateTimeMs: Cardinal; const AMemoryTagName: string; const ACpuTagName: string);\nbegin\n  inherited Create(ASourceId, 'Recorder diagnostics data source', AUpdateTimeMs);\n  if AMemoryTagName = '' then\n    raise ERecorderDataSourceError.Create('Diagnostics memory tag name cannot be empty');\n  if ACpuTagName = '' then\n    raise ERecorderDataSourceError.Create('Diagnostics CPU tag name cannot be empty');\n\n  fMemoryTagName := AMemoryTagName;\n  fCpuTagName := ACpuTagName;\n  fLastCpuTime100Ns := 0;\n  fLastWallTickMs := 0;\n  fTimeSec := 0;\n  {$IFDEF LINUX}\n  try fProcSelfStat := TFileStream.Create('/proc/self/stat', fmOpenRead or fmShareDenyNone); except fProcSelfStat := nil; end;\n  try fProcSelfStatus := TFileStream.Create('/proc/self/status', fmOpenRead or fmShareDenyNone); except fProcSelfStatus := nil; end;\n  try fProcSystemStat := TFileStream.Create('/proc/stat', fmOpenRead or fmShareDenyNone); except fProcSystemStat := nil; end;\n  fLastProcessTicks := 0;\n  fLastSystemTicks := 0;\n  fMetricsSampleCount := 0;\n  {$ENDIF}\nend;\n\ndestructor TRecorderDiagnosticsDataSource.Destroy;\nbegin\n  {$IFDEF LINUX}\n  fProcSystemStat.Free;\n  fProcSelfStatus.Free;\n  fProcSelfStat.Free;\n  {$ENDIF}\n  inherited Destroy;\nend;\n\nprocedure TRecorderDiagnosticsDataSource.Start;\nbegin\n  fLastCpuTime100Ns := 0;\n  fLastWallTickMs := 0;\n  fTimeSec := 0;\n  {$IFDEF LINUX}\n  fLastProcessTicks := 0;\n  fLastSystemTicks := 0;\n  fMetricsSampleCount := 0;\n  {$ENDIF}\n  inherited Start;\nend;\n\nfunction TRecorderDiagnosticsDataSource.GetMemoryTagName: string;\nbegin\n  if fMemoryTag <> nil then\n    Result := fMemoryTag.Name\n  else\n    Result := fMemoryTagName;\nend;\n\nfunction TRecorderDiagnosticsDataSource.GetCpuTagName: string;\nbegin\n  if fCpuTag <> nil then\n    Result := fCpuTag.Name\n  else\n    Result := fCpuTagName;\nend;\n\nprocedure TRecorderDiagnosticsDataSource.DoCreateTags(ARegistry: TRecorderTagRegistry);\nvar\n  lTag: TRecorderTag;\n  I: Integer;\nbegin\n  fMemoryTag := nil;\n  fCpuTag := nil;\n  for I := 0 to ARegistry.TagCount - 1 do\n  begin\n    lTag := ARegistry.Tags[I];\n    if SameText(lTag.SourceId, SourceId) then\n    begin\n      if SameText(lTag.Address, 'diagnostics.memory') then\n        fMemoryTag := lTag\n      else if SameText(lTag.Address, 'diagnostics.cpu') then\n        fCpuTag := lTag;\n    end;\n  end;\n\n  if fMemoryTag <> nil then\n    fMemoryTagName := fMemoryTag.Name\n  else\n  begin\n    fMemoryTag := ARegistry.FindByName(fMemoryTagName);\n    if fMemoryTag = nil then\n      fMemoryTag := ARegistry.CreateTag(fMemoryTagName, 4096, True);\n  end;\n  fMemoryTag.Address := 'diagnostics.memory';\n  fMemoryTag.UnitName := 'MB';\n  fMemoryTag.Description := 'Recorder process memory usage';\n  fMemoryTag.SourceId := SourceId;\n  fMemoryTag.IsVirtual := True;\n  fMemoryTag.ModuleType := 'diagnostics';\n  fMemoryTag.PollFrequencyHz := 1000.0 / UpdateTimeMs;\n\n  if fCpuTag <> nil then\n    fCpuTagName := fCpuTag.Name\n  else\n  begin\n    fCpuTag := ARegistry.FindByName(fCpuTagName);\n    if fCpuTag = nil then\n      fCpuTag := ARegistry.CreateTag(fCpuTagName, 4096, True);\n  end;\n  fCpuTag.Address := 'diagnostics.cpu';\n  fCpuTag.UnitName := '%';\n  fCpuTag.Description := 'Recorder process CPU usage';\n  fCpuTag.SourceId := SourceId;\n  fCpuTag.IsVirtual := True;\n  fCpuTag.ModuleType := 'diagnostics';\n  fCpuTag.PollFrequencyHz := 1000.0 / UpdateTimeMs;\nend;\n\nfunction TRecorderDiagnosticsDataSource.GetProcessMemoryMb: Double;\n{$IFDEF MSWINDOWS}\nvar\n  lCounters: TProcessMemoryCounters;\nbegin\n  FillChar(lCounters, SizeOf(lCounters), 0);\n  lCounters.cb := SizeOf(lCounters);\n  if GetProcessMemoryInfo(GetCurrentProcess, lCounters, SizeOf(lCounters)) then\n    Result := lCounters.WorkingSetSize / (1024.0 * 1024.0)\n  else\n    Result := 0;\nend;\n{$ELSE}\n{$IFDEF LINUX}\nvar\n  lBuffer: TProcBuffer;\n  lCursor, lEnd: PChar;\n  lLength: Integer;\n  lValueKb: QWord;\nbegin\n  Result := 0;\n  if not ReadProcBuffer(fProcSelfStatus, lBuffer, lLength) then Exit;\n  lCursor := @lBuffer[0];\n  lEnd := lCursor + lLength;\n  while lCursor + 6 < lEnd do\n  begin\n    if CompareMem(lCursor, PChar('VmRSS:'), 6) then\n    begin\n      Inc(lCursor, 6);\n      if ParseProcUnsigned(lCursor, lEnd, lValueKb) then\n        Result := lValueKb / 1024.0;\n      Exit;\n    end;\n    while (lCursor < lEnd) and (lCursor^ <> #10) do Inc(lCursor);\n    if lCursor < lEnd then Inc(lCursor);\n  end;\nend;\n{$ELSE}\nbegin\n  Result := 0;\nend;\n{$ENDIF}\n{$ENDIF}\n\nfunction TRecorderDiagnosticsDataSource.GetProcessCpuUsagePercent: Double;\n{$IFDEF MSWINDOWS}\nvar\n  lCreationTime: TFileTime;\n  lExitTime: TFileTime;\n  lKernelTime: TFileTime;\n  lNowMs: QWord;\n  lProcessDelta100Ns: QWord;\n  lProcessTime100Ns: QWord;\n  lProcessorCount: Cardinal;\n  lSystemInfo: TSystemInfo;\n  lUserTime: TFileTime;\n  lWallDelta100Ns: QWord;\n\n  function FileTimeToQWord(const AValue: TFileTime): QWord;\n  begin\n    Result := (QWord(AValue.dwHighDateTime) shl 32) or QWord(AValue.dwLowDateTime);\n  end;\nbegin\n  Result := 0;\n  lNowMs := GetTickCount64;\n  if not GetProcessTimes(GetCurrentProcess, lCreationTime, lExitTime, lKernelTime,\n    lUserTime) then\n    Exit;\n\n  lProcessTime100Ns := FileTimeToQWord(lKernelTime) + FileTimeToQWord(lUserTime);\n  if (fLastWallTickMs = 0) or (fLastCpuTime100Ns = 0) then\n  begin\n    fLastWallTickMs := lNowMs;\n    fLastCpuTime100Ns := lProcessTime100Ns;\n    Exit;\n  end;\n\n  lWallDelta100Ns := (lNowMs - fLastWallTickMs) * 10000;\n  lProcessDelta100Ns := lProcessTime100Ns - fLastCpuTime100Ns;\n  fLastWallTickMs := lNowMs;\n  fLastCpuTime100Ns := lProcessTime100Ns;\n  if lWallDelta100Ns = 0 then\n    Exit;\n\n  GetSystemInfo(lSystemInfo);\n  lProcessorCount := lSystemInfo.dwNumberOfProcessors;\n  if lProcessorCount = 0 then\n    lProcessorCount := 1;\n  Result := (lProcessDelta100Ns / lWallDelta100Ns) * 100.0 / lProcessorCount;\n  Result := Max(0.0, Min(100.0, Result));\nend;\n{$ELSE}\n{$IFDEF LINUX}\nvar\n  lBuffer: TProcBuffer;\n  lCursor, lEnd, lToken: PChar;\n  lField, lLength: Integer;\n  lProcessTicks, lSystemTicks, lValue: QWord;\n  lUserTicks, lKernelTicks: QWord;\nbegin\n  Result := 0;\n  if not ReadProcBuffer(fProcSelfStat, lBuffer, lLength) then Exit;\n  lCursor := @lBuffer[0];\n  lEnd := lCursor + lLength;\n  while (lEnd > lCursor) and ((lEnd - 1)^ <> ')') do Dec(lEnd);\n  if lEnd <= lCursor then Exit;\n  Inc(lEnd);\n  lCursor := lEnd;\n  lEnd := @lBuffer[0] + lLength;\n  lField := 3;\n  lUserTicks := 0;\n  lKernelTicks := 0;\n  while (lCursor < lEnd) and (lField <= 15) do\n  begin\n    while (lCursor < lEnd) and (lCursor^ in [' ', #9]) do Inc(lCursor);\n    lToken := lCursor;\n    while (lCursor < lEnd) and not (lCursor^ in [' ', #9, #10]) do Inc(lCursor);\n    if lField = 14 then\n      ParseProcUnsigned(lToken, lCursor, lUserTicks)\n    else if lField = 15 then\n      ParseProcUnsigned(lToken, lCursor, lKernelTicks);\n    Inc(lField);\n  end;\n  lProcessTicks := lUserTicks + lKernelTicks;\n\n  if not ReadProcBuffer(fProcSystemStat, lBuffer, lLength) then Exit;\n  lCursor := @lBuffer[0];\n  lEnd := lCursor + lLength;\n  if (lLength < 4) or not CompareMem(lCursor, PChar('cpu '), 4) then Exit;\n  Inc(lCursor, 4);\n  lSystemTicks := 0;\n  while (lCursor < lEnd) and (lCursor^ <> #10) do\n  begin\n    if not ParseProcUnsigned(lCursor, lEnd, lValue) then Break;\n    Inc(lSystemTicks, lValue);\n  end;\n\n  if (fLastSystemTicks <> 0) and (lSystemTicks > fLastSystemTicks) and\n     (lProcessTicks >= fLastProcessTicks) then\n    Result := 100.0 * (lProcessTicks - fLastProcessTicks) /\n      (lSystemTicks - fLastSystemTicks);\n  fLastProcessTicks := lProcessTicks;\n  fLastSystemTicks := lSystemTicks;\n  Result := Max(0.0, Min(100.0, Result));\nend;\n{$ELSE}\nbegin\n  Result := 0;\nend;\n{$ENDIF}\n{$ENDIF}\n\nprocedure TRecorderDiagnosticsDataSource.DoTick;\nvar\n  lCpuPercent, lMemoryMb: Double;\nbegin\n  lMemoryMb := GetProcessMemoryMb;\n  lCpuPercent := GetProcessCpuUsagePercent;\n  Registry.PublishValue(MemoryTagName, fTimeSec, lMemoryMb);\n  Registry.PublishValue(CpuTagName, fTimeSec, lCpuPercent);\n  {$IFDEF LINUX}\n  Inc(fMetricsSampleCount);\n  if fMetricsSampleCount = 2 then\n    RecorderDebugLog(Format('Diagnostics metrics: MemTag=%.3f MB CpuUsage=%.3f%%',\n      [lMemoryMb, lCpuPercent]));\n  {$ENDIF}\n  fTimeSec := fTimeSec + (UpdateTimeMs / 1000.0);\nend;\n\ntype\n  { TMeraPlaybackSignal\n    Вспомогательный класс для воспроизведения отдельного сигнала из файла MERA. }\n  TMeraPlaybackSignal = class\n  private\n    fCachedTimeSec: Double;             { Время кэшированного отсчета }\n    fCachedValue: Double;                { Значение кэшированного отсчета }\n    fDataStream: TFileStream;           { Файловый поток значений (Y) }\n    fHasCachedSample: Boolean;          { Наличие кэшированного отсчета }\n    fInfo: TMeraSignalInfo;             { Информация о сигнале MERA }\n    fSampleIndex: Int64;                { Счетчик прочитанных отсчетов }\n    fTagName: string;                   { Имя целевого тега }\n    fTimeStream: TFileStream;           { Файловый поток времени (X) для неравномерных сигналов }\n    \n    fBlockTimes: TRecorderDoubleArray;\n    fBlockValues: TRecorderDoubleArray;\n    fReadSingles: array of Single;\n\n    function GetDataSize: Integer;\n    function IsScalar: Boolean;\n    function ReadRawValue(out AValue: Double): Boolean;\n    function ReadRawBlock(AMaxCount: Integer): Integer;\n    function ReadSample(out ATimeSec, AValue: Double): Boolean;\n    function EnsureCachedSample: Boolean;\n  public\n    { Конструктор проигрывателя сигнала }\n    constructor Create(ASignal: TMeraSignalInfo);\n    { Деструктор закрывает потоки }\n    destructor Destroy; override;\n    { Открытие файлов данных }\n    procedure Open;\n    { Закрытие файлов }\n    procedure Close;\n    { Перемотка в начало }\n    procedure Rewind;\n    procedure PrepareVectorBuffers(AUpdateTimeMs: Cardinal;\n      ABlockLength: Cardinal);\n    { Публикует следующий отсчет }\n    function PublishNext(ARegistry: TRecorderTagRegistry): Boolean;\n    { Публикует скалярные отсчеты, время которых подошло к текущему }\n    function PublishScalarDue(ARegistry: TRecorderTagRegistry; APlayTimeSec: Double;\n      AMaxSamples: Integer): Boolean;\n    { Публикует векторные блоки данных }\n    function PublishVectorDue(ARegistry: TRecorderTagRegistry; APlayTimeSec: Double;\n      AUpdateTimeMs: Cardinal; ABlockLength: Cardinal; AMaxBlocks: Integer): Boolean;\n    property TagName: string read fTagName;\n  end;\n\nconstructor TMeraPlaybackSignal.Create(ASignal: TMeraSignalInfo);\nbegin\n  inherited Create;\n  if ASignal = nil then\n    raise ERecorderDataSourceError.Create('MERA signal cannot be nil');\n\n  fInfo := ASignal;\n  fTagName := MeraSignalToRecorderTagName(ASignal);\nend;\n\ndestructor TMeraPlaybackSignal.Destroy;\nbegin\n  Close;\n  FreeAndNil(fInfo);\n  inherited Destroy;\nend;\n\nfunction TMeraPlaybackSignal.GetDataSize: Integer;\nbegin\n  Result := MeraValueTypeSize(fInfo.DataType);\nend;\n\nfunction TMeraPlaybackSignal.IsScalar: Boolean;\nbegin\n  Result := fInfo.HasXData or (fInfo.FrequencyHz <= 0);\nend;\n\nprocedure TMeraPlaybackSignal.Open;\nbegin\n  Close;\n  if not FileExists(fInfo.FileName) then\n    raise ERecorderDataSourceError.CreateFmt('MERA data file not found: %s',\n      [fInfo.FileName]);\n\n  fDataStream := TFileStream.Create(fInfo.FileName, fmOpenRead or fmShareDenyNone);\n  if fInfo.HasXData then\n  begin\n    if not FileExists(fInfo.XFileName) then\n      raise ERecorderDataSourceError.CreateFmt('MERA time file not found: %s',\n        [fInfo.XFileName]);\n    fTimeStream := TFileStream.Create(fInfo.XFileName, fmOpenRead or fmShareDenyNone);\n  end;\n  Rewind;\nend;\n\nprocedure TMeraPlaybackSignal.Close;\nbegin\n  FreeAndNil(fTimeStream);\n  FreeAndNil(fDataStream);\nend;\n\nprocedure TMeraPlaybackSignal.Rewind;\nbegin\n  if fDataStream <> nil then\n    fDataStream.Position := 0;\n  if fTimeStream <> nil then\n    fTimeStream.Position := 0;\n  fSampleIndex := 0;\n  fCachedTimeSec := 0;\n  fCachedValue := 0;\n  fHasCachedSample := False;\nend;\n\nprocedure TMeraPlaybackSignal.PrepareVectorBuffers(AUpdateTimeMs: Cardinal;\n  ABlockLength: Cardinal);\nvar\n  lCapacity: Integer;\nbegin\n  if IsScalar then\n    Exit;\n  if ABlockLength > 0 then\n    lCapacity := ABlockLength\n  else\n  begin\n    if AUpdateTimeMs = 0 then\n      AUpdateTimeMs := 1;\n    lCapacity := Round(fInfo.FrequencyHz * AUpdateTimeMs / 1000.0);\n  end;\n  if lCapacity < 1 then\n    lCapacity := 1;\n  SetLength(fBlockTimes, lCapacity);\n  SetLength(fBlockValues, lCapacity);\n  if fInfo.DataType = mvtFloat32 then\n    SetLength(fReadSingles, lCapacity)\n  else\n    SetLength(fReadSingles, 0);\nend;\n\nfunction TMeraPlaybackSignal.ReadRawValue(out AValue: Double): Boolean;\nvar\n  lDouble: Double;\n  lSingle: Single;\n  lInt32: LongInt;\n  lUInt32: LongWord;\n  lInt16: SmallInt;\n  lUInt16: Word;\nbegin\n  Result := False;\n  AValue := 0;\n  if (fDataStream = nil) or (fDataStream.Position + GetDataSize > fDataStream.Size) then\n    Exit;\n\n  case fInfo.DataType of\n    mvtFloat64:\n      begin\n        fDataStream.ReadBuffer(lDouble, SizeOf(lDouble));\n        AValue := lDouble;\n      end;\n    mvtFloat32:\n      begin\n        fDataStream.ReadBuffer(lSingle, SizeOf(lSingle));\n        AValue := lSingle;\n      end;\n    mvtInt32:\n      begin\n        fDataStream.ReadBuffer(lInt32, SizeOf(lInt32));\n        AValue := lInt32;\n      end;\n    mvtUInt32:\n      begin\n        fDataStream.ReadBuffer(lUInt32, SizeOf(lUInt32));\n        AValue := lUInt32;\n      end;\n    mvtInt16:\n      begin\n        fDataStream.ReadBuffer(lInt16, SizeOf(lInt16));\n        AValue := lInt16;\n      end;\n    mvtUInt16:\n      begin\n        fDataStream.ReadBuffer(lUInt16, SizeOf(lUInt16));\n        AValue := lUInt16;\n      end;\n  end;\n  Result := True;\nend;\n\nfunction TMeraPlaybackSignal.ReadRawBlock(AMaxCount: Integer): Integer;\nvar\n  I: Integer;\n  lAvailable: Int64;\n  lValue: Double;\nbegin\n  Result := 0;\n  if (AMaxCount <= 0) or (fDataStream = nil) then\n    Exit;\n  if AMaxCount > Length(fBlockValues) then\n    raise ERecorderDataSourceError.Create(\n      'MERA vector buffer is smaller than configured block');\n\n  lAvailable := (fDataStream.Size - fDataStream.Position) div GetDataSize;\n  if lAvailable <= 0 then\n    Exit;\n  if lAvailable < AMaxCount then\n    AMaxCount := Integer(lAvailable);\n\n  { Высокочастотные MERA-сигналы R4 читаем одной порцией. Файловый вызов на\n    каждый отсчёт при Fs=57600 превращал периодический worker в busy-loop. }\n  if fInfo.DataType = mvtFloat32 then\n  begin\n    if AMaxCount > Length(fReadSingles) then\n      raise ERecorderDataSourceError.Create(\n        'MERA R4 read buffer is smaller than configured block');\n    fDataStream.ReadBuffer(fReadSingles[0], AMaxCount * SizeOf(Single));\n    for I := 0 to AMaxCount - 1 do\n      fBlockValues[I] := fReadSingles[I];\n    Exit(AMaxCount);\n  end;\n\n  { Редкие legacy-типы сохраняют прежнее преобразование. Основной R4-путь\n    выше не выполняет поточечных файловых операций. }\n  while (Result < AMaxCount) and ReadRawValue(lValue) do\n  begin\n    fBlockValues[Result] := lValue;\n    Inc(Result);\n  end;\nend;\n\nfunction TMeraPlaybackSignal.ReadSample(out ATimeSec, AValue: Double): Boolean;\nbegin\n  Result := False;\n  ATimeSec := 0;\n  AValue := 0;\n\n  if fTimeStream <> nil then\n  begin\n    if fTimeStream.Position + SizeOf(Double) > fTimeStream.Size then\n      Exit;\n    fTimeStream.ReadBuffer(ATimeSec, SizeOf(Double));\n    ATimeSec := ATimeSec + fInfo.StartSec;\n  end\n  else\n  begin\n    if fInfo.FrequencyHz <= 0 then\n      Exit;\n    ATimeSec := fInfo.StartSec + (fSampleIndex / fInfo.FrequencyHz);\n  end;\n\n  if not ReadRawValue(AValue) then\n    Exit;\n\n  Inc(fSampleIndex);\n  Result := True;\nend;\n\nfunction TMeraPlaybackSignal.EnsureCachedSample: Boolean;\nbegin\n  Result := fHasCachedSample;\n  if Result then\n    Exit;\n\n  Result := ReadSample(fCachedTimeSec, fCachedValue);\n  fHasCachedSample := Result;\nend;\n\nfunction TMeraPlaybackSignal.PublishNext(ARegistry: TRecorderTagRegistry): Boolean;\nvar\n  lTimeSec: Double;\n  lValue: Double;\nbegin\n  Result := False;\n  if ARegistry = nil then\n    Exit;\n\n  if not ReadSample(lTimeSec, lValue) then\n    Exit;\n\n  ARegistry.PublishValue(fTagName, lTimeSec, lValue);\n  Result := True;\nend;\n\nfunction TMeraPlaybackSignal.PublishScalarDue(ARegistry: TRecorderTagRegistry;\n  APlayTimeSec: Double; AMaxSamples: Integer): Boolean;\nvar\n  lPublished: Integer;\nbegin\n  Result := False;\n  lPublished := 0;\n  while (lPublished < AMaxSamples) and EnsureCachedSample and\n    (fCachedTimeSec <= APlayTimeSec) do\n  begin\n    ARegistry.PublishValue(fTagName, fCachedTimeSec, fCachedValue);\n    fHasCachedSample := False;\n    Inc(lPublished);\n    Result := True;\n  end;\nend;\n\nfunction TMeraPlaybackSignal.PublishVectorDue(ARegistry: TRecorderTagRegistry;\n  APlayTimeSec: Double; AUpdateTimeMs: Cardinal; ABlockLength: Cardinal;\n  AMaxBlocks: Integer): Boolean;\nvar\n  I: Integer;\n  lAutoBlockLength: Boolean;\n  lBlocks: Integer;\n  lCount: Integer;\n  lTimeSec: Double;\nbegin\n  Result := False;\n  if (ARegistry = nil) or IsScalar or (fInfo.FrequencyHz <= 0) then\n    Exit;\n  lAutoBlockLength := ABlockLength = 0;\n  if ABlockLength = 0 then\n  begin\n    if AUpdateTimeMs = 0 then\n      AUpdateTimeMs := 1;\n    ABlockLength := Round(fInfo.FrequencyHz * AUpdateTimeMs / 1000.0);\n    if ABlockLength = 0 then\n      ABlockLength := 1;\n    AMaxBlocks := 1;\n  end;\n\n  lBlocks := 0;\n  if (ABlockLength > Cardinal(Length(fBlockValues))) or\n    (ABlockLength > Cardinal(Length(fBlockTimes))) then\n    raise ERecorderDataSourceError.Create(\n      'MERA vector buffers were not prepared for configured block');\n  while (lBlocks < AMaxBlocks) and\n    (((not lAutoBlockLength) and\n      (fInfo.StartSec + (fSampleIndex / fInfo.FrequencyHz) <= APlayTimeSec)) or\n     (lAutoBlockLength and\n      (fInfo.StartSec + ((fSampleIndex + ABlockLength - 1) / fInfo.FrequencyHz) <=\n      APlayTimeSec))) do\n  begin\n    lCount := ReadRawBlock(ABlockLength);\n    for I := 0 to lCount - 1 do\n    begin\n      lTimeSec := fInfo.StartSec + ((fSampleIndex + I) / fInfo.FrequencyHz);\n      fBlockTimes[I] := lTimeSec;\n    end;\n    Inc(fSampleIndex, lCount);\n\n    if lCount = 0 then\n      Break;\n\n    ARegistry.PublishBlock(fTagName, fBlockTimes, fBlockValues, lCount);\n    { Streaming debug: MERA block log suppressed.\n    RecorderDebugLog(Format('MERA block: tag=%s count=%d first=%.6f last=%.6f blockLength=%d update=%dms',\n      [fTagName, lCount, lTimes[0], lTimes[lCount - 1], ABlockLength,\n      AUpdateTimeMs])); }\n    Result := True;\n    Inc(lBlocks);\n  end;\nend;\n\n{ TRecorderMeraFileDataSource }\n\nconstructor TRecorderMeraFileDataSource.Create(const ASourceId, AFileName: string;\n  AUpdateTimeMs: Cardinal; ASelectedTagNames: TStrings; ABlockLength: Cardinal;\n  APlaybackSpeed: Cardinal);\nbegin\n  if AFileName = '' then\n    raise ERecorderDataSourceError.Create('MERA file name cannot be empty');\n  if APlaybackSpeed = 0 then\n    raise ERecorderDataSourceError.Create('MERA playback speed must be positive');\n\n  inherited Create(ASourceId, 'MERA file playback', AUpdateTimeMs);\n  fFileName := AFileName;\n  fBlockLength := ABlockLength;\n  fPlaybackSpeed := APlaybackSpeed;\n  fPlaybackSignals := TList.Create;\n  fSelectedTagNames := TStringList.Create;\n  fSelectedTagNames.CaseSensitive := False;\n  fSelectedTagNames.Sorted := False;\n  if ASelectedTagNames <> nil then\n    fSelectedTagNames.Assign(ASelectedTagNames);\nend;\n\ndestructor TRecorderMeraFileDataSource.Destroy;\nbegin\n  Stop;\n  while fPlaybackSignals.Count > 0 do\n  begin\n    TObject(fPlaybackSignals[0]).Free;\n    fPlaybackSignals.Delete(0);\n  end;\n  fPlaybackSignals.Free;\n  fSelectedTagNames.Free;\n  inherited Destroy;\nend;\n\nfunction TRecorderMeraFileDataSource.IsSignalSelected(ASignal: TMeraSignalInfo): Boolean;\nbegin\n  Result := (fSelectedTagNames.Count = 0) or\n    IsSignalTagSelected(ASignal.Address) or\n    IsSignalTagSelected(ASignal.Name) or\n    IsSignalTagSelected(MeraSignalToRecorderTagName(ASignal));\nend;\nfunction TRecorderMeraFileDataSource.IsSignalTagSelected(\n  const ATagName: string): Boolean;\nbegin\n  Result := fSelectedTagNames.IndexOf(ATagName) >= 0;\nend;\n\nprocedure TRecorderMeraFileDataSource.DoCreateTags(ARegistry: TRecorderTagRegistry);\nvar\n  I: Integer;\n  J: Integer;\n  lSignal: TMeraSignalInfo;\n  lSignals: TList;\n  lTag: TRecorderTag;\n  lUpdated: Boolean;\n  lDisplayAddress: string;\n  lSourceId: string;\n  lTagName: string;\n\n  function UniqueTagName(const ABaseName: string): string;\n  var\n    lBase: string;\n    lIndex: Integer;\n  begin\n    lBase := Trim(ABaseName);\n    if lBase = '' then\n      lBase := 'Tag';\n    Result := lBase;\n    lIndex := 2;\n    while (ARegistry <> nil) and (ARegistry.FindByName(Result) <> nil) do\n    begin\n      Result := Format('%s_%d', [lBase, lIndex]);\n      Inc(lIndex);\n    end;\n  end;\n\n  procedure UpdateTag(ATag: TRecorderTag);\n  begin\n    ATag.Address := lDisplayAddress;\n    if ATag.AutoUnit then\n      ATag.UnitName := lSignal.UnitsName;\n    ATag.ModuleType := lSignal.ModuleName;\n    ATag.PollFrequencyHz := lSignal.FrequencyHz;\n    ATag.SensorCalibrationName := lSignal.SensorCalibrationName;\n    ATag.AmplifierCalibrationName := lSignal.AmplifierCalibrationName;\n    ATag.SourceId := lSourceId;\n    ATag.IsVirtual := True;\n    if Trim(ATag.Description) = '' then\n      ATag.Description := Format('%s; type=%s; freq=%s; file=%s',\n        [lSignal.Name, lSignal.DataTypeName,\n        FormatFloat('0.######', lSignal.FrequencyHz),\n        ExtractFileName(lSignal.FileName)]);\n  end;\n\nbegin\n  if not FileExistsUTF8(fFileName) then\n    Exit;\n\n  lSignals := TList.Create;\n  try\n    LoadMeraSignalsFromFile(fFileName, lSignals);\n    lSourceId := 'Mera file: ' + fFileName;\n    for I := 0 to lSignals.Count - 1 do\n    begin\n      lSignal := TMeraSignalInfo(lSignals[I]);\n      if not IsSignalSelected(lSignal) then\n        Continue;\n      lDisplayAddress := RecorderTreeIndexedAddress(ARegistry, lSourceId,\n        lSignal.Address, True);\n\n      lUpdated := False;\n      for J := 0 to ARegistry.TagCount - 1 do\n      begin\n        lTag := ARegistry.Tags[J];\n        if SameText(lTag.SourceId, lSourceId) and\n          SameText(lTag.Address, lDisplayAddress) then\n        begin\n          UpdateTag(lTag);\n          lUpdated := True;\n        end;\n      end;\n\n      if not lUpdated then\n      begin\n        lTagName := MeraSignalToRecorderTagName(lSignal);\n        lTag := ARegistry.FindByName(lTagName);\n        if (lTag <> nil) and SameText(lTag.SourceId, lSourceId) then\n        begin\n          RecorderDebugLog(Format(\n            '[MeraFile] Relink tag by name \"%s\": old address=\"%s\", new address=\"%s\"',\n            [lTag.Name, lTag.Address, lDisplayAddress]));\n        end\n        else\n        begin\n          if lTag <> nil then\n            lTagName := UniqueTagName(lTagName);\n          lTag := ARegistry.CreateTag(lTagName, 4096, True);\n        end;\n        UpdateTag(lTag);\n      end;\n    end;\n  finally\n    ClearMeraSignals(lSignals);\n    lSignals.Free;\n  end;\nend;\nprocedure TRecorderMeraFileDataSource.Start;\nvar\n  I: Integer;\n  J: Integer;\n  lHasRange: Boolean;\n  lLinked: Boolean;\n  lSourceId: string;\n  lSignal: TMeraSignalInfo;\n  lSignals: TList;\n  lTag: TRecorderTag;\n  lDisplayAddress: string;\n\n  procedure AddPlaybackSignal(ASourceSignal: TMeraSignalInfo; const ATagName: string);\n  var\n    lPlaybackSignal: TMeraPlaybackSignal;\n    lSignalCopy: TMeraSignalInfo;\n  begin\n    lSignalCopy := TMeraSignalInfo.Create;\n    try\n      lSignalCopy.Name := ATagName;\n      lSignalCopy.Address := ASourceSignal.Address;\n      lSignalCopy.ModuleName := ASourceSignal.ModuleName;\n      lSignalCopy.DataTypeName := ASourceSignal.DataTypeName;\n      lSignalCopy.DataType := ASourceSignal.DataType;\n      lSignalCopy.FrequencyHz := ASourceSignal.FrequencyHz;\n      lSignalCopy.StartSec := ASourceSignal.StartSec;\n      lSignalCopy.UnitsName := ASourceSignal.UnitsName;\n      lSignalCopy.Description := ASourceSignal.Description;\n      lSignalCopy.SensorCalibrationName := ASourceSignal.SensorCalibrationName;\n      lSignalCopy.AmplifierCalibrationName := ASourceSignal.AmplifierCalibrationName;\n      lSignalCopy.FileName := ASourceSignal.FileName;\n      lSignalCopy.XFileName := ASourceSignal.XFileName;\n      lSignalCopy.HasXData := ASourceSignal.HasXData;\n      lSignalCopy.Enabled := ASourceSignal.Enabled;\n      lSignalCopy.Selected := ASourceSignal.Selected;\n\n      lPlaybackSignal := TMeraPlaybackSignal.Create(lSignalCopy);\n      lSignalCopy := nil;\n      try\n        lPlaybackSignal.PrepareVectorBuffers(UpdateTimeMs, fBlockLength);\n        lPlaybackSignal.Open;\n        fPlaybackSignals.Add(lPlaybackSignal);\n        lPlaybackSignal := nil;\n      finally\n        lPlaybackSignal.Free;\n      end;\n    finally\n      lSignalCopy.Free;\n    end;\n  end;\n\nbegin\n  inherited Start;\n  fFirstBlockLogged := False;\n  lHasRange := False;\n  lSourceId := 'Mera file: ' + fFileName;\n  fPlayRangeMinSec := 0;\n  fStartTickMs := GetTickCount64;\n\n  if not FileExistsUTF8(fFileName) then\n    Exit;\n\n  lSignals := TList.Create;\n  try\n    LoadMeraSignalsFromFile(fFileName, lSignals);\n    for I := 0 to lSignals.Count - 1 do\n    begin\n      lSignal := TMeraSignalInfo(lSignals[I]);\n      if not IsSignalSelected(lSignal) then\n        Continue;\n      lDisplayAddress := RecorderTreeIndexedAddress(Registry, lSourceId,\n        lSignal.Address, True);\n      if (not lHasRange) or (lSignal.StartSec < fPlayRangeMinSec) then\n      begin\n        fPlayRangeMinSec := lSignal.StartSec;\n        lHasRange := True;\n      end;\n\n      lLinked := False;\n      if Registry <> nil then\n        for J := 0 to Registry.TagCount - 1 do\n        begin\n          lTag := Registry.Tags[J];\n          if SameText(lTag.SourceId, lSourceId) and\n            SameText(lTag.Address, lDisplayAddress) then\n          begin\n            AddPlaybackSignal(lSignal, lTag.Name);\n            lLinked := True;\n          end;\n        end;\n\n      if not lLinked then\n        AddPlaybackSignal(lSignal, MeraSignalToRecorderTagName(lSignal));\n    end;\n  finally\n    ClearMeraSignals(lSignals);\n    lSignals.Free;\n  end;\n  RecorderDebugLog(Format('[MeraFile] started file=\"%s\" signals=%d',\n    [fFileName, fPlaybackSignals.Count]));\nend;\n\nprocedure TRecorderMeraFileDataSource.Stop;\nbegin\n  inherited Stop;\n  while fPlaybackSignals.Count > 0 do\n  begin\n    TObject(fPlaybackSignals[0]).Free;\n    fPlaybackSignals.Delete(0);\n  end;\nend;\n\nprocedure TRecorderMeraFileDataSource.DoTick;\nvar\n  I: Integer;\n  lAnyPublished: Boolean;\n  lPlayTimeSec: Double;\n  lSignal: TMeraPlaybackSignal;\n  lSignalPublished: Boolean;\nconst\n  CScalarSamplesPerTickLimit = 4096;\n  CVectorBlocksPerTickLimit = 16;\nbegin\n  lPlayTimeSec := fPlayRangeMinSec +\n    (((GetTickCount64 - fStartTickMs) / 1000.0) * fPlaybackSpeed);\n  lAnyPublished := False;\n  for I := 0 to fPlaybackSignals.Count - 1 do\n  begin\n    if ShouldStop then\n      Exit;\n    lSignal := TMeraPlaybackSignal(fPlaybackSignals[I]);\n    if lSignal.IsScalar then\n      lSignalPublished := lSignal.PublishScalarDue(Registry, lPlayTimeSec,\n        CScalarSamplesPerTickLimit)\n    else\n      lSignalPublished := lSignal.PublishVectorDue(Registry, lPlayTimeSec,\n        UpdateTimeMs, fBlockLength, CVectorBlocksPerTickLimit);\n\n    if (not lSignalPublished) and fLoop then\n    begin\n      lSignal.Rewind;\n      if lSignal.IsScalar then\n        lSignalPublished := lSignal.PublishScalarDue(Registry, lPlayTimeSec,\n          CScalarSamplesPerTickLimit)\n      else\n        lSignalPublished := lSignal.PublishVectorDue(Registry, lPlayTimeSec,\n          UpdateTimeMs, fBlockLength, CVectorBlocksPerTickLimit);\n    end;\n    lAnyPublished := lSignalPublished or lAnyPublished;\n  end;\n\n  if not lAnyPublished then\n    Exit;\n  if not fFirstBlockLogged then\n  begin\n    fFirstBlockLogged := True;\n    RecorderDebugLog(Format('[MeraFile] first data published file=\"%s\" signals=%d',\n      [fFileName, fPlaybackSignals.Count]));\n  end;\nend;\n{ TRecorderDataSourceThread }\n\nconstructor TRecorderDataSourceThread.Create(const ASource: IRecorderDataSource);\nbegin\n  inherited Create(True);\n  if ASource = nil then\n    raise ERecorderDataSourceError.Create('Data source thread source cannot be nil');\n\n  FreeOnTerminate := False;\n  fSource := ASource;\nend;\n\nprocedure TRecorderDataSourceThread.SleepInterruptible(AMilliseconds: Cardinal);\nvar\n  lChunkMs: Cardinal;\n  lSleptMs: Cardinal;\nbegin\n  lSleptMs := 0;\n  while (not Terminated) and (lSleptMs < AMilliseconds) do\n  begin\n    lChunkMs := AMilliseconds - lSleptMs;\n    if lChunkMs > 10 then\n      lChunkMs := 10;\n\n    Sleep(lChunkMs);\n    Inc(lSleptMs, lChunkMs);\n  end;\nend;\n\nprocedure TRecorderDataSourceThread.Execute;\nvar\n  lElapsed: QWord;\n  lNextTickMs: QWord;\n  lNow: QWord;\n  lSleepMs: QWord;\n  lStart: QWord;\nbegin\n  try\n    fSource.Start;\n    lNextTickMs := GetTickCount64;\n    while not Terminated do\n    begin\n      if fSource.TryStop then\n        Break;\n\n      lStart := GetTickCount64;\n      fSource.Tick;\n      Inc(fTickCount);\n      if fSource.TryStop then\n        Break;\n      lElapsed := GetTickCount64 - lStart;\n      {$IFDEF RECORDER_RUNTIME_DIAGNOSTICS}\n      if lElapsed > 10 then\n        RecorderDebugLog(Format('[DataSource:%s] Tick took %d ms on Thread %d',\n          [fSource.SourceId, lElapsed, PtrUInt(GetThreadID)]));\n      {$ENDIF}\n\n      Inc(lNextTickMs, fSource.UpdateTimeMs);\n      lNow := GetTickCount64;\n      if lNextTickMs <= lNow then\n      begin\n        if lNow - lNextTickMs >= fSource.UpdateTimeMs then\n          lNextTickMs := lNow + fSource.UpdateTimeMs\n        else\n          lNextTickMs := lNow + 1;\n      end;\n\n      lSleepMs := lNextTickMs - lNow;\n      if lSleepMs > High(Cardinal) then\n        lSleepMs := High(Cardinal);\n      SleepInterruptible(Cardinal(lSleepMs));\n    end;\n  except\n    on E: Exception do\n    begin\n      fLastErrorMessage := E.ClassName + ': ' + E.Message;\n      RecorderDebugLog(Format('[DataSource:%s] Thread stopped by exception: %s',\n        [fSource.SourceId, fLastErrorMessage]));\n    end;\n  end;\n\n  try\n    fSource.Stop;\n  except\n    on E: Exception do\n      begin\n        if fLastErrorMessage = '' then\n          fLastErrorMessage := E.ClassName + ': ' + E.Message\n        else\n          fLastErrorMessage := fLastErrorMessage + '; stop failed: ' + E.Message;\n      end;\n  end;\nend;\n\n{ TRecorderDataSourceManager }\n\nfunction TRecorderDataSourceManager.TSourceContext.NeedsPrepareHardware: Boolean;\nbegin\n  Result := (not Prepared) or\n    RecorderHardwareHasSourceResetRequest(Source.SourceId);\nend;\n\nprocedure TRecorderDataSourceManager.TSourceContext.PrepareHardware;\nbegin\n  PrepareError := '';\n  Prepared := False;\n  try\n    Source.PrepareHardware;\n    if RecorderHardwareIsSourceOffline(Source.SourceId) then\n      PrepareError := RecorderHardwareSourceOfflineReason(Source.SourceId)\n    else\n      Prepared := True;\n  except\n    on E: Exception do\n    begin\n      PrepareError := E.ClassName + ': ' + E.Message;\n      RecorderHardwareMarkSourceOffline(Source.SourceId, PrepareError);\n      RecorderDebugLog(Format('[DataSource:%s] connection/preparation failed: %s',\n        [Source.SourceId, PrepareError]));\n    end;\n  end;\nend;\n\nconstructor TRecorderDataSourceManager.Create;\nbegin\n  inherited Create;\n  fSources := TList.Create;\n  fLastErrors := TStringList.Create;\nend;\n\ndestructor TRecorderDataSourceManager.Destroy;\nbegin\n  Clear;\n  fLastErrors.Free;\n  fSources.Free;\n  inherited Destroy;\nend;\n\nfunction TRecorderDataSourceManager.ResolveTagSource(const ASourceId: string): IInterface;\nbegin\n  Result := FindSource(ASourceId);\nend;\n\nfunction TRecorderDataSourceManager.GetSourceContext(AIndex: Integer): TSourceContext;\nbegin\n  Result := TSourceContext(fSources[AIndex]);\nend;\n\nfunction TRecorderDataSourceManager.GetSource(AIndex: Integer): IRecorderDataSource;\nbegin\n  Result := GetSourceContext(AIndex).Source;\nend;\n\nfunction TRecorderDataSourceManager.GetSourceCount: Integer;\nbegin\n  Result := fSources.Count;\nend;\n\nfunction TRecorderDataSourceManager.GetLastError(AIndex: Integer): string;\nbegin\n  Result := fLastErrors[AIndex];\nend;\n\nfunction TRecorderDataSourceManager.GetLastErrorCount: Integer;\nbegin\n  Result := fLastErrors.Count;\nend;\n\nprocedure TRecorderDataSourceManager.AddSource(const ASource: IRecorderDataSource;\n  AEnabled: Boolean);\nvar\n  lContext: TSourceContext;\nbegin\n  if ASource = nil then\n    raise ERecorderDataSourceError.Create('Data source manager source cannot be nil');\n  if fRunning then\n    raise ERecorderDataSourceError.Create('Cannot add data source while manager is running');\n  if FindSource(ASource.SourceId) <> nil then\n    raise ERecorderDataSourceError.CreateFmt('Data source already exists: %s',\n      [ASource.SourceId]);\n\n  lContext := TSourceContext.Create;\n  lContext.Source := ASource;\n  lContext.Enabled := AEnabled;\n  lContext.Prepared := False;\n  fSources.Add(lContext);\nend;\n\nprocedure TRecorderDataSourceManager.SetSourceEnabled(const ASourceId: string;\n  AEnabled: Boolean);\nvar\n  I: Integer;\n  lContext: TSourceContext;\nbegin\n  for I := 0 to fSources.Count - 1 do\n  begin\n    lContext := GetSourceContext(I);\n    if not SameText(lContext.Source.SourceId, ASourceId) then\n      Continue;\n    if lContext.Enabled = AEnabled then\n      Exit;\n\n    if not AEnabled then\n    begin\n      if lContext.Thread <> nil then\n      begin\n        lContext.Thread.Terminate;\n        lContext.Source.RequestStop;\n        lContext.Thread.WaitFor;\n        if lContext.Thread.LastErrorMessage <> '' then\n          fLastErrors.Add(lContext.Source.SourceId + ': ' +\n            lContext.Thread.LastErrorMessage);\n        FreeAndNil(lContext.Thread);\n      end;\n      lContext.Enabled := False;\n    end\n    else\n    begin\n      lContext.Enabled := True;\n      if fRunning then\n      begin\n        lContext.PrepareHardware;\n        if lContext.PrepareError <> '' then\n        begin\n          fLastErrors.Add(lContext.Source.SourceId + ': ' +\n            lContext.PrepareError);\n          Exit;\n        end;\n        lContext.Thread := TRecorderDataSourceThread.Create(lContext.Source);\n        lContext.Thread.Start;\n        RegisterThreadName(lContext.Thread.ThreadID,\n          'Src_' + lContext.Source.SourceId);\n      end;\n    end;\n    Exit;\n  end;\nend;\n\nprocedure TRecorderDataSourceManager.RemoveSource(const ASourceId: string);\nvar\n  I: Integer;\n  lContext: TSourceContext;\nbegin\n  for I := fSources.Count - 1 downto 0 do\n  begin\n    lContext := GetSourceContext(I);\n    if not SameText(lContext.Source.SourceId, ASourceId) then\n      Continue;\n    if lContext.Thread <> nil then\n    begin\n      lContext.Thread.Terminate;\n      lContext.Source.RequestStop;\n      lContext.Thread.WaitFor;\n      FreeAndNil(lContext.Thread);\n    end;\n    if fMessageRegistry <> nil then\n      fMessageRegistry.RemoveBySource(ASourceId);\n    lContext.Free;\n    fSources.Delete(I);\n    Exit;\n  end;\nend;\n\nprocedure TRecorderDataSourceManager.ReplaceSource(\n  const ASource: IRecorderDataSource; AEnabled: Boolean;\n  APrepareNow: Boolean);\nvar\n  lWasRunning: Boolean;\n  lMessageSource: IRecorderMessageSource;\nbegin\n  if ASource = nil then\n    raise ERecorderDataSourceError.Create('Replacement data source cannot be nil');\n  lWasRunning := fRunning;\n  RemoveSource(ASource.SourceId);\n  AddSource(ASource, AEnabled);\n  ASource.ConfigureTags(fRegistry);\n  if Supports(ASource, IRecorderMessageSource, lMessageSource) then\n    lMessageSource.ConfigureMessages(fMessageRegistry);\n  if AEnabled and APrepareNow then\n  begin\n    GetSourceContext(fSources.Count - 1).PrepareHardware;\n    if GetSourceContext(fSources.Count - 1).PrepareError <> '' then\n    begin\n      fLastErrors.Add(ASource.SourceId + ': ' +\n        GetSourceContext(fSources.Count - 1).PrepareError);\n      Exit;\n    end;\n    if lWasRunning then\n    begin\n      GetSourceContext(fSources.Count - 1).Thread :=\n        TRecorderDataSourceThread.Create(ASource);\n      GetSourceContext(fSources.Count - 1).Thread.Start;\n      RegisterThreadName(GetSourceContext(fSources.Count - 1).Thread.ThreadID,\n        'Src_' + ASource.SourceId);\n    end;\n  end;\nend;\n\nfunction TRecorderDataSourceManager.FindSource(const ASourceId: string): IRecorderDataSource;\nvar\n  I: Integer;\nbegin\n  Result := nil;\n  for I := 0 to fSources.Count - 1 do\n    if SameText(GetSourceContext(I).Source.SourceId, ASourceId) then\n      Exit(GetSourceContext(I).Source);\nend;\n\nprocedure TRecorderDataSourceManager.ConfigureTagsAll(\n  ARegistry: TRecorderTagRegistry; AMessageRegistry: TRecorderMessageRegistry);\nvar\n  I: Integer;\n  lMessageSource: IRecorderMessageSource;\nbegin\n  if ARegistry = nil then\n    raise ERecorderDataSourceError.Create('Data source manager registry cannot be nil');\n  if fRunning then\n    raise ERecorderDataSourceError.Create('Cannot configure data sources while running');\n\n  if fRegistry <> nil then fRegistry.ConfigureTagSources(nil, Self);\n  fRegistry := ARegistry;\n  fRegistry.ConfigureTagSources(@ResolveTagSource);\n  fMessageRegistry := AMessageRegistry;\n  for I := 0 to fSources.Count - 1 do\n  begin\n    GetSourceContext(I).Source.ConfigureTags(fRegistry);\n    if Supports(GetSourceContext(I).Source, IRecorderMessageSource,\n      lMessageSource) then\n      lMessageSource.ConfigureMessages(fMessageRegistry);\n  end;\nend;\n\nprocedure TRecorderDataSourceBase.RefreshRuntimeTransforms;\nbegin\nend;\n\nfunction TRecorderDataSourceBase.GetUnits(ATag: TRecorderTag): string;\nvar\n  lCalibration: TRecorderCalibration;\nbegin\n  Result := 'б.р.';\n  if ATag = nil then Exit;\n  if ATag.SourceHardwareOutputUnitName <> '' then\n  begin\n    if ATag.HardwareCalibrationEnabled then Result := ATag.SourceHardwareOutputUnitName\n    else Result := 'code';\n  end\n  else\n  begin\n    lCalibration := nil;\n    if ATag.OwnerRegistry <> nil then\n      lCalibration := ATag.OwnerRegistry.FindTagHardwareCalibration(ATag);\n    if (lCalibration <> nil) and (Trim(lCalibration.UnitOut) <> '') then\n      Result := lCalibration.GetUnits\n    else if Trim(ATag.SourceUnitName) <> '' then Result := ATag.SourceUnitName;\n  end;\nend;\n\nprocedure TRecorderDataSourceBase.GetUnitNames(ATag: TRecorderTag;\n  AUnitNames: TStrings);\nvar\n  lNames: TStringList;\n  lUnit: string;\n  lFactor: Double;\n  I: Integer;\nbegin\n  if AUnitNames = nil then Exit;\n  AUnitNames.Clear;\n  lUnit := GetUnits(ATag);\n  lNames := TStringList.Create;\n  try\n    RecorderUnitManager.FillUnitNames(lNames);\n    for I := 0 to lNames.Count - 1 do\n      if SameText(lUnit, lNames[I]) or\n        RecorderUnitManager.TryGetConversionFactor(lUnit, lNames[I], lFactor) then\n        if AUnitNames.IndexOf(lNames[I]) < 0 then AUnitNames.Add(lNames[I]);\n    if AUnitNames.Count = 0 then AUnitNames.Add(lUnit);\n  finally\n    lNames.Free;\n  end;\nend;\n\nfunction TRecorderDataSourceBase.CanSetUnits(ATag: TRecorderTag;\n  const AUnitName: string; out AErrorText: string): Boolean;\nvar\n  lFactor: Double;\nbegin\n  Result := SameText(GetUnits(ATag), AUnitName) or\n    RecorderUnitManager.TryGetConversionFactor(GetUnits(ATag), AUnitName, lFactor);\n  AErrorText := '';\n  if not Result then AErrorText := 'Datasource cannot select unit: ' + AUnitName;\nend;\n\nfunction TRecorderDataSourceBase.SetUnits(ATag: TRecorderTag;\n  const AUnitName: string; out AErrorText: string): Boolean;\nvar\n  lInfo: TRecorderUnitInfo;\nbegin\n  Result := CanSetUnits(ATag, AUnitName, AErrorText);\n  if not Result or (ATag = nil) then Exit;\n  ATag.AutoUnit := False;\n  if RecorderUnitManager.TryGetUnitInfo(AUnitName, lInfo) and\n    SameText(lInfo.QuantityId, RECORDER_QUANTITY_RAW_CODE) then\n    ATag.HardwareCalibrationEnabled := False\n  else ATag.HardwareCalibrationEnabled := True;\n  ATag.UnitName := AUnitName;\nend;\n\nprocedure TRecorderDataSourceBase.UpdateScales(ATag: TRecorderTag);\nbegin\n  if (ATag = nil) or (ATag.OwnerRegistry = nil) then Exit;\n  ATag.InvalidateCalibrationScale;\n  ATag.OwnerRegistry.RebuildScales(ATag);\nend;\n\nprocedure TRecorderDataSourceManager.PrepareHardwareAll;\nvar\n  I: Integer;\n  lProcedures: array of TThreadMethod;\nbegin\n  if fRunning then\n    raise ERecorderDataSourceError.Create(\n      'Cannot prepare data source hardware while manager is running');\n  if fRegistry = nil then\n    raise ERecorderDataSourceError.Create(\n      'Data source manager tags are not configured');\n  { Независимые источники имеют отдельные TCP-сеансы и готовятся параллельно.\n    Внутри одного устройства его протокол остаётся строго последовательным. }\n  fLastErrors.Clear;\n  SetLength(lProcedures, 0);\n  for I := 0 to fSources.Count - 1 do\n    if GetSourceContext(I).Enabled then\n    begin\n      if not GetSourceContext(I).NeedsPrepareHardware then\n        Continue;\n      SetLength(lProcedures, Length(lProcedures) + 1);\n      lProcedures[High(lProcedures)] := @GetSourceContext(I).PrepareHardware;\n    end;\n  SharedRunParallel(lProcedures);\n  for I := 0 to fSources.Count - 1 do\n    if GetSourceContext(I).PrepareError <> '' then\n      fLastErrors.Add(GetSourceContext(I).Source.SourceId + ': ' +\n        GetSourceContext(I).PrepareError);\nend;\n\nprocedure TRecorderDataSourceManager.PrepareHardwareSources(ASourceIds: TStrings);\nvar\n  I: Integer;\n  lContext: TSourceContext;\n  lProcedures: array of TThreadMethod;\nbegin\n  if (ASourceIds = nil) or (ASourceIds.Count = 0) then\n    Exit;\n  if fRunning then\n    raise ERecorderDataSourceError.Create(\n      'Cannot prepare data source hardware while manager is running');\n  if fRegistry = nil then\n    raise ERecorderDataSourceError.Create(\n      'Data source manager tags are not configured');\n\n  fLastErrors.Clear;\n  SetLength(lProcedures, 0);\n  for I := 0 to fSources.Count - 1 do\n  begin\n    lContext := GetSourceContext(I);\n    if (not lContext.Enabled) or\n      (ASourceIds.IndexOf(lContext.Source.SourceId) < 0) then\n      Continue;\n    if not lContext.NeedsPrepareHardware then\n      Continue;\n    SetLength(lProcedures, Length(lProcedures) + 1);\n    lProcedures[High(lProcedures)] := @lContext.PrepareHardware;\n  end;\n  SharedRunParallel(lProcedures);\n  for I := 0 to fSources.Count - 1 do\n  begin\n    lContext := GetSourceContext(I);\n    if (ASourceIds.IndexOf(lContext.Source.SourceId) >= 0) and\n      (lContext.PrepareError <> '') then\n      fLastErrors.Add(lContext.Source.SourceId + ': ' + lContext.PrepareError);\n  end;\nend;\n\nfunction TRecorderDataSourceManager.ReconfigureAll(AUpdateTimeMs: Cardinal;\n  AErrors: TStrings): Boolean;\nvar\n  I: Integer;\n  lContext: TSourceContext;\n  lErrorText: string;\nbegin\n  Result := False;\n  if fRunning then\n  begin\n    if AErrors <> nil then\n      AErrors.Add('Stop data sources before reconfiguration');\n    Exit;\n  end;\n  Result := True;\n  for I := 0 to fSources.Count - 1 do\n  begin\n    lContext := GetSourceContext(I);\n    lErrorText := '';\n    if lContext.Source.Reconfigure(AUpdateTimeMs, lErrorText) then\n      Continue;\n    Result := False;\n    lContext.Prepared := False;\n    lContext.PrepareError := lErrorText;\n    if AErrors <> nil then\n      AErrors.Add(lContext.Source.SourceId + ': ' + lErrorText);\n  end;\nend;\n\nprocedure TRecorderDataSourceManager.RefreshSourceRuntimeTransforms(\n  const ASourceId: string);\nvar\n  lSource: IRecorderDataSource;\nbegin\n  lSource := FindSource(ASourceId);\n  if lSource <> nil then\n    lSource.RefreshRuntimeTransforms;\nend;\n\nprocedure TRecorderDataSourceManager.StartAll;\nvar\n  I: Integer;\n  lContext: TSourceContext;\nbegin\n  if fRunning then\n    raise ERecorderDataSourceError.Create('Data source manager is already running');\n  if fRegistry = nil then\n    raise ERecorderDataSourceError.Create('Data source manager tags are not configured');\n\n  fLastErrors.Clear;\n  try\n    for I := 0 to fSources.Count - 1 do\n      if GetSourceContext(I).Enabled then\n      begin\n        lContext := GetSourceContext(I);\n        if not lContext.Prepared then\n        begin\n          if lContext.PrepareError = '' then\n            lContext.PrepareError :=\n              'hardware is not prepared; apply configuration before Preview';\n          fLastErrors.Add(lContext.Source.SourceId + ': ' +\n            lContext.PrepareError);\n        end;\n      end;\n    for I := 0 to fSources.Count - 1 do\n    begin\n      lContext := GetSourceContext(I);\n      if (not lContext.Enabled) or (not lContext.Prepared) or\n        RecorderHardwareIsSourceOffline(lContext.Source.SourceId) then\n        Continue;\n      lContext.Thread := TRecorderDataSourceThread.Create(lContext.Source);\n      lContext.Thread.Start;\n      RegisterThreadName(lContext.Thread.ThreadID, 'Src_' + lContext.Source.SourceId);\n    end;\n    fRunning := True;\n  except\n    StopAll;\n    raise;\n  end;\nend;\n\nprocedure TRecorderDataSourceManager.StopAll;\nvar\n  I: Integer;\n  lContext: TSourceContext;\nbegin\n  for I := 0 to fSources.Count - 1 do\n  begin\n    lContext := GetSourceContext(I);\n    if lContext.Thread <> nil then\n      lContext.Thread.Terminate;\n  end;\n\n  { Внешний поток только выставляет TryStop; State и очистка — в worker-thread. }\n  for I := 0 to fSources.Count - 1 do\n  begin\n    lContext := GetSourceContext(I);\n    try\n      lContext.Source.RequestStop;\n    except\n      on E: Exception do\n        fLastErrors.Add(lContext.Source.SourceId + ': request stop failed: ' +\n          E.Message);\n    end;\n  end;\n\n  for I := 0 to fSources.Count - 1 do\n  begin\n    lContext := GetSourceContext(I);\n    if lContext.Thread <> nil then\n    begin\n      lContext.Thread.WaitFor;\n      if lContext.Thread.LastErrorMessage <> '' then\n        fLastErrors.Add(lContext.Source.SourceId + ': ' +\n          lContext.Thread.LastErrorMessage);\n      FreeAndNil(lContext.Thread);\n    end;\n  end;\n\n  fRunning := False;\nend;\n\nprocedure TRecorderDataSourceManager.Clear;\nvar\n  I: Integer;\nbegin\n  StopAll;\n  if fRegistry <> nil then fRegistry.ConfigureTagSources(nil, Self);\n  for I := fSources.Count - 1 downto 0 do\n  begin\n    GetSourceContext(I).Free;\n    fSources.Delete(I);\n  end;\n  fRegistry := nil;\n  fLastErrors.Clear;\nend;\n\nend.\n", "sha256": "a913c228054a689c15f1abdb890f8261b10815448e87024457f8bc8156fa9428"}, "Core/uRecorderTagSettingsProvider.pas": {"text": "unit uRecorderTagSettingsProvider;\n\n{\n  UI-neutral extension point for device-specific tag settings.\n\n  A datasource exposes its own settings through these interfaces, including\n  while stopped. Tag.GetSource is the preferred owner lookup. Registered\n  providers remain a compatibility path for sources not yet migrated; MIC140\n  and MIC185 have no separate settings-provider objects. Device names and\n  source-id formats remain outside the common UI and tag selection policy.\n}\n\n{$mode objfpc}{$H+}\n{$codepage UTF8}\n\ninterface\n\nuses\n  Classes, SysUtils,\n  uRecorderTags, uRecorderDataSources;\n\ntype\n  TRecorderStringArray = array of string;\n\n  { Values displayed by the common dialog. Empty strings mean that the common\n    tag/calibration model should supply the value. }\n  TRecorderTagSettingsState = record\n    HardwareSourceConfigurable: Boolean;\n    HardwareCalibrationDownloadable: Boolean;\n    ChannelCalibrationSelectable: Boolean;\n    HardwareCalibrationText: string;\n    OutputUnitName: string;\n    SourceUnitName: string;\n    FrequencyNames: TRecorderStringArray;\n  end;\n\n  { Common dialog values offered to a provider before commit. A provider may\n    normalize related values, then ApplyDraft persists only device-owned state.\n    Generic tag fields remain owned by the common dialog. }\n  TRecorderTagSettingsDraft = record\n    PollFrequencyHz: Double;\n    UnitName: string;\n    AutoUnit: Boolean;\n    HardwareCalibrationEnabled: Boolean;\n    ChannelCalibrationEnabled: Boolean;\n    DataUpdateMs: Cardinal;\n  end;\n\n  TRecorderTagSettingsApplyResult = record\n    UnitName: string;\n    SourceUnitName: string;\n    PollFrequencyHz: Double;\n    RangeMin: Double;\n    RangeMax: Double;\n    UnitChanged: Boolean;\n    SourceUnitChanged: Boolean;\n    FrequencyChanged: Boolean;\n    RangeChanged: Boolean;\n    SignalHistoryMustBeCleared: Boolean;\n  end;\n\n  TRecorderHardwareCalibrationResult = record\n    CalibrationName: string;\n    PresentationText: string;\n    MessageText: string;\n  end;\n\n  { Implemented by a concrete datasource or a device provider. Methods never\n    show UI. Registry and tag ownership stays with the caller. }\n  IRecorderTagSettingsProvider = interface\n    ['{8C160195-8B74-4CF7-9D5E-3D40C48764B1}']\n    function ReadState(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      out AState: TRecorderTagSettingsState): Boolean;\n    function NormalizeDraft(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      var ADraft: TRecorderTagSettingsDraft; out AErrorText: string): Boolean;\n    function ApplyDraft(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      const ADraft: TRecorderTagSettingsDraft;\n      out AResult: TRecorderTagSettingsApplyResult;\n      out AErrorText: string): Boolean;\n    function DownloadHardwareCalibration(ARegistry: TRecorderTagRegistry;\n      ATag: TRecorderTag; out AResult: TRecorderHardwareCalibrationResult;\n      out AErrorText: string): Boolean;\n  end;\n\n  { Resolver is useful when settings support is separate from the datasource.\n    It must only identify a provider; device I/O belongs to the provider. }\n  IRecorderTagSettingsProviderResolver = interface\n    ['{F71FD84D-BBD6-47A7-B44A-6B2DA993E6F2}']\n    function Resolve(ATag: TRecorderTag;\n      const ASource: IRecorderDataSource;\n      out AProvider: IRecorderTagSettingsProvider): Boolean;\n  end;\n\nprocedure RecorderInitTagSettingsState(out AState: TRecorderTagSettingsState);\nprocedure RecorderInitTagSettingsDraft(ATag: TRecorderTag;\n  ADataUpdateMs: Cardinal; out ADraft: TRecorderTagSettingsDraft);\nprocedure RecorderInitTagSettingsApplyResult(\n  out AResult: TRecorderTagSettingsApplyResult);\nprocedure RecorderInitHardwareCalibrationResult(\n  out AResult: TRecorderHardwareCalibrationResult);\n\nprocedure RegisterRecorderTagSettingsProviderResolver(AOwner: TObject;\n  const AResolver: IRecorderTagSettingsProviderResolver);\nprocedure UnregisterRecorderTagSettingsProviderResolver(AOwner: TObject);\nfunction RecorderResolveTagSettingsProvider(ATag: TRecorderTag;\n  ADataSources: TRecorderDataSourceManager;\n  out AProvider: IRecorderTagSettingsProvider): Boolean;\n\nimplementation\n\ntype\n  TRecorderTagSettingsResolverEntry = record\n    Owner: TObject;\n    Resolver: IRecorderTagSettingsProviderResolver;\n  end;\n\nvar\n  GResolverLock: TRTLCriticalSection;\n  GResolvers: array of TRecorderTagSettingsResolverEntry;\n\nprocedure RecorderInitTagSettingsState(out AState: TRecorderTagSettingsState);\nbegin\n  AState.HardwareSourceConfigurable := False;\n  AState.HardwareCalibrationDownloadable := False;\n  AState.ChannelCalibrationSelectable := True;\n  AState.HardwareCalibrationText := '';\n  AState.OutputUnitName := '';\n  AState.SourceUnitName := '';\n  SetLength(AState.FrequencyNames, 0);\nend;\n\nprocedure RecorderInitTagSettingsDraft(ATag: TRecorderTag;\n  ADataUpdateMs: Cardinal; out ADraft: TRecorderTagSettingsDraft);\nbegin\n  ADraft.PollFrequencyHz := 0;\n  ADraft.UnitName := '';\n  ADraft.AutoUnit := False;\n  ADraft.HardwareCalibrationEnabled := False;\n  ADraft.ChannelCalibrationEnabled := False;\n  ADraft.DataUpdateMs := ADataUpdateMs;\n  if ATag = nil then\n    Exit;\n  ADraft.PollFrequencyHz := ATag.PollFrequencyHz;\n  ADraft.UnitName := ATag.UnitName;\n  ADraft.AutoUnit := ATag.AutoUnit;\n  ADraft.HardwareCalibrationEnabled := ATag.HardwareCalibrationEnabled;\n  ADraft.ChannelCalibrationEnabled := ATag.ChannelCalibrationEnabled;\nend;\n\nprocedure RecorderInitTagSettingsApplyResult(\n  out AResult: TRecorderTagSettingsApplyResult);\nbegin\n  AResult.UnitName := '';\n  AResult.SourceUnitName := '';\n  AResult.PollFrequencyHz := 0;\n  AResult.RangeMin := 0;\n  AResult.RangeMax := 0;\n  AResult.UnitChanged := False;\n  AResult.SourceUnitChanged := False;\n  AResult.FrequencyChanged := False;\n  AResult.RangeChanged := False;\n  AResult.SignalHistoryMustBeCleared := False;\nend;\n\nprocedure RecorderInitHardwareCalibrationResult(\n  out AResult: TRecorderHardwareCalibrationResult);\nbegin\n  AResult.CalibrationName := '';\n  AResult.PresentationText := '';\n  AResult.MessageText := '';\nend;\n\nfunction FindResolverOwner(AOwner: TObject): Integer;\nvar\n  lIndex: Integer;\nbegin\n  for lIndex := 0 to High(GResolvers) do\n    if GResolvers[lIndex].Owner = AOwner then\n      Exit(lIndex);\n  Result := -1;\nend;\n\nprocedure DeleteResolver(AIndex: Integer);\nvar\n  lIndex: Integer;\nbegin\n  for lIndex := AIndex to High(GResolvers) - 1 do\n    GResolvers[lIndex] := GResolvers[lIndex + 1];\n  if Length(GResolvers) > 0 then\n  begin\n    GResolvers[High(GResolvers)].Resolver := nil;\n    GResolvers[High(GResolvers)].Owner := nil;\n    SetLength(GResolvers, Length(GResolvers) - 1);\n  end;\nend;\n\nprocedure RegisterRecorderTagSettingsProviderResolver(AOwner: TObject;\n  const AResolver: IRecorderTagSettingsProviderResolver);\nvar\n  lIndex: Integer;\nbegin\n  if AOwner = nil then\n    raise EArgumentNilException.Create('Tag settings resolver owner is nil');\n  EnterCriticalSection(GResolverLock);\n  try\n    lIndex := FindResolverOwner(AOwner);\n    if AResolver = nil then\n    begin\n      if lIndex >= 0 then\n        DeleteResolver(lIndex);\n      Exit;\n    end;\n    if lIndex < 0 then\n    begin\n      lIndex := Length(GResolvers);\n      SetLength(GResolvers, lIndex + 1);\n      GResolvers[lIndex].Owner := AOwner;\n    end;\n    GResolvers[lIndex].Resolver := AResolver;\n  finally\n    LeaveCriticalSection(GResolverLock);\n  end;\nend;\n\nprocedure UnregisterRecorderTagSettingsProviderResolver(AOwner: TObject);\nbegin\n  RegisterRecorderTagSettingsProviderResolver(AOwner, nil);\nend;\n\nfunction SnapshotResolvers: TInterfaceList;\nvar\n  lIndex: Integer;\nbegin\n  Result := TInterfaceList.Create;\n  EnterCriticalSection(GResolverLock);\n  try\n    for lIndex := 0 to High(GResolvers) do\n      Result.Add(GResolvers[lIndex].Resolver);\n  finally\n    LeaveCriticalSection(GResolverLock);\n  end;\nend;\n\nfunction RecorderResolveTagSettingsProvider(ATag: TRecorderTag;\n  ADataSources: TRecorderDataSourceManager;\n  out AProvider: IRecorderTagSettingsProvider): Boolean;\nvar\n  lIndex: Integer;\n  lResolver: IRecorderTagSettingsProviderResolver;\n  lResolvers: TInterfaceList;\n  lSource: IRecorderDataSource;\n  lTagSource: IInterface;\nbegin\n  AProvider := nil;\n  if ATag = nil then\n    Exit(False);\n\n  lSource := nil;\n  lTagSource := ATag.GetSource;\n  Supports(lTagSource, IRecorderDataSource, lSource);\n  if (lSource = nil) and (ADataSources <> nil) then\n    lSource := ADataSources.FindSource(ATag.SourceId);\n  if Supports(lTagSource, IRecorderTagSettingsProvider, AProvider) or\n    Supports(lSource, IRecorderTagSettingsProvider, AProvider) then\n    Exit(True);\n\n  lResolvers := SnapshotResolvers;\n  try\n    for lIndex := lResolvers.Count - 1 downto 0 do\n    begin\n      lResolver := IRecorderTagSettingsProviderResolver(lResolvers[lIndex]);\n      if lResolver.Resolve(ATag, lSource, AProvider) and (AProvider <> nil) then\n        Exit(True);\n      AProvider := nil;\n    end;\n  finally\n    lResolvers.Free;\n  end;\n  Result := False;\nend;\n\ninitialization\n  InitCriticalSection(GResolverLock);\n\nfinalization\n  { Program shutdown is single-threaded here. Release provider interfaces\n    outside the lock: their destructors may unregister related services. }\n  SetLength(GResolvers, 0);\n  DoneCriticalSection(GResolverLock);\n\nend.\n", "sha256": "f89079a1bc244ae8df58f9d07000aede4ce6acb88e391493931ea45cc778093b"}, "Core/uRecorderUnitManager.pas": {"text": "unit uRecorderUnitManager;\n\n{$mode objfpc}{$H+}\n{$codepage utf8}\n\ninterface\n\nuses\n  Classes, SysUtils, Contnrs;\n\nconst\n  RECORDER_QUANTITY_VOLTAGE = 'voltage';\n  RECORDER_QUANTITY_ACCELERATION = 'acceleration';\n  RECORDER_QUANTITY_VELOCITY = 'velocity';\n  RECORDER_QUANTITY_DISPLACEMENT = 'displacement';\n  RECORDER_QUANTITY_FORCE = 'force';\n  RECORDER_QUANTITY_FREQUENCY = 'frequency';\n  RECORDER_QUANTITY_ELECTRIC_CHARGE = 'electric_charge';\n  RECORDER_QUANTITY_RAW_CODE = 'raw_code';\n\ntype\n  ERecorderUnitError = class(Exception);\n\n  TRecorderUnitInfo = record\n    QuantityId: string;\n    Name: string;\n    BaseUnitName: string;\n    ScaleToBase: Double;\n  end;\n\n  { TRecorderUnitManager\n\n    ScaleToBase converts one unit to its quantity's base unit:\n      baseValue := sourceValue * ScaleToBase.\n\n    ConversionFactor(AFrom, ATo) returns a multiplier in the requested\n    direction:\n      targetValue := sourceValue * ConversionFactor(AFrom, ATo).\n\n    Register quantities and units during application/plugin initialization;\n    subsequent lookup and conversion calls do not modify the registry. }\n  TRecorderUnitManager = class\n  private type\n    TUnitDefinition = class\n      QuantityId: string;\n      Name: string;\n      BaseUnitName: string;\n      ScaleToBase: Double;\n    end;\n  private\n    fAliases: TStringList;\n    fDefinitions: TObjectList;\n    function NormalizeUnitName(const AName: string): string;\n    function FindDefinition(const AUnitName: string): TUnitDefinition;\n    procedure FillUnitInfo(ADefinition: TUnitDefinition;\n      out AInfo: TRecorderUnitInfo);\n    procedure RegisterDefinition(const AQuantityId, AUnitName: string;\n      AScaleToBase: Double; const AAliases: array of string;\n      AIsBaseUnit: Boolean);\n    procedure RegisterDefaults;\n  public\n    constructor Create(ARegisterDefaults: Boolean = True);\n    destructor Destroy; override;\n\n    procedure RegisterQuantity(const AQuantityId, ABaseUnitName: string;\n      const ABaseAliases: array of string);\n    procedure RegisterUnit(const AQuantityId, AUnitName: string;\n      AScaleToBase: Double; const AAliases: array of string);\n\n    procedure FillUnitNames(AItems: TStrings; const ASubstring: string = '');\n    function TryGetUnitInfo(const AUnitName: string;\n      out AInfo: TRecorderUnitInfo): Boolean;\n    function QuantityCaption(const AQuantityId: string): string;\n    function AreCompatible(const AFirstUnit, ASecondUnit: string): Boolean;\n    function TryGetConversionFactor(const AFromUnit, AToUnit: string;\n      out AFactor: Double): Boolean;\n    function ConversionFactor(const AFromUnit, AToUnit: string): Double;\n    function TryConvert(const AValue: Double; const AFromUnit, AToUnit: string;\n      out AResult: Double): Boolean;\n    function Convert(const AValue: Double; const AFromUnit,\n      AToUnit: string): Double;\n  end;\n\nfunction RecorderUnitManager: TRecorderUnitManager;\n\nimplementation\n\nvar\n  g_RecorderUnitManager: TRecorderUnitManager = nil;\n\nfunction TRecorderUnitManager.NormalizeUnitName(const AName: string): string;\nbegin\n  Result := LowerCase(Trim(AName));\n  Result := StringReplace(Result, ' ', '', [rfReplaceAll]);\n  Result := StringReplace(Result, #$C2#$B5, 'u', [rfReplaceAll]); // micro sign\n  Result := StringReplace(Result, #$CE#$BC, 'u', [rfReplaceAll]); // Greek mu\n  Result := StringReplace(Result, '^2', '2', [rfReplaceAll]);\n  Result := StringReplace(Result, '²', '2', [rfReplaceAll]);\nend;\n\nfunction TRecorderUnitManager.FindDefinition(\n  const AUnitName: string): TUnitDefinition;\nvar\n  lIndex: Integer;\nbegin\n  lIndex := fAliases.IndexOf(NormalizeUnitName(AUnitName));\n  if lIndex < 0 then\n    Exit(nil);\n  Result := TUnitDefinition(fAliases.Objects[lIndex]);\nend;\n\nprocedure TRecorderUnitManager.FillUnitInfo(ADefinition: TUnitDefinition;\n  out AInfo: TRecorderUnitInfo);\nbegin\n  AInfo.QuantityId := ADefinition.QuantityId;\n  AInfo.Name := ADefinition.Name;\n  AInfo.BaseUnitName := ADefinition.BaseUnitName;\n  AInfo.ScaleToBase := ADefinition.ScaleToBase;\nend;\n\nconstructor TRecorderUnitManager.Create(ARegisterDefaults: Boolean);\nbegin\n  inherited Create;\n  fAliases := TStringList.Create;\n  fAliases.CaseSensitive := True;\n  fAliases.Sorted := True;\n  fAliases.Duplicates := dupError;\n  fDefinitions := TObjectList.Create(True);\n  if ARegisterDefaults then\n    RegisterDefaults;\nend;\n\ndestructor TRecorderUnitManager.Destroy;\nbegin\n  FreeAndNil(fAliases);\n  FreeAndNil(fDefinitions);\n  inherited Destroy;\nend;\n\nprocedure TRecorderUnitManager.RegisterQuantity(const AQuantityId,\n  ABaseUnitName: string; const ABaseAliases: array of string);\nbegin\n  RegisterDefinition(AQuantityId, ABaseUnitName, 1.0, ABaseAliases, True);\nend;\n\nprocedure TRecorderUnitManager.RegisterUnit(const AQuantityId,\n  AUnitName: string; AScaleToBase: Double; const AAliases: array of string);\nbegin\n  RegisterDefinition(AQuantityId, AUnitName, AScaleToBase, AAliases, False);\nend;\n\nprocedure TRecorderUnitManager.RegisterDefinition(const AQuantityId,\n  AUnitName: string; AScaleToBase: Double; const AAliases: array of string;\n  AIsBaseUnit: Boolean);\nvar\n  lAliases: TStringList;\n  lDefinition: TUnitDefinition;\n  lBaseDefinition: TUnitDefinition;\n  lAlias: string;\n  lIndex: Integer;\nbegin\n  if Trim(AQuantityId) = '' then\n    raise ERecorderUnitError.Create('Quantity identifier must not be empty');\n  if Trim(AUnitName) = '' then\n    raise ERecorderUnitError.Create('Unit name must not be empty');\n  if AScaleToBase <= 0 then\n    raise ERecorderUnitError.Create('Unit scale to base must be positive');\n\n  lBaseDefinition := nil;\n  for lIndex := 0 to fDefinitions.Count - 1 do\n    if SameText(TUnitDefinition(fDefinitions[lIndex]).QuantityId, AQuantityId) then\n    begin\n      lBaseDefinition := TUnitDefinition(fDefinitions[lIndex]);\n      Break;\n    end;\n  if (not AIsBaseUnit) and (lBaseDefinition = nil) then\n    raise ERecorderUnitError.CreateFmt(\n      'Base unit for quantity \"%s\" must be registered first', [AQuantityId]);\n  if AIsBaseUnit and (lBaseDefinition <> nil) then\n    raise ERecorderUnitError.CreateFmt(\n      'Base unit for quantity \"%s\" is already registered', [AQuantityId]);\n\n  lAliases := TStringList.Create;\n  try\n    lAliases.Sorted := True;\n    lAliases.Duplicates := dupIgnore;\n    lAlias := NormalizeUnitName(AUnitName);\n    lAliases.Add(lAlias);\n    for lIndex := Low(AAliases) to High(AAliases) do\n      lAliases.Add(NormalizeUnitName(AAliases[lIndex]));\n    for lIndex := 0 to lAliases.Count - 1 do\n    begin\n      if lAliases[lIndex] = '' then\n        raise ERecorderUnitError.Create('Unit alias must not be empty');\n      if fAliases.IndexOf(lAliases[lIndex]) >= 0 then\n        raise ERecorderUnitError.CreateFmt(\n          'Unit alias \"%s\" is already registered', [lAliases[lIndex]]);\n    end;\n\n    lDefinition := TUnitDefinition.Create;\n    lDefinition.QuantityId := LowerCase(Trim(AQuantityId));\n    lDefinition.Name := Trim(AUnitName);\n    if AIsBaseUnit then\n      lDefinition.BaseUnitName := lDefinition.Name\n    else\n      lDefinition.BaseUnitName := lBaseDefinition.Name;\n    lDefinition.ScaleToBase := AScaleToBase;\n    for lIndex := 0 to lAliases.Count - 1 do\n      fAliases.AddObject(lAliases[lIndex], lDefinition);\n    fDefinitions.Add(lDefinition);\n  finally\n    lAliases.Free;\n  end;\nend;\n\nprocedure TRecorderUnitManager.FillUnitNames(AItems: TStrings;\n  const ASubstring: string);\nvar\n  I, J: Integer;\n  lDefinition: TUnitDefinition;\n  lFilter: string;\n  lMatches: Boolean;\nbegin\n  if AItems = nil then\n    Exit;\n  lFilter := NormalizeUnitName(ASubstring);\n  AItems.BeginUpdate;\n  try\n    AItems.Clear;\n    for I := 0 to fDefinitions.Count - 1 do\n    begin\n      lDefinition := TUnitDefinition(fDefinitions[I]);\n      lMatches := (lFilter = '') or\n        (Pos(lFilter, NormalizeUnitName(lDefinition.Name)) > 0);\n      if not lMatches then\n        for J := 0 to fAliases.Count - 1 do\n          if (fAliases.Objects[J] = lDefinition) and\n            (Pos(lFilter, fAliases[J]) > 0) then\n          begin\n            lMatches := True;\n            Break;\n          end;\n      if lMatches then\n        AItems.Add(lDefinition.Name);\n    end;\n  finally\n    AItems.EndUpdate;\n  end;\nend;\n\nfunction TRecorderUnitManager.TryGetUnitInfo(const AUnitName: string;\n  out AInfo: TRecorderUnitInfo): Boolean;\nvar\n  lDefinition: TUnitDefinition;\nbegin\n  lDefinition := FindDefinition(AUnitName);\n  Result := Assigned(lDefinition);\n  if Result then\n    FillUnitInfo(lDefinition, AInfo)\n  else\n  begin\n    AInfo.QuantityId := '';\n    AInfo.Name := '';\n    AInfo.BaseUnitName := '';\n    AInfo.ScaleToBase := 0.0;\n  end;\nend;\n\nfunction TRecorderUnitManager.QuantityCaption(const AQuantityId: string): string;\nbegin\n  if SameText(AQuantityId, RECORDER_QUANTITY_VOLTAGE) then\n    Result := 'напряжение'\n  else if SameText(AQuantityId, RECORDER_QUANTITY_ACCELERATION) then\n    Result := 'ускорение'\n  else if SameText(AQuantityId, RECORDER_QUANTITY_VELOCITY) then\n    Result := 'скорость'\n  else if SameText(AQuantityId, RECORDER_QUANTITY_DISPLACEMENT) then\n    Result := 'перемещение'\n  else if SameText(AQuantityId, RECORDER_QUANTITY_FORCE) then\n    Result := 'сила'\n  else if SameText(AQuantityId, RECORDER_QUANTITY_FREQUENCY) then\n    Result := 'частота'\n  else if SameText(AQuantityId, RECORDER_QUANTITY_ELECTRIC_CHARGE) then\n    Result := 'электрический заряд'\n  else\n    Result := AQuantityId;\nend;\n\nfunction TRecorderUnitManager.AreCompatible(const AFirstUnit,\n  ASecondUnit: string): Boolean;\nvar\n  lFirst: TUnitDefinition;\n  lSecond: TUnitDefinition;\nbegin\n  lFirst := FindDefinition(AFirstUnit);\n  lSecond := FindDefinition(ASecondUnit);\n  Result := Assigned(lFirst) and Assigned(lSecond) and\n    SameText(lFirst.QuantityId, lSecond.QuantityId);\nend;\n\nfunction TRecorderUnitManager.TryGetConversionFactor(const AFromUnit,\n  AToUnit: string; out AFactor: Double): Boolean;\nvar\n  lFrom: TUnitDefinition;\n  lTo: TUnitDefinition;\nbegin\n  lFrom := FindDefinition(AFromUnit);\n  lTo := FindDefinition(AToUnit);\n  Result := Assigned(lFrom) and Assigned(lTo) and\n    SameText(lFrom.QuantityId, lTo.QuantityId);\n  if Result then\n    AFactor := lFrom.ScaleToBase / lTo.ScaleToBase\n  else\n    AFactor := 0.0;\nend;\n\nfunction TRecorderUnitManager.ConversionFactor(const AFromUnit,\n  AToUnit: string): Double;\nbegin\n  if not TryGetConversionFactor(AFromUnit, AToUnit, Result) then\n    raise ERecorderUnitError.CreateFmt('Cannot convert \"%s\" to \"%s\"',\n      [AFromUnit, AToUnit]);\nend;\n\nfunction TRecorderUnitManager.TryConvert(const AValue: Double;\n  const AFromUnit, AToUnit: string; out AResult: Double): Boolean;\nvar\n  lFactor: Double;\nbegin\n  Result := TryGetConversionFactor(AFromUnit, AToUnit, lFactor);\n  if Result then\n    AResult := AValue * lFactor\n  else\n    AResult := 0.0;\nend;\n\nfunction TRecorderUnitManager.Convert(const AValue: Double;\n  const AFromUnit, AToUnit: string): Double;\nbegin\n  Result := AValue * ConversionFactor(AFromUnit, AToUnit);\nend;\n\nprocedure TRecorderUnitManager.RegisterDefaults;\nbegin\n  { Драйверы исторически публиковали code/codes/код. Это одна безразмерная\n    исходная величина, поэтому все варианты должны давать единичный переход. }\n  RegisterQuantity(RECORDER_QUANTITY_RAW_CODE, 'code', ['codes', 'код', 'коды']);\n  RegisterQuantity('dimensionless', 'б.р.', ['-', 'a.u.', 'б/р']);\n\n  RegisterQuantity(RECORDER_QUANTITY_VOLTAGE, 'V', ['В', 'volt', 'volts']);\n  RegisterUnit(RECORDER_QUANTITY_VOLTAGE, 'mV', 1E-3, ['мВ']);\n  RegisterUnit(RECORDER_QUANTITY_VOLTAGE, 'uV', 1E-6, ['мкВ', 'µV', 'μV']);\n  RegisterUnit(RECORDER_QUANTITY_VOLTAGE, 'kV', 1E3, ['кВ']);\n\n  RegisterQuantity('temperature', 'degC', ['°C', 'градусы', 'град.С']);\n  RegisterQuantity('resistance', 'Ohm', ['Ом', 'ohms', 'Ω']);\n  RegisterUnit('resistance', 'kOhm', 1E3, ['кОм']);\n  RegisterQuantity('strain', 'strain', []);\n  RegisterUnit('strain', 'uStrain', 1E-6, ['мкстрн', 'мкм/м']);\n\n  RegisterQuantity(RECORDER_QUANTITY_ACCELERATION, 'm/s2',\n    ['m/s^2', 'm/s²', 'м/с2', 'м/с^2', 'м/с²']);\n  RegisterUnit(RECORDER_QUANTITY_ACCELERATION, 'mm/s2', 1E-3,\n    ['mm/s^2', 'mm/s²', 'мм/с2', 'мм/с^2', 'мм/с²']);\n  RegisterUnit(RECORDER_QUANTITY_ACCELERATION, 'g', 9.80665,\n    ['G', 'же']);\n\n  RegisterQuantity(RECORDER_QUANTITY_VELOCITY, 'm/s', ['м/с']);\n  RegisterUnit(RECORDER_QUANTITY_VELOCITY, 'mm/s', 1E-3, ['мм/с']);\n  RegisterUnit(RECORDER_QUANTITY_VELOCITY, 'um/s', 1E-6,\n    ['мкм/с', 'µm/s', 'μm/s']);\n\n  RegisterQuantity(RECORDER_QUANTITY_DISPLACEMENT, 'm',\n    ['м', 'meter', 'metre']);\n  RegisterUnit(RECORDER_QUANTITY_DISPLACEMENT, 'cm', 1E-2, ['см']);\n  RegisterUnit(RECORDER_QUANTITY_DISPLACEMENT, 'mm', 1E-3, ['мм']);\n  RegisterUnit(RECORDER_QUANTITY_DISPLACEMENT, 'um', 1E-6,\n    ['мкм', 'µm', 'μm', 'micron']);\n  RegisterUnit(RECORDER_QUANTITY_DISPLACEMENT, 'nm', 1E-9, ['нм']);\n\n  RegisterQuantity(RECORDER_QUANTITY_FORCE, 'N', ['Н', 'newton']);\n  RegisterUnit(RECORDER_QUANTITY_FORCE, 'kN', 1E3, ['кН']);\n\n  RegisterQuantity(RECORDER_QUANTITY_FREQUENCY, 'Hz', ['Гц', 'hertz']);\n  RegisterUnit(RECORDER_QUANTITY_FREQUENCY, 'kHz', 1E3, ['кГц']);\n\n  RegisterQuantity(RECORDER_QUANTITY_ELECTRIC_CHARGE, 'C',\n    ['Кл', 'coulomb']);\n  RegisterUnit(RECORDER_QUANTITY_ELECTRIC_CHARGE, 'mC', 1E-3, ['мКл']);\n  RegisterUnit(RECORDER_QUANTITY_ELECTRIC_CHARGE, 'uC', 1E-6,\n    ['мкКл', 'µC', 'μC']);\n  RegisterUnit(RECORDER_QUANTITY_ELECTRIC_CHARGE, 'nC', 1E-9, ['нКл']);\n  RegisterUnit(RECORDER_QUANTITY_ELECTRIC_CHARGE, 'pC', 1E-12, ['пКл']);\nend;\n\nfunction RecorderUnitManager: TRecorderUnitManager;\nbegin\n  if not Assigned(g_RecorderUnitManager) then\n    g_RecorderUnitManager := TRecorderUnitManager.Create;\n  Result := g_RecorderUnitManager;\nend;\n\nfinalization\n  FreeAndNil(g_RecorderUnitManager);\n\nend.\n", "sha256": "811864601059fb766cabb60e6e208e7ed197568f069f7ffffc7a9bcc8b921570"}, "Core/uRecorderAppVersion.pas": {"text": "unit uRecorderAppVersion;\n\n{$mode objfpc}{$H+}\n{$codepage UTF8}\n\ninterface\n\nconst\n  CRecorderLnxVersion = '0.1.207';\n  CRecorderLnxCaption = 'RecorderLnx ' + CRecorderLnxVersion;\n  CRecorderDefaultSoftwareArticle = 'БЛИЖ.409801.100.236-01';\n\nfunction RecorderSoftwareArticle: string;\n\nimplementation\n\nuses\n  SysUtils, IniFiles, uRecorderMeraPaths;\n\nfunction RecorderSoftwareArticle: string;\nvar\n  lIni: TIniFile;\n  lIniFileName: string;\nbegin\n  Result := CRecorderDefaultSoftwareArticle;\n  lIniFileName := RecorderAppConfigFileName;\n  if FileExists(lIniFileName) then\n  begin\n    lIni := TIniFile.Create(lIniFileName);\n    try\n      if lIni.ValueExists('Application', 'SoftwareArticle') then\n        Result := Trim(lIni.ReadString('Application', 'SoftwareArticle',\n          CRecorderDefaultSoftwareArticle))\n      else\n        lIni.WriteString('Application', 'SoftwareArticle',\n          CRecorderDefaultSoftwareArticle);\n    finally\n      lIni.Free;\n    end;\n  end;\n  if Result = '' then\n    Result := CRecorderDefaultSoftwareArticle;\nend;\n\nend.\n", "sha256": "e2791258ea8c37357dcec9fc9d57b32201c54dc8a2f8b21630b613de377bcca6"}, "UI/uTagSettingsDialog.pas": {"text": "unit uTagSettingsDialog;\n\n{\n  Модуль uTagSettingsDialog\n\n  Назначение:\n    Диалог редактирования свойств одного или нескольких тегов/каналов RecorderLnx.\n\n  Режим multi-select:\n    - Если выбрано несколько каналов, общие поля показывают «смешанное» состояние.\n    - Часть действий (градуировки, адрес входа) доступна только для одного тега.\n    - При сохранении изменения применяются ко всем выбранным тегам.\n\n  Кодировка (2026-06):\n    Файл в UTF-8 с соответствующей директивой codepage. Строки для LCL — обычные string-литералы.\n    См. Docs/source-encoding.md.\n}\n\n{$mode objfpc}{$H+}\n{$codepage UTF8}\n\ninterface\n\nuses\n  Classes, SysUtils, Math, Forms, Controls, Graphics, StdCtrls, ExtCtrls, ComCtrls,\n  Buttons, Dialogs, ImgList, uRecorderTags, uMeraFile, uComponentServices,\n  uRecorderDataSources, uRecorderTagSettingsProvider,\n  uRecorderCalibrationAddDialog, uRecorderCalibrationPropertiesDialog,\n  uRecorderCalibrationListDialog, uRecorderSdbStore, uRecorderSdbSelectDialog,\n  uRecorderStrainCalibrationDialog,\n  uRecorderCommandImages, uRcIconIds,\n  uRecorderFrequencyGrids, uRecorderUnitManager,\n  uRecorderTagCalibrationDialog, uRecorderConfiguredDataSources;\n\ntype\n  TTagHardwareSourceSetupEvent = procedure(Sender: TObject; ATag: TRecorderTag) of object;\n  TTagCanZeroBalanceEvent = function(Sender: TObject;\n    ARegistry: TRecorderTagRegistry; ATags: TList): Boolean of object;\n  TTagZeroBalanceEvent = procedure(Sender: TObject; ARegistry: TRecorderTagRegistry;\n    ATags: TList) of object;\n  { TTagSettingsDialog }\n  { Диалоговое окно настройки свойств тега (канала)   }\n  TTagSettingsDialog = class(TForm)\n  published\n    fPageControl: TPageControl;\n    tsParams: TTabSheet;\n    gbGeneral: TGroupBox;\n    lbName: TLabel;\n    fNameEdit: TEdit;\n    lbUnit: TLabel;\n    fUnitCombo: TComboBox;\n    fAutoUnitCheck: TCheckBox;\n    lbModule: TLabel;\n    fModuleEdit: TEdit;\n    fAddressButton: TSpeedButton;\n    lbDescription: TLabel;\n    fDescriptionEdit: TEdit;\n    fDescriptionEditBtn: TSpeedButton;\n    lbFrequency: TLabel;\n    fFrequencyCombo: TComboBox;\n    lbHz: TLabel;\n    fDetachedSourceLabel: TLabel;\n    gbRange: TGroupBox;\n    lbMin: TLabel;\n    fMinEdit: TEdit;\n    lbMax: TLabel;\n    fMaxEdit: TEdit;\n    fAutoRangeCheck: TCheckBox;\n    gbHardwareCurve: TGroupBox;\n    fHardwareCurveCheck: TCheckBox;\n    fHardwareCurveEdit: TEdit;\n    fHardwareCurveSelectBtn: TSpeedButton;\n    fHardwareCurveSetupBtn: TSpeedButton;\n    fHardwareCurveDownloadBtn: TSpeedButton;\n    gbChannelCurve: TGroupBox;\n    fChannelCurveCheck: TCheckBox;\n    fChannelCurveEdit: TEdit;\n    fChannelCurveSelectBtn: TSpeedButton;\n    fChannelCurveAddBtn: TSpeedButton;\n    fChannelCurveDeleteBtn: TSpeedButton;\n    fChannelCurveEditBtn: TSpeedButton;\n    fChannelCalibrateBtn: TButton;\n    pnTagDeviceActions: TPanel;\n    fZeroBalanceBtn: TSpeedButton;\n    fHardwareDeviceSetupBtn: TSpeedButton;\n    lbVirtualChannelInfo: TLabel;\n    tsAdditional: TTabSheet;\n    gbEstimates: TGroupBox;\n    fEstimateCheckMO: TCheckBox;\n    fEstimateCheckSKZ: TCheckBox;\n    fEstimateCheckSKO: TCheckBox;\n    fEstimateCheckPeak: TCheckBox;\n    fEstimateCheckPeakPeak: TCheckBox;\n    fEstimateCheckMin: TCheckBox;\n    fEstimateCheckMax: TCheckBox;\n    fEstimateCheckPeakPeakByRms: TCheckBox;\n    lbDefaultEstimate: TLabel;\n    fDefaultEstimateCombo: TComboBox;\n    gbPortion: TGroupBox;\n    fPortionLengthEdit: TEdit;\n    lbPortionUnit: TLabel;\n    gbSmoothing: TGroupBox;\n    fSmoothingCheck: TCheckBox;\n    fSmoothingKEdit: TEdit;\n    gbChannelProps: TGroupBox;\n    fScadaCheck: TCheckBox;\n    tsSetpoints: TTabSheet;\n    pnSetpoint0: TPanel;\n    lbSetpointName0: TLabel;\n    fSetpointEnabledCheck0: TCheckBox;\n    pnSetpointUnit0: TPanel;\n    fSetpointThresholdEdit0: TEdit;\n    fSetpointAlarmInfoEdit0: TEdit;\n    lbSetpointText0_1: TLabel;\n    lbSetpointText0_2: TLabel;\n    fSetpointColorPanel0: TPanel;\n    pnSetpoint1: TPanel;\n    lbSetpointName1: TLabel;\n    fSetpointEnabledCheck1: TCheckBox;\n    pnSetpointUnit1: TPanel;\n    fSetpointThresholdEdit1: TEdit;\n    fSetpointAlarmInfoEdit1: TEdit;\n    lbSetpointText1_1: TLabel;\n    lbSetpointText1_2: TLabel;\n    fSetpointColorPanel1: TPanel;\n    pnSetpoint2: TPanel;\n    lbSetpointName2: TLabel;\n    fSetpointEnabledCheck2: TCheckBox;\n    pnSetpointUnit2: TPanel;\n    fSetpointThresholdEdit2: TEdit;\n    fSetpointAlarmInfoEdit2: TEdit;\n    lbSetpointText2_1: TLabel;\n    lbSetpointText2_2: TLabel;\n    fSetpointColorPanel2: TPanel;\n    pnSetpoint3: TPanel;\n    lbSetpointName3: TLabel;\n    fSetpointEnabledCheck3: TCheckBox;\n    pnSetpointUnit3: TPanel;\n    fSetpointThresholdEdit3: TEdit;\n    fSetpointAlarmInfoEdit3: TEdit;\n    lbSetpointText3_1: TLabel;\n    lbSetpointText3_2: TLabel;\n    fSetpointColorPanel3: TPanel;\n    pnSetpointAdd: TPanel;\n    lbSetpointAddName: TLabel;\n    fSetpointHysteresisCheck: TCheckBox;\n    fSetpointStatusChannelCheck: TCheckBox;\n    fSetpointSoundCheck: TCheckBox;\n    fSetpointRangeControlCheck: TCheckBox;\n    fSetpointRangeAlarmInfoEdit: TEdit;\n    pnBottom: TPanel;\n    btnOk: TButton;\n    btnCancel: TButton;\n    fApplyButton: TButton;\n    /// LFM-обработчик OnClick кнопки OK; при создании заменяется на OkButtonClick.\n    procedure btnOkClick(Sender: TObject);\n    /// LFM-обработчик OnChange флага Auto; рабочая логика назначается через OnClick.\n    procedure fAutoUnitCheckChange(Sender: TObject);\n    /// OnClick кнопки балансировки запускает операцию для выбранного канала.\n    procedure ZeroBalanceButtonClick(Sender: TObject);\n    /// OnClick кнопки настройки устройства открывает редактор аппаратного
