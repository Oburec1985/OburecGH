o.QuantityId,\n          lOutputInfo.QuantityId)) then\n          fUnitCombo.Text := lOutputInfo.BaseUnitName;\n      end\n      else\n        fUnitCombo.Text := BaseUnitName(TagAt(0));\n      RefreshUnitChoices;\n    end;\n    Exit;\n  end;\n  ApplyAutoUnitFromChannelCalibration;\n  RefreshUnitChoices;\nend;\n\nprocedure TTagSettingsDialog.EstimateCheckClick(Sender: TObject);\nvar\n  lCheck: TCheckBox;\nbegin\n  if not (Sender is TCheckBox) then\n    Exit;\n  lCheck := TCheckBox(Sender);\n  if lCheck.State = cbGrayed then\n    lCheck.State := cbChecked;\n  lCheck.AllowGrayed := False;\nend;\n\nprocedure TTagSettingsDialog.DefaultEstimateComboChange(Sender: TObject);\nvar\n  lCheck: TCheckBox;\n  lKind: TRecorderTagEstimateKind;\nbegin\n  if fDefaultEstimateCombo.ItemIndex < 0 then\n    Exit;\n  lKind := TRecorderTagEstimateKind(PtrInt(\n    fDefaultEstimateCombo.Items.Objects[fDefaultEstimateCombo.ItemIndex]));\n  if lKind > tekPeakToPeakByRmsDeviation then\n    Exit;\n  lCheck := fEstimateChecks[lKind];\n  if lCheck = nil then\n    Exit;\n  lCheck.AllowGrayed := False;\n  lCheck.Checked := True;\nend;\n\nprocedure TTagSettingsDialog.AddCalibrationButtonClick(Sender: TObject);\nvar\n  lAction: TRecorderCalibrationAddAction;\n  lCalibrationName: string;\n  lExcitation: string;\n  lKey: string;\n  I: Integer;\n  lKind: TRecorderCalibrationKind;\n  lCalibration: TRecorderCalibration;\nbegin\n  if not ShowRecorderCalibrationAddDialog(Self, lKind, lAction) then\n    Exit;\n\n  if lAction = rcaaLoadFromSdb then\n  begin\n    if not ShowRecorderSdbSelectDialog(Self, '', lKey) or\n      not RecorderSdbImportCalibration(fTagRegistry.Calibrations, lKey,\n        lCalibrationName) then\n      Exit;\n    for I := 0 to fTags.Count - 1 do\n    begin\n      TagAt(I).CalibrationNames.Add(lCalibrationName);\n    end;\n    ApplyAutoUnitFromChannelCalibration;\n    UpdateChannelCurveText;\n    Exit;\n  end;\n\n  lCalibration := TRecorderCalibration.Create(lKind);\n  try\n    lCalibration.Name := 'ГХ ' + IntToStr(fTagRegistry.Calibrations.Count + 1);\n    if lKind in [rckPiecewiseLinear, rckPolynomial] then\n    begin\n      lCalibration.AddPoint(0, 0);\n      lCalibration.AddPoint(1, 1);\n    end;\n\n    if lKind = rckStrain then\n    begin\n      if fTags.Count > 0 then\n        TryGetStrainDeviceExcitation(TagAt(0), lExcitation);\n      if not ShowRecorderStrainCalibrationDialog(Self, lCalibration,\n        lExcitation, TagAt(0).UnitName) then Exit;\n    end\n    else if not ShowRecorderCalibrationPropertiesDialog(Self, lCalibration) then\n      Exit;\n\n  fTagRegistry.Calibrations.Add(lCalibration);\n  for I := 0 to fTags.Count - 1 do\n  begin\n    TagAt(I).CalibrationNames.Add(lCalibration.Name);\n  end;\n    lCalibration := nil;\n    ApplyAutoUnitFromChannelCalibration;\n    UpdateChannelCurveText;\n  finally\n    lCalibration.Free;\n  end;\nend;\n\nprocedure TTagSettingsDialog.DeleteCalibrationButtonClick(Sender: TObject);\nvar\n  I: Integer;\nbegin\n  for I := 0 to fTags.Count - 1 do\n    TagAt(I).CalibrationNames.Clear;\n  UpdateChannelCurveText;\nend;\n\nprocedure TTagSettingsDialog.EditCalibrationButtonClick(Sender: TObject);\nbegin\n  if (fTags.Count = 1) and (TagAt(0).CalibrationNames.Count > 0) then\n    EditCalibrationAt(TagAt(0).CalibrationNames.Count - 1)\n  else\n    EditCalibrationAt(-1);\nend;\n\nprocedure TTagSettingsDialog.EditCalibrationAt(APipelineIndex: Integer);\nvar\n  lCalibration: TRecorderCalibration;\n  lDraft: TRecorderCalibration;\n  lError: string;\n  lExisting: TRecorderCalibration;\n  lExcitation: string;\n  lName: string;\n  lChoice: TModalResult;\n  lSavePrompt: string;\n  lSdbKey: string;\nbegin\n  if fTags.Count <> 1 then\n  begin\n    MessageDlg('Канальная ГХ','Редактирование доступно только для одного значения тега.',\n      mtInformation, [mbOK], 0);\n    Exit;\n  end;\n\n  if (APipelineIndex < 0) or\n    (APipelineIndex >= TagAt(0).CalibrationNames.Count) then\n  begin\n    MessageDlg('Канальная ГХ',\n      'У выбранного тега нет назначенной ГХ.',\n      mtInformation, [mbOK], 0);\n    Exit;\n  end;\n\n  lName := TagAt(0).CalibrationNames[APipelineIndex];\n  lCalibration := fTagRegistry.FindCalibrationByName(lName);\n  if lCalibration = nil then\n  begin\n    MessageDlg('Канальная ГХ', 'ГХ «' + lName +\n      '» не найдена в реестре калибровок.',\n      mtInformation, [mbOK], 0);\n    Exit;\n  end;\n\n  lDraft := lCalibration.Clone;\n  try\n    TryGetStrainDeviceExcitation(TagAt(0), lExcitation);\n    if not (((lDraft.Kind = rckStrain) and\n      ShowRecorderStrainCalibrationDialog(Self, lDraft, lExcitation,\n      TagAt(0).UnitName)) or\n      ((lDraft.Kind <> rckStrain) and\n      ShowRecorderCalibrationPropertiesDialog(Self, lDraft))) then\n      Exit;\n\n    if Trim(lCalibration.SdbKey) <> '' then\n      lSavePrompt := 'Да — обновить исходную ГХ в БДГХ и во всех тегах.'\n    else\n      lSavePrompt := 'Да — изменить общую ГХ для всех тегов, которые её используют.';\n    lChoice := MessageDlg('Сохранение канальной ГХ',\n      lSavePrompt + LineEnding +\n      'Нет — создать отдельную локальную копию только для текущего тега.' + LineEnding +\n      'Отмена — не применять изменения.', mtConfirmation,\n      [mbYes, mbNo, mbCancel], 0);\n    try\n      case lChoice of\n        mrYes:\n          begin\n            if Trim(lDraft.Name) = '' then\n            begin\n              MessageDlg('Сохранение канальной ГХ',\n                'Имя ГХ не может быть пустым.', mtError, [mbOK], 0);\n              Exit;\n            end;\n            lExisting := fTagRegistry.FindCalibrationByName(Trim(lDraft.Name));\n            if (lExisting <> nil) and (lExisting <> lCalibration) then\n            begin\n              MessageDlg('Сохранение канальной ГХ',\n                'ГХ с именем «' + Trim(lDraft.Name) +\n                '» уже существует.', mtError, [mbOK], 0);\n              Exit;\n            end;\n            lSdbKey := Trim(lCalibration.SdbKey);\n            if not RecorderSdbUpdateLinkedCalibration(lCalibration,\n              lDraft, lError) then\n            begin\n              MessageDlg('Сохранение канальной ГХ',\n                'Не удалось обновить ГХ в БДГХ:' + LineEnding + lError,\n                mtError, [mbOK], 0);\n              Exit;\n            end;\n            fTagRegistry.CommitCalibrationEdit(lCalibration, lDraft);\n            { CommitCalibrationEdit normally turns an edited calibration into\n              a local one.  A successful in-place SDB update keeps the link. }\n            if lSdbKey <> '' then\n              lCalibration.SdbKey := lSdbKey;\n          end;\n        mrNo:\n          fTagRegistry.AddCalibrationCopyForTag(TagAt(0), APipelineIndex, lDraft);\n      else\n        Exit;\n      end;\n    except\n      on E: ERecorderTagError do\n      begin\n        MessageDlg('Канальная ГХ', E.Message, mtError, [mbOK], 0);\n        Exit;\n      end;\n    end;\n    ApplyAutoUnitFromChannelCalibration;\n    UpdateChannelCurveText;\n  finally\n    lDraft.Free;\n  end;\nend;\n\nprocedure TTagSettingsDialog.ChannelCurveNotebookClick(Sender: TObject);\nvar\n  lIndex: Integer;\nbegin\n  if (fTags.Count <> 1) or (TagAt(0).CalibrationNames.Count = 0) then\n  begin\n    EditCalibrationAt(-1);\n    Exit;\n  end;\n  if TagAt(0).CalibrationNames.Count = 1 then\n  begin\n    EditCalibrationAt(0);\n    Exit;\n  end;\n  if ShowRecorderCalibrationPipelineItemDialog(Self,\n    fTagRegistry.Calibrations, TagAt(0).CalibrationNames, lIndex) then\n    EditCalibrationAt(lIndex);\nend;\n\nprocedure TTagSettingsDialog.ExportCalibrationButtonClick(Sender: TObject);\nvar\n  lCalibration: TRecorderCalibration;\n  lCreatedKey: string;\n  lError: string;\n  lFolderKey: string;\n  lName: string;\nbegin\n  if fTags.Count <> 1 then\n  begin\n    MessageDlg('Экспорт ГХ',\n      'Экспорт доступен только для одного значения тега.',\n      mtInformation, [mbOK], 0);\n    Exit;\n  end;\n  if TagAt(0).CalibrationNames.Count = 0 then\n  begin\n    MessageDlg('Экспорт ГХ', 'У выбранного тега нет назначенной ГХ.',\n      mtInformation, [mbOK], 0);\n    Exit;\n  end;\n  lName := TagAt(0).CalibrationNames[TagAt(0).CalibrationNames.Count - 1];\n  lCalibration := fTagRegistry.FindCalibrationByName(lName);\n  if lCalibration = nil then\n  begin\n    MessageDlg('Экспорт ГХ', 'Назначенная ГХ не найдена в реестре.', mtError, [mbOK], 0);\n    Exit;\n  end;\n  if not ShowRecorderSdbFolderSelectDialog(Self, '', lFolderKey) then\n    Exit;\n  if RecorderSdbExportCalibration(lFolderKey, lCalibration, False,\n    lCreatedKey, lError) then\n  begin\n    MessageDlg('Экспорт ГХ', 'ГХ экспортирована в БДГХ:' + LineEnding + lCreatedKey, mtInformation, [mbOK], 0);\n    Exit;\n  end;\n  if lError = 'EXISTS' then\n  begin\n    if MessageDlg('Экспорт ГХ', 'В выбранной папке уже есть ГХ с таким именем.' +LineEnding + 'Заменить её?', mtConfirmation, [mbYes, mbNo], 0) <> mrYes then\n      Exit;\n    if RecorderSdbExportCalibration(lFolderKey, lCalibration, True,\n      lCreatedKey, lError) then\n    begin\n      MessageDlg('Экспорт ГХ', 'ГХ заменена в БДГХ:' + LineEnding +\n        lCreatedKey, mtInformation, [mbOK], 0);\n      Exit;\n    end;\n  end;\n  MessageDlg('Экспорт ГХ', 'Не удалось экспортировать ГХ:' + LineEnding +\n    lError, mtError, [mbOK], 0);\nend;\n\nprocedure TTagSettingsDialog.SelectHardwareCalibrationButtonClick(Sender: TObject);\nvar\n  lCalibration: TRecorderCalibration;\nbegin\n  if fTags.Count <> 1 then\n  begin\n    MessageDlg('Аппаратная ГХ',\n      'Просмотр аппаратной ГХ поддерживается только для одного значения тега.',\n      mtInformation, [mbOK], 0);\n    Exit;\n  end;\n\n  if Trim(TagAt(0).HardwareCalibrationName) = '' then\n  begin\n    if SameText(Copy(RecorderNormalizeTagSourceId(TagAt(0).SourceId), 1,\n      Length('pxi-mx248:')), 'pxi-mx248:') then\n    begin\n      DownloadHardwareCalibrationFromDeviceClick(Sender);\n      Exit;\n    end;\n    MessageDlg('Аппаратная ГХ',\n      'У выбранного тега нет назначенной аппаратной ГХ. Сначала выполните вычитку ГХ из модуля.',\n      mtInformation, [mbOK], 0);\n    Exit;\n  end;\n\n  lCalibration := fTagRegistry.FindCalibrationByName(\n    Trim(TagAt(0).HardwareCalibrationName));\n  if lCalibration <> nil then\n  begin\n    if EditLinkedHardwareCalibration(lCalibration) then\n      UpdateHardwareCurveText;\n  end\n  else\n  begin\n    MessageDlg('Аппаратная ГХ',\n      'Градуировка аппаратной ГХ не найдена в реестре калибровок.',\n      mtInformation, [mbOK], 0);\n  end;\nend;\n\nprocedure TTagSettingsDialog.EditHardwareCalibrationButtonClick(Sender: TObject);\nvar\n  lCalibration: TRecorderCalibration;\nbegin\n  if fTags.Count <> 1 then\n  begin\n    MessageDlg('Аппаратная ГХ',\n      'Редактирование доступно только для одного значения тега.',\n      mtInformation, [mbOK], 0);\n    Exit;\n  end;\n\n  if Trim(TagAt(0).HardwareCalibrationName) = '' then\n  begin\n    MessageDlg('Аппаратная ГХ',\n      'У выбранного тега нет назначенной аппаратной ГХ.',\n      mtInformation, [mbOK], 0);\n    Exit;\n  end;\n\n  lCalibration := fTagRegistry.FindCalibrationByName(TagAt(0).HardwareCalibrationName);\n  if lCalibration = nil then\n  begin\n    MessageDlg('Аппаратная ГХ',\n      'Градуировка аппаратной ГХ не найдена в списке калибровок.',\n      mtInformation, [mbOK], 0);\n    Exit;\n  end;\n\n  if EditLinkedHardwareCalibration(lCalibration) then\n    UpdateHardwareCurveText;\nend;\n\nfunction TTagSettingsDialog.EditLinkedHardwareCalibration(\n  ACalibration: TRecorderCalibration): Boolean;\nvar\n  lDraft: TRecorderCalibration;\n  lError: string;\n  lExisting: TRecorderCalibration;\nbegin\n  Result := False;\n  if ACalibration = nil then\n    Exit;\n  lDraft := ACalibration.Clone;\n  try\n    if not (((lDraft.Kind = rckStrain) and\n      ShowRecorderStrainCalibrationDialog(Self, lDraft)) or\n      ((lDraft.Kind <> rckStrain) and\n      ShowRecorderCalibrationPropertiesDialog(Self, lDraft))) then\n      Exit;\n    if Trim(lDraft.Name) = '' then\n    begin\n      MessageDlg('Сохранение аппаратной ГХ',\n        'Имя ГХ не может быть пустым.', mtError, [mbOK], 0);\n      Exit;\n    end;\n    lExisting := fTagRegistry.FindCalibrationByName(Trim(lDraft.Name));\n    if (lExisting <> nil) and (lExisting <> ACalibration) then\n    begin\n      MessageDlg('Сохранение аппаратной ГХ',\n        'ГХ с именем «' + Trim(lDraft.Name) + '» уже существует.',\n        mtError, [mbOK], 0);\n      Exit;\n    end;\n    if not RecorderSdbUpdateLinkedCalibration(ACalibration, lDraft,\n      lError) then\n    begin\n      MessageDlg('Сохранение аппаратной ГХ',\n        'Не удалось обновить связанную ГХ в БДГХ:' + LineEnding +\n        lError, mtError, [mbOK], 0);\n      Exit;\n    end;\n    try\n      Result := fTagRegistry.CommitCalibrationEdit(ACalibration, lDraft);\n    except\n      on E: ERecorderTagError do\n        MessageDlg('Сохранение аппаратной ГХ', E.Message,\n          mtError, [mbOK], 0);\n    end;\n  finally\n    lDraft.Free;\n  end;\nend;\n\nprocedure TTagSettingsDialog.AssignDownloadFlashIcon(AButton: TSpeedButton);\nvar\n  lI: Integer;\n  lIcon: TIcon;\nbegin\n  if AButton = nil then\n    Exit;\n  lIcon := TIcon.Create;\n  try\n    for lI := Low(CRamOutIconPaths) to High(CRamOutIconPaths) do\n    begin\n      if FileExists(CRamOutIconPaths[lI]) then\n      begin\n        lIcon.LoadFromFile(CRamOutIconPaths[lI]);\n        AButton.Glyph.Assign(lIcon);\n        Break;\n      end;\n    end;\n  finally\n    lIcon.Free;\n  end;\nend;\n\nprocedure TTagSettingsDialog.UpdateHardwareCurveButtons;\nvar\n  lI: Integer;\n  lHasHardwareDevice: Boolean;\n  lProvider: IRecorderTagSettingsProvider;\n  lState: TRecorderTagSettingsState;\nbegin\n  lHasHardwareDevice := False;\n  for lI := 0 to fTags.Count - 1 do\n    if ResolveSettingsProvider(TagAt(lI), lProvider) and\n      lProvider.ReadState(fTagRegistry, TagAt(lI), lState) and\n      lState.HardwareCalibrationDownloadable then\n    begin\n      lHasHardwareDevice := True;\n      Break;\n    end;\n  if fHardwareCurveDownloadBtn <> nil then\n    fHardwareCurveDownloadBtn.Visible := lHasHardwareDevice;\nend;\n\nprocedure TTagSettingsDialog.DownloadHardwareCalibrationFromDeviceClick(Sender: TObject);\nconst\n  sGhDownloadTitle = 'Выгрузка ГХ';\n  sGhDownloadOk = 'Градуировки считаны и привязаны к тегам.';\n  sGhReadOnly = 'Параметры ГХ считаны из устройства, но ГХ не была создана ' +\n    'или привязана к тегу.';\n  sGhDownloadNoSupported =\n    'Среди выбранных тегов нет источников с поддержкой выгрузки аппаратной ГХ.';\nvar\n  lErrorMessage: string;\n  lErrors: TStringList;\n  lI: Integer;\n  lMessageText: string;\n  lMessages: TStringList;\n  lLinkedCount: Integer;\n  lOkCount: Integer;\n  lProvider: IRecorderTagSettingsProvider;\n  lResult: TRecorderHardwareCalibrationResult;\n  lState: TRecorderTagSettingsState;\nbegin\n  if fTags.Count = 0 then\n    Exit;\n\n  lErrors := TStringList.Create;\n  lMessages := TStringList.Create;\n  try\n    lOkCount := 0;\n    lLinkedCount := 0;\n    for lI := 0 to fTags.Count - 1 do\n    begin\n      if not ResolveSettingsProvider(TagAt(lI), lProvider) then\n        Continue;\n      if not lProvider.ReadState(fTagRegistry, TagAt(lI), lState) or\n        not lState.HardwareCalibrationDownloadable then\n        Continue;\n      if lProvider.DownloadHardwareCalibration(fTagRegistry, TagAt(lI),\n        lResult, lErrorMessage) then\n      begin\n        Inc(lOkCount);\n        { Успех вызова provider означает успешное чтение устройства, но не\n          обязательно создание TRecorderCalibration. Не обещаем пользователю\n          привязку, пока она не подтверждена моделью тега и registry. }\n        if (Trim(TagAt(lI).HardwareCalibrationName) <> '') and\n          (fTagRegistry.FindCalibrationByName(\n            TagAt(lI).HardwareCalibrationName) <> nil) then\n          Inc(lLinkedCount);\n        lMessageText := Trim(lResult.MessageText);\n        if Trim(lResult.PresentationText) <> '' then\n        begin\n          if lMessageText <> '' then\n            lMessageText := lMessageText + LineEnding;\n          lMessageText := lMessageText + Trim(lResult.PresentationText);\n        end;\n        if lMessageText <> '' then\n          lMessages.Add(Format('%s (%s): %s', [TagAt(lI).Name,\n            TagAt(lI).Address, lMessageText]));\n      end\n      else\n        lErrors.Add(Format('%s (%s): %s', [TagAt(lI).Name, TagAt(lI).Address,\n          lErrorMessage]));\n    end;\n\n    UpdateHardwareCurveText;\n    if (lErrors.Count = 0) and (lOkCount > 0) then\n    begin\n      if lMessages.Count > 0 then\n      begin\n        lMessageText := lMessages[0];\n        if lMessages.Count > 1 then\n          lMessageText := lMessageText + LineEnding + '...';\n        if lLinkedCount = lOkCount then\n          lErrorMessage := sGhDownloadOk\n        else\n          lErrorMessage := sGhReadOnly;\n        MessageDlg(sGhDownloadTitle, lErrorMessage + LineEnding +\n          lMessageText, mtInformation, [mbOK], 0);\n      end\n      else if lLinkedCount = lOkCount then\n        MessageDlg(sGhDownloadTitle, sGhDownloadOk, mtInformation, [mbOK], 0)\n      else\n        MessageDlg(sGhDownloadTitle, sGhReadOnly, mtInformation, [mbOK], 0);\n    end\n    else if lErrors.Count > 0 then\n      MessageDlg(sGhDownloadTitle, lErrors.Text, mtError, [mbOK], 0)\n    else\n      MessageDlg(sGhDownloadTitle, sGhDownloadNoSupported,\n        mtInformation, [mbOK], 0);\n  finally\n    lMessages.Free;\n    lErrors.Free;\n  end;\nend;\n\nend.\n", "sha256": "62976c9044b811c63b199b31a7b073f99fc76369a871eec76188da61fbf38a5d"}, "Device/uRecorderHardwareTagSettingsProviders.pas": {"text": "unit uRecorderHardwareTagSettingsProviders;\n\n{\n  Device implementations of the common tag-settings capability. Device\n  recognition, frequency scope and calibration details intentionally live\n  here rather than in uTagSettingsDialog.\n}\n\n{$mode objfpc}{$H+}\n{$codepage UTF8}\n\ninterface\n\nuses\n  Classes, SysUtils,\n  uRecorderTags, uRecorderDataSources, uRecorderTagSettingsProvider;\n\ntype\n  TRecorderHardwareTagSettingsResolver = class(TInterfacedObject,\n    IRecorderTagSettingsProviderResolver)\n  private\n    fProviders: TInterfaceList;\n  public\n    constructor Create;\n    destructor Destroy; override;\n    function Resolve(ATag: TRecorderTag; const ASource: IRecorderDataSource;\n      out AProvider: IRecorderTagSettingsProvider): Boolean;\n  end;\n\nfunction CreateRecorderHardwareTagSettingsResolver:\n  IRecorderTagSettingsProviderResolver;\n\nimplementation\n\nuses\n  Math, StrUtils,\n  uRecorderConfiguredDataSources,\n  uRecorderHardwareLiveDevices, uRecorderDeviceInterfaces,\n  uRecorderMc201Calibration, uRecorderPxiMx248Types,\n  uRecorderPxiMx248Addressing,\n  uRecorderPxiMx248Properties,\n  uRecorderDriverContractsV2, uRecorderPxiMx248RuntimeTransport,\n  uRecorderPxiMx248WindowsTransport;\n\ntype\n  IRecorderHardwareTagSettingsProvider = interface(IRecorderTagSettingsProvider)\n    ['{42949D96-928D-411C-827E-15CB5D333A49}']\n    function Accepts(ATag: TRecorderTag): Boolean;\n    function ForSource(const ASource: IRecorderDataSource): IRecorderTagSettingsProvider;\n  end;\n\n  TRecorderHardwareTagSettingsProvider = class(TInterfacedObject,\n    IRecorderTagSettingsProvider, IRecorderHardwareTagSettingsProvider)\n  public\n    function Accepts(ATag: TRecorderTag): Boolean; virtual; abstract;\n    function ForSource(const ASource: IRecorderDataSource): IRecorderTagSettingsProvider; virtual;\n    function ReadState(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      out AState: TRecorderTagSettingsState): Boolean; virtual;\n    function NormalizeDraft(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      var ADraft: TRecorderTagSettingsDraft; out AErrorText: string): Boolean; virtual;\n    function ApplyDraft(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      const ADraft: TRecorderTagSettingsDraft;\n      out AResult: TRecorderTagSettingsApplyResult;\n      out AErrorText: string): Boolean; virtual;\n    function DownloadHardwareCalibration(ARegistry: TRecorderTagRegistry;\n      ATag: TRecorderTag; out AResult: TRecorderHardwareCalibrationResult;\n      out AErrorText: string): Boolean; virtual;\n  end;\n\n  { MX-248 has one ADC clock for all eight channels. The common tag dialog\n    therefore edits the persisted source packet and every already published\n    tag in place; replacing tag objects here would break external bindings. }\n  TRecorderPxiMx248TagSettingsProvider = class(\n    TRecorderHardwareTagSettingsProvider)\n  private\n    fSource: IRecorderDataSource;\n    function ProgramSourceFrequency(ARegistry: TRecorderTagRegistry;\n      ATag: TRecorderTag; AFrequencyHz: Double;\n      out AErrorText: string): Boolean;\n    procedure ApplySourceFrequency(ARegistry: TRecorderTagRegistry;\n      ATag: TRecorderTag; AFrequencyHz: Double);\n    function PersistSourceFrequency(ARegistry: TRecorderTagRegistry;\n      ATag: TRecorderTag; AFrequencyHz: Double;\n      out AErrorText: string): Boolean;\n  public\n    constructor Create(const ASource: IRecorderDataSource = nil);\n    function ForSource(const ASource: IRecorderDataSource): IRecorderTagSettingsProvider; override;\n    function Accepts(ATag: TRecorderTag): Boolean; override;\n    function ReadState(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      out AState: TRecorderTagSettingsState): Boolean; override;\n    function NormalizeDraft(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      var ADraft: TRecorderTagSettingsDraft; out AErrorText: string): Boolean; override;\n    function ApplyDraft(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      const ADraft: TRecorderTagSettingsDraft;\n      out AResult: TRecorderTagSettingsApplyResult;\n      out AErrorText: string): Boolean; override;\n    function DownloadHardwareCalibration(ARegistry: TRecorderTagRegistry;\n      ATag: TRecorderTag; out AResult: TRecorderHardwareCalibrationResult;\n      out AErrorText: string): Boolean; override;\n  end;\n\n  TRecorderMc201TagSettingsProvider = class(TRecorderHardwareTagSettingsProvider)\n  private\n    function SlotFromAddress(const AAddress: string; out ASlot: Integer): Boolean;\n    procedure ApplySlotFrequency(ARegistry: TRecorderTagRegistry;\n      ATag: TRecorderTag; AFrequencyHz: Double);\n  public\n    function Accepts(ATag: TRecorderTag): Boolean; override;\n    function ReadState(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      out AState: TRecorderTagSettingsState): Boolean; override;\n    function ApplyDraft(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      const ADraft: TRecorderTagSettingsDraft;\n      out AResult: TRecorderTagSettingsApplyResult;\n      out AErrorText: string): Boolean; override;\n    function DownloadHardwareCalibration(ARegistry: TRecorderTagRegistry;\n      ATag: TRecorderTag; out AResult: TRecorderHardwareCalibrationResult;\n      out AErrorText: string): Boolean; override;\n  end;\n\nvar\n  GTagSettingsResolverOwner: TObject;\n  GTagSettingsResolver: IRecorderTagSettingsProviderResolver;\n\nfunction TRecorderHardwareTagSettingsProvider.ForSource(\n  const ASource: IRecorderDataSource): IRecorderTagSettingsProvider;\nbegin\n  Result := Self;\nend;\n\nconstructor TRecorderPxiMx248TagSettingsProvider.Create(const ASource: IRecorderDataSource);\nbegin\n  inherited Create;\n  fSource := ASource;\nend;\n\nfunction TRecorderPxiMx248TagSettingsProvider.ForSource(\n  const ASource: IRecorderDataSource): IRecorderTagSettingsProvider;\nbegin\n  Result := TRecorderPxiMx248TagSettingsProvider.Create(ASource);\nend;\n\nfunction TRecorderHardwareTagSettingsProvider.ReadState(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  out AState: TRecorderTagSettingsState): Boolean;\nbegin\n  RecorderInitTagSettingsState(AState);\n  Result := Accepts(ATag);\n  AState.HardwareSourceConfigurable := Result;\nend;\n\nfunction TRecorderHardwareTagSettingsProvider.NormalizeDraft(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  var ADraft: TRecorderTagSettingsDraft; out AErrorText: string): Boolean;\nbegin\n  AErrorText := '';\n  Result := Accepts(ATag);\nend;\n\nfunction TRecorderHardwareTagSettingsProvider.ApplyDraft(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  const ADraft: TRecorderTagSettingsDraft;\n  out AResult: TRecorderTagSettingsApplyResult;\n  out AErrorText: string): Boolean;\nbegin\n  RecorderInitTagSettingsApplyResult(AResult);\n  AErrorText := '';\n  Result := Accepts(ATag);\nend;\n\nfunction TRecorderHardwareTagSettingsProvider.DownloadHardwareCalibration(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  out AResult: TRecorderHardwareCalibrationResult;\n  out AErrorText: string): Boolean;\nbegin\n  RecorderInitHardwareCalibrationResult(AResult);\n  AErrorText := 'Источник не поддерживает выгрузку аппаратной ГХ';\n  Result := False;\nend;\n\nfunction TRecorderPxiMx248TagSettingsProvider.Accepts(\n  ATag: TRecorderTag): Boolean;\nbegin\n  Result := (ATag <> nil) and StartsText('pxi-mx248:',\n    RecorderNormalizeTagSourceId(ATag.SourceId));\nend;\n\nfunction TRecorderPxiMx248TagSettingsProvider.ReadState(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  out AState: TRecorderTagSettingsState): Boolean;\nvar\n  I: Integer;\n  lValues: TStringList;\n  lConfigured: TRecorderConfiguredDataSource;\n  lChannel: Integer;\n  lSourceUnit: string;\nbegin\n  Result := inherited ReadState(ARegistry, ATag, AState);\n  if not Result then Exit;\n  SetLength(AState.FrequencyNames, CPxiMx248SampleRateCount);\n  for I := Low(CPxiMx248SampleRates) to High(CPxiMx248SampleRates) do\n    AState.FrequencyNames[I] := IntToStr(CPxiMx248SampleRates[I]);\n  AState.HardwareCalibrationDownloadable := True;\n  lSourceUnit := Trim(ATag.SourceUnitName);\n  lConfigured := RecorderConfiguredDataSourcesFind(ARegistry, ATag.SourceId);\n  if (lConfigured <> nil) and\n    PxiMx248TryChannelFromAddress(ATag.Address, lChannel) then\n  begin\n    lValues := TStringList.Create;\n    try\n      lValues.StrictDelimiter := True;\n      lValues.Delimiter := ';';\n      lValues.DelimitedText := lConfigured.SpecificConfigText;\n      if lValues.IndexOfName(Format('channel.%d.amplifier-enabled',\n        [lChannel])) >= 0 then\n        if SameText(lValues.Values[Format('channel.%d.amplifier-enabled',\n          [lChannel])], 'True') then lSourceUnit := 'pC'\n        else lSourceUnit := 'V';\n    finally\n      lValues.Free;\n    end;\n  end;\n  if (lSourceUnit = '') or SameText(lSourceUnit, 'code') then\n    lSourceUnit := 'V';\n  AState.SourceUnitName := lSourceUnit;\n  AState.OutputUnitName := lSourceUnit;\n\nend;\n\nfunction TRecorderPxiMx248TagSettingsProvider.NormalizeDraft(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  var ADraft: TRecorderTagSettingsDraft; out AErrorText: string): Boolean;\nbegin\n  Result := inherited NormalizeDraft(ARegistry, ATag, ADraft, AErrorText);\n  if not Result then Exit;\n  if PxiMx248IsSupportedSampleRate(ADraft.PollFrequencyHz) then Exit(True);\n  AErrorText := Format('MX-248 does not support sample rate %g Hz',\n    [ADraft.PollFrequencyHz]);\n  Result := False;\nend;\n\nfunction IsPxiMx248AcquisitionProperty(const AName: string): Boolean;\nvar\n  lName, lSuffix: string;\n  lChannel, lDot: Integer;\nbegin\n  lName := LowerCase(Trim(AName));\n  if MatchText(lName, ['sample-rate-hz', 'block-samples',\n    'calibration-mode']) then Exit(True);\n  if Pos('channel.', lName) <> 1 then Exit(False);\n  lSuffix := Copy(lName, Length('channel.') + 1, MaxInt);\n  lDot := Pos('.', lSuffix);\n  if (lDot <= 1) or not TryStrToInt(Copy(lSuffix, 1, lDot - 1), lChannel) or\n    (lChannel < 1) or (lChannel > CPxiMx248ChannelCount) then Exit(False);\n  lSuffix := Copy(lSuffix, lDot + 1, MaxInt);\n  Result := MatchText(lSuffix, ['enabled', 'amplifier-enabled', 'input-mode',\n    'range-index', 'lpf-index', 'icp-current', 'calibration-enabled',\n    'input-floating']);\nend;\n\nfunction TRecorderPxiMx248TagSettingsProvider.ProgramSourceFrequency(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  AFrequencyHz: Double; out AErrorText: string): Boolean;\nvar\n  lCanonical, lProperties, lSerial, lVersion: string;\n  lConfigured: TRecorderConfiguredDataSource;\n  lConfiguration: TPxiMx248Configuration;\n  lFormat: TFormatSettings;\n  lItems, lValues: TStringList;\n  I, lChassis, lSlot: Integer;\n  lResult: TRcOperationResult;\n  lStore: TPxiMx248PropertyStore;\n  lTransport: TRecorderPxiMx248WindowsTransport;\n  lRuntime: IPxiMx248RuntimeSampleRateSettings;\n  lDevice: IRecorderDevice;\n  lRateControl: IPxiMx248SampleRateDevice;\nbegin\n  Result := False;\n  AErrorText := '';\n  lConfigured := RecorderConfiguredDataSourcesFind(ARegistry, ATag.SourceId);\n  if lConfigured = nil then\n  begin\n    AErrorText := 'MX-248 configured source was not found';\n    Exit;\n  end;\n  if fSource <> nil then\n  begin\n    if not SameText(RecorderNormalizeTagSourceId(fSource.SourceId),\n      RecorderNormalizeTagSourceId(ATag.SourceId)) then\n    begin\n      AErrorText := 'MX-248 runtime source does not match the tag';\n      Exit;\n    end;\n    if Supports(fSource, IPxiMx248RuntimeSampleRateSettings, lRuntime) then\n      lResult := lRuntime.RuntimeSetSampleRate(AFrequencyHz, lProperties)\n    else\n      lResult := TRcOperationResult.Failure(rocUnsupported,\n        'mx248.sample-rate', 'Owned runtime source does not support sample rate settings');\n  end\n  else\n  begin\n    lDevice := RecorderHardwareFindLiveDevice(ATag.SourceId);\n    if lDevice <> nil then\n    begin\n      if Supports(lDevice, IPxiMx248SampleRateDevice, lRateControl) then\n        lResult := lRateControl.SetSampleRate(AFrequencyHz, lProperties)\n      else\n        lResult := TRcOperationResult.Failure(rocUnsupported,\n          'mx248.sample-rate', 'Owned runtime device does not support sample rate settings');\n    end;\n  end;\n  if (fSource <> nil) or (lDevice <> nil) then\n  begin\n    if not lResult.IsSuccess then\n    begin\n      AErrorText := lResult.Stage + ': ' + lResult.MessageText;\n      Exit;\n    end;\n    lValues := TStringList.Create;\n    try\n      lValues.StrictDelimiter := True;\n      lValues.Delimiter := ';';\n      lValues.DelimitedText := lProperties;\n      Result := SameText(Trim(lValues.Values['sample-rate-hz']),\n        IntToStr(Round(AFrequencyHz)));\n      if not Result then AErrorText := 'MX-248 readback did not confirm the requested frequency';\n    finally\n      lValues.Free;\n    end;\n    Exit;\n  end;\n  lItems := TStringList.Create;\n  lValues := TStringList.Create;\n  lStore := TPxiMx248PropertyStore.Create(nil);\n  try\n    lItems.StrictDelimiter := True;\n    lItems.Delimiter := ':';\n    lItems.DelimitedText := RecorderNormalizeTagSourceId(ATag.SourceId);\n    if (lItems.Count <> 3) or not SameText(lItems[0], 'pxi-mx248') or\n      not TryStrToInt(lItems[1], lChassis) or\n      not TryStrToInt(lItems[2], lSlot) then\n    begin\n      AErrorText := 'Tag is not linked to a valid PXI MX-248 source';\n      Exit;\n    end;\n    lValues.StrictDelimiter := True;\n    lValues.Delimiter := ';';\n    lValues.NameValueSeparator := '=';\n    lValues.DelimitedText := lConfigured.SpecificConfigText;\n    for I := lValues.Count - 1 downto 0 do\n      if not IsPxiMx248AcquisitionProperty(lValues.Names[I]) then\n        lValues.Delete(I);\n    lFormat := DefaultFormatSettings;\n    lFormat.DecimalSeparator := '.';\n    lFormat.ThousandSeparator := #0;\n    lValues.Values['sample-rate-hz'] := FloatToStr(AFrequencyHz, lFormat);\n    lResult := lStore.CalcProperties(lValues.DelimitedText, lCanonical);\n    if lResult.IsSuccess then\n      lResult := lStore.CurrentConfiguration(lConfiguration);\n    if not lResult.IsSuccess then\n    begin\n      AErrorText := lResult.Stage + ': ' + lResult.MessageText;\n      Exit;\n    end;\n    lTransport := TRecorderPxiMx248WindowsTransport.Create(lChassis, lSlot);\n    try\n      lResult := lTransport.Connect;\n      if lResult.IsSuccess then\n        lResult := lTransport.Initialize(lSerial, lVersion);\n      if lResult.IsSuccess then\n        lResult := lTransport.ProgramAcquisition(lConfiguration);\n      if lResult.IsSuccess then\n        lResult := lTransport.ReadLiveProperties(lProperties);\n      if not lResult.IsSuccess then\n      begin\n        AErrorText := lResult.Stage + ': ' + lResult.MessageText;\n        Exit;\n      end;\n      lValues.DelimitedText := lProperties;\n      if not SameText(Trim(lValues.Values['sample-rate-hz']),\n        IntToStr(Round(AFrequencyHz))) then\n      begin\n        AErrorText := 'MX-248 readback did not confirm the requested frequency';\n        Exit;\n      end;\n    finally\n      lTransport.Disconnect;\n      lTransport.Free;\n    end;\n    Result := True;\n  finally\n    lStore.Free;\n    lValues.Free;\n    lItems.Free;\n  end;\nend;\n\nfunction TRecorderPxiMx248TagSettingsProvider.PersistSourceFrequency(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  AFrequencyHz: Double; out AErrorText: string): Boolean;\nvar\n  lConfigured: TRecorderConfiguredDataSource;\n  lFormat: TFormatSettings;\n  lValues: TStringList;\nbegin\n  Result := False;\n  AErrorText := '';\n  lConfigured := RecorderConfiguredDataSourcesFind(ARegistry, ATag.SourceId);\n  if lConfigured = nil then\n  begin\n    AErrorText := 'MX-248 configured source was not found';\n    Exit;\n  end;\n  lFormat := DefaultFormatSettings;\n  lFormat.DecimalSeparator := '.';\n  lFormat.ThousandSeparator := #0;\n  lValues := TStringList.Create;\n  try\n    lValues.StrictDelimiter := True;\n    lValues.Delimiter := ';';\n    lValues.NameValueSeparator := '=';\n    lValues.DelimitedText := lConfigured.SpecificConfigText;\n    lValues.Values['sample-rate-hz'] := FloatToStr(AFrequencyHz, lFormat);\n    lConfigured.SpecificConfigText := lValues.DelimitedText;\n    lConfigured.DefaultPollFrequencyHz := AFrequencyHz;\n  finally\n    lValues.Free;\n  end;\n  Result := True;\nend;\n\nprocedure TRecorderPxiMx248TagSettingsProvider.ApplySourceFrequency(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  AFrequencyHz: Double);\nvar\n  I: Integer;\n  lTag: TRecorderTag;\n  lSourceId: string;\nbegin\n  if (ARegistry = nil) or (ATag = nil) then Exit;\n  lSourceId := RecorderNormalizeTagSourceId(ATag.SourceId);\n  for I := 0 to ARegistry.TagCount - 1 do\n  begin\n    lTag := ARegistry.Tags[I];\n    if SameText(RecorderNormalizeTagSourceId(lTag.SourceId), lSourceId) then\n      lTag.PollFrequencyHz := AFrequencyHz;\n  end;\nend;\n\nfunction TRecorderPxiMx248TagSettingsProvider.ApplyDraft(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  const ADraft: TRecorderTagSettingsDraft;\n  out AResult: TRecorderTagSettingsApplyResult;\n  out AErrorText: string): Boolean;\nbegin\n  Result := inherited ApplyDraft(ARegistry, ATag, ADraft, AResult, AErrorText);\n  if not Result then Exit;\n  if not PxiMx248IsSupportedSampleRate(ADraft.PollFrequencyHz) then\n  begin\n    AErrorText := Format('MX-248 does not support sample rate %g Hz',\n      [ADraft.PollFrequencyHz]);\n    Exit(False);\n  end;\n  if SameValue(ATag.PollFrequencyHz, ADraft.PollFrequencyHz, 1E-9) then\n    Exit(True);\n  if not ProgramSourceFrequency(ARegistry, ATag, ADraft.PollFrequencyHz,\n    AErrorText) then Exit(False);\n  if not PersistSourceFrequency(ARegistry, ATag, ADraft.PollFrequencyHz,\n    AErrorText) then Exit(False);\n  ApplySourceFrequency(ARegistry, ATag, ADraft.PollFrequencyHz);\n  AResult.PollFrequencyHz := ADraft.PollFrequencyHz;\n  AResult.FrequencyChanged := True;\nend;\n\nfunction TRecorderPxiMx248TagSettingsProvider.DownloadHardwareCalibration(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  out AResult: TRecorderHardwareCalibrationResult;\n  out AErrorText: string): Boolean;\nvar\n  lChannel: Integer;\n  lDevice: IRecorderDevice;\n  lControl: IPxiMx248LiveControlDevice;\n  lItems, lValues: TStringList;\n  lAdcSensitivity, lAmplifierSensitivity, lNominal: string;\n  lConversionScale, lOutputUnit, lProperties: string;\n  lResult: TRcOperationResult;\nbegin\n  RecorderInitHardwareCalibrationResult(AResult);\n  Result := False;\n  AErrorText := '';\n  if (ARegistry = nil) or (ATag = nil) or\n    not PxiMx248TryChannelFromAddress(ATag.Address, lChannel) then\n  begin\n    AErrorText := 'MX-248 channel address must be 1..8';\n    Exit;\n  end;\n  lItems := TStringList.Create;\n  lValues := TStringList.Create;\n  try\n    lItems.StrictDelimiter := True;\n    lItems.Delimiter := ':';\n    lItems.DelimitedText := RecorderNormalizeTagSourceId(ATag.SourceId);\n    if (lItems.Count <> 3) or not SameText(lItems[0], 'pxi-mx248') then\n    begin\n      AErrorText := 'Tag is not linked to a valid PXI MX-248 source';\n      Exit;\n    end;\n    lDevice := RecorderHardwareFindLiveDevice(ATag.SourceId);\n    if (lDevice = nil) or\n      not Supports(lDevice, IPxiMx248LiveControlDevice, lControl) then\n    begin\n      AErrorText := 'Нет активной сессии MX-248';\n      Exit;\n    end;\n    lResult := lControl.ReadLiveProperties(lProperties);\n    if not lResult.IsSuccess then\n    begin\n      AErrorText := lResult.Stage + ': ' + lResult.MessageText;\n      Exit;\n    end;\n    lValues.StrictDelimiter := True;\n    lValues.Delimiter := ';';\n    lValues.NameValueSeparator := '=';\n    lValues.DelimitedText := lProperties;\n    lAdcSensitivity := Trim(lValues.Values[\n      Format('ch%d.adc-sensitivity', [lChannel])]);\n    { Older bridge versions exposed this field under sensitivity. }\n    if lAdcSensitivity = '' then\n      lAdcSensitivity := Trim(lValues.Values[\n        Format('ch%d.sensitivity', [lChannel])]);\n    lNominal := Trim(lValues.Values[\n      Format('ch%d.sensitivity-nominal', [lChannel])]);\n    if (lAdcSensitivity = '') or (lNominal = '') then\n    begin\n      AErrorText := 'DevAPI did not return MX-248 sensitivity coefficients';\n      Exit;\n    end;\n    lAmplifierSensitivity := Trim(lValues.Values[\n      Format('ch%d.amplifier-sensitivity', [lChannel])]);\n    lConversionScale := Trim(lValues.Values[\n      Format('ch%d.conversion-scale', [lChannel])]);\n    lOutputUnit := Trim(lValues.Values[\n      Format('ch%d.output-unit', [lChannel])]);\n    AResult.PresentationText := Format('adc-sensitivity=%s codes/V; ' +\n      'sensitivity-nominal=%s', [lAdcSensitivity, lNominal]);\n    if lAmplifierSensitivity <> '' then\n      AResult.PresentationText := AResult.PresentationText +\n        '; amplifier-sensitivity=' + lAmplifierSensitivity;\n    if lConversionScale <> '' then\n      AResult.PresentationText := AResult.PresentationText +\n        '; conversion-scale=' + lConversionScale;\n    if lOutputUnit <> '' then\n      AResult.PresentationText := AResult.PresentationText +\n        '; output-unit=' + lOutputUnit;\n    AResult.MessageText := 'DevAPI уже применил аппаратную ГХ; значения ' +\n      'приведены только для информации.';\n    Result := True;\n  finally\n    lValues.Free;\n    lItems.Free;\n  end;\nend;\n\nfunction TRecorderMc201TagSettingsProvider.Accepts(ATag: TRecorderTag): Boolean;\nbegin\n  Result := (ATag <> nil) and\n    StartsText('MC-032:', RecorderNormalizeTagSourceId(ATag.SourceId));\nend;\n\nfunction TRecorderMc201TagSettingsProvider.SlotFromAddress(\n  const AAddress: string; out ASlot: Integer): Boolean;\nvar\n  lParts: TStringList;\nbegin\n  ASlot := 0;\n  lParts := TStringList.Create;\n  try\n    lParts.StrictDelimiter := True;\n    lParts.Delimiter := '-';\n    lParts.DelimitedText := Trim(AAddress);\n    Result := (lParts.Count >= 2) and\n      TryStrToInt(lParts[lParts.Count - 2], ASlot) and (ASlot > 0);\n  finally\n    lParts.Free;\n  end;\nend;\n\nprocedure TRecorderMc201TagSettingsProvider.ApplySlotFrequency(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag; AFrequencyHz: Double);\nvar\n  lIndex, lSlot, lTagSlot: Integer;\n  lTag: TRecorderTag;\nbegin\n  if (ARegistry = nil) or not SlotFromAddress(ATag.Address, lSlot) then Exit;\n  for lIndex := 0 to ARegistry.TagCount - 1 do\n  begin\n    lTag := ARegistry.Tags[lIndex];\n    if SameText(RecorderNormalizeTagSourceId(lTag.SourceId),\n      RecorderNormalizeTagSourceId(ATag.SourceId)) and\n      SlotFromAddress(lTag.Address, lTagSlot) and (lTagSlot = lSlot) then\n      lTag.PollFrequencyHz := AFrequencyHz;\n  end;\nend;\n\nfunction TRecorderMc201TagSettingsProvider.ReadState(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  out AState: TRecorderTagSettingsState): Boolean;\nvar\n  lConfigured: TRecorderConfiguredDataSource;\nbegin\n  Result := inherited ReadState(ARegistry, ATag, AState);\n  if not Result then Exit;\n  AState.HardwareCalibrationDownloadable := True;\n  lConfigured := RecorderConfiguredDataSourcesFind(ARegistry, ATag.SourceId);\n  if lConfigured <> nil then\n    RecorderMc201LoadHardwareCalibrationForTag(ARegistry, ATag,\n      lConfigured.SpecificConfigText);\nend;\n\nfunction TRecorderMc201TagSettingsProvider.ApplyDraft(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  const ADraft: TRecorderTagSettingsDraft;\n  out AResult: TRecorderTagSettingsApplyResult;\n  out AErrorText: string): Boolean;\nbegin\n  Result := inherited ApplyDraft(ARegistry, ATag, ADraft, AResult, AErrorText);\n  if not Result then Exit;\n  if not SameValue(ATag.PollFrequencyHz, ADraft.PollFrequencyHz, 1E-9) then\n  begin\n    ApplySlotFrequency(ARegistry, ATag, ADraft.PollFrequencyHz);\n    AResult.PollFrequencyHz := ADraft.PollFrequencyHz;\n    AResult.FrequencyChanged := True;\n  end;\nend;\n\nfunction TRecorderMc201TagSettingsProvider.DownloadHardwareCalibration(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  out AResult: TRecorderHardwareCalibrationResult;\n  out AErrorText: string): Boolean;\nvar\n  lDevice: IRecorderDevice;\n  lValues: TRecorderDeviceActionValues;\nbegin\n  RecorderInitHardwareCalibrationResult(AResult);\n  lDevice := RecorderHardwareFindLiveDevice(ATag.SourceId);\n  if lDevice = nil then\n  begin\n    AErrorText := 'Нет активной сессии MC-032';\n    Exit(False);\n  end;\n  Result := lDevice.ExecuteDeviceAction(rdaReadHardwareCalibration, [],\n    lValues, AErrorText);\n  if Result then\n    AResult.CalibrationName := ATag.HardwareCalibrationName;\nend;\n\nconstructor TRecorderHardwareTagSettingsResolver.Create;\nbegin\n  inherited Create;\n  fProviders := TInterfaceList.Create;\n  fProviders.Add(TRecorderPxiMx248TagSettingsProvider.Create as\n    IRecorderHardwareTagSettingsProvider);\n  fProviders.Add(TRecorderMc201TagSettingsProvider.Create as\n    IRecorderHardwareTagSettingsProvider);\nend;\n\ndestructor TRecorderHardwareTagSettingsResolver.Destroy;\nbegin\n  fProviders.Free;\n  inherited Destroy;\nend;\n\nfunction TRecorderHardwareTagSettingsResolver.Resolve(ATag: TRecorderTag;\n  const ASource: IRecorderDataSource;\n  out AProvider: IRecorderTagSettingsProvider): Boolean;\nvar\n  lIndex: Integer;\n  lProvider: IRecorderHardwareTagSettingsProvider;\nbegin\n  AProvider := nil;\n  for lIndex := 0 to fProviders.Count - 1 do\n  begin\n    lProvider := IRecorderHardwareTagSettingsProvider(fProviders[lIndex]);\n    if lProvider.Accepts(ATag) then\n    begin\n      AProvider := lProvider.ForSource(ASource);\n      Exit(True);\n    end;\n  end;\n  Result := False;\nend;\n\nfunction CreateRecorderHardwareTagSettingsResolver:\n  IRecorderTagSettingsProviderResolver;\nbegin\n  Result := TRecorderHardwareTagSettingsResolver.Create;\nend;\n\ninitialization\n  GTagSettingsResolverOwner := TObject.Create;\n  GTagSettingsResolver := CreateRecorderHardwareTagSettingsResolver;\n  RegisterRecorderTagSettingsProviderResolver(GTagSettingsResolverOwner,\n    GTagSettingsResolver);\n\nfinalization\n  UnregisterRecorderTagSettingsProviderResolver(GTagSettingsResolverOwner);\n  GTagSettingsResolver := nil;\n  GTagSettingsResolverOwner.Free;\n\nend.\n", "sha256": "bde9b9a7340542603e8a73eaa6d199f6234cc21dfda69d1fea34fd020131ae61"}, "Device/MIC140/uRecorderMic140DeviceConfig.pas": {"text": "unit uRecorderMic140DeviceConfig;\n\n{\n  Персистентные настройки MIC-140 на уровне источника данных (устройства).\n  Аппаратные и поканальные параметры не хранятся в тегах — только в узле\n  dataSources/mic140 проектного JSON, по аналогии с StoreSettings устройства\n  в оригинальном Recorder/Mebius.\n}\n\n{$mode objfpc}{$H+}\n{$codepage UTF8}\n\ninterface\n\nuses\n  Classes, SysUtils, fpjson,\n  uRecorderTags, uRecorderMic140Utils, uRecorderMic140StreamTypes;\n\ntype\n  TRecorderMic140DialogResult = record\n    Host: string;\n    Port: Word;\n    ChannelCount: Integer;\n    DeviceSerial: Integer;\n    VersionText: string;\n    ThermoCompensationEnabled: Boolean;\n    SelectedChannels: TStringList;\n    ChannelSettings: array of TRecorderMic140ChannelSettings;\n  end;\n\n  TRecorderMic140SourceConfig = class(TPersistent)\n  private\n    function GetSourceId: string;\n  public\n    Host: string;\n    Port: Word;\n    ChannelCount: Integer;\n    DeviceSerial: Integer;\n    VersionText: string;\n    ThermoCompensationEnabled: Boolean;\n    { [ORIG] mic140ppext IDC_COMBO_CALIBR2 → SetCommutChanBoard(all, calibr2) }\n    BoardCommutIndex: Integer;\n    SelectedChannels: TStringList;\n    ChannelSettings: array of TRecorderMic140ChannelSettings;\n    constructor Create;\n    destructor Destroy; override;\n    procedure EnsureChannelCapacity(ACount: Integer);\n    function FindChannelIndex(const AAddress: string;\n      out AChannelNumber: Integer): Integer;\n    function TryGetChannelSettings(const AAddress: string;\n      out AChannelNumber: Integer; out ASettings: TRecorderMic140ChannelSettings): Boolean;\n    procedure SetChannelSettings(AChannelNumber: Integer;\n      const AAddress: string; const ASettings: TRecorderMic140ChannelSettings);\n    procedure LoadFromResult(const AResult: TRecorderMic140DialogResult);\n    procedure SaveToResult(var AResult: TRecorderMic140DialogResult);\n    { SourceId = \"MIC-140: host:port\" из Host/Port, не отдельная константа. }\n    property SourceId: string read GetSourceId;\n  end;\n\n  TRecorderMic140LegacyTagFields = record\n    MeasRangeIndex: LongWord;\n    HardwareCalibrationEnabled: Boolean;\n    HardwareCalibrationName: string;\n    DeviceSerial: Integer;\n    ThermoCompensationEnabled: Boolean;\n    CjcDefault: Boolean;\n    CjcChannel: Integer;\n    ThermocoupleScaleName: string;\n    ThermocoupleScalePath: string;\n    SoftBalance: Double;\n  end;\n\nfunction RecorderMic140DeviceConfigList(\n  ARegistry: TRecorderTagRegistry): TStringList;\nfunction FindRecorderMic140DeviceConfig(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string): TRecorderMic140SourceConfig;\nfunction RecorderMic140ResolveEndpoint(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; out AHost: string; out APort: Word): Boolean;\n\nfunction EnsureRecorderMic140DeviceConfig(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string): TRecorderMic140SourceConfig;\nfunction FindRecorderMic140SourceConfig(AList: TStrings;\n  const ASourceId: string): TRecorderMic140SourceConfig;\nfunction EnsureRecorderMic140SourceConfig(AList: TStrings;\n  const ASourceId: string): TRecorderMic140SourceConfig;\n{ Переименовывает ключ SourceId (теги, dataSources, SourceSpecificConfigs)\n  под канонический MIC-140: host:port. }\nprocedure RecorderMic140RekeySourceId(ARegistry: TRecorderTagRegistry;\n  const AOldSourceId, ANewSourceId: string);\n{ После load: SourceId = Host:Port для всех MIC-140 в registry. }\nprocedure RecorderMic140CanonicalizeSourceIds(ARegistry: TRecorderTagRegistry);\n\nfunction RecorderMic140TryGetChannelSettings(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; out AChannelNumber: Integer;\n  out ASettings: TRecorderMic140ChannelSettings): Boolean;\nfunction RecorderMic140DeviceSerialForSource(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string): Integer;\nfunction RecorderMic140ThermoCompensationForSource(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string): Boolean;\nfunction RecorderMic140TagHardwareCalibrationEnabled(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag): Boolean;\nfunction RecorderMic140TagHardwareCalibrationName(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag): string;\n\nprocedure RecorderMic140InitLegacyTagFields(out AFields: TRecorderMic140LegacyTagFields);\nprocedure RecorderMic140LoadLegacyFieldsFromTagJson(AJson: TJSONObject;\n  out AFields: TRecorderMic140LegacyTagFields);\nprocedure RecorderMic140MigrateLegacyFieldsToDeviceConfig(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  const ALegacy: TRecorderMic140LegacyTagFields);\nprocedure RecorderMic140SetChannelSoftBalance(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; AValue: Double);\nprocedure RecorderMic140SetDeviceSerialForSource(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; ADeviceSerial: Integer);\nprocedure RecorderMic140EnsureThermoCompensationForSource(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string);\nprocedure RecorderMic140UpdateChannelSettings(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; const ASettings: TRecorderMic140ChannelSettings);\n{ Explicit cold configuration only: fill an empty temperature scale from the\n  installed type-K GOST catalogue. Existing operator choices are preserved. }\nfunction RecorderMic140TryAssignDefaultThermocouple(ARegistry: TRecorderTagRegistry;\n  var ASettings: TRecorderMic140ChannelSettings): Boolean;\nfunction RecorderMic140TagUsesThermoCompensation(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag): Boolean;\n{ Синхронизирует отображаемый выход тега с реальным конвейером MIC-140:\n  коды АЦП -> аппаратная ГХ -> мВ -> КТХС/ГХ термопары -> °C. }\nprocedure RecorderMic140ApplyTagOutputPresentation(ATag: TRecorderTag;\n  const ASettings: TRecorderMic140ChannelSettings);\n\nprocedure RecorderMic140MigrateTagHardwareToDeviceConfig(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag);\nprocedure RecorderMic140RebuildDeviceConfigsFromTags(ARegistry: TRecorderTagRegistry);\nprocedure SaveMic140DeviceConfigs(AJson: TJSONObject;\n  ARegistry: TRecorderTagRegistry);\nprocedure LoadMic140DeviceConfigs(AJson: TJSONObject;\n  ARegistry: TRecorderTagRegistry);\nconst\n  CMic140Mic140SubRev1 = 1;\n\nprocedure RecorderMic140InitChannelSettings(out ASettings: TRecorderMic140ChannelSettings;\n  AChannelIndex, ADevSubRev: Integer);\nfunction RecorderMic140DefaultCjcChannel(AChannelIndex: Integer;\n  ADevSubRev: Integer): Integer;\nfunction RecorderMic140RangeComboLabel(ARangeIndex: Integer): string;\nfunction RecorderMic140ChannelUsesTemperature(const ASettings: TRecorderMic140ChannelSettings): Boolean;\nfunction RecorderMic140ChannelGradRangeText(const ASettings: TRecorderMic140ChannelSettings): string;\n\nprocedure InitRecorderMic140DialogResult(var AResult: TRecorderMic140DialogResult);\nprocedure DoneRecorderMic140DialogResult(var AResult: TRecorderMic140DialogResult);\n\nimplementation\n\nuses\n  Math, StrUtils, uRecorderUnitManager, uRecorderMeraSdbThermocouples, uRecorderMic140LegacyConstants,\n  uRecorderProjectFiles, uRecorderMic140DataSource, uRecorderMic140Thermocouple,\n  uRecorderConfiguredDataSources;\n\nfunction RecorderMic140DefaultCjcChannel(AChannelIndex: Integer;\n  ADevSubRev: Integer): Integer;\nbegin\n  Result := Mic140DefaultCjcTChannelNumber(AChannelIndex);\nend;\n\nprocedure RecorderMic140InitChannelSettings(out ASettings: TRecorderMic140ChannelSettings;\n  AChannelIndex, ADevSubRev: Integer);\nbegin\n  ASettings.RangeIndex := CMic140Range100mV;\n  ASettings.CommutIndex := CMic140ChannelCommutIn;\n  ASettings.DefaultCjc := True;\n  ASettings.CjcChannel := RecorderMic140DefaultCjcChannel(AChannelIndex, ADevSubRev);\n  ASettings.ThermocoupleScalePath := '';\n  ASettings.ThermocoupleScaleName := '';\n  ASettings.SoftBalance := 0;\n  ASettings.OutputMode := 'mV';\n  ASettings.ChannelCalibrationEnabled := False;\n  ASettings.HardwareCalibrationEnabled := False;\n  ASettings.HardwareCalibrationName := '';\n  ASettings.CjcTemperOffsetC := 0.0;\nend;\n\nfunction RecorderMic140RangeComboLabel(ARangeIndex: Integer): string;\nbegin\n  case ARangeIndex of\n    0: Result := '100 mV';\n    1: Result := '50 mV';\n    2: Result := '25 mV';\n  else\n    Result := '?';\n  end;\nend;\n\nfunction RecorderMic140ChannelUsesTemperature(const ASettings: TRecorderMic140ChannelSettings): Boolean;\nbegin\n  { The selected scale and the source output mode are separate settings. A\n    scale may remain assigned while the operator temporarily requests mV. }\n  Result := SameText(ASettings.OutputMode, 'degC') or\n    SameText(ASettings.OutputMode, 'C');\nend;\n\nprocedure RecorderMic140ApplyTagOutputPresentation(ATag: TRecorderTag;\n  const ASettings: TRecorderMic140ChannelSettings);\nvar\n  lAutoUnit: string;\n  lMode: string;\n  lUnit: string;\n  lDisplayUnit: string;\n  lHasExternal: Boolean;\n  lFactor: Double;\n  I: Integer;\nbegin\n  if ATag = nil then\n    Exit;\n\n  { OutputMode describes the physical values produced by the source when the\n    tag enables hardware calibration. Raw-code selection belongs to the tag. }\n  if RecorderMic140ChannelUsesTemperature(ASettings) then\n  begin\n    lMode := 'degC';\n    lUnit := 'degC';\n  end\n  else\n  begin\n    lMode := 'mV';\n    lUnit := 'mV';\n  end;\n\n  if ATag.HardwareCalibrationEnabled then\n    lAutoUnit := lUnit\n  else\n    lAutoUnit := 'code';\n  if Trim(ASettings.ThermocoupleScaleName) <> '' then\n    for I := ATag.CalibrationNames.Count - 1 downto 0 do\n      if SameText(ATag.CalibrationNames[I],\n        'TC ' + ASettings.ThermocoupleScaleName) then\n        ATag.CalibrationNames.Delete(I);\n  lHasExternal := False;\n  if ATag.ChannelCalibrationEnabled then\n    for I := 0 to ATag.CalibrationNames.Count - 1 do\n      if RecorderCalibrationStepEnabled(ATag.CalibrationNames, I) then\n      begin\n        lHasExternal := True;\n        Break;\n      end;\n  lDisplayUnit := ATag.UnitName;\n  if not lHasExternal then\n  begin\n    if ATag.AutoUnit then\n      lDisplayUnit := lAutoUnit\n    else if ATag.HardwareCalibrationEnabled and\n      not SameText(lUnit, ATag.UnitName) and\n      not RecorderUnitManager.TryGetConversionFactor(lUnit, ATag.UnitName,\n        lFactor) then\n      lDisplayUnit := lUnit;\n  end;\n  if (not SameText(ATag.SourceValueMode, lMode)) or\n    (not SameText(ATag.UnitName, lDisplayUnit)) then\n    ATag.ClearSignalHistory;\n  ATag.SourceValueMode := lMode;\n  ATag.SourceHardwareOutputUnitName := lUnit;\n  ATag.SourceUnitName := lUnit;\n  { Project source edits back into a manual display only when its previous\n    quantity no longer exists. Keep compatible prefixes and external GX output. }\n  if not SameText(ATag.UnitName, lDisplayUnit) then\n    ATag.UnitName := lDisplayUnit;\nend;\n\nfunction RecorderMic140ChannelGradRangeText(const ASettings: TRecorderMic140ChannelSettings): string;\nbegin\n  Result := ASettings.ThermocoupleScaleName;\nend;\n\nprocedure RecorderMic140ProjectTagLoaded(AJson: TJSONObject;\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag);\nvar\n  lLegacy: TRecorderMic140LegacyTagFields;\nbegin\n  if not RecorderTagUsesMic140Settings(ATag) then\n    Exit;\n  RecorderMic140LoadLegacyFieldsFromTagJson(AJson, lLegacy);\n  RecorderMic140MigrateLegacyFieldsToDeviceConfig(ARegistry, ATag, lLegacy);\nend;\n\n{ TRecorderMic140SourceConfig }\n\nconstructor TRecorderMic140SourceConfig.Create;\nbegin\n  inherited Create;\n  SelectedChannels := TStringList.Create;\n  ChannelCount := MIC140DefaultChannelCount;\n  BoardCommutIndex := CMic140ChannelCommutIn;\n  EnsureChannelCapacity(MIC140MaxChannelCount);\nend;\n\ndestructor TRecorderMic140SourceConfig.Destroy;\nbegin\n  SelectedChannels.Free;\n  SetLength(ChannelSettings, 0);\n  inherited Destroy;\nend;\n\nprocedure TRecorderMic140SourceConfig.EnsureChannelCapacity(ACount: Integer);\nvar\n  I: Integer;\nbegin\n  if ACount <= Length(ChannelSettings) then\n    Exit;\n  SetLength(ChannelSettings, ACount);\n  for I := 0 to ACount - 1 do\n    RecorderMic140InitChannelSettings(ChannelSettings[I], I, CMic140Mic140SubRev1);\nend;\n\nfunction TRecorderMic140SourceConfig.FindChannelIndex(const AAddress: string;\n  out AChannelNumber: Integer): Integer;\nvar\n  I: Integer;\nbegin\n  Result := -1;\n  AChannelNumber := 0;\n  if ParseMic140ChannelNumber(AAddress, AChannelNumber) then\n  begin\n    if (AChannelNumber > 0) and (AChannelNumber <= Length(ChannelSettings)) then\n      Exit(AChannelNumber - 1);\n    Exit;\n  end;\n  for I := 0 to High(ChannelSettings) do\n    if SameText(ChannelSettings[I].ChannelAddress, AAddress) then\n      Exit(I);\nend;\n\nfunction TRecorderMic140SourceConfig.TryGetChannelSettings(const AAddress: string;\n  out AChannelNumber: Integer; out ASettings: TRecorderMic140ChannelSettings): Boolean;\nvar\n  lIndex: Integer;\nbegin\n  Result := False;\n  lIndex := FindChannelIndex(AAddress, AChannelNumber);\n  if lIndex < 0 then\n    Exit;\n  ASettings := ChannelSettings[lIndex];\n  Result := True;\nend;\n\nprocedure TRecorderMic140SourceConfig.SetChannelSettings(AChannelNumber: Integer;\n  const AAddress: string; const ASettings: TRecorderMic140ChannelSettings);\nvar\n  lIndex: Integer;\nbegin\n  if AChannelNumber <= 0 then\n    Exit;\n  EnsureChannelCapacity(AChannelNumber);\n  lIndex := AChannelNumber - 1;\n  ChannelSettings[lIndex] := ASettings;\n  if Trim(AAddress) <> '' then\n    ChannelSettings[lIndex].ChannelAddress := AAddress;\nend;\n\nprocedure TRecorderMic140SourceConfig.LoadFromResult(\n  const AResult: TRecorderMic140DialogResult);\nvar\n  I: Integer;\nbegin\n  Host := AResult.Host;\n  Port := AResult.Port;\n  ChannelCount := AResult.ChannelCount;\n  DeviceSerial := AResult.DeviceSerial;\n  VersionText := AResult.VersionText;\n  ThermoCompensationEnabled := AResult.ThermoCompensationEnabled;\n  SelectedChannels.Clear;\n  if AResult.SelectedChannels <> nil then\n    SelectedChannels.Assign(AResult.SelectedChannels);\n  EnsureChannelCapacity(Length(AResult.ChannelSettings));\n  for I := 0 to High(AResult.ChannelSettings) do\n    ChannelSettings[I] := AResult.ChannelSettings[I];\nend;\n\nprocedure TRecorderMic140SourceConfig.SaveToResult(\n  var AResult: TRecorderMic140DialogResult);\nvar\n  I: Integer;\nbegin\n  AResult.Host := Host;\n  AResult.Port := Port;\n  AResult.ChannelCount := ChannelCount;\n  AResult.DeviceSerial := DeviceSerial;\n  AResult.VersionText := VersionText;\n  AResult.ThermoCompensationEnabled := ThermoCompensationEnabled;\n  if AResult.SelectedChannels <> nil then\n  begin\n    AResult.SelectedChannels.Clear;\n    AResult.SelectedChannels.Assign(SelectedChannels);\n  end;\n  SetLength(AResult.ChannelSettings, Length(ChannelSettings));\n  for I := 0 to High(ChannelSettings) do\n    AResult.ChannelSettings[I] := ChannelSettings[I];\nend;\n\nfunction TRecorderMic140SourceConfig.GetSourceId: string;\nvar\n  lPort: Word;\nbegin\n  lPort := Port;\n  if lPort = 0 then\n    lPort := MIC140DefaultPort;\n  Result := RecorderMic140SourceId(Host, lPort);\nend;\n\nfunction RecorderMic140DeviceConfigList(\n  ARegistry: TRecorderTagRegistry): TStringList;\nbegin\n  if ARegistry = nil then\n    Result := nil\n  else\n    Result := ARegistry.SourceSpecificConfigs;\nend;\n\nfunction FindRecorderMic140SourceConfig(AList: TStrings;\n  const ASourceId: string): TRecorderMic140SourceConfig;\nvar\n  lIndex: Integer;\nbegin\n  Result := nil;\n  if AList = nil then\n    Exit;\n  lIndex := AList.IndexOf(ASourceId);\n  if lIndex >= 0 then\n    Result := TRecorderMic140SourceConfig(AList.Objects[lIndex]);\nend;\n\nfunction EnsureRecorderMic140SourceConfig(AList: TStrings;\n  const ASourceId: string): TRecorderMic140SourceConfig;\nvar\n  lIndex: Integer;\nbegin\n  Result := FindRecorderMic140SourceConfig(AList, ASourceId);\n  if Result <> nil then\n    Exit;\n  Result := TRecorderMic140SourceConfig.Create;\n  lIndex := AList.AddObject(ASourceId, Result);\n  AList[lIndex] := ASourceId;\nend;\n\nfunction FindRecorderMic140DeviceConfig(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string): TRecorderMic140SourceConfig;\nbegin\n  Result := FindRecorderMic140SourceConfig(RecorderMic140DeviceConfigList(ARegistry),\n    ASourceId);\nend;\n\nfunction RecorderMic140ResolveEndpoint(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; out AHost: string; out APort: Word): Boolean;\nvar\n  lConfig: TRecorderMic140SourceConfig;\nbegin\n  { SourceId канонически = MIC-140: host:port (BuildSourceId). Host в mic140\n    — источник истины при рассинхроне старых конфигов. }\n  Result := False;\n  AHost := '';\n  APort := 0;\n  if ARegistry <> nil then\n  begin\n    lConfig := FindRecorderMic140DeviceConfig(ARegistry, ASourceId);\n    if (lConfig <> nil) and (Trim(lConfig.Host) <> '') then\n    begin\n      AHost := Trim(lConfig.Host);\n      if lConfig.Port <> 0 then\n        APort := Word(lConfig.Port)\n      else\n        APort := MIC140DefaultPort;\n      Exit(True);\n    end;\n  end;\n  Result := TryParseRecorderMic140SourceId(ASourceId, AHost, APort);\nend;\n\nfunction EnsureRecorderMic140DeviceConfig(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string): TRecorderMic140SourceConfig;\nbegin\n  Result := EnsureRecorderMic140SourceConfig(RecorderMic140DeviceConfigList(ARegistry),\n    ASourceId);\nend;\n\nprocedure RecorderMic140RekeySourceId(ARegistry: TRecorderTagRegistry;\n  const AOldSourceId, ANewSourceId: string);\nvar\n  I, lOldIndex, lNewIndex: Integer;\n  lList: TStringList;\n  lConfig: TRecorderMic140SourceConfig;\n  lDup: TRecorderMic140SourceConfig;\n  lEntry: TRecorderConfiguredDataSource;\n  lTag: TRecorderTag;\n  lWasActive: Boolean;\n  lOldNorm, lNewNorm: string;\nbegin\n  if ARegistry = nil then\n    Exit;\n  lOldNorm := RecorderNormalizeTagSourceId(AOldSourceId);\n  lNewNorm := RecorderNormalizeTagSourceId(ANewSourceId);\n  if (lOldNorm = '') or (lNewNorm = '') or SameText(lOldNorm, lNewNorm) then\n    Exit;\n\n  lList := RecorderMic140DeviceConfigList(ARegistry);\n  if lList <> nil then\n  begin\n    lOldIndex := lList.IndexOf(lOldNorm);\n    if lOldIndex >= 0 then\n    begin\n      lNewIndex := lList.IndexOf(lNewNorm);\n      if lNewIndex >= 0 then\n      begin\n        { Новый ключ уже есть — оставляем его, удаляем старую запись. }\n        lList.OwnsObjects := False;\n        try\n          lDup := TRecorderMic140SourceConfig(lList.Objects[lOldIndex]);\n          lList.Delete(lOldIndex);\n          lDup.Free;\n        finally\n          lList.OwnsObjects := True;\n        end;\n      end\n      else\n        lList[lOldIndex] := lNewNorm;\n    end;\n  end;\n\n  lEntry := RecorderConfiguredDataSourcesFind(ARegistry, lOldNorm);\n  if lEntry <> nil then\n    lEntry.SourceId := lNewNorm\n  else\n    RecorderConfiguredDataSourcesEnsure(ARegistry, lNewNorm, 'MIC-140', 0);\n\n  lWasActive := ARegistry.IsSourceActive(lOldNorm);\n  if lWasActive then\n    ARegistry.UnregisterActiveSource(lOldNorm);\n\n  for I := 0 to ARegistry.TagCount - 1 do\n  begin\n    lTag := ARegistry.Tags[I];\n    if SameText(RecorderNormalizeTagSourceId(lTag.SourceId), lOldNorm) then\n      lTag.SourceId := lNewNorm;\n  end;\n\n  if lWasActive then\n    ARegistry.RegisterActiveSource(lNewNorm);\n\n  lConfig := FindRecorderMic140DeviceConfig(ARegistry, lNewNorm);\n  if (lConfig <> nil) and (Trim(lConfig.Host) = '') then\n    TryParseRecorderMic140SourceId(lNewNorm, lConfig.Host, lConfig.Port);\nend;\n\nprocedure RecorderMic140CanonicalizeSourceIds(ARegistry: TRecorderTagRegistry);\nvar\n  I: Integer;\n  lList: TStringList;\n  lConfig: TRecorderMic140SourceConfig;\n  lOldId, lCanon: string;\n  lKeys: TStringList;\nbegin\n  if ARegistry = nil then\n    Exit;\n  lList := RecorderMic140DeviceConfigList(ARegistry);\n  if (lList = nil) or (lList.Count = 0) then\n    Exit;\n  { Копия ключей: Rekey меняет сам список. }\n  lKeys := TStringList.Create;\n  try\n    lKeys.Assign(lList);\n    for I := 0 to lKeys.Count - 1 do\n    begin\n      lOldId := lKeys[I];\n      lConfig := FindRecorderMic140SourceConfig(lList, lOldId);\n      if lConfig = nil then\n        Continue;\n      if Trim(lConfig.Host) = '' then\n        TryParseRecorderMic140SourceId(lOldId, lConfig.Host, lConfig.Port);\n      if Trim(lConfig.Host) = '' then\n        Continue;\n      if lConfig.Port = 0 then\n        lConfig.Port := MIC140DefaultPort;\n      lCanon := lConfig.SourceId;\n      if not SameText(lOldId, lCanon) then\n        RecorderMic140RekeySourceId(ARegistry, lOldId, lCanon);\n    end;\n  finally\n    lKeys.Free;\n  end;\nend;\n\nfunction RecorderMic140TryGetChannelSettings(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; out AChannelNumber: Integer;\n  out ASettings: TRecorderMic140ChannelSettings): Boolean;\nvar\n  lConfig: TRecorderMic140SourceConfig;\nbegin\n  Result := False;\n  if (ATag = nil) or (not RecorderTagUsesMic140Settings(ATag)) then\n    Exit;\n  lConfig := FindRecorderMic140DeviceConfig(ARegistry, ATag.SourceId);\n  if lConfig = nil then\n    Exit;\n  Result := lConfig.TryGetChannelSettings(ATag.Address, AChannelNumber, ASettings);\nend;\n\nfunction RecorderMic140DeviceSerialForSource(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string): Integer;\nvar\n  lConfig: TRecorderMic140SourceConfig;\nbegin\n  Result := 0;\n  lConfig := FindRecorderMic140DeviceConfig(ARegistry, ASourceId);\n  if lConfig <> nil then\n    Result := lConfig.DeviceSerial;\nend;\n\nfunction RecorderMic140ThermoCompensationForSource(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string): Boolean;\nvar\n  lConfig: TRecorderMic140SourceConfig;\nbegin\n  Result := False;\n  lConfig := FindRecorderMic140DeviceConfig(ARegistry, ASourceId);\n  if lConfig <> nil then\n    Result := lConfig.ThermoCompensationEnabled;\nend;\n\nfunction RecorderMic140TagHardwareCalibrationEnabled(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag): Boolean;\nbegin\n  { Применение аппаратной ГХ является пользовательским свойством тега. }\n  Result := (ATag <> nil) and ATag.HardwareCalibrationEnabled;\nend;\n\nfunction RecorderMic140TagHardwareCalibrationName(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag): string;\nvar\n  lSettings: TRecorderMic140ChannelSettings;\n  lChannelNumber: Integer;\nbegin\n  Result := '';\n  if not RecorderMic140TryGetChannelSettings(ARegistry, ATag, lChannelNumber,\n    lSettings) then\n    Exit;\n  Result := lSettings.HardwareCalibrationName;\nend;\n\nprocedure RecorderMic140InitLegacyTagFields(out AFields: TRecorderMic140LegacyTagFields);\nbegin\n  AFields := Default(TRecorderMic140LegacyTagFields);\n  AFields.CjcDefault := True;\nend;\n\nprocedure RecorderMic140LoadLegacyFieldsFromTagJson(AJson: TJSONObject;\n  out AFields: TRecorderMic140LegacyTagFields);\nbegin\n  RecorderMic140InitLegacyTagFields(AFields);\n  if AJson = nil then\n    Exit;\n  AFields.MeasRangeIndex := AJson.Get('measRangeIndex', AFields.MeasRangeIndex);\n  AFields.HardwareCalibrationEnabled := AJson.Get('hardwareCalibrationEnabled',\n    AFields.HardwareCalibrationEnabled);\n  AFields.HardwareCalibrationName := AJson.Get('hardwareCalibrationName',\n    AFields.HardwareCalibrationName);\n  AFields.DeviceSerial := AJson.Get('mic140DeviceSerial', AFields.DeviceSerial);\n  AFields.ThermoCompensationEnabled := AJson.Get('mic140ThermoCompensationEnabled',\n    AFields.ThermoCompensationEnabled);\n  AFields.CjcDefault := AJson.Get('mic140CjcDefault', AFields.CjcDefault);\n  AFields.CjcChannel := AJson.Get('mic140CjcChannel', AFields.CjcChannel);\n  AFields.ThermocoupleScaleName := AJson.Get('mic140ThermocoupleScaleName',\n    AFields.ThermocoupleScaleName);\n  AFields.ThermocoupleScalePath := AJson.Get('mic140ThermocoupleScalePath',\n    AFields.ThermocoupleScalePath);\n  AFields.SoftBalance := AJson.Get('mic140SoftBalance', AFields.SoftBalance);\nend;\n\nprocedure RecorderMic140ApplyLegacyFieldsToChannelSettings(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  const ALegacy: TRecorderMic140LegacyTagFields;\n  var ASettings: TRecorderMic140ChannelSettings);\nvar\n  J: Integer;\n  lCal: TRecorderCalibration;\n  lCalName: string;\n  lResolvedKey: string;\nbegin\n  if ATag = nil then\n    Exit;\n  if Trim(ATag.Address) <> '' then\n    ASettings.ChannelAddress := ATag.Address;\n  if ALegacy.MeasRangeIndex < CMic140RangeCount then\n    ASettings.RangeIndex := ALegacy.MeasRangeIndex;\n  ASettings.SoftBalance := ALegacy.SoftBalance;\n  ASettings.DefaultCjc := ALegacy.CjcDefault;\n  if (ALegacy.CjcChannel >= 1) and\n    (ALegacy.CjcChannel <= MIC140v3VisibleTemperatureChannelCount) then\n    ASettings.CjcChannel := ALegacy.CjcChannel;\n  if Trim(ALegacy.ThermocoupleScaleName) <> '' then\n  begin\n    ASettings.ThermocoupleScaleName := ALegacy.ThermocoupleScaleName;\n    ASettings.ThermocoupleScalePath := ALegacy.ThermocoupleScalePath;\n  end\n  else if ATag.CalibrationNames <> nil then\n    for J := 0 to ATag.CalibrationNames.Count - 1 do\n    begin\n      lCalName := Trim(ATag.CalibrationNames[J]);\n      if Pos('TC ', lCalName) <> 1 then\n        Continue;\n      ASettings.ThermocoupleScaleName := Trim(Copy(lCalName, 4, MaxInt));\n      if ARegistry <> nil then\n      begin\n        lCal := ARegistry.FindCalibrationByName(lCalName);\n        if (lCal <> nil) and (Trim(lCal.Description) <> '') then\n          ASettings.ThermocoupleScalePath := lCal.Description\n        else if ASettings.ThermocoupleScaleName <> '' then\n          ASettings.ThermocoupleScalePath :=\n            RecorderMeraThermocoupleRelativePath(ASettings.ThermocoupleScaleName);\n      end;\n      Break;\n    end;\n  lResolvedKey := RecorderMeraResolveThermocoupleScaleKey(\n    ASettings.ThermocoupleScalePath, ASettings.ThermocoupleScaleName);\n  if lResolvedKey <> '' then\n    ASettings.ThermocoupleScalePath := lResolvedKey;\n  if Trim(ATag.SourceValueMode) <> '' then\n    ASettings.OutputMode := ATag.SourceValueMode;\n  ASettings.ChannelCalibrationEnabled := ATag.ChannelCalibrationEnabled;\n  ASettings.HardwareCalibrationEnabled := ALegacy.HardwareCalibrationEnabled;\n  ASettings.HardwareCalibrationName := ALegacy.HardwareCalibrationName;\nend;\n\nprocedure RecorderMic140MigrateLegacyFieldsToDeviceConfig(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  const ALegacy: TRecorderMic140LegacyTagFields);\nvar\n  lChannelNumber: Integer;\n  lConfig: TRecorderMic140SourceConfig;\n  lSettings: TRecorderMic140ChannelSettings;\n  lHasLegacy: Boolean;\nbegin\n  if (ARegistry = nil) or (ATag = nil) or\n    (not RecorderTagUsesMic140Settings(ATag)) or\n    (not ParseMic140ChannelNumber(ATag.Address, lChannelNumber)) then\n    Exit;\n\n  lHasLegacy := (ALegacy.MeasRangeIndex > 0) or (ALegacy.DeviceSerial > 0) or\n    ALegacy.ThermoCompensationEnabled or (ALegacy.SoftBalance <> 0) or\n    (Trim(ALegacy.ThermocoupleScaleName) <> '') or (ALegacy.CjcChannel > 0) or\n    (not ALegacy.CjcDefault) or ALegacy.HardwareCalibrationEnabled;\n  if not lHasLegacy then\n    Exit;\n\n  lConfig := EnsureRecorderMic140DeviceConfig(ARegistry, ATag.SourceId);\n  if not TryParseRecorderMic140SourceId(ATag.SourceId, lConfig.Host, lConfig.Port) then\n    Exit;\n  if lConfig.DeviceSerial <= 0 then\n    lConfig.DeviceSerial := ALegacy.DeviceSerial;\n  lConfig.ThermoCompensationEnabled :=\n    lConfig.ThermoCompensationEnabled or ALegacy.ThermoCompensationEnabled;\n  if lChannelNumber > lConfig.ChannelCount then\n    lConfig.ChannelCount := MIC140MaxChannelCount;\n  if lConfig.SelectedChannels.IndexOf(IntToStr(lChannelNumber)) < 0 then\n    lConfig.SelectedChannels.Add(IntToStr(lChannelNumber));\n\n  RecorderMic140InitChannelSettings(lSettings, lChannelNumber - 1,\n    CMic140Mic140SubRev1);\n  lConfig.TryGetChannelSettings(ATag.Address, lChannelNumber, lSettings);\n  RecorderMic140ApplyLegacyFieldsToChannelSettings(ARegistry, ATag, ALegacy, lSettings);\n  lConfig.SetChannelSettings(lChannelNumber, ATag.Address, lSettings);\n  { Поля тега остаются синхронной проекцией настроек канала. Они нужны\n    универсальному диалогу тега и сохраняются в общей секции tags. }\n  ATag.HardwareCalibrationEnabled := lSettings.HardwareCalibrationEnabled;\n  ATag.HardwareCalibrationName := lSettings.HardwareCalibrationName;\n  RecorderMic140ApplyTagOutputPresentation(ATag, lSettings);\nend;\n\nprocedure RecorderMic140SetChannelSoftBalance(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; AValue: Double);\nvar\n  lChannelNumber: Integer;\n  lConfig: TRecorderMic140SourceConfig;\n  lSettings: TRecorderMic140ChannelSettings;\nbegin\n  if (ARegistry = nil) or (ATag = nil) or (not RecorderTagUsesMic140Settings(ATag)) then\n    Exit;\n  lConfig := EnsureRecorderMic140DeviceConfig(ARegistry, ATag.SourceId);\n  if not lConfig.TryGetChannelSettings(ATag.Address, lChannelNumber, lSettings) then\n  begin\n    if not ParseMic140ChannelNumber(ATag.Address, lChannelNumber) then\n      Exit;\n    RecorderMic140InitChannelSettings(lSettings, lChannelNumber - 1,\n      CMic140Mic140SubRev1);\n    lSettings.ChannelAddress := ATag.Address;\n  end;\n  lSettings.SoftBalance := AValue;\n  lConfig.SetChannelSettings(lChannelNumber, ATag.Address, lSettings);\nend;\n\nprocedure RecorderMic140SetDeviceSerialForSource(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; ADeviceSerial: Integer);\nvar\n  lConfig: TRecorderMic140SourceConfig;\nbegin\n  if (ARegistry = nil) or (ADeviceSerial <= 0) or (Trim(ASourceId) = '') then\n    Exit;\n  lConfig := EnsureRecorderMic140DeviceConfig(ARegistry, ASourceId);\n  if lConfig.DeviceSerial <= 0 then\n    lConfig.DeviceSerial := ADeviceSerial;\nend;\n\nprocedure RecorderMic140EnsureThermoCompensationForSource(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string);\nvar\n  lConfig: TRecorderMic140SourceConfig;\nbegin\n  if (ARegistry = nil) or (Trim(ASourceId) = '') then\n    Exit;\n  lConfig := EnsureRecorderMic140DeviceConfig(ARegistry, ASourceId);\n  lConfig.ThermoCompensationEnabled := True;\nend;\n\nfunction RecorderMic140TryAssignDefaultThermocouple(ARegistry: TRecorderTagRegistry;\n  var ASettings: TRecorderMic140ChannelSettings): Boolean;\nvar\n  lNames: TStringList;\n  lCandidate: TRecorderMic140ChannelSettings;\n  lName, lMatch: string;\n  I: Integer;\nbegin\n  Result := False;\n  if (ARegistry = nil) or not RecorderMic140ChannelUsesTemperature(ASettings) or\n    (Trim(ASettings.ThermocoupleScaleName) <> '') or\n    (Trim(ASettings.ThermocoupleScalePath) <> '') then Exit;\n  lNames := TStringList.Create;\n  try\n    RecorderMeraListThermocoupleScales(lNames);\n    lNames.Sort;\n    for I := 0 to lNames.Count - 1 do\n    begin\n      lName := lNames[I];\n      lMatch := StringReplace(lName, ' ', '', [rfReplaceAll]);\n      if not (StartsText('K_ГОСТР8', lMatch) or\n        StartsText('К_ГОСТР8', lMatch)) then Continue;\n      lCandidate := ASettings;\n      lCandidate.ThermocoupleScaleName := lName;\n      lCandidate.ThermocoupleScalePath := RecorderMeraThermocoupleRelativePath(lName);\n      if (ARegistry.FindCalibrationByName('TC ' + lName) = nil) and\n        (RecorderMic140EnsureThermocoupleCalibration(ARegistry, lCandidate) = '') then\n        Continue;\n      ASettings := lCandidate;\n      Exit(True);\n    end;\n  finally\n    lNames.Free;\n  end;\nend;\n\nprocedure RecorderMic140UpdateChannelSettings(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; const ASettings: TRecorderMic140ChannelSettings);\nvar\n  lChannelNumber: Integer;\n  lConfig: TRecorderMic140SourceConfig;\n  lDummy: TRecorderMic140ChannelSettings;\nbegin\n  if (ARegistry = nil) or (ATag = nil) then\n    Exit;\n  lConfig := EnsureRecorderMic140DeviceConfig(ARegistry, ATag.SourceId);\n  if not ParseMic140ChannelNumber(ATag.Address, lChannelNumber) then\n  begin\n    if not lConfig.TryGetChannelSettings(ATag.Address, lChannelNumber, lDummy) then\n      Exit;\n  end;\n  lConfig.SetChannelSettings(lChannelNumber, ATag.Address, ASettings);\n  RecorderMic140ApplyTagOutputPresentation(ATag, ASettings);\nend;\n\nfunction RecorderMic140TagUsesThermoCompensation(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag): Boolean;\nbegin\n  Result := (ATag <> nil) and\n    RecorderMic140ThermoCompensationForSource(ARegistry, ATag.SourceId);\nend;\n\nprocedure RecorderMic140CopyLegacyTagFieldsToChannelSettings(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  var ASettings: TRecorderMic140ChannelSettings);\nvar\n  lLegacy: TRecorderMic140LegacyTagFields;\nbegin\n  RecorderMic140InitLegacyTagFields(lLegacy);\n  RecorderMic140ApplyLegacyFieldsToChannelSettings(ARegistry, ATag, lLegacy, ASettings);\nend;\n\nprocedure RecorderMic140MigrateTagHardwareToDeviceConfig(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag);\nvar\n  lLegacy: TRecorderMic140LegacyTagFields;\nbegin\n  RecorderMic140InitLegacyTagFields(lLegacy);\n  RecorderMic140MigrateLegacyFieldsToDeviceConfig(ARegistry, ATag, lLegacy);\nend;\n\nprocedure RecorderMic140RebuildDeviceConfigsFromTags(ARegistry: TRecorderTagRegistry);\nbegin\n  { Legacy no-op: MIC-140 settings live in device config, not in tags. }\nend;\n\nprocedure SaveMic140ChannelSettingsJson(AJson: TJSONArray;\n  const ASettings: TRecorderMic140ChannelSettings);\nvar\n  lItem: TJSONObject;\nbegin\n  lItem := TJSONObject.Create;\n  AJson.Add(lItem);\n  lItem.Add('address', ASettings.ChannelAddress);\n  lItem.Add('rangeIndex', ASettings.RangeIndex);\n  lItem.Add('commutIndex', ASettings.CommutIndex);\n  lItem.Add('softBalance', ASettings.SoftBalance);\n  lItem.Add('defaultCjc', ASettings.DefaultCjc);\n  lItem.Add('cjcChannel', ASettings.CjcChannel);\n  lItem.Add('thermocoupleScaleName', ASettings.ThermocoupleScaleName);\n  lItem.Add('thermocoupleScalePath', ASettings.ThermocoupleScalePath);\n  lItem.Add('outputMode', ASettings.OutputMode);\n  lItem.Add('channelCalibrationEnabled', ASettings.ChannelCalibrationEnabled);\n  lItem.Add('hardwareCalibrationEnabled', ASettings.HardwareCalibrationEnabled);\n  lItem.Add('hardwareCalibrationName', ASettings.HardwareCalibrationName);\n  if ASettings.CjcTemperOffsetC <> 0.0 then\n    lItem.Add('cjcTemperOffsetC', ASettings.CjcTemperOffsetC);\nend;\n\nprocedure LoadMic140ChannelSettingsJson(AJson: TJSONObject;\n  out ASettings: TRecorderMic140ChannelSettings);\nbegin\n  RecorderMic140InitChannelSettings(ASettings, 0, CMic140Mic140SubRev1);\n  ASettings.ChannelAddress := AJson.Get('address', ASettings.ChannelAddress);\n  ASettings.RangeIndex := AJson.Get('rangeIndex', ASettings.RangeIndex);\n  ASettings.CommutIndex := AJson.Get('commutIndex', ASettings.CommutIndex);\n  ASettings.SoftBalance := AJson.Get('softBalance', ASettings.SoftBalance);\n  ASettings.DefaultCjc := AJson.Get('defaultCjc', ASettings.DefaultCjc);\n  ASettings.CjcChannel := AJson.Get('cjcChannel', ASettings.CjcChannel);\n  ASettings.ThermocoupleScaleName := AJson.Get('thermocoupleScaleName',\n    ASettings.ThermocoupleScaleName);\n  ASettings.ThermocoupleScalePath := AJson.Get('thermocoupleScalePath',\n    ASettings.ThermocoupleScalePath);\n  ASettings.OutputMode := AJson.Get('outputMode', ASettings.OutputMode);\n  ASettings.ChannelCalibrationEnabled := AJson.Get('channelCalibrationEnabled',\n    ASettings.ChannelCalibrationEnabled);\n  ASettings.HardwareCalibrationEnabled := AJson.Get('hardwareCalibrationEnabled',\n    ASettings.HardwareCalibrationEnabled);\n  ASettings.HardwareCalibrationName := AJson.Get('hardwareCalibrationName',\n    ASettings.HardwareCalibrationName);\n  ASettings.CjcTemperOffsetC := AJson.Get('cjcTemperOffsetC',\n    ASettings.CjcTemperOffsetC);\nend;\n\nprocedure SaveMic140DeviceConfigJson(AItem: TJSONObject;\n  AConfig: TRecorderMic140SourceConfig);\nvar\n  I: Integer;\n  lChannels: TJSONArray;\n  lMic140: TJSONObject;\n  lSelected: TJSONArray;\nbegin\n  if (AItem = nil) or (AConfig = nil) then\n    Exit;\n  lMic140 := TJSONObject.Create;\n  AItem.Add('mic14
