gin\n  RecorderInitTagSettingsApplyResult(AResult);\n  AErrorText := '';\n  Result := OwnsSettingsTag(ARegistry, ATag);\n  if not Result then AErrorText := 'Tag settings do not belong to this datasource';\n  if not Result then Exit;\n  if not SameValue(ATag.PollFrequencyHz, ADraft.PollFrequencyHz, 1E-9) then\n  begin\n    RecorderMic185ApplySourceFrequency(ARegistry, ATag.SourceId,\n      ADraft.PollFrequencyHz, ADraft.DataUpdateMs);\n    fPollFrequencyHz := ADraft.PollFrequencyHz;\n    AResult.PollFrequencyHz := ADraft.PollFrequencyHz;\n    AResult.FrequencyChanged := True;\n  end;\n  lOriginalSourceUnit := RecorderMic185GetSourceChannelUnitName(ARegistry,\n    ATag.SourceId, ATag.Address);\n  lSourceUnit := Trim(ADraft.UnitName);\n  if HasExternalCalibration(ATag, ADraft) then\n    lSourceUnit := lOriginalSourceUnit;\n  if MatchText(lSourceUnit, ['V', 'mV', 'uV', 'kV', 'В']) then\n    lSourceUnit := 'мВ'\n  else if SameText(lSourceUnit, 'Ohm') then\n    lSourceUnit := 'Ом'\n  else if SameText(lSourceUnit, 'uStrain') then\n    lSourceUnit := 'мкстрн';\n  if MatchText(lSourceUnit, ['мВ', 'мВ(тензо)', 'Ом', 'мкстрн', 'мкм/м']) and\n    not SameText(lOriginalSourceUnit, lSourceUnit) then\n  begin\n    RecorderMic185SetSourceChannelUnitName(ARegistry, ATag.SourceId,\n      ATag.Address, ADraft.PollFrequencyHz, lSourceUnit);\n    AResult.SourceUnitName := lSourceUnit;\n    AResult.SourceUnitChanged := True;\n  end;\n  if MatchText(lSourceUnit, ['мВ', 'мВ(тензо)', 'Ом', 'мкстрн', 'мкм/м']) and\n    not ADraft.AutoUnit and not SameText(ATag.UnitName, ADraft.UnitName) then\n  begin\n    AResult.UnitName := ADraft.UnitName;\n    AResult.UnitChanged := True;\n  end;\n  if ADraft.HardwareCalibrationEnabled then\n  begin\n    RecorderMic185LoadHardwareCalibrationForTag(ARegistry, ATag, True);\n    RecorderMic185GetSourceChannelMode(ARegistry, ATag.SourceId, ATag.Address,\n      ADraft.PollFrequencyHz, lSettings);\n    if SameText(ADraft.UnitName, 'код') or SameText(ADraft.UnitName, 'code') then\n    begin\n      AResult.UnitName := RecorderMic185GetSourceChannelUnitName(ARegistry,\n        ATag.SourceId, ATag.Address);\n      if AResult.UnitName = '' then\n        AResult.UnitName := RecorderMic185RangeUnitText(lSettings.MeasRangeIndex);\n      AResult.UnitChanged := True;\n    end;\n    lRange := RecorderMic185EffectiveRangeMaxForTag(ARegistry, ATag,\n      lSettings, ADraft.UnitName);\n    AResult.RangeMin := -lRange;\n    AResult.RangeMax := lRange;\n    AResult.RangeChanged := True;\n  end;\n  AResult.SignalHistoryMustBeCleared :=\n    (ATag.HardwareCalibrationEnabled <> ADraft.HardwareCalibrationEnabled) or\n    AResult.SourceUnitChanged or AResult.UnitChanged;\nend;\n\nfunction TRecorderMic185DataSource.DownloadHardwareCalibration(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  out AResult: TRecorderHardwareCalibrationResult;\n  out AErrorText: string): Boolean;\nvar\n  lB, lK: Double;\nbegin\n  RecorderInitHardwareCalibrationResult(AResult);\n  AErrorText := '';\n  Result := OwnsSettingsTag(ARegistry, ATag);\n  if not Result then AErrorText := 'Tag settings do not belong to this datasource';\n  if not Result then Exit;\n  Result := RecorderMic185DownloadHardwareCalibrationFromDeviceEx(ARegistry,\n    ATag, lK, lB, AResult.CalibrationName, AErrorText);\n  if Result then\n    AResult.PresentationText := RecorderMic185FormatHardwareKx(lK, lB);\nend;\n\nfunction TRecorderMic185DataSource.CanSetUnits(\n  ATag: TRecorderTag;\n  const AUnitName: string; out AErrorText: string): Boolean;\nvar\n  ARegistry: TRecorderTagRegistry;\n  lInfo: TRecorderUnitInfo;\nbegin\n  ARegistry := nil;\n  if ATag <> nil then ARegistry := ATag.OwnerRegistry;\n  AErrorText := '';\n  Result := OwnsSettingsTag(ARegistry, ATag);\n  if not Result then\n  begin\n    AErrorText := 'MIC-185 tag settings are unavailable';\n    Exit;\n  end;\n  if State = dssRunning then\n  begin\n    AErrorText := 'Stop the datasource before changing its unit mode';\n    Exit(False);\n  end;\n  { Batch validation only inspects the requested category and the model;\n    it never resolves identity, loads current GX or mutates a tag. }\n  Result := RecorderUnitManager.TryGetUnitInfo(AUnitName, lInfo) and\n    (SameText(lInfo.QuantityId, RECORDER_QUANTITY_RAW_CODE) or\n     SameText(lInfo.QuantityId, RECORDER_QUANTITY_VOLTAGE) or\n     SameText(lInfo.QuantityId, 'resistance') or\n     SameText(lInfo.QuantityId, 'strain'));\n  if not Result then AErrorText := 'MIC-185 does not support source units ' + AUnitName;\nend;\n\nfunction TRecorderMic185DataSource.SetUnits(ATag: TRecorderTag; const AUnitName: string; out AErrorText: string): Boolean;\nvar\n  ARegistry: TRecorderTagRegistry;\n  lInfo: TRecorderUnitInfo;\n  lMode: string;\nbegin\n  ARegistry := nil;\n  if ATag <> nil then ARegistry := ATag.OwnerRegistry;\n  Result := CanSetUnits(ATag, AUnitName, AErrorText);\n  if not Result then Exit;\n  RecorderUnitManager.TryGetUnitInfo(AUnitName, lInfo);\n  if SameText(lInfo.QuantityId, RECORDER_QUANTITY_RAW_CODE) then\n    ATag.HardwareCalibrationEnabled := False\n  else\n  begin\n    if SameText(lInfo.QuantityId, RECORDER_QUANTITY_VOLTAGE) then lMode := 'мВ'\n    else if SameText(lInfo.QuantityId, 'resistance') then lMode := 'Ом'\n    else lMode := 'мкстрн';\n    RecorderMic185SetSourceChannelUnitName(ARegistry, SourceId,\n      ATag.Address, ATag.PollFrequencyHz, lMode);\n    ATag.HardwareCalibrationEnabled := True;\n  end;\n  ATag.AutoUnit := False;\n  ATag.UnitName := Trim(AUnitName);\n  ATag.ClearSignalHistory;\nend;\n\nconstructor TRecorderMic185DataSource.Create(const ASourceId, AHost: string;\n  APort: Word; APollFrequencyHz: Double; AUpdateTimeMs: Cardinal;\n  ASelectedNames: TStrings);\nbegin\n  inherited Create(ASourceId, 'MIC183/185 data source', AUpdateTimeMs);\n  InitCriticalSection(fValueTransformsLock);\n  fHost := AHost;\n  fPort := APort;\n  fPollFrequencyHz := APollFrequencyHz;\n  if fPollFrequencyHz <= 0 then\n    fPollFrequencyHz := MIC185DefaultPollFrequencyHz;\n  fChannelTagNames := TStringList.Create;\n  fChannelTagNames.CaseSensitive := False;\n  fSelectedNames := TStringList.Create;\n  fSelectedNames.CaseSensitive := False;\n  if ASelectedNames <> nil then\n    fSelectedNames.Assign(ASelectedNames);\nend;\n\ndestructor TRecorderMic185DataSource.Destroy;\nbegin\n  Stop;\n  { Destroy closes the device session. A normal Preview/Record -> Stop\n    transition deliberately keeps it connected and programmed so that the\n    next run only starts acquisition. }\n  RecorderHardwareUnregisterLiveDevice(Self);\n  fDevice := nil;\n  fHardwarePrepared := False;\n  fHardwarePrepareAttempted := False;\n  fSelectedNames.Free;\n  fChannelTagNames.Free;\n  SetLength(fValueTransforms, 0);\n  DoneCriticalSection(fValueTransformsLock);\n  inherited Destroy;\nend;\n\nfunction TRecorderMic185DataSource.FindTagBySourceAddress(\n  ARegistry: TRecorderTagRegistry; const AAddress: string): TRecorderTag;\nvar\n  I: Integer;\n  lTag: TRecorderTag;\nbegin\n  Result := nil;\n  if ARegistry = nil then\n    Exit;\n  for I := 0 to ARegistry.TagCount - 1 do\n  begin\n    lTag := ARegistry.Tags[I];\n    if SameText(RecorderNormalizeTagSourceId(lTag.SourceId),\n      RecorderNormalizeTagSourceId(SourceId)) and\n      SameMic185Address(lTag.Address, AAddress) then\n    begin\n      { Сохраняем заданный источнику префикс, нормализуя только номер канала. }\n      lTag.Address := Mic185CanonicalAddress(lTag.Address);\n      Exit(lTag);\n    end;\n  end;\nend;\n\nfunction TRecorderMic185DataSource.ChannelSelected(\n  const AChannel: TRecorderDeviceChannel): Boolean;\nvar\n  I: Integer;\nbegin\n  Result := (fSelectedNames.Count = 0) or\n    (fSelectedNames.IndexOf(AChannel.Name) >= 0) or\n    (fSelectedNames.IndexOf(AChannel.Address) >= 0);\n  if Result then\n    Exit;\n  for I := 0 to fSelectedNames.Count - 1 do\n    if SameMic185Address(fSelectedNames[I], AChannel.Address) then\n      Exit(True);\nend;\n\nprocedure TRecorderMic185DataSource.TraceZeroBalance(const AText: string);\nbegin\n  if Assigned(fZeroBalanceTrace) then\n    fZeroBalanceTrace(AText);\nend;\n\nprocedure TRecorderMic185DataSource.SetZeroBalanceTrace(\n  AHandler: TRecorderZeroBalanceTraceEvent);\nbegin\n  fZeroBalanceTrace := AHandler;\nend;\n\nfunction TRecorderMic185DataSource.ZeroBalanceTags(AOwner: TComponent;\n  ATags: TList; AMessages: TStrings): Boolean;\nvar\n  I: Integer;\n  lChannels: array of Integer;\n  lIndex: Integer;\n  lTag: TRecorderTag;\nbegin\n  Result := False;\n  if ATags = nil then\n    Exit;\n  SetLength(lChannels, 0);\n  for I := 0 to ATags.Count - 1 do\n  begin\n    lTag := TRecorderTag(ATags[I]);\n    if (lTag = nil) or (not SameText(lTag.SourceId, SourceId)) then\n      Continue;\n    lIndex := RecorderMic185ChannelAddressToIndex(lTag.Address);\n    if lIndex < 0 then\n      Continue;\n    SetLength(lChannels, Length(lChannels) + 1);\n    lChannels[High(lChannels)] := lIndex;\n    if Trim(lTag.SourceUnitName) <> '' then\n      RecorderMic185SetSourceChannelUnitName(Registry, SourceId, lTag.Address,\n        lTag.PollFrequencyHz, lTag.SourceUnitName);\n  end;\n  if Length(lChannels) = 0 then\n  begin\n    if AMessages <> nil then\n      AMessages.Add('Нет измерительных каналов MIC183/185 для балансировки.');\n    Exit;\n  end;\n  TraceZeroBalance(Format('MIC183/185 %s: channels=%d',\n    [SourceId, Length(lChannels)]));\n  Result := RecorderMic185ZeroBalanceChannels(Registry, SourceId, lChannels,\n    AMessages);\n  if Result then\n  begin\n    if fDevice <> nil then\n      ApplyChannelProgramSettings\n    else\n    begin\n      RecorderMic185BuildSourceProgramSettings(Registry, SourceId,\n        fPollFrequencyHz, fRuntimeChannelSettings);\n    end;\n    { Balancing changed the software correction. Refresh it explicitly here;\n      the hardware programming operation itself must stay independent of GX. }\n    CacheRuntimeChannels;\n    RecorderMic185Log(Format(\n      'ZeroBalance %s runtime transform cache refreshed', [SourceId]));\n  end;\nend;\n\nprocedure RecorderMic185SetKnownIdentity(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; ASerialNumber, ASoftVersion: LongWord);\nvar\n  lConfig: TJSONObject;\n  lEntry: TRecorderConfiguredDataSource;\nbegin\n  lEntry := RecorderMic185EnsureConfiguredSource(ARegistry, ASourceId,\n    MIC185DefaultPollFrequencyHz);\n  lConfig := Mic185SourceConfigObject(lEntry, True);\n  try\n    if ASerialNumber <> 0 then\n      lConfig.Integers['serialNumber'] := ASerialNumber;\n    if ASoftVersion <> 0 then\n      lConfig.Integers['softVersion'] := ASoftVersion;\n    Mic185StoreSourceConfigObject(lEntry, lConfig);\n  finally\n    lConfig.Free;\n  end;\nend;\n\nfunction RecorderMic185GetKnownIdentity(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; out ASerialNumber, ASoftVersion: LongWord): Boolean;\nvar\n  lConfig: TJSONObject;\n  lEntry: TRecorderConfiguredDataSource;\nbegin\n  ASerialNumber := 0;\n  ASoftVersion := 0;\n  lEntry := RecorderConfiguredDataSourcesFind(ARegistry, ASourceId);\n  lConfig := Mic185SourceConfigObject(lEntry, False);\n  try\n    if lConfig = nil then\n      Exit(False);\n    ASerialNumber := LongWord(lConfig.Get('serialNumber', 0));\n    ASoftVersion := LongWord(lConfig.Get('softVersion', 0));\n    Result := (ASerialNumber <> 0) or (ASoftVersion <> 0);\n  finally\n    lConfig.Free;\n  end;\nend;\n\nprocedure TRecorderMic185DataSource.ConfigureDevice;\nvar\n  lKnownSerial, lKnownVersion: LongWord;\n  lNative: TObject;\nbegin\n  fDevice := CreateRecorderMic185Device;\n  lNative := fDevice.GetNativeObject;\n  if lNative is TRecorderMic185Device then\n  begin\n    TRecorderMic185Device(lNative).RecorderDeviceIndex :=\n      RecorderMic185SourceDeviceIndex(Registry, SourceId);\n    if RecorderMic185GetKnownIdentity(Registry, SourceId, lKnownSerial,\n      lKnownVersion) then\n      TRecorderMic185Device(lNative).ApplyKnownIdentity(lKnownSerial,\n        lKnownVersion);\n  end;\n  fDevice.TrySetDeviceProperty(rdpHost, fHost);\n  fDevice.TrySetDeviceProperty(rdpPort, Integer(fPort));\n  fDevice.TrySetDeviceProperty(rdpPollFrequencyHz, fPollFrequencyHz);\n  fDevice.TrySetDeviceProperty(rdpUpdateTimeMs, Integer(UpdateTimeMs));\nend;\n\nfunction Mic185BlockSize(AFrequencyHz: Double;\n  AUpdateTimeMs: Cardinal): Word;\nvar\n  lCount: Int64;\nbegin\n  { Размер аппаратной порции задаётся в отсчётах канала. Оригинальный\n    Recorder вычисляет его из частоты и периода данных перед Program. }\n  lCount := Ceil(AFrequencyHz * AUpdateTimeMs / 1000.0);\n  if lCount < 1 then\n    lCount := 1\n  else if lCount > High(Word) then\n    lCount := High(Word);\n  Result := Word(lCount);\nend;\n\nprocedure TRecorderMic185DataSource.ApplyChannelProgramSettings;\nvar\n  I: Integer;\n  lDevice: TRecorderMic185Device;\n  lGroupAddition: TMic185GroupAdditionArray;\n  lModuleSettings: TMic185ModuleProgramSettings;\n  lSummary: string;\n  lSettings: TMic185ChannelProgramSettingsArray;\n  lTemperatureCompensation: Boolean;\nbegin\n  if (fDevice = nil) or (not (fDevice.GetNativeObject is TRecorderMic185Device)) then\n    Exit;\n  lDevice := TRecorderMic185Device(fDevice.GetNativeObject);\n\n  RecorderMic185BuildSourceProgramSettings(Registry, SourceId, fPollFrequencyHz,\n    lSettings);\n  for I := 0 to High(lSettings) do\n    lSettings[I].BlockSize := Mic185BlockSize(lSettings[I].FrequencyHz,\n      UpdateTimeMs);\n  fRuntimeChannelSettings := lSettings;\n  RecorderMic185GetSourceGroupAddition(Registry, SourceId, lGroupAddition);\n  RecorderMic185GetSourceModuleSettings(Registry, SourceId, lModuleSettings);\n  lTemperatureCompensation :=\n    RecorderMic185GetSourceTemperatureCompensation(Registry, SourceId);\n  lSummary := '';\n\n  for I := 0 to High(lSettings) do\n  begin\n    if lSummary <> '' then\n      lSummary := lSummary + '; ';\n    lSummary := lSummary + Format('ch%d range=%d commut=%d block=%d',\n      [I + 1, lSettings[I].MeasRangeIndex,\n       lSettings[I].CommutIndex, lSettings[I].BlockSize]);\n  end;\n\n  if lSummary <> '' then\n    RecorderMic185Log(Format(\n      'ApplyChannelProgramSettings %s power=%d tkc=%s groupAddition=%s: %s',\n      [SourceId, lSettings[0].PowerMaCode,\n       BoolToStr(lTemperatureCompensation, True),\n       RecorderMic185FormatGroupAddition(lGroupAddition), lSummary]));\n  lDevice.ApplyChannelProgramSettings(lSettings, lGroupAddition,\n    lTemperatureCompensation, lModuleSettings);\nend;\n\nprocedure TRecorderMic185DataSource.BuildRuntimeTransforms(\n  out ATransforms: TRecorderMic185ValueTransformArray);\nvar\n  I: Integer;\n  lCalibration: TRecorderCalibration;\n  lSettings: TMic185ChannelProgramSettings;\n  lTag: TRecorderTag;\nbegin\n  SetLength(ATransforms, Length(fChannelTags));\n  for I := 0 to High(fChannelTags) do\n  begin\n    lTag := fChannelTags[I];\n    SetLength(ATransforms[I].ChannelCalibrations, 0);\n    SetLength(ATransforms[I].ChannelConversions, 0);\n    ATransforms[I].IsLinear := True;\n    ATransforms[I].Valid := False;\n    ATransforms[I].K := 1.0;\n    ATransforms[I].B := 0.0;\n    if lTag = nil then\n      Continue;\n\n    lCalibration := nil;\n    if lTag.HardwareCalibrationEnabled then\n    begin\n      { The tag may still name a calibration from a previous range. Resolve\n        against the current programmed range every time the immutable runtime\n        snapshot is rebuilt; never apply a stale range calibration. }\n      lCalibration := RecorderMic185ResolveHardwareCalibrationForTransform(\n        Registry, lTag);\n      if lCalibration = nil then\n      begin\n        RecorderHardwareSetSourceWarning(SourceId, Format(\n          'Для канала %s не найдена аппаратная ГХ текущего диапазона; данные выводятся в кодах',\n          [lTag.Name]));\n        RecorderMic185Log(Format(\n          'Hardware GX unavailable tag=\"%s\" source=\"%s\": publishing raw ADC codes',\n          [lTag.Name, SourceId]));\n      end;\n    end;\n\n    if I > High(fRuntimeChannelSettings) then\n      Continue;\n    lSettings := fRuntimeChannelSettings[I];\n    ATransforms[I] := RecorderMic185BuildValueTransform(Registry, lTag,\n      lSettings, lCalibration);\n  end;\nend;\n\nprocedure TRecorderMic185DataSource.PublishRuntimeTransforms(\n  var ATransforms: TRecorderMic185ValueTransformArray);\nvar\n  lPrevious: TRecorderMic185ValueTransformArray;\nbegin\n  EnterCriticalSection(fValueTransformsLock);\n  try\n    lPrevious := fValueTransforms;\n    fValueTransforms := ATransforms;\n    ATransforms := lPrevious;\n  finally\n    LeaveCriticalSection(fValueTransformsLock);\n  end;\nend;\n\nprocedure TRecorderMic185DataSource.CacheRuntimeChannels;\nvar\n  lPrepared: TRecorderMic185ValueTransformArray;\nbegin\n  BuildRuntimeTransforms(lPrepared);\n  PublishRuntimeTransforms(lPrepared);\nend;\n\nprocedure TRecorderMic185DataSource.RefreshRuntimeTransforms;\nbegin\n  CacheRuntimeChannels;\nend;\n\nprocedure TRecorderMic185DataSource.DoCreateTags(ARegistry: TRecorderTagRegistry);\nvar\n  I: Integer;\n  lCapacity: Integer;\n  lRangePowerMa: Double;\n  lChannels: TRecorderDeviceChannelArray;\n  lChannelSettings: TMic185ChannelProgramSettings;\n  lTag: TRecorderTag;\n  lCreated: Boolean;\n  lUnitName: string;\nbegin\n  if fDevice = nil then\n    ConfigureDevice;\n\n  ARegistry.RegisterActiveSource(SourceId);\n  fChannelTagNames.Clear;\n  lChannels := fDevice.GetChannels;\n  SetLength(fChannelTags, Min(Length(lChannels), CMic185ChannelCountMax));\n  SetLength(fTempTags, CMic185TempChannelCount);\n  fUtsTag := nil;\n  for I := 0 to High(lChannels) do\n  begin\n    lTag := FindTagBySourceAddress(ARegistry, lChannels[I].Address);\n    { A project may rename a hardware channel (for example 185_149_01 to\n      4Е1). In that case fSelectedNames contains the project tag name, while\n      the freshly enumerated device channel still has its factory name.\n      Preserve the configured channel by matching source+address before the\n      name-based selection filter. }\n    if (lTag = nil) and (not ChannelSelected(lChannels[I])) then\n      Continue;\n    if lTag = nil then\n      lTag := ARegistry.FindByName(lChannels[I].Name);\n    lCreated := lTag = nil;\n    if lTag = nil then\n    begin\n      lCapacity := Ceil(Max(4096, lChannels[I].PollFrequencyHz * 4));\n      lTag := ARegistry.CreateTag(lChannels[I].Name, lCapacity);\n    end;\n\n    if lCreated or (not SameText(lTag.SourceId, SourceId)) or\n      (not SameMic185Address(lTag.Address, lChannels[I].Address)) then\n      lTag.Address := Mic185ConfiguredChannelAddress(ARegistry, SourceId,\n        lChannels[I].Address)\n    else\n      lTag.Address := Mic185CanonicalAddress(lTag.Address);\n    lTag.SourceId := SourceId;\n    lTag.ModuleType := CMic185ModuleName;\n    lTag.PollFrequencyHz := lChannels[I].PollFrequencyHz;\n    lTag.SourceValueMode := '';\n    if I < CMic185ChannelCountMax then\n    begin\n      RecorderMic185GetSourceChannelMode(ARegistry, SourceId,\n        lChannels[I].Address, lChannels[I].PollFrequencyHz, lChannelSettings);\n      lUnitName := RecorderMic185GetSourceChannelUnitName(ARegistry,\n        SourceId, lChannels[I].Address);\n      if lUnitName <> '' then\n      begin\n        lTag.SourceUnitName := lUnitName;\n        lTag.SourceHardwareOutputUnitName := lUnitName;\n        if lTag.AutoUnit then\n          ARegistry.SyncTagAutoUnit(lTag, True)\n      end\n      else if Trim(lTag.UnitName) = '' then\n        lTag.UnitName := RecorderMic185RangeUnitText(\n          lChannelSettings.MeasRangeIndex);\n      { Binding tags is model-only. Preserve a registered current GX, but do\n        not resolve serials or load CSV/hardware merely to show the range. }\n      lRangePowerMa := RecorderMic185ApplyCachedCurrentCalibration(ARegistry,\n        lTag, Mic185EffectivePowerMa(lChannelSettings));\n      lTag.RangeMax := Mic185EffectiveRangeMaxWithPower(lChannelSettings,\n        lTag.UnitName, lRangePowerMa);\n      lTag.RangeMin := -lTag.RangeMax;\n    end\n    else\n    begin\n      lTag.UnitName := lChannels[I].UnitName;\n      if I < CMic185ChannelCountMax + CMic185TempChannelCount then\n      begin\n        lTag.RangeMin := CMic185TempMinRangeC;\n        lTag.RangeMax := CMic185TempMaxRangeC;\n      end;\n    end;\n    if lCreated then\n    begin\n      lTag.AutoRange := False;\n      lTag.AutoUnit := False;\n    end;\n    if lCreated or (Trim(lTag.Description) = '') then\n      lTag.Description := Format('%s channel %s',\n        [CMic185ModuleName, lChannels[I].Address]);\n    lTag.EnsureBufferCapacity(Ceil(Max(4096, lChannels[I].PollFrequencyHz * 4)));\n    fChannelTagNames.Add(lTag.Name);\n    if I < Length(fChannelTags) then\n      fChannelTags[I] := lTag\n    else if I < CMic185ChannelCountMax + Length(fTempTags) then\n      fTempTags[I - CMic185ChannelCountMax] := lTag\n    else\n      fUtsTag := lTag;\n  end;\nend;\n\nprocedure TRecorderMic185DataSource.PrepareHardware;\nvar\n  lStartDelayMs: Cardinal;\n  lTestError: string;\n  lNativeDevice: TRecorderMic185Device;\n  lInitializeOk: Boolean;\n  lStageStartedAt: QWord;\n  lTraceId: string;\nbegin\n  if RecorderHardwareConsumeSourceResetRequest(SourceId) then\n  begin\n    fHardwarePrepared := False;\n    fHardwarePrepareAttempted := False;\n    RecorderHardwareClearSourceOffline(SourceId);\n  end;\n  if fHardwarePrepared or fHardwarePrepareAttempted then\n    Exit;\n  { До завершения протокольной проверки источник не считается исправным.\n    Иначе дерево показывало зелёный статус сразу после загрузки конфигурации,\n    хотя Connect/Initialize/Configure ещё не выполнялись. }\n  RecorderHardwareMarkSourceOffline(SourceId,\n    'Проверка связи и инициализация ещё не завершены');\n  fHardwarePrepareAttempted := True;\n  lTraceId := RecorderMic185NewLifecycleTraceId('startup');\n  RecorderMic185LifecycleLog(lTraceId, SourceId, 'operation', 'BEGIN',\n    Format('endpoint=%s:%d bind=%s', [fHost, fPort,\n      RecorderNetworkBindAddress]));\n  lStartDelayMs := Mic185EndpointStartDelayMs(fHost);\n  if lStartDelayMs > 0 then\n  begin\n    RecorderMic185LifecycleLog(lTraceId, SourceId, 'startup-stagger', 'BEGIN',\n      Format('delay_ms=%d', [lStartDelayMs]));\n    Sleep(lStartDelayMs);\n    RecorderMic185LifecycleLog(lTraceId, SourceId, 'startup-stagger', 'OK', '',\n      lStartDelayMs);\n  end;\n  { Прошивка MIC-185 допускает параллельный сбор, но одновременное\n    программирование нескольких контроллеров даёт нестабильный результат.\n    Последовательно выполняется только connect/init/config. }\n  inherited PrepareHardware;\n  try\n    if fDevice = nil then\n      ConfigureDevice;\n    ApplyChannelProgramSettings;\n    { Connect/ProgramDevice могут бросать исключения и останавливать debugger.\n      Для ожидаемо отключённого прибора сначала выполняется безопасный TEST. }\n    if not (fDevice.GetNativeObject is TRecorderMic185Device) then\n    begin\n      RecorderHardwareMarkSourceOffline(SourceId,\n        'MIC183/185 native device is unavailable');\n      Exit;\n    end;\n    lNativeDevice := TRecorderMic185Device(fDevice.GetNativeObject);\n    lStageStartedAt := GetTickCount64;\n    RecorderMic185LifecycleLog(lTraceId, SourceId, 'connect', 'BEGIN', '');\n    if not lNativeDevice.TryConnect(lTestError) then\n    begin\n      RecorderMic185LifecycleLog(lTraceId, SourceId, 'connect', 'FAIL',\n        lTestError, GetTickCount64 - lStageStartedAt);\n      RecorderMic185LifecycleLog(lTraceId, SourceId, 'operation', 'FAIL',\n        'connect: ' + lTestError);\n      RecorderHardwareMarkSourceOffline(SourceId, lTestError);\n      RecorderHardwareUnregisterLiveDevice(Self);\n      Exit;\n    end;\n    RecorderMic185LifecycleLog(lTraceId, SourceId, 'connect', 'OK', '',\n      GetTickCount64 - lStageStartedAt);\n    Mic185EnterPrepareCommandSlot(lTraceId, SourceId);\n    try\n      lStageStartedAt := GetTickCount64;\n      RecorderMic185LifecycleLog(lTraceId, SourceId, 'initialize', 'BEGIN',\n        'GetSoftVersion/read SN');\n      lInitializeOk := lNativeDevice.TryInitializeSession(lTestError);\n      if not lInitializeOk then\n      begin\n        RecorderMic185LifecycleLog(lTraceId, SourceId, 'initialize', 'FAIL',\n          lTestError, GetTickCount64 - lStageStartedAt);\n        RecorderMic185LifecycleLog(lTraceId, SourceId, 'operation', 'FAIL',\n          'initialize: ' + lTestError);\n        RecorderHardwareMarkSourceOffline(SourceId,\n          'MIC183/185 initialization failed: ' + lTestError);\n        RecorderHardwareUnregisterLiveDevice(Self);\n        fDevice.Disconnect;\n        Exit;\n      end;\n      RecorderMic185LifecycleLog(lTraceId, SourceId, 'initialize', 'OK',\n        Format('sn=%d version=%s', [lNativeDevice.DeviceSerial,\n          Mic185FormatSoftVersion(lNativeDevice.SoftVersion)]),\n        GetTickCount64 - lStageStartedAt);\n      RecorderMic185SetKnownIdentity(Registry, SourceId,\n        lNativeDevice.DeviceSerial, lNativeDevice.SoftVersion);\n\n      lStageStartedAt := GetTickCount64;\n      RecorderMic185LifecycleLog(lTraceId, SourceId, 'configure', 'BEGIN', '');\n      if not lNativeDevice.TryProgramDevice(lTestError) then\n      begin\n        RecorderMic185LifecycleLog(lTraceId, SourceId, 'configure', 'FAIL',\n          lTestError, GetTickCount64 - lStageStartedAt);\n        RecorderMic185LifecycleLog(lTraceId, SourceId, 'operation', 'FAIL',\n          'configure: ' + lTestError);\n        RecorderHardwareMarkSourceOffline(SourceId,\n          'MIC183/185 programming failed: ' + lTestError);\n        RecorderHardwareUnregisterLiveDevice(Self);\n        fDevice.Disconnect;\n        Exit;\n      end;\n      RecorderMic185LifecycleLog(lTraceId, SourceId, 'configure', 'OK', '',\n        GetTickCount64 - lStageStartedAt);\n    finally\n      Mic185LeavePrepareCommandSlot;\n    end;\n    RecorderMic185RegisterLiveDevice(Self, fHost, fPort, fDevice);\n    fHardwarePrepared := True;\n    RecorderHardwareClearSourceOffline(SourceId);\n    RecorderMic185LifecycleLog(lTraceId, SourceId, 'operation', 'OK',\n      Format('sn=%d', [lNativeDevice.DeviceSerial]));\n  except\n    on E: Exception do\n    begin\n      RecorderMic185LifecycleLog(lTraceId, SourceId, 'operation', 'EXCEPTION',\n        E.ClassName + ': ' + E.Message);\n      RecorderHardwareMarkSourceOffline(SourceId, E.Message);\n      RecorderHardwareUnregisterLiveDevice(Self);\n      if fDevice <> nil then\n      begin\n        try\n          fDevice.Disconnect;\n        except\n        end;\n      end;\n    end;\n  end;\nend;\n\nprocedure TRecorderMic185DataSource.Start;\nvar\n  lError: string;\n  lDevice: TRecorderMic185Device;\nbegin\n  inherited Start;\n  if RecorderHardwareIsSourceOffline(SourceId) then\n    Exit;\n  if fDevice = nil then\n    ConfigureDevice;\n  if (not fHardwarePrepared) and fHardwarePrepareAttempted then\n    Exit;\n  RecorderHardwareClearSourceWarning(SourceId);\n  { Logical acquisition preparation is distinct from hardware reset/program.\n    Keep validation before TryStart; invalid units must still block sampling. }\n  CacheRuntimeChannels;\n  if fDevice.State <> rdsStarted then\n  begin\n    if not (fDevice.GetNativeObject is TRecorderMic185Device) then\n    begin\n      RecorderHardwareMarkSourceOffline(SourceId,\n        'MIC183/185 native device is unavailable');\n      Exit;\n    end;\n    lDevice := TRecorderMic185Device(fDevice.GetNativeObject);\n    if not lDevice.TryStart(lError) then\n    begin\n      RecorderMic185Log(Format('%s start failed: %s', [SourceId, lError]));\n      RecorderHardwareMarkSourceOffline(SourceId, lError);\n      Exit;\n    end;\n  end;\n  { A new acquisition session must publish its first UTS packet even if the\n    datasource object is reused after Stop/Start. }\n  fLastPublishedUtsGeneration := 0;\n  fUtsPublishLogCount := 0;\n  fDiagTick := GetTickCount64;\n  fDiagBlocks := 0;\n  fLastRxPackets := 0;\n  fLastRxBlocks := 0;\n  fLastRxTick := fDiagTick;\n  fLastBlockTick := fDiagTick;\n  fRxWarning := False;\nend;\n\nfunction TRecorderMic185DataSource.Reconfigure(AUpdateTimeMs: Cardinal;\n  out AErrorText: string): Boolean;\nvar\n  lNative: TRecorderMic185Device;\nbegin\n  Result := inherited Reconfigure(AUpdateTimeMs, AErrorText);\n  if not Result then\n    Exit;\n  if fDevice = nil then\n    Exit(True);\n  try\n    fDevice.TrySetDeviceProperty(rdpPollFrequencyHz, fPollFrequencyHz);\n    fDevice.TrySetDeviceProperty(rdpUpdateTimeMs, Integer(UpdateTimeMs));\n    ApplyChannelProgramSettings;\n    if not fHardwarePrepared then\n      Exit(True);\n    if not (fDevice.GetNativeObject is TRecorderMic185Device) then\n    begin\n      AErrorText := 'MIC183/185 native device is unavailable';\n      Exit(False);\n    end;\n    lNative := TRecorderMic185Device(fDevice.GetNativeObject);\n    Result := lNative.TryProgramDevice(AErrorText);\n    if Result then\n      RecorderHardwareClearSourceOffline(SourceId)\n    else\n      RecorderHardwareMarkSourceOffline(SourceId, AErrorText);\n  except\n    on E: Exception do\n    begin\n      AErrorText := E.ClassName + ': ' + E.Message;\n      RecorderHardwareMarkSourceOffline(SourceId, AErrorText);\n      Result := False;\n    end;\n  end;\nend;\n\nprocedure TRecorderMic185DataSource.RequestStop;\nbegin\n  RecorderMic185RuntimeHoldBusy(Trim(fHost), fPort, True);\n  inherited RequestStop;\nend;\n\nprocedure TRecorderMic185DataSource.Stop;\nbegin\n  RecorderHardwareClearSourceWarning(SourceId);\n  fRxWarning := False;\n  if fDevice <> nil then\n  begin\n    try\n      fDevice.Stop;\n    except\n      on E: Exception do\n        ;\n    end;\n  end;\n  RecorderMic185RuntimeHoldBusy(Trim(fHost), fPort, False);\n  { Stop is an acquisition-stage operation, not Disconnect. Preserve the\n    initialized/programmed session for a fast subsequent Preview or Record.\n    A requested reset clears these flags at the next PrepareHardware call;\n    destruction releases fDevice and closes the TCP session. }\n  inherited Stop;\nend;\n\nprocedure TRecorderMic185DataSource.PublishMeasurementBlock(const ABlock: TRcAcquisitionBlock);\nvar\n  I, J: Integer;\n  lCount: Integer;\n  lFirstTime: Double;\n  lTag: TRecorderTag;\n  lTransform: TRecorderMic185ValueTransform;\n  lTransforms: TRecorderMic185ValueTransformArray;\nbegin\n  if (Registry = nil) or (ABlock.SampleCount <= 0) or (ABlock.SampleRateHz <= 0) then\n    Exit;\n  // перепроверить!!! зачем в RunTime SetLength\n  if Length(fTimes) < ABlock.SampleCount then\n    SetLength(fTimes, ABlock.SampleCount);\n  if Length(fValues) < ABlock.SampleCount then\n    SetLength(fValues, ABlock.SampleCount);\n  // нельзя формировать для каждой точки времена X - это задача для линий в чарте\n  // там есть x0 для одномерных сигналов и dx - шейдер сам разворачивает X для каждой точки\n  // собирает полный снимок настроек всех 64 измерительных каналов одного MIC-185 источника\n  // из конфигурации проекта (registry / configuredDataSources), в виде массива\n  // TMic185ChannelProgramSettingsArray\n  // Этой функции не место в RunTime\n  lCount := Min(ABlock.ChannelCount, Length(fChannelTags));\n  EnterCriticalSection(fValueTransformsLock);\n  try\n    lTransforms := fValueTransforms;\n  finally\n    LeaveCriticalSection(fValueTransformsLock);\n  end;\n  for I := 0 to lCount - 1 do\n  begin\n    // лучше хранить массив ссылок на теги. Поиск тега по имени каждый раз плохая операция!\n    // у каждого канала может быть по нескольку ГХ в стеке, но если они все линейные то можно вычислить\n    // итоговую линейную ГХ и делать однократное умножение в цикле.\n    // Для плат которые меряют быстропеременные процессы и имеют десятки кГц\n    // отсчетов за блок данных это критично. Еще применение линейной ГХ можно делать не поточечно а аппаратно ускоренными\n    // функциями где сразу перемножается весь массив с константой (повод для модернизации в дальнейшем)\n    lTag := fChannelTags[I];\n    if (lTag = nil) or (not SameText(lTag.SourceId, SourceId)) then\n      Continue;\n    lFirstTime := RecorderBlockChannelFirstTime(ABlock, I);\n    for J := 0 to ABlock.SampleCount - 1 do\n      fTimes[J] := lFirstTime + (J / ABlock.SampleRateHz);\n    if I <= High(lTransforms) then\n    begin\n      lTransform := lTransforms[I];\n      { With hardware GX enabled, absence of the calibration for the current\n        range is a hard data-validity failure. Never publish ADC codes as mV,\n        Ohm or strain merely because the transform could not be resolved. }\n      if not lTransform.Valid then\n        Continue;\n      lTag.StageRawValue(fTimes[ABlock.SampleCount - 1],\n        ABlock.Values[I][ABlock.SampleCount - 1]);\n      if lTransform.IsLinear then\n        for J := 0 to ABlock.SampleCount - 1 do\n          fValues[J] := lTransform.K * ABlock.Values[I][J] + lTransform.B\n      else\n        for J := 0 to ABlock.SampleCount - 1 do\n          fValues[J] := RecorderMic185ApplyValueTransform(ABlock.Values[I][J],\n            lTransform);\n    end\n    else\n    begin\n      lTag.StageRawValue(fTimes[ABlock.SampleCount - 1],\n        ABlock.Values[I][ABlock.SampleCount - 1]);\n      for J := 0 to ABlock.SampleCount - 1 do\n        fValues[J] := ABlock.Values[I][J];\n    end;\n    Registry.AddBlockSamples(lTag, fTimes, fValues, ABlock.SampleCount, True);\n    { Значения уже пересчитаны: передаём тот же блок без повторного\n      LastBlockSnapshot и второго поиска тега по имени. }\n    Registry.PublishBlockNotifications(lTag, fTimes, fValues,\n      ABlock.SampleCount);\n  end;\n  // не надо каждому отсчету время сопоставлять! вре5мя должно соответсвовать блоку а не каждому отсчету если это одномерный сигнал!\n  PublishAuxChannels(RecorderBlockSampleTime(ABlock, -1,\n    ABlock.SampleCount - 1));\nend;\n\n// не надо каждому отсчету время сопоставлять! вре5мя должно соответсвовать блоку а не каждому отсчету если это одномерный сигнал!\nprocedure TRecorderMic185DataSource.PublishAuxChannels(ATimeSec: Double);\nvar\n  I: Integer;\n  lDevice: TRecorderMic185Device;\n  lTag: TRecorderTag;\nbegin\n  if (Registry = nil) or (fDevice = nil) or\n    (not (fDevice.GetNativeObject is TRecorderMic185Device)) then\n    Exit;\n  lDevice := TRecorderMic185Device(fDevice.GetNativeObject);\n\n  if lDevice.HasTempData then\n    for I := 0 to Min(lDevice.TempChannelCount, Length(fTempTags)) - 1 do\n    begin\n      // поиск тега по строке в цикле на каждой итерации - не корректно!\n      // надо хранить ссылки на теги\n      lTag := fTempTags[I];\n      // не надо каждому отсчету время сопоставлять!\n      if lTag <> nil then\n        Registry.PublishValue(lTag.Name, ATimeSec, lDevice.LastTempValue(I));\n    end;\n\n  if lDevice.HasUtsData and\n    (lDevice.UtsGeneration <> fLastPublishedUtsGeneration) then\n  begin\n    lTag := fUtsTag;\n    if lTag <> nil then\n    begin\n      { Original Recorder stores UTS as an XY pair: device-relative X and\n        absolute UTS seconds Y. PublishValue preserves the same .x/.dat split. }\n      Registry.PublishValue(lTag.Name, lDevice.LastUtsDeviceTimeSec,\n        lDevice.LastUts);\n      if fUtsPublishLogCount < 4 then\n      begin\n        Inc(fUtsPublishLogCount);\n        RecorderMic185Log(Format(\n          '[DataSource:%s] MIC-185 UTS published #%d tag=%s x=%.6f uts=%.0f gen=%d',\n          [SourceId, fUtsPublishLogCount, lTag.Name,\n           lDevice.LastUtsDeviceTimeSec, lDevice.LastUts,\n           lDevice.UtsGeneration]));\n      end;\n      if Registry.TimeSystem <> nil then\n        Registry.TimeSystem.UpdateFromTagSample(lDevice.LastUtsDeviceTimeSec,\n          lDevice.LastUts);\n    end;\n    fLastPublishedUtsGeneration := lDevice.UtsGeneration;\n  end;\nend;\n\nfunction RecorderMic185SameChannelAddress(const ALeft,\n  ARight: string): Boolean;\nbegin\n  Result := SameMic185Address(ALeft, ARight);\nend;\n\nprocedure TRecorderMic185DataSource.DoTick;\nvar\n  lBlock: TRcAcquisitionBlock;\n  lDevice: TRecorderMic185Device;\n  lError: string;\n  lNow: QWord;\n  lTimeout: Cardinal;\n  lPackets: QWord;\n  lStaleMs: QWord;\n  lWarning: string;\nbegin\n  if fDevice = nil then\n    Exit;\n  if RecorderHardwareIsSourceOffline(SourceId) then\n    Exit;\n  if fDevice.State <> rdsStarted then\n  begin\n    RecorderHardwareMarkSourceOffline(SourceId,\n      'MIC183/185 acquisition was not started');\n    Exit;\n  end;\n\n  lTimeout := Max(Cardinal(1000), UpdateTimeMs * 4);\n  if fDevice.ReadBlock(lTimeout, lBlock) then\n  begin\n    Inc(fDiagBlocks);\n    PublishMeasurementBlock(lBlock);\n  end;\n\n  if not (fDevice.GetNativeObject is TRecorderMic185Device) then\n    Exit;\n  lDevice := TRecorderMic185Device(fDevice.GetNativeObject);\n  lNow := GetTickCount64;\n  lPackets := lDevice.RxDataPacketCount;\n  if lPackets <> fLastRxPackets then\n  begin\n    fLastRxPackets := lPackets;\n    fLastRxTick := lNow;\n  end;\n  if fDiagBlocks <> fLastRxBlocks then\n  begin\n    fLastRxBlocks := fDiagBlocks;\n    fLastBlockTick := lNow;\n  end;\n  lStaleMs := Max(QWord(3000), QWord(UpdateTimeMs) * 15);\n  if fRxWarning and (lNow - fLastRxTick < lStaleMs) and\n    (lNow - fLastBlockTick < lStaleMs) then\n  begin\n    RecorderDebugLog(Format('[MIC185-HEALTH] %s stream resumed: packets=%d blocks=%d',\n      [SourceId, lPackets, fDiagBlocks]));\n    RecorderHardwareClearSourceWarning(SourceId);\n    fRxWarning := False;\n  end;\n  if (not fRxWarning) and ((lNow - fLastRxTick >= lStaleMs) or\n    (lNow - fLastBlockTick >= lStaleMs)) then\n  begin\n    if lNow - fLastRxTick >= lStaleMs then\n      lWarning := Format('TCP-сессия открыта, пакеты MIC-185 не поступают %d мс',\n        [lNow - fLastRxTick])\n    else\n      lWarning := Format('пакеты MIC-185 поступают, готовые блоки не собраны %d мс',\n        [lNow - fLastBlockTick]);\n    RecorderHardwareSetSourceWarning(SourceId, lWarning);\n    RecorderDebugLog(Format(\n      '[MIC185-HEALTH] %s stalled: bytes=%d packets=%d data=%d blocks=%d buffered=%d maxbuf=%d compact=%d syncdrop=%d lost=%s; %s',\n      [SourceId, lDevice.RxByteCount, lDevice.RxPacketCount, lPackets,\n       fDiagBlocks, lDevice.RxBufferedByteCount, lDevice.RxMaxBuffered,\n       lDevice.RxCompactCount, lDevice.RxSyncDropCount,\n       BoolToStr(lDevice.ConnectionLost, True), lWarning]));\n    fRxWarning := True;\n  end;\n  if lNow - fDiagTick >= 10000 then\n  begin\n    RecorderMic185Log(Format(\n      '%s RX heartbeat: bytes=%d packets=%d data=%d blocks=%d buffered=%d maxbuf=%d compact=%d syncdrop=%d lost=%s state=%d',\n      [SourceId, lDevice.RxByteCount, lDevice.RxPacketCount,\n       lDevice.RxDataPacketCount, fDiagBlocks, lDevice.RxBufferedByteCount,\n       lDevice.RxMaxBuffered, lDevice.RxCompactCount,\n       lDevice.RxSyncDropCount, BoolToStr(lDevice.ConnectionLost, True),\n       Ord(fDevice.State)]));\n    fDiagTick := lNow;\n  end;\n  { Неполный TCP-пакет штатно остаётся в накопителе до следующего такта.\n    Отсутствие готового блока не означает разрыв соединения. }\n  if not lDevice.ConnectionLost then\n    Exit;\n  lError := Trim(lDevice.LastReadError);\n  if lError = '' then\n    lError := 'MIC183/185 TCP connection lost';\n  RecorderMic185Log(Format('%s acquisition stopped: %s', [SourceId, lError]));\n  { Не оставляем прибор владельцем зависшей Mebius-сессии. Иначе следующий\n    клиент откроет TCP-порт, но прибор не будет отвечать на IoControl. }\n  try\n    fDevice.Disconnect;\n  except\n  end;\n  RecorderHardwareUnregisterLiveDevice(Self);\n  fHardwarePrepared := False;\n  RecorderHardwareMarkSourceOffline(SourceId, lError);\nend;\n\nprocedure Mic185ProjectTagLoaded(AJson: TJSONObject;\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag);\nvar\n  lAddress: string;\n  lSourceId: string;\nbegin\n  if ATag = nil then\n    Exit;\n  lSourceId := RecorderNormalizeTagSourceId(ATag.SourceId);\n  if not RecorderIsHardwareMic185TagSource(lSourceId) then\n    Exit;\n\n  lAddress := Mic185CanonicalAddress(ATag.Address);\n  if (lAddress <> '') and (not SameText(lAddress, Trim(ATag.Address))) then\n  begin\n    RecorderMic185Log(Format(\n      'Load tag normalized address source=\"%s\" tag=\"%s\": \"%s\" -> \"%s\"',\n      [lSourceId, ATag.Name, ATag.Address, lAddress]));\n    ATag.Address := lAddress;\n  end;\nend;\n\ninitialization\n  InitCriticalSection(gMic185PrepareLock);\n  RecorderRegisterFrequencyGrid('MIC-185:', CMic185Frequencies);\n  RecorderRegisterProjectConfigExtension(@SaveMic185DataSourceConfigs,\n    @LoadMic185DataSourceConfigs, @Mic185ProjectTagLoaded);\n  RecorderRegisterHardwareSourceLinkProbe(@RecorderMic185HardwareLinkProbe);\n\nfinalization\n  DoneCriticalSection(gMic185PrepareLock);\n\nend.\n", "sha256": "4099dc13cfe6018aa83b44920f7d0f13c4ff643dcc739fa5226168c082356f95"}, "Core/uRecorderMeraSdbThermocouples.pas": {"text": "unit uRecorderMeraSdbThermocouples;\n\n{\n  GOST thermocouple scales from Mera SDB (same tree as original Recorder).\n\n  Загружает таблицы термопар из системной базы Mera SDB.\n  \"ГОСТ\\\\Термопары\" under DEFAULT_SDB_PATH (Mera Files\\\\sdb\\\\sdb.xml).\n  Each scale is a pair of .xml metadata + .csv points (mV -> degC).\n}\n\n{$mode objfpc}{$H+}\n{$codepage UTF8}\n\ninterface\n\nuses\n  Classes, SysUtils, uRecorderTags;\n\nconst\n  CMeraSdbThermocoupleFolder = 'ГОСТ\\Термопары';\n\nfunction RecorderMeraSdbRootDir: string;\nfunction RecorderMeraThermocoupleDir: string;\nfunction RecorderMeraThermocoupleFolderKey: string;\nprocedure RecorderMeraListThermocoupleScales(AItems: TStrings);\nfunction RecorderMeraThermocoupleRelativePath(const ADisplayName: string): string;\nfunction RecorderMeraResolveThermocoupleScaleKey(const ARelativeScalePath,\n  ADisplayName: string): string;\nfunction RecorderMeraThermocoupleCsvPath(const ARelativeScalePath: string): string;\nfunction RecorderMeraThermocoupleDisplayName(const ARelativeScalePath: string): string;\nfunction RecorderMeraThermocoupleDstRange(const ARelativeScalePath: string;\n  out AMinC, AMaxC: Double): Boolean;\nfunction RecorderMeraLoadThermocoupleCalibration(const ARelativeScalePath,\n  ADisplayName: string; ACalibration: TRecorderCalibration): Boolean;\n\nimplementation\n\nuses\n  FileUtil, LazFileUtils, StrUtils, uRecorderMeraPaths, uRecorderSdbStore,\n  uRecorderSdbTypes;\n\nfunction RecorderMeraSdbRootDir: string;\nbegin\n  Result := RecorderSdbRootDir;\nend;\n\nfunction MeraCachedThermocoupleDir: string;\nvar\n  lFolderKey: string;\nbegin\n  RecorderMeraGetThermocoupleCache(Result, lFolderKey);\nend;\n\nfunction MeraCachedThermocoupleFolderKey: string;\nvar\n  lDir: string;\nbegin\n  RecorderMeraGetThermocoupleCache(lDir, Result);\nend;\n\nfunction RecorderMeraCountScalePairs(const ADiskDir: string): Integer;\nvar\n  lBasenames: TStringList;\n  lBase: string;\n  lDirName: string;\n  lDiskDir: string;\n  SR: TSearchRec;\nbegin\n  Result := 0;\n  lDiskDir := IncludeTrailingPathDelimiter(ADiskDir);\n  if not DirectoryExistsUTF8(lDiskDir) then\n    Exit;\n  lDirName := ExtractFileName(ExcludeTrailingPathDelimiter(lDiskDir));\n  lBasenames := TStringList.Create;\n  try\n    lBasenames.Sorted := True;\n    lBasenames.Duplicates := dupIgnore;\n    if FindFirstUTF8(lDiskDir + '*', faAnyFile, SR) = 0 then\n    try\n      repeat\n        if (SR.Attr and faDirectory) <> 0 then\n          Continue;\n        if not SameText(ExtractFileExt(SR.Name), '.xml') then\n          Continue;\n        lBase := ChangeFileExt(SR.Name, '');\n        if SameText(lBase, lDirName) then\n          Continue;\n        if FileExistsUTF8(lDiskDir + lBase + '.csv') or\n          FileExistsUTF8(lDiskDir + lBase + '.CSV') then\n          lBasenames.Add(lBase);\n      until FindNextUTF8(SR) <> 0;\n    finally\n      FindCloseUTF8(SR);\n    end;\n    Result := lBasenames.Count;\n  finally\n    lBasenames.Free;\n  end;\nend;\n\nfunction RecorderMeraTryThermocoupleDir(const ADiskDir, AFolderKey: string): Boolean;\nbegin\n  Result := RecorderMeraCountScalePairs(ADiskDir) > 0;\n  if Result then\n    RecorderMeraSetThermocoupleCache(IncludeTrailingPathDelimiter(ADiskDir),\n      AFolderKey);\nend;\n\nfunction RecorderMeraIsThermocoupleFolderName(const AName: string): Boolean;\nbegin\n  Result := SameText(AName, 'Термопары') or SameText(AName, 'Thermocouples');\nend;\n\nfunction RecorderMeraScanThermocoupleTree(const ADiskDir, AFolderKey: string;\n  ADepth: Integer): Boolean;\nvar\n  SR: TSearchRec;\n  lChildDir: string;\n  lChildKey: string;\n  lDiskDir: string;\nbegin\n  if ADepth < 0 then\n    Exit(False);\n  lDiskDir := IncludeTrailingPathDelimiter(ADiskDir);\n  if not DirectoryExistsUTF8(lDiskDir) then\n    Exit(False);\n  if RecorderMeraIsThermocoupleFolderName(ExtractFileName(\n    ExcludeTrailingPathDelimiter(lDiskDir))) and\n    RecorderMeraTryThermocoupleDir(lDiskDir, AFolderKey) then\n    Exit(True);\n  if FindFirstUTF8(lDiskDir + '*', faDirectory, SR) = 0 then\n  try\n    repeat\n      if (SR.Attr and faDirectory) = 0 then\n        Continue;\n      if SameText(SR.Name, '.') or SameText(SR.Name, '..') then\n        Continue;\n      lChildDir := lDiskDir + SR.Name;\n      if AFolderKey <> '' then\n        lChildKey := AFolderKey + '\\' + SR.Name\n      else\n        lChildKey := SR.Name;\n      if RecorderMeraScanThermocoupleTree(lChildDir, lChildKey, ADepth - 1) then\n        Exit(True);\n    until FindNextUTF8(SR) <> 0;\n  finally\n    FindCloseUTF8(SR);\n  end;\n  Result := False;\nend;\n\nfunction RecorderMeraResolveThermocoupleLocation: Boolean;\nvar\n  SR: TSearchRec;\n  SR2: TSearchRec;\n  lGostDir: string;\n  lGostKey: string;\n  lRoot: string;\n  lTcDir: string;\n  lTcKey: string;\n  lCurrentMeraPath: string;\nbegin\n  lCurrentMeraPath := RecorderMeraFilesPath;\n  if lCurrentMeraPath <> RecorderMeraThermocoupleLastMeraPath then\n  begin\n    RecorderMeraSetThermocoupleLastMeraPath(lCurrentMeraPath);\n    RecorderMeraResetThermocoupleCache;\n  end;\n\n  if (MeraCachedThermocoupleDir <> '') and\n    DirectoryExistsUTF8(MeraCachedThermocoupleDir) and\n    (RecorderMeraCountScalePairs(MeraCachedThermocoupleDir) > 0) then\n    Exit(True);\n\n  RecorderMeraResetThermocoupleCache;\n\n  lRoot := IncludeTrailingPathDelimiter(ExpandFileName(RecorderSdbRootDir));\n  if not DirectoryExistsUTF8(lRoot) then\n    Exit(False);\n\n  if RecorderMeraTryThermocoupleDir(lRoot +\n    StringReplace(CMeraSdbThermocoupleFolder, '\\', PathDelim, [rfReplaceAll]),\n    CMeraSdbThermocoupleFolder) then\n    Exit(True);\n\n  if FindFirstUTF8(lRoot + '*', faDirectory, SR) = 0 then\n  try\n    repeat\n      if (SR.Attr and faDirectory) = 0 then\n        Continue;\n      if SameText(SR.Name, '.') or SameText(SR.Name, '..') then\n        Continue;\n      lGostDir := lRoot + SR.Name + PathDelim;\n      lGostKey := SR.Name;\n      if RecorderMeraTryThermocoupleDir(lGostDir, lGostKey) then\n        Exit(True);\n      if FindFirstUTF8(lGostDir + '*', faDirectory, SR2) = 0 then\n      try\n        repeat\n          if (SR2.Attr and faDirectory) = 0 then\n            Continue;\n          if SameText(SR2.Name, '.') or SameText(SR2.Name, '..') then\n            Continue;\n          lTcDir := lGostDir + SR2.Name + PathDelim;\n          lTcKey := lGostKey + '\\' + SR2.Name;\n          if RecorderMeraTryThermocoupleDir(lTcDir, lTcKey) then\n            Exit(True);\n        until FindNextUTF8(SR2) <> 0;\n      finally\n        FindCloseUTF8(SR2);\n      end;\n    until FindNextUTF8(SR) <> 0;\n  finally\n    FindCloseUTF8(SR);\n  end;\n\n  Result := RecorderMeraScanThermocoupleTree(lRoot, '', 6);\nend;\n\nfunction RecorderMeraThermocoupleDir: string;\nbegin\n  if not RecorderMeraResolveThermocoupleLocation then\n    Result := IncludeTrailingPathDelimiter(RecorderMeraSdbRootDir) +\n      StringReplace(CMeraSdbThermocoupleFolder, '\\', PathDelim, [rfReplaceAll])\n  else\n    Result := MeraCachedThermocoupleDir;\nend;\n\nfunction RecorderMeraThermocoupleFolderKey: string;\nbegin\n  if not RecorderMeraResolveThermocoupleLocation then\n    Result := CMeraSdbThermocoupleFolder\n  else\n    Result := MeraCachedThermocoupleFolderKey;\nend;\n\nfunction RecorderMeraThermocoupleCsvPath(const ARelativeScalePath: string): string;\nvar\n  lDiskPath: string;\n  lKey: string;\nbegin\n  lKey := Trim(ARelativeScalePath);\n  if lKey = '' then\n    Exit('');\n  if (Pos('\\', lKey) = 0) and (Pos(PathDelim, lKey) = 0) then\n  begin\n    if RecorderMeraResolveThermocoupleLocation then\n    begin\n      lDiskPath := MeraCachedThermocoupleDir + lKey + '.csv';\n      if FileExistsUTF8(lDiskPath) then\n        Exit(lDiskPath);\n      lDiskPath := MeraCachedThermocoupleDir + lKey + '.CSV';\n      if FileExistsUTF8(lDiskPath) then\n        Exit(lDiskPath);\n    end;\n    lKey := RecorderMeraThermocoupleRelativePath(lKey);\n  end;\n  Result := RecorderSdbScaleCsvPath(lKey);\nend;\n\nfunction RecorderMeraThermocoupleDisplayName(const ARelativeScalePath: string): string;\nvar\n  lExt: string;\nbegin\n  Result := ExtractFileName(StringReplace(ARelativeScalePath, '\\', PathDelim,\n    [rfReplaceAll]));\n  lExt := LowerCase(ExtractFileExt(Result));\n  if (lExt = '.xml') or (lExt = '.csv') then\n    Result := ChangeFileExt(Result, '');\nend;\n\nfunction RecorderMeraThermocoupleDstRange(const ARelativeScalePath: string;\n  out AMinC, AMaxC: Double): Boolean;\nvar\n  lInfo: TSdbScaleInfo;\n  lKey: string;\nbegin\n  Result := False;\n  AMinC := 0;\n  AMaxC := 0;\n  lKey := Trim(ARelativeScalePath);\n  if (Pos('\\', lKey) = 0) and (Pos(PathDelim, lKey) = 0) then\n    lKey := RecorderMeraThermocoupleRelativePath(lKey);\n  if not RecorderSdbTryLoadScale(lKey, lInfo) then\n    Exit;\n  AMinC := lInfo.DstFrom;\n  AMaxC := lInfo.DstTo;\n  Result := AMinC <> AMaxC;\nend;\n\nprocedure RecorderMeraCollectScalesInDir(const ADiskDir: string; AItems: TStrings);\nvar\n  lBase: string;\n  lBasenames: TStringList;\n  lDirName: string;\n  lDiskDir: string;\n  lI: Integer;\n  SR: TSearchRec;\nbegin\n  if AItems = nil then\n    Exit;\n  lDiskDir := IncludeTrailingPathDelimiter(ADiskDir);\n  if not DirectoryExistsUTF8(lDiskDir) then\n    Exit;\n  lDirName := ExtractFileName(ExcludeTrailingPathDelimiter(lDiskDir));\n  lBasenames := TStringList.Create;\n  try\n    lBasenames.Sorted := True;\n    lBasenames.Duplicates := dupIgnore;\n    if FindFirstUTF8(lDiskDir + '*', faAnyFile, SR) = 0 then\n    try\n      repeat\n        if (SR.Attr and faDirectory) <> 0 then\n          Continue;\n        if not SameText(ExtractFileExt(SR.Name), '.xml') then\n          Continue;\n        lBase := ChangeFileExt(SR.Name, '');\n        if SameText(lBase, lDirName) then\n          Continue;\n        if FileExistsUTF8(lDiskDir + lBase + '.csv') or\n          FileExistsUTF8(lDiskDir + lBase + '.CSV') then\n          lBasenames.Add(lBase);\n      until FindNextUTF8(SR) <> 0;\n    finally\n      FindCloseUTF8(SR);\n    end;\n    for lI := 0 to lBasenames.Count - 1 do\n      if AItems.IndexOf(lBasenames[lI]) < 0 then\n        AItems.Add(lBasenames[lI]);\n  finally\n    lBasenames.Free;\n  end;\nend;\n\nprocedure RecorderMeraListThermocoupleScales(AItems: TStrings);\nvar\n  lFiles: TStringList;\n  lI: Integer;\n  lName: string;\nbegin\n  if AItems = nil then\n    Exit;\n  lFiles := TStringList.Create;\n  try\n    if RecorderMeraResolveThermocoupleLocation then\n      RecorderMeraCollectScalesInDir(MeraCachedThermocoupleDir, lFiles);\n    if lFiles.Count = 0 then\n      RecorderSdbListScaleKeys(RecorderMeraThermocoupleFolderKey, lFiles);\n    for lI := 0 to lFiles.Count - 1 do\n    begin\n      { Directory collection already returns extensionless scale keys. Names\n        such as K_ГОСТ Р 8.585-2001 contain significant dots. }\n      lName := RecorderMeraThermocoupleDisplayName(lFiles[lI]);\n      if lName = '' then\n        Continue;\n      if SameText(lName, 'Термопары') or SameText(lName, 'Thermocouples') then\n        Continue;\n      if AItems.IndexOf(lName) >= 0 then\n        Continue;\n      AItems.Add(lName);\n    end;\n  finally\n    lFiles.Free;\n  end;\nend;\n\nfunction RecorderMeraThermocoupleRelativePath(const ADisplayName: string): string;\nbegin\n  Result := RecorderMeraThermocoupleFolderKey + PathDelim + ADisplayName;\nend;\n\nfunction RecorderMeraThermocoupleScaleKeyExists(const AKey: string): Boolean;\nvar\n  lInfo: TSdbScaleInfo;\nbegin\n  Result := (Trim(AKey) <> '') and RecorderSdbTryLoadScale(AKey, lInfo);\nend;\n\nfunction RecorderMeraFindThermocoupleScaleByPrefix(const AName: string): string;\nvar\n  lBestBase: string;\n  lBestKey: string;\n  lBestLen: Integer;\n  lDiskDir: string;\n  lName: string;\n  SR: TSearchRec;\nbegin\n  Result := '';\n  lName := Trim(AName);\n  if lName = '' then\n    Exit;\n  if not RecorderMeraResolveThermocoupleLocation then\n    Exit;\n  lDiskDir := IncludeTrailingPathDelimiter(MeraCachedThermocoupleDir);\n  lBestKey := '';\n  lBestLen := -1;\n  if FindFirstUTF8(lDiskDir + '*.xml', faAnyFile, SR) = 0 then\n  try\n    repeat\n      if (SR.Attr and faDirectory) <> 0 then\n        Continue;\n      lBestBase := ChangeFileExt(SR.Name, '');\n      if not (FileExistsUTF8(lDiskDir + lBestBase + '.csv') or\n        FileExistsUTF8(lDiskDir + lBestBase + '.CSV')) then\n        Continue;\n      if SameText(lBestBase, lName) then\n        Exit(RecorderMeraThermocoupleRelativePath(lBestBase));\n      if StartsText(lBestBase, lName) or StartsText(lName, lBestBase) then\n      begin\n        if Length(lBestBase) > lBestLen then\n        begin\n          lBestLen := Length(lBestBase);\n          lBestKey := RecorderMeraThermocoupleRelativePath(lBestBase);\n        end;\n      end;\n    until FindNextUTF8(SR) <> 0;\n  finally\n    FindCloseUTF8(SR);\n  end;\n  Result := lBestKey;\nend;\n\nfunction RecorderMeraResolveThermocoupleScaleKey(const ARelativeScalePath,\n  ADisplayName: string): string;\nvar\n  lCandidates: array[0..2] of string;\n  lI: Integer;\n  lName: string;\n  lPath: string;\nbegin\n  lName := Trim(ADisplayName);\n  lPath := Trim(ARelativeScalePath);\n  lCandidates[0] := lPath;\n  if lName <> '' then\n    lCandidates[1] := RecorderMeraThermocoupleRelativePath(lName)\n  else\n    lCandidates[1] := '';\n  lCandidates[2] := '';\n  for lI := Low(lCandidates) to High(lCandidates) do\n    if RecorderMeraThermocoupleScaleKeyExists(lCandidates[lI]) then\n      Exit(lCandidates[lI]);\n  if lName <> '' then\n  begin\n    Result := RecorderMeraFindThermocoupleScaleByPrefix(lName);\n    if Result <> '' then\n      Exit;\n  end;\n  if lPath <> '' then\n    Exit(lPath);\n  if lName <> '' then\n    Result := RecorderMeraThermocoupleRelativePath(lName);\nend;\n\nfunction RecorderMeraLoadThermocoupleCalibration(const ARelativeScalePath,\n  ADisplayName: string; ACalibration: TRecorderCalibration): Boolean;\nvar\n  lCsvPath: string;\n  lKey: string;\nbegin\n  Result := False;\n  if ACalibration = nil then\n    Exit;\n  lKey := RecorderMeraResolveThermocoupleScaleKey(ARelativeScalePath, ADisplayName);\n  if lKey = '' then\n    Exit;\n  if RecorderSdbLoadScaleCalibration(lKey, ACalibration) then\n    Exit(True);\n  lCsvPath := RecorderMeraThermocoupleCsvPath(lKey);\n  Result := RecorderSdbLoadScaleCalibrationFromCsv(lCsvPath, lKey, ACalibration);\nend;\n\nend.\n", "sha256": "91ca7ac8261a8ff41cdc216d30e50fd1de0a97d7a7d5e5ddd428d2546a217ea2"}, "Device/mic185/uRecorderMic185Calibration.pas": {"text": "unit uRecorderMic185Calibration;\n\n{\n  MIC-183/185 hardware calibration reader.\n\n  Source of protocol information:\n    - windev-v3.9\\Mebius\\Include\\IoControlIds.h:\n      IOCTL_CMD_GET_CALIBR_KOEF, IOCTL_CMD_RELOAD_CALIBR.\n    - windev-v3.9\\examples\\mebius.daq\\mebius_daq_devices\\ms\\mic185\\mic185.cpp:\n      CMIC185::LoadCalibrCoefficients reads MIC185_CHANNEL_KX_FULL per channel.\n    - windev-v3.9\\Mebius\\MebiusDAQDevices\\mic183\\mic183base\\ComputePhysical.h:\n      MIC183_CHANNEL_KX is k,b and the linear evaluator is k * (x - b).\n}\n\n{$mode objfpc}{$H+}\n{$codepage UTF8}\n\ninterface\n\nuses\n  Classes, SysUtils,\n  uRecorderTags;\n\nfunction RecorderMic185DownloadHardwareCalibrationFromDevice(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  out AErrorMessage: string): Boolean;\n\nfunction RecorderMic185DownloadHardwareCalibrationFromDeviceEx(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  out AK, AB: Double; out ACalibrationName, AErrorMessage: string): Boolean;\n\nfunction RecorderMic185LoadHardwareCalibrationForTag(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  AEnableOnTag: Boolean = True): Boolean;\n\nfunction RecorderMic185ApplyCurrentCalibration(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  ANominalPowerMa: Double): Double;\n\n{ Model-only lookup: no serial resolution, CSV loading or device I/O. Missing\n  registered identity/current GX leaves the nominal current unchanged. }\nfunction RecorderMic185ApplyCachedCurrentCalibration(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  ANominalPowerMa: Double): Double;\n\nfunction RecorderMic185TryExtractHardwareKx(ACalibration: TRecorderCalibration;\n  out AK, AB: Double): Boolean;\n\nfunction RecorderMic185FormatHardwareKx(AK, AB: Double): string;\n\nfunction RecorderMic185HardwareCalibrationDisplayText(\n  ACalibration: TRecorderCalibration): string;\n{ Presence only: never loads a calibration, changes enable flags or contacts hardware. }\nfunction RecorderMic185HasHardwareCalibration(ARegistry: TRecorderTagRegistry;\n  ASerial: LongWord; ARangeIndex, AChannelNumber: Integer): Boolean;\n\nimplementation\n\nuses\n  Math, LazFileUtils,\n  uMic185Constants, uMic185MebiusTcpProtocol, uMic185MebiusTypes,\n  uMic185Device, uRecorderDeviceInterfaces, uRecorderMeraPaths,\n  uRecorderMic185DataSource,\n  uRecorderMic185Runtime;\n\nconst\n  { In original MIC183/185: four mV ranges plus one current/Ohm evaluator. }\n  CMic185HardwareRangeCount = 4;\n  CMic185HardwareEvalCount = 5;\n  { MIC185_CHANNEL_KX_FULL = 5*(k,b) + TC[4] + AdtTc[8], all Single. }\n  CMic185ChannelKxSize = SizeOf(Single) * 2;\n  CMic185ChannelKxFullSize = SizeOf(Single) * (CMic185HardwareEvalCount * 2 + 4 + 8);\n  CMic185HardwareCalibrSubDir = 'hardware' + PathDelim + 'MIC-185' + PathDelim;\n\nfunction Mic185NormalizeHardwareRangeIndex(ARangeIndex: Integer): Integer;\nbegin\n  Result := ARangeIndex;\n  if Result < 0 then\n    Result := CMic185Range500mV\n  else if Result >= CMic185HardwareRangeCount then\n    Result := CMic185HardwareRangeCount - 1;\nend;\n\nfunction RecorderMic185MakeHardwareCalibrationName(ASerial: LongWord;\n  ARangeIndex, AChannelNumber: Integer): string;\nbegin\n  ARangeIndex := Mic185NormalizeHardwareRangeIndex(ARangeIndex);\n  Result := Format('MIC185 sn%4.4d range%d ch%2.2d',\n    [ASerial, ARangeIndex + 1, AChannelNumber]);\nend;\n\nfunction RecorderMic185HardwareCalibrCsvPath(ASerial: LongWord;\n  ARangeIndex, AChannelNumber: Integer): string;\nbegin\n  Result := '';\n  if (ASerial = 0) or (AChannelNumber <= 0) then\n    Exit;\n  ARangeIndex := Mic185NormalizeHardwareRangeIndex(ARangeIndex);\n  Result := IncludeTrailingPathDelimiter(RecorderMeraCalibrRootDir) +\n    CMic185HardwareCalibrSubDir + Format('sn%4.4d', [ASerial]) +\n    PathDelim + Format('range%d', [ARangeIndex + 1]) + PathDelim +\n    Format('%2.2d.csv', [AChannelNumber]);\nend;\n\nfunction RecorderMic185CurrentCalibrCsvPath(ASerial: LongWord;\n  AChannelNumber: Integer): string;\nbegin\n  Result := '';\n  if (ASerial = 0) or (AChannelNumber <= 0) then\n    Exit;\n  Result := IncludeTrailingPathDelimiter(RecorderMeraCalibrRootDir) +\n    CMic185HardwareCalibrSubDir + Format('sn%4.4d', [ASerial]) +\n    PathDelim + 'current' + PathDelim + Format('%2.2d.csv', [AChannelNumber]);\nend;\n\nfunction RecorderMic185HasHardwareCalibration(ARegistry: TRecorderTagRegistry;\n  ASerial: LongWord; ARangeIndex, AChannelNumber: Integer): Boolean;\nbegin\n  if (ASerial = 0) or (AChannelNumber < 1) or\n    (AChannelNumber > CMic185ChannelCountMax) then Exit(False);\n  if (ARegistry <> nil) and (ARegistry.FindCalibrationByName(\n    RecorderMic185MakeHardwareCalibrationName(ASerial, ARangeIndex,\n      AChannelNumber)) <> nil) then Exit(True);\n  Result := FileExistsUTF8(RecorderMic185HardwareCalibrCsvPath(ASerial,\n    ARangeIndex, AChannelNumber));\nend;\n\nfunction RecorderMic185MakeCurrentCalibrationName(ASerial: LongWord;\n  AChannelNumber: Integer): string;\nbegin\n  Result := Format('MIC185 sn%4.4d current ch%2.2d',\n    [ASerial, AChannelNumber]);\nend;\n\nfunction Mic185ParseCsvNumber(const AText: string; out AValue: Double): Boolean;\nvar\n  lFS: TFormatSettings;\n  lText: string;\nbegin\n  lText := Trim(StringReplace(AText, ',', '.', [rfReplaceAll]));\n  lFS := DefaultFormatSettings;\n  lFS.DecimalSeparator := '.';\n  Result := TryStrToFloat(lText, AValue, lFS);\nend;\n\nfunction Mic185LoadCalibrationFromCsv(const AFileName, AName: string;\n  out AK, AB: Double; out ACalibration: TRecorderCalibration): Boolean;\nvar\n  I: Integer;\n  lLines: TStringList;\n  lParts: TStringList;\n  lX: Double;\n  lY: Double;\nbegin\n  Result := False;\n  AK := 0;\n  AB := 0;\n  ACalibration := nil;\n  if (Trim(AFileName) = '') or (not FileExistsUTF8(AFileName)) then\n    Exit;\n\n  ACalibration := TRecorderCalibration.Create(rckPiecewiseLinear);\n  lLines := TStringList.Create;\n  lParts := TStringList.Create;\n  try\n    ACalibration.Name := AName;\n    ACalibration.Description := 'MIC-185 hardware GX loaded from ' + AFileName;\n    ACalibration.UnitIn := 'codes';\n    ACalibration.UnitOut := 'mV';\n    ACalibration.Extrapolation := True;\n    lParts.StrictDelimiter := True;\n    lParts.Delimiter := ',';\n    lLines.LoadFromFile(AFileName);\n    for I := 0 to lLines.Count - 1 do\n    begin\n      if Trim(lLines[I]) = '' then\n        Continue;\n      lParts.DelimitedText := lLines[I];\n      if lParts.Count < 2 then\n        Continue;\n      if not Mic185ParseCsvNumber(lParts[0], lX) then\n        Continue;\n      if not Mic185ParseCsvNumber(lParts[1], lY) then\n        Continue;\n      ACalibration.AddPoint(lX, lY);\n    end;\n    Result := RecorderMic185TryExtractHardwareKx(ACalibration, AK, AB);\n    if not Result then\n      FreeAndNil(ACalibration);\n  finally\n    lParts.Free;\n    lLines.Free;\n  end;\nend;\n\nfunction Mic185SaveCalibrationToCsv(const AFileName: string;\n  ACalibration: TRecorderCalibration): Boolean;\nvar\n  lFS: TFormatSettings;\n  lI: Integer;\n  lLines: TStringList;\nbegin\n  Result := False;\n  if (ACalibration = nil) or (Trim(AFileName) = '') then\n    Exit;\n  ForceDirectories(ExtractFileDir(AFileName));\n  lLines := TStringList.Create;\n  try\n    lFS := DefaultFormatSettings;\n    lFS.DecimalSeparator := '.';\n    for lI := 0 to ACalibration.PointCount - 1 do\n      lLines.Add(Format('%.9g,%.9g',\n        [ACalibration.PointAt(lI).X, ACalibration.PointAt(lI).Y], lFS));\n    lLines.SaveToFile(AFileName);\n    Result := lLines.Count > 0;\n  finally\n    lLines.Free;\n  end;\nend;\n\nfunction Mic185TryParseCalibrationName(const AName: string; out ASerial: LongWord;\n  out ARangeIndex, AChannelNumber: Integer): Boolean;\nvar\n  lParts: TStringList;\n  lSerial: Integer;\nbegin\n  Result := False;\n  ASerial := 0;\n  ARangeIndex := -1;\n  AChannelNumber := 0;\n  lParts := TStringList.Create;\n  try\n    lParts.StrictDelimiter := True;\n    lParts.Delimiter := ' ';\n    lParts.DelimitedText := Trim(AName);\n    if lParts.Count <> 4 then\n      Exit;\n    if not SameText(lParts[0], 'MIC185') then\n      Exit;\n    if Pos('sn', LowerCase(lParts[1])) <> 1 then\n      Exit;\n    if Pos('range', LowerCase(lParts[2])) <> 1 then\n      Exit;\n    if Pos('ch', LowerCase(lParts[3])) <> 1 then\n      Exit;\n    if not TryStrToInt(Copy(lParts[1], 3, MaxInt), lSerial) then\n      Exit;\n    if not TryStrToInt(Copy(lParts[2], 6, MaxInt), ARangeIndex) then\n      Exit;\n    if not TryStrToInt(Copy(lParts[3], 3, MaxInt), AChannelNumber) then\n      Exit;\n    if (lSerial <= 0) or (ARangeIndex <= 0) or (AChannelNumber <= 0) then\n      Exit;\n    ASerial := LongWord(lSerial);\n    Dec(ARangeIndex);\n    Result := True;\n  finally\n    lParts.Free;\n  end;\nend;\n\nfunction Mic185ResolveSerialFromTag(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; out ASerial: LongWord): Boolean;\nvar\n  lAcquiring: Boolean;\n  lChannelNumber: Integer;\n  lErrorText: string;\n  lHost: string;\n  lKnownVersion: LongWord;\n  lPort: Word;\n  lRangeIndex: Integer;\n  lVersionText: string;\nbegin\n  Result := False;\n  ASerial := 0;\n  if (ATag <> nil) and Mic185TryParseCalibrationName(\n    ATag.HardwareCalibrationName, ASerial, lRangeIndex, lChannelNumber) then\n    Exit(True);\n  if (ATag = nil) or (not TryParseRecorderMic185SourceId(ATag.SourceId, lHost, lPort)) then\n    Exit;\n  if RecorderMic185GetKnownIdentity(ARegistry, ATag.SourceId, ASerial,\n    lKnownVersion) and (ASerial > 0) then\n    Exit(True);\n  if RecorderMic185TryGetLiveDeviceInfo(lHost, lPort, ASerial, lVersionText,\n    lAcquiring) and (ASerial > 0) then\n    Exit(True);\n  Result := RecorderMic185ReadDeviceInfo(lHost, lPort, ASerial, lVersionText,\n    lErrorText, 700) and (ASerial > 0);\nend;\n\nfunction RecorderMic185FormatHardwareKx(AK, AB: Double): string;\nbegin\n  Result := Format('k=%s; b=%s',\n    [FloatToStrF(AK, ffGeneral, 9, 6), FloatToStrF(AB, ffGeneral, 9, 6)]);\nend;\n\nfunction RecorderMic185TryExtractHardwareKx(ACalibration: TRecorderCalibration;\n  out AK, AB: Double): Boolean;\nvar\n  lPoint0: TRecorderCalibrationPoint;\n  lPoint1: TRecorderCalibrationPoint;\nbegin\n  Result := False;\n  AK := 0;\n  AB := 0;\n  if (ACalibration = nil) or (ACalibration.Kind <> rckPiecewiseLinear) or\n    (ACalibration.PointCount < 2) then\n    Exit;\n\n  lPoint0 := ACalibration.PointAt(0);\n  lPoint1 := ACalibration.PointAt(1);\n  if SameValue(lPoint0.X, lPoint1.X) then\n    Exit;\n\n  AK := (lPoint1.Y - lPoint0.Y) / (lPoint1.X - lPoint0.X);\n  if SameValue(AK, 0.0) then\n    Exit;\n\n  { The stored two-point curve is y = k * (code - b). }\n  AB := lPoint0.X - (lPoint0.Y / AK);\n  Result := True;\nend;\n\nfunction RecorderMic185HardwareCalibrationDisplayText(\n  ACalibration: TRecorderCalibration): string;\nvar\n  lB: Double;\n  lK: Double;\nbegin\n  if ACalibration = nil then\n    Exit('');\n  if RecorderMic185TryExtractHardwareKx(ACalibration, lK, lB) then\n    Result := RecorderMic185FormatHardwareKx(lK, lB)\n  else\n    Result := ACalibration.Name;\nend;\n\nfunction Mic185SingleFromBytes(const AData: TRecorderByteArray;\n  AOffset: Integer): Single;\nbegin\n  Result := 0;\n  if (AOffset < 0) or (Length(AData) < AOffset + SizeOf(Result)) then\n    Exit;\n  Move(AData[AOffset], Result, SizeOf(Result));\nend;\n\nfunction Mic185MakeChannelQuery(AChannelIndex: Integer): TRecorderByteArray;\nbegin\n  Result := nil;\n  SetLength(Result, 1);\n  Result[0] := Byte(AChannelIndex);\nend;\n\nfunction Mic185LinearKxToCalibration(const AName, AUnitIn, AUnitOut: string;\n  AK, AB: Double): TRecorderCalibration;\nvar\n  lX0: Double;\n  lX1: Double;\nbegin\n  Result := TRecorderCalibration.Create(rckPiecewiseLinear);\n  Result.Name := AName;\n  Result.Description := 'MIC-185 hardware GX: ' +\n    RecorderMic185FormatHardwareKx(AK, AB) + '; evaluator k*(code-b)';\n  Result.UnitIn := AUnitIn;\n  Result.UnitOut := AUnitOut;\n  Result.Extrapolation := True;\n  lX0 := 0.0;\n  lX1 := 1.0;\n  Result.AddPoint(lX0, AK * (lX0 - AB));\n  Result.AddPoint(lX1, AK * (lX1 - AB));\nend;\n\nfunction Mic185UpsertHardwareCalibration(ARegistry: TRecorderTagRegistry;\n  ASource: TRecorderCalibration): TRecorderCalibration; forward;\n\nfunction Mic185LoadCachedCalibration(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; ASerial: LongWord; ARangeIndex, AChannelIndex: Integer;\n  out AK, AB: Double; out ACalibrationName: string): Boolean;\nvar\n  lCalibration: TRecorderCalibration;\n  lCsvPath: string;\n  lExisting: TRecorderCalibration;\n  lName: string;\n  lStored: TRecorderCalibration;\nbegin\n  Result := False;\n  AK := 0;\n  AB := 0;\n  ACalibrationName := '';\n  if (ARegistry = nil) or (ATag = nil) or (ASerial = 0) or\n    (AChannelIndex < 0) then\n    Exit;\n\n  lName := RecorderMic185MakeHardwareCalibrationName(ASerial, ARangeIndex,\n    AChannelIndex + 1);\n  lExisting := ARegistry.FindCalibrationByName(lName);\n  if lExisting <> nil then\n  begin\n    RecorderMic185TryExtractHardwareKx(lExisting, AK, AB);\n    ACalibrationName := lName;\n    Exit(True);\n  end;\n\n  lCsvPath := RecorderMic185HardwareCalibrCsvPath(ASerial, ARangeIndex,\n    AChannelIndex + 1);\n  if not Mic185LoadCalibrationFromCsv(lCsvPath, lName, AK, AB, lCalibration) then\n    Exit;\n  try\n    lStored := Mic185UpsertHardwareCalibration(ARegistry, lCalibration);\n    if lStored = nil then\n      Exit;\n    ACalibrationName := lStored.Name;\n    Result := True;\n  finally\n    lCalibration.Free;\n  end;\nend;\n\nfunction Mic185LoadCachedCurrentCalibration(ARegistry: TRecorderTagRegistry;\n  ASerial: LongWord; AChannelIndex: Integer; out AK, AB: Double;\n  out ACalibration: TRecorderCalibration): Boolean;\nvar\n  lCsvPath: string;\n  lExisting: TRecorderCalibration;\n  lLoaded: TRecorderCalibration;\n  lName: string;\n  lStored: TRecorderCalibration;\nbegin\n  Result := False;\n  AK := 0;\n  AB := 0;\n  ACalibration := nil;\n  if (ARegistry = nil) or (ASerial = 0) or (AChannelIndex < 0) then\n    Exit;\n\n  lName := RecorderMic185MakeCurrentCalibrationName(ASerial,\n    AChannelIndex + 1);\n  lExisting := ARegistry.FindCalibrationByName(lName);\n  if lExisting <> nil then\n  begin\n    Result := RecorderMic185TryExtractHardwareKx(lExisting, AK, AB);\n    ACalibration := lExisting;\n    Exit;\n  end;\n\n  lCsvPath := RecorderMic185CurrentCalibrCsvPath(ASerial, AChannelIndex + 1);\n  if not Mic185LoadCalibrationFromCsv(lCsvPath, lName, AK, AB, lLoaded) then\n    Exit;\n  try\n    lStored := Mic185UpsertHardwareCalibration(ARegistry, lLoaded);\n    Result := lStored <> nil;\n    if Result then\n      ACalibration := lStored;\n  finally\n    lLoaded.Free;\n  end;\nend;\n\nfunction Mic185UpsertHardwareCalibration(ARegistry: TRecorderTagRegistry;\n  ASource: TRecorderCalibration): TRecorderCalibration;\nvar\n  lExisting: TRecorderCalibration;\nbegin\n  Result := nil;\n  if (ARegistry = nil) or (ASource = nil) or (Trim(ASource.Name) = '') then\n    Exit;\n\n  lExisting := ARegistry.FindCalibrationByName(ASource.Name);\n  if lExisting = nil then\n  begin\n    Result := TRecorderCalibration.Create(rckPiecewiseLinear);\n    Result.Assign(ASource);\n    ARegistry.Calibrations.Add(Result);\n    Exit;\n  end;\n\n  lExisting.Assign(ASource);\n  Result := lExisting;\nend;\n\nfunction Mic185ReadChannelRangeKx(AClient: TRecorderMebiusTcpClient;\n  AChannelIndex, ARangeIndex: Integer; out AK, AB, ACurrentK,\n  ACurrentB: Double;\n  out AErrorMessage: string): Boolean;\nvar\n  lIn: TRecorderByteArray;\n  lOut: TRecorderByteArray;\n  lOffset: Integer;\nbegin\n  Result := False;\n  AK := 0;\n  AB := 0;\n  ACurrentK := 0;\n  ACurrentB := 0;\n  if ARangeIndex < 0 then\n    ARangeIndex := 0;\n  if ARangeIndex >= CMic185HardwareRangeCount then\n    ARangeIndex := CMic185HardwareRangeCount - 1;\n\n  lIn := Mic185MakeChannelQuery(AChannelIndex);\n  if not AClient.TryCallCommand(CMic185IoCtlCmdGetCalibrKoef, lIn,\n    CMic185ChannelKxFullSize, lOut, AErrorMessage) then\n    Exit;\n\n  if Length(lOut) < CMic185ChannelKxFullSize then\n  begin\n    AErrorMessage := 'MIC-185 calibration reply is shorter than expected';\n    Exit;\n  end;\n\n  lOffset := ARangeIndex * CMic185ChannelKxSize;\n  AK := Mic185SingleFromBytes(lOut, lOffset);\n  AB := Mic185SingleFromBytes(lOut, lOffset + SizeOf(Single));\n  lOffset := CMic185HardwareRangeCount * CMic185ChannelKxSize;\n  ACurrentK := Mic185SingleFromBytes(lOut, lOffset);\n  ACurrentB := Mic185SingleFromBytes(lOut, lOffset + SizeOf(Single));\n  if (AK <> AK) or (AB <> AB) or (Abs(AK) > 1E20) or (Abs(AB) > 1E20) then\n  begin\n    AErrorMessage := 'MIC-185 calibration reply contains invalid k,b values';\n    Exit;\n  end;\n  if (ACurrentK <> ACurrentK) or (ACurrentB <> ACurrentB) or\n    (Abs(ACurrentK) > 1E20) or (Abs(ACurrentB) > 1E20) then\n  begin\n    ACurrentK := 0;\n    ACurrentB := 0;\n  end;\n\n  Result := True;\nend;\n\nfunction Mic185ReadSerialFromConnectedClient(AClient: TRecorderMebiusTcpClient;\n  const AHost: string; APort: Word; out ASerial: LongWord): Boolean;\nvar\n  lError: string;\n  lInfo: TMic185HardDeviceInfo;\n  lOut: TRecorderByteArray;\nbegin\n  Result := False;\n  ASerial := 0;\n  if AClient = nil then\n    Exit;\n  if not AClient.TryCallCommand(CMic185IoCtlCmdGetSoftVersion, nil,\n    CMic185HardDeviceInfoSize, lOut, lError) then\n  begin\n    RecorderMic185Log(Format('Hardware GX serial read failed %s:%d: %s',\n      [AHost, APort, lError]));\n    Exit;\n  end;\n  if Length(lOut) < CMic185HardDeviceInfoSize then\n  begin\n    RecorderMic185Log(Format('Hardware GX serial read short reply %s:%d: %d bytes',\n      [AHost, APort, Length(lOut)]));\n    Exit;\n  end;\n  FillChar(lInfo, SizeOf(lInfo), 0);\n  Move(lOut[0], lInfo, SizeOf(lInfo));\n  ASerial := lInfo.SerialNumber;\n  Result := ASerial <> 0;\n  if Result then\n    RecorderMic185RuntimeUpdateInfo(AHost, APort, ASerial, lInfo.SoftVersion);\nend;\n\nfunction RecorderMic185DownloadHardwareCalibrationFromDevice(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  out AErrorMessage: string): Boolean;\nvar\n  lB: Double;\n  lCalibrationName: string;\n  lK: Double;\nbegin\n  Result := RecorderMic185DownloadHardwareCalibrationFromDeviceEx(ARegistry,\n    ATag, lK, lB, lCalibrationName, AErrorMessage);\nend;\n\nfunction RecorderMic185DownloadHardwareCalibrationFromDeviceEx(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  out AK, AB: Double; out ACalibrationName, AErrorMessage: string): Boolean;\nvar\n  lCalibration: TRecorderCalibration;\n  lChannelIndex: Integer;\n  lClient: TRecorderMebiusTcpClient;\n  lCurrentB: Double;\n  lCurrentCalibration: TRecorderCalibration;\n  lCurrentK: Double;\n  lHost: string;\n  lLiveDevice: TRecorderMic185Device;\n  lName: string;\n  lPort: Word;\n  lSerial: LongWord;\n  lSettings: TMic185ChannelProgramSettings;\n  lStored: TRecorderCalibration;\n  lCsvPath: string;\nbegin\n  Result := False;\n  AK := 0;\n  AB := 0;\n  ACalibrationName := '';\n  AErrorMessage := '';\n  if (ARegistry = nil) or (ATag = nil) then\n  begin\n    AErrorMessage := 'MIC-185 tag registry is not available';\n    Exit;\n  end;\n  if not TryParseRecorderMic185SourceId(ATag.SourceId, lHost, lPort) then\n  begin\n    AErrorMessage := 'Tag is not linked to a MIC-185 source';\n    Exit;\n  end;\n  lChannelIndex := RecorderMic185ChannelAddressToIndex(ATag.Address);\n  if (lChannelIndex < 0) or (lChannelIndex >= CMic185ChannelCountMax) then\n  begin\n    AErrorMessage := 'Tag address is not a MIC-185 measurement channel';\n    Exit;\n  end;\n\n  RecorderMic185GetSourceChannelMode(ARegistry, ATag.SourceId, ATag.Address,\n    ATag.PollFrequencyHz, lSettings);\n\n  if Mic185ResolveSerialFromTag(ARegistry, ATag, lSerial) and\n    Mic185LoadCachedCalibration(ARegistry, ATag, lSerial, lSettings.MeasRangeIndex,\n      lChannelIndex, AK, AB, ACalibrationName) then\n  begin\n    if Mic185LoadCachedCurrentCalibration(ARegistry, lSerial, lChannelIndex,\n      lCurrentK, lCurrentB, lCurrentCalibration) then\n    begin\n      ATag.HardwareCalibrationName := ACalibrationName;\n      ATag.HardwareCalibrationEnabled := True;\n      Exit(True);\n    end;\n  end;\n\n  { Match the original working-channel path: CMIC185::LoadCalibrCoefficients\n    reads the currently loaded evaluator with GET_CALIBR_KOEF. RELOAD_CALIBR\n    is intentionally not called here because its flash fileType is a separate\n    device setting and changing it from the tag dialog would alter OMAP state. }\n  lLiveDevice := RecorderMic185FindLiveDevice(lHost, lPort);\n  if lLiveDevice <> nil then\n  begin\n    if not lLiveDevice.TryReadChannelRangeKx(lChannelIndex,\n      lSettings.MeasRangeIndex, AK, AB, lCurrentK, lCurrentB,\n      AErrorMessage) then\n      Exit;\n    if lSerial = 0 then\n      lSerial := lLiveDevice.DeviceSerial;\n    RecorderMic185Log(Format('Hardware GX read via live MIC-185 session %s:%d ch=%d',\n      [lHost, lPort, lChannelIndex + 1]));\n  end\n  else\n  begin\n    if RecorderMic185RuntimeIsBusy(lHost, lPort) then\n    begin\n      AErrorMessage :=\n        'MIC183/185 endpoint is busy by active RecorderLnx session';\n      Exit;\n    end;\n    lClient := TRecorderMebiusTcpClient.Create(lHost, lPort,\n      CRecorderDeviceCommandTimeoutMs);\n    try\n      if not lClient.TryConnect(AErrorMessage) then\n        Exit;\n\n      if not Mic185ReadChannelRangeKx(lClient, lChannelIndex,\n        lSettings.MeasRangeIndex, AK, AB, lCurrentK, lCurrentB,\n        AErrorMessage) then\n        Exit;\n      if lSerial = 0 then\n        Mic185ReadSerialFromConnectedClient(lClient, lHost, lPort, lSerial);\n    finally\n      lClient.Free;\n    end;\n  end;\n\n  if lSerial = 0 then\n    Mic185ResolveSerialFromTag(ARegistry, ATag, lSerial);\n  if lSerial > 0 then\n    lName := RecorderMic185MakeHardwareCalibrationName(lSerial,\n      lSettings.MeasRangeIndex, lChannelIndex + 1)\n  else\n    lName := Format('MIC185 %s ch%2.2d range%d',\n      [ATag.SourceId, lChannelIndex + 1, lSettings.MeasRangeIndex]);\n  lCalibration := Mic185LinearKxToCalibration(lName, 'codes', 'mV', AK, AB);\n  try\n    if lSerial > 0 then\n    begin\n      lCsvPath := RecorderMic185HardwareCalibrCsvPath(lSerial,\n        lSettings.MeasRangeIndex, lChannelIndex + 1);\n      Mic185SaveCalibrationToCsv(lCsvPath, lCalibration);\n      if not SameValue(lCurrentK, 0.0) then\n      begin\n        lCurrentCalibration := Mic185LinearKxToCalibration(\n          RecorderMic185MakeCurrentCalibrationName(lSerial, lChannelIndex + 1),\n          'mA', 'mA', lCurrentK, lCurrentB);\n        try\n          lCsvPath := RecorderMic185CurrentCalibrCsvPath(lSerial,\n            lChannelIndex + 1);\n          Mic185SaveCalibrationToCsv(lCsvPath, lCurrentCalibration);\n          Mic185UpsertHardwareCalibration(ARegistry, lCurrentCalibration);\n        finally\n          lCurrentCalibration.Free;\n        end;\n      end;\n    end;\n    if lSerial = 0 then\n      RecorderMic185Log(Format(\n        'Hardware GX cache skipped for %s %s: serial number is unknown',\n        [ATag.SourceId, ATag.Address]));\n    lStored := Mic185UpsertHardwareCalibration(ARegistry, lCalibration);\n    if lStored = nil then\n    begin\n      AErrorMessage := 'Failed to register MIC-185 hardware calibration';\n      Exit;\n    end;\n\n    ATag.HardwareCalibrationName := lStored.Name;\n    ATag.HardwareCalibrationEnabled := True;\n    ACalibrationName := lStored.Name;\n    Result := True;\n  finally\n    lCalibration.Free;\n  end;\nend;\n\nfunction RecorderMic185ApplyCachedCurrentCalibration(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  ANominalPowerMa: Double): Double;\nvar\n  lCalibration: TRecorderCalibration;\n  lChannelIndex, lChannelNumber, lRangeIndex: Integer;\n  lSerial: LongWord;\nbegin\n  Result := ANominalPowerMa;\n  if (ARegistry = nil) or (ATag = nil) or SameValue(ANominalPowerMa, 0.0) then\n    Exit;\n  lChannelIndex := RecorderMic185ChannelAddressToIndex(ATag.Address);\n  if (lChannelIndex < 0) or\n    not Mic185TryParseCalibrationName(ATag.HardwareCalibrationName, lSerial,\n      lRangeIndex, lChannelNumber) then Exit;\n  lCalibration := ARegistry.FindCalibrationByName(\n    RecorderMic185MakeCurrentCalibrationName(lSerial, lChannelIndex + 1));\n  if lCalibration = nil then Exit;\n  Result := lCalibration.Transform(ANominalPowerMa);\n  if SameValue(Result, 0.0, 1E-9) or (Result <> Result) then\n    Result := ANominalPowerMa;\nend;\n\nfunction RecorderMic185ApplyCurrentCalibration(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  ANominalPowerMa: Double): Double;\nvar\n  lB: Double;\n  lCalibration: TRecorderCalibration;\n  lChannelIndex: Integer;\n  lChannelNumber: Integer;\n  lK: Double;\n  lRangeIndex: Integer;\n  lSerial: LongWord;\nbegin\n  Result := ANominalPowerMa;\n  if (ARegistry = nil) or (ATag = nil) or SameValue(ANominalPowerMa, 0.0) then\n    Exit;\n  lChannelIndex := RecorderMic185ChannelAddressToIndex(ATag.Address);\n  if lChannelIndex < 0 then\n    Exit;\n  if not Mic185TryParseCalibrationName(ATag.HardwareCalibrationName, lSerial,\n    lRangeIndex, lChannelNumber) then\n    if not Mic185ResolveSerialFromTag(ARegistry, ATag, lSerial) then\n      Exit;\n  if not Mic185LoadCachedCurrentCalibration(ARegistry, lSerial, lChannelIndex,\n    lK, lB, lCalibration) then\n    Exit;\n  Result := lCalibration.Transform(ANominalPowerMa);\n  if SameValue(Result, 0.0, 1E-9) or (Result <> Result) then\n    Result := ANominalPowerMa;\nend;\n\nfunction RecorderMic185LoadHardwareCalibrationForTag(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n  AEnableOnTag: Boolean): Boolean;\nvar\n  lB: Double;\n  lCalibrationName: string;\n  lChannelIndex: Integer;\n  lChannelNumber: Integer;\n  lCsvPath: string;\n  lK: Double;\n  lOldCalibrationName: string;\n  lRangeIndex: Integer;\n  lNameRangeIndex: Integer;\n  lSerial: LongWord;\n  lSettings: TMic185ChannelProgramSettings;\nbegin\n  Result := False;\n  if (ARegistry = nil) or (ATag = nil) or\n    (not (Pos('MIC-185:', ATag.SourceId) = 1)) then\n    Exit;\n  lChannelIndex := RecorderMic185ChannelAddressToIndex(ATag.Address);\n  if lChannelIndex < 0 then\n  begin\n    RecorderMic185Log(Format(\n      'Hardware GX cache miss tag=\"%s\" addr=\"%s\" source=\"%s\": invalid MIC185 channel address',\n      [ATag.Name, ATag.Address, ATag.SourceId]));\n    Exit;\n  end;\n  RecorderMic185GetSourceChannelMode(ARegistry, ATag.SourceId, ATag.Address,\n    ATag.PollFrequencyHz, lSettings);\n  if Trim(ATag.SourceValueMode) <> '' then\n    RecorderMic185ReadChannelMode(ATag.SourceValueMode, ATag.PollFrequencyHz,\n      lSettings);\n  lRangeIndex := Mic185NormalizeHardwareRangeInde
