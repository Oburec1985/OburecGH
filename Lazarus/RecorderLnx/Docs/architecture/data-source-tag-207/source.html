d := AValue;\n  InvalidateCalibrationScale;\nend;\n\nfunction TRecorderTagRegistry.FindByName(const AName: string): TRecorderTag;\nvar\n  I: Integer;\nbegin\n  Result := nil;\n  for I := 0 to fTags.Count - 1 do\n    if SameText(GetTag(I).Name, AName) then\n      Exit(GetTag(I));\n  I := fLoadedTagNameAliases.IndexOf(AName);\n  if I >= 0 then\n    Result := TRecorderTag(fLoadedTagNameAliases.Objects[I]);\nend;\n\nprocedure TRecorderTagRegistry.RegisterLoadedTagAlias(\n  AOldId: TRecorderTagId; const AOldName: string; ATarget: TRecorderTag);\nvar\n  lIndex: Integer;\n  lIdText: string;\n  lName: string;\nbegin\n  if not ContainsTag(ATarget) then\n    raise ERecorderTagError.Create('Loaded tag alias target is not registered');\n\n  if AOldId <> ATarget.Id then\n  begin\n    lIdText := IntToStr(AOldId);\n    lIndex := fLoadedTagIdAliases.IndexOf(lIdText);\n    if lIndex < 0 then\n      fLoadedTagIdAliases.AddObject(lIdText, ATarget)\n    else\n      fLoadedTagIdAliases.Objects[lIndex] := ATarget;\n  end;\n\n  lName := Trim(AOldName);\n  if (lName <> '') and not SameText(lName, ATarget.Name) then\n  begin\n    lIndex := fLoadedTagNameAliases.IndexOf(lName);\n    if lIndex < 0 then\n      fLoadedTagNameAliases.AddObject(lName, ATarget)\n    else\n      fLoadedTagNameAliases.Objects[lIndex] := ATarget;\n  end;\nend;\n\nfunction TRecorderTagRegistry.ContainsTag(ATag: TRecorderTag): Boolean;\nbegin\n  Result := (ATag <> nil) and (fTags.IndexOf(ATag) >= 0);\nend;\n\n\nfunction TRecorderTagRegistry.RenameTag(ATag: TRecorderTag; const ANewName: string): Boolean;\nvar\n  lExisting: TRecorderTag;\n  lNewName: string;\nbegin\n  Result := False;\n  if ATag = nil then\n    Exit;\n  lNewName := Trim(ANewName);\n  if lNewName = '' then\n    Exit;\n  if SameText(lNewName, ATag.Name) then\n    Exit(True);\n  lExisting := FindByName(lNewName);\n  if (lExisting <> nil) and (lExisting <> ATag) then\n    raise ERecorderTagError.Create('Tag name already exists: ' + lNewName);\n  if SameText(fSelectedTagName, ATag.Name) then\n    fSelectedTagName := lNewName;\n  ATag.Name := lNewName;\n  Result := True;\nend;\n\n\nfunction TRecorderTagRegistry.FindCalibrationByName(const AName: string): TRecorderCalibration;\nvar\n  I: Integer;\nbegin\n  Result := nil;\n  for I := 0 to fCalibrations.Count - 1 do\n    if (fCalibrations[I] <> nil) and SameText(fCalibrations[I].Name, AName) then\n      Exit(fCalibrations[I]);\nend;\n\nfunction TRecorderTagRegistry.FindCalibrationBySdbKey(\n  const AKey: string): TRecorderCalibration;\nvar\n  I: Integer;\n  lKey: string;\nbegin\n  Result := nil;\n  lKey := Trim(AKey);\n  if lKey = '' then\n    Exit;\n  for I := 0 to fCalibrations.Count - 1 do\n    if (fCalibrations[I] <> nil) and\n      SameText(Trim(fCalibrations[I].SdbKey), lKey) then\n      Exit(fCalibrations[I]);\nend;\n\nfunction TRecorderTagRegistry.RemoveUnusedCalibrations: Integer;\nvar\n  I: Integer;\n  J: Integer;\n  lName: string;\n  lReferencedNames: TStringList;\n  lTag: TRecorderTag;\nbegin\n  Result := 0;\n  lReferencedNames := TStringList.Create;\n  try\n    lReferencedNames.CaseSensitive := False;\n    lReferencedNames.Sorted := True;\n    lReferencedNames.Duplicates := dupIgnore;\n    for I := 0 to TagCount - 1 do\n    begin\n      lTag := Tags[I];\n      if lTag = nil then\n        Continue;\n      lName := Trim(lTag.HardwareCalibrationName);\n      if lName <> '' then\n        lReferencedNames.Add(lName);\n      if lTag.CalibrationNames = nil then\n        Continue;\n      for J := 0 to lTag.CalibrationNames.Count - 1 do\n      begin\n        lName := Trim(lTag.CalibrationNames[J]);\n        if lName <> '' then\n          lReferencedNames.Add(lName);\n      end;\n    end;\n\n    for I := fCalibrations.Count - 1 downto 0 do\n      if (fCalibrations[I] = nil) or\n        (lReferencedNames.IndexOf(Trim(fCalibrations[I].Name)) < 0) then\n      begin\n        fCalibrations.Delete(I);\n        Inc(Result);\n      end;\n  finally\n    lReferencedNames.Free;\n  end;\nend;\n\nfunction TRecorderTagRegistry.CommitCalibrationEdit(ATarget,\n  ADraft: TRecorderCalibration): Boolean;\nvar\n  I: Integer;\n  J: Integer;\n  lExisting: TRecorderCalibration;\n  lNewName: string;\n  lOldName: string;\n  lSdbKey: string;\n  lSourceFileName: string;\n  lTag: TRecorderTag;\nbegin\n  Result := False;\n  if (ATarget = nil) or (ADraft = nil) then\n    Exit;\n  lOldName := Trim(ATarget.Name);\n  lSdbKey := ATarget.SdbKey;\n  lSourceFileName := ATarget.SourceFileName;\n  lNewName := Trim(ADraft.Name);\n  if lNewName = '' then\n    raise ERecorderTagError.Create('Calibration name cannot be empty');\n  lExisting := FindCalibrationByName(lNewName);\n  if (lExisting <> nil) and (lExisting <> ATarget) then\n    raise ERecorderTagError.Create('Calibration name already exists: ' + lNewName);\n\n  ATarget.Assign(ADraft);\n  { A linked calibration remains the same source object after an in-place\n    edit.  Explicit copy creation is the operation that clears this link. }\n  if (ATarget.SdbKey = '') and (lSdbKey <> '') then\n    ATarget.SdbKey := lSdbKey;\n  if (ATarget.SourceFileName = '') and (lSourceFileName <> '') then\n    ATarget.SourceFileName := lSourceFileName;\n  ATarget.Name := lNewName;\n\n  for I := 0 to TagCount - 1 do\n  begin\n    lTag := Tags[I];\n    if lTag = nil then\n      Continue;\n    lTag.InvalidateCalibrationScale;\n    for J := 0 to lTag.CalibrationNames.Count - 1 do\n      if SameText(lTag.CalibrationNames[J], lOldName) then\n        lTag.CalibrationNames[J] := lNewName;\n    if SameText(lTag.HardwareCalibrationName, lOldName) then\n      lTag.HardwareCalibrationName := lNewName;\n    RebuildScales(lTag);\n  end;\n  Result := True;\nend;\n\nfunction TRecorderTagRegistry.AddCalibrationCopyForTag(ATag: TRecorderTag;\n  APipelineIndex: Integer; ADraft: TRecorderCalibration): TRecorderCalibration;\nvar\n  lBaseName: string;\n  lName: string;\n  lNumber: Integer;\nbegin\n  Result := nil;\n  if (ATag = nil) or (ADraft = nil) or\n    (APipelineIndex < 0) or (APipelineIndex >= ATag.CalibrationNames.Count) then\n    Exit;\n  lBaseName := Trim(ADraft.Name);\n  if lBaseName = '' then\n    lBaseName := Trim(ATag.CalibrationNames[APipelineIndex]);\n  if lBaseName = '' then\n    lBaseName := 'ГХ';\n  lName := lBaseName;\n  lNumber := 2;\n  while FindCalibrationByName(lName) <> nil do\n  begin\n    lName := lBaseName + ' (копия ' + IntToStr(lNumber) + ')';\n    Inc(lNumber);\n  end;\n\n  Result := ADraft.Clone;\n  Result.SdbKey := '';\n  Result.Name := lName;\n  fCalibrations.Add(Result);\n  ATag.CalibrationNames[APipelineIndex] := lName;\nend;\n\nfunction TRecorderTagRegistry.FindTagHardwareCalibration(\n  ATag: TRecorderTag): TRecorderCalibration;\nbegin\n  Result := nil;\n  if ATag = nil then\n    Exit;\n  if ATag.HardwareCalibrationEnabled and (Trim(ATag.HardwareCalibrationName) <> '') then\n    Result := FindCalibrationByName(ATag.HardwareCalibrationName);\nend;\n\nfunction TRecorderTagRegistry.TryGetTagAutoUnit(ATag: TRecorderTag;\n  out AUnitName: string): Boolean;\nvar\n  lCalibration: TRecorderCalibration;\nbegin\n  AUnitName := '';\n  Result := False;\n  if ATag = nil then\n    Exit;\n  lCalibration := ATag.GetLastScale;\n  if (lCalibration <> nil) and (Trim(lCalibration.UnitOut) <> '') then\n  begin\n    AUnitName := lCalibration.GetUnits;\n    Exit(True);\n  end;\n  if ATag.SourceHardwareOutputUnitName <> '' then\n  begin\n    if ATag.HardwareCalibrationEnabled then\n      AUnitName := ATag.SourceHardwareOutputUnitName\n    else AUnitName := 'code';\n    Exit(True);\n  end;\n  lCalibration := FindTagHardwareCalibration(ATag);\n  if (lCalibration <> nil) and (Trim(lCalibration.UnitOut) <> '') then\n  begin\n    AUnitName := lCalibration.GetUnits;\n    Result := True;\n  end;\nend;\n\nprocedure TRecorderTagRegistry.SyncTagAutoUnit(ATag: TRecorderTag;\n  AForce: Boolean);\nvar\n  lUnitName: string;\nbegin\n  if (ATag = nil) or not (ATag.AutoUnit or AForce) then\n    Exit;\n  if TryGetTagAutoUnit(ATag, lUnitName) then\n    ATag.fUnitName := lUnitName\n  else\n    ATag.fUnitName := Trim(ATag.fSourceUnitName);\n  ATag.InvalidateCalibrationScale;\nend;\n\nprocedure TRecorderTagRegistry.RebuildSourceScales(ATag: TRecorderTag);\nvar\n  I: Integer;\n  lCalibration: TRecorderCalibration;\n  lUnit, lResultUnit: string;\n  lFactor: Double;\nbegin\n  { Cold preparation only. Runtime follows direct calibration pointers and\n    numeric conversion factors; no source/provider or calibration-name lookup. }\n  ATag.fSourceStepCount := 0;\n  ATag.fSourceTransformError := '';\n  ATag.ClearCalibrationWarning;\n  ATag.fResultScale := 1;\n  ATag.fSourceFinalScale := 1;\n  ATag.fCalibrationScaleLinear := True;\n  if ATag.HardwareCalibrationEnabled then\n    lUnit := ATag.SourceHardwareOutputUnitName\n  else lUnit := 'code';\n  SetLength(ATag.fSourceSteps, ATag.CalibrationNames.Count);\n  if ATag.ChannelCalibrationEnabled then\n    for I := 0 to ATag.CalibrationNames.Count - 1 do\n    begin\n      if not RecorderCalibrationStepEnabled(ATag.CalibrationNames, I) then Continue;\n      lCalibration := FindCalibrationByName(ATag.CalibrationNames[I]);\n      if lCalibration = nil then\n      begin\n        ATag.fSourceTransformError := 'Calibration not found: ' + ATag.CalibrationNames[I];\n        Break;\n      end;\n      lFactor := 1;\n      if (Trim(lCalibration.UnitIn) <> '') and\n        not SameText(lUnit, lCalibration.UnitIn) and\n        not RecorderUnitManager.TryGetConversionFactor(lUnit, lCalibration.UnitIn, lFactor) then\n      begin\n        ATag.AddCalibrationWarning('Incompatible calibration units: ' +\n          lUnit + ' -> ' + lCalibration.UnitIn);\n        lFactor := 1;\n      end;\n      ATag.fSourceSteps[ATag.fSourceStepCount].Calibration := lCalibration;\n      ATag.fSourceSteps[ATag.fSourceStepCount].InputScale := lFactor;\n      Inc(ATag.fSourceStepCount);\n      if lCalibration.Kind = rckScale then\n        ATag.fResultScale := ATag.fResultScale * lFactor * lCalibration.Scale\n      else ATag.fCalibrationScaleLinear := False;\n      if Trim(lCalibration.UnitOut) <> '' then lUnit := Trim(lCalibration.UnitOut);\n    end;\n  lResultUnit := lUnit;\n  if ATag.AutoUnit then\n    ATag.fUnitName := lResultUnit\n  else if (Trim(ATag.UnitName) <> '') and not SameText(lResultUnit, ATag.UnitName) then\n  begin\n    lFactor := 1;\n    if RecorderUnitManager.TryGetConversionFactor(lResultUnit, ATag.UnitName, lFactor) then\n    begin\n      ATag.fSourceFinalScale := lFactor;\n      ATag.fResultScale := ATag.fResultScale * lFactor;\n    end\n    else\n    begin\n      ATag.AddCalibrationWarning('Incompatible output units: ' + lResultUnit +\n        ' -> ' + ATag.UnitName);\n      ATag.fUnitName := lResultUnit;\n    end;\n  end;\n  ATag.fCalibrationScaleBuilt := True;\nend;\n\nprocedure TRecorderTagRegistry.ValidateTagSourceOutput(ATag: TRecorderTag);\nbegin\n  if ATag = nil then Exit;\n  RebuildScales(ATag);\n  if ATag.fSourceTransformError <> '' then\n    raise ERecorderTagError.Create(ATag.fSourceTransformError);\nend;\n\nfunction TRecorderTagRegistry.TransformTagSourceOutput(ATag: TRecorderTag;\n  AValue: Double): Double;\nvar\n  I: Integer;\nbegin\n  if ATag = nil then Exit(AValue);\n  RebuildScales(ATag);\n  if ATag.SourceHardwareOutputUnitName = '' then\n    raise ERecorderTagError.Create('Source hardware-stage boundary is not configured');\n  if ATag.fSourceTransformError <> '' then\n    raise ERecorderTagError.Create(ATag.fSourceTransformError);\n  if ATag.fCalibrationScaleLinear and not CalibrationCaptureActive(ATag) then\n    Exit(AValue * ATag.fResultScale);\n  Result := AValue;\n  CaptureCalibrationValue(ATag, Result);\n  for I := 0 to ATag.fSourceStepCount - 1 do\n    Result := ATag.fSourceSteps[I].Calibration.Transform(\n      Result * ATag.fSourceSteps[I].InputScale);\n  Result := Result * ATag.fSourceFinalScale;\nend;\n\nprocedure TRecorderTagRegistry.TransformTagSourceBlock(ATag: TRecorderTag;\n  var AValues: TRecorderDoubleArray; ACount: Integer);\nvar\n  I: Integer;\nbegin\n  if (ATag = nil) or (ACount < 0) or (ACount > Length(AValues)) then\n    raise ERecorderTagError.Create('Invalid source output block');\n  RebuildScales(ATag);\n  if ATag.SourceHardwareOutputUnitName = '' then\n    raise ERecorderTagError.Create('Source hardware-stage boundary is not configured');\n  if ATag.fSourceTransformError <> '' then\n    raise ERecorderTagError.Create(ATag.fSourceTransformError);\n  if ATag.fCalibrationScaleLinear and not CalibrationCaptureActive(ATag) then\n    for I := 0 to ACount - 1 do AValues[I] := AValues[I] * ATag.fResultScale\n  else\n    for I := 0 to ACount - 1 do\n      AValues[I] := TransformTagSourceOutput(ATag, AValues[I]);\nend;\n\nprocedure TRecorderTagRegistry.RebuildScales(ATag: TRecorderTag);\nvar\n  I: Integer;\n  lCalibration: TRecorderCalibration;\n  lConversion: Double;\n  lCurrentUnit: string;\n  lResultUnit: string;\n  lAutoUnit: string;\n\n  function TryInputConversion(ACalibration: TRecorderCalibration;\n    out AFactor: Double): Boolean;\n  begin\n    AFactor := 1.0;\n    Result := True;\n    if (ACalibration = nil) or (lCurrentUnit = '') or\n      (Trim(ACalibration.UnitIn) = '') or\n      SameText(lCurrentUnit, Trim(ACalibration.UnitIn)) then\n      Exit;\n    Result := RecorderUnitManager.TryGetConversionFactor(lCurrentUnit,\n      ACalibration.UnitIn, AFactor);\n    if not Result then\n    begin\n      ATag.AddCalibrationWarning('Incompatible calibration units: ' +\n        lCurrentUnit + ' -> ' + ACalibration.UnitIn);\n      AFactor := 1;\n      Result := True;\n    end;\n  end;\nbegin\n  if (ATag = nil) or ATag.fCalibrationScaleBuilt then\n    Exit;\n  if ATag.fSourceHardwareOutputUnitName <> '' then\n  begin\n    RebuildSourceScales(ATag);\n    Exit;\n  end;\n  ATag.fHardwareScale := 1.0;\n  ATag.ClearCalibrationWarning;\n  ATag.fSourceTransformError := '';\n  ATag.fSourceStepCount := 0;\n  ATag.fSourceFinalScale := 1;\n  ATag.fPreparedHardwareCalibration := nil;\n  ATag.fPreparedHardwareInputScale := 1;\n  SetLength(ATag.fSourceSteps, ATag.CalibrationNames.Count);\n  ATag.fResultScale := 1.0;\n  ATag.fCalibrationScaleLinear := True;\n  lCurrentUnit := Trim(ATag.fSourceUnitName);\n  if lCurrentUnit = '' then\n    lCurrentUnit := Trim(ATag.fUnitName);\n\n  lCalibration := FindTagHardwareCalibration(ATag);\n  if (lCalibration = nil) and ATag.HardwareCalibrationEnabled and\n    (Trim(ATag.HardwareCalibrationName) <> '') then\n    ATag.fSourceTransformError := 'Calibration not found: ' + ATag.HardwareCalibrationName;\n  if lCalibration <> nil then\n  begin\n    TryInputConversion(lCalibration, lConversion);\n    ATag.fPreparedHardwareCalibration := lCalibration;\n    ATag.fPreparedHardwareInputScale := lConversion;\n    if lCalibration.Kind <> rckScale then\n      ATag.fCalibrationScaleLinear := False\n    else\n    begin\n      ATag.fHardwareScale := lConversion * lCalibration.Scale;\n      ATag.fResultScale := ATag.fResultScale * ATag.fHardwareScale;\n    end;\n    if Trim(lCalibration.UnitOut) <> '' then lCurrentUnit := Trim(lCalibration.UnitOut);\n  end;\n\n  if ATag.ChannelCalibrationEnabled and (ATag.CalibrationNames <> nil) then\n    for I := 0 to ATag.CalibrationNames.Count - 1 do\n    begin\n      if not RecorderCalibrationStepEnabled(ATag.CalibrationNames, I) then\n        Continue;\n      lCalibration := FindCalibrationByName(ATag.CalibrationNames[I]);\n      if lCalibration = nil then\n      begin\n        ATag.fSourceTransformError := 'Calibration not found: ' + ATag.CalibrationNames[I];\n        Break;\n      end;\n      TryInputConversion(lCalibration, lConversion);\n      ATag.fSourceSteps[ATag.fSourceStepCount].Calibration := lCalibration;\n      ATag.fSourceSteps[ATag.fSourceStepCount].InputScale := lConversion;\n      Inc(ATag.fSourceStepCount);\n      if lCalibration.Kind <> rckScale then ATag.fCalibrationScaleLinear := False\n      else ATag.fResultScale := ATag.fResultScale * lConversion * lCalibration.Scale;\n      if Trim(lCalibration.UnitOut) <> '' then lCurrentUnit := Trim(lCalibration.UnitOut);\n    end;\n\n  { AutoUnit управляет только выбранной единицей результата. Сама цепочка ГХ\n    определяется исключительно флагами Hardware/ChannelCalibrationEnabled.\n    Для ручной совместимой единицы добавляем конечный переход в уже свёрнутый\n    коэффициент (например, V -> mV), не пересчитывая pipeline в runtime. }\n  lResultUnit := lCurrentUnit;\n  { TryGetTagAutoUnit также возвращает UnitOut нелинейной последней ступени,\n    которую линейный свёртыватель намеренно не обходит. }\n  if TryGetTagAutoUnit(ATag, lAutoUnit) then\n    lResultUnit := lAutoUnit;\n  if ATag.AutoUnit then\n    ATag.fUnitName := lResultUnit\n  else if (lResultUnit <> '') and\n    (Trim(ATag.fUnitName) <> '') and\n    not SameText(lResultUnit, Trim(ATag.fUnitName)) then\n  begin\n    if RecorderUnitManager.TryGetConversionFactor(lResultUnit,\n      ATag.fUnitName, lConversion) then\n    begin\n      ATag.fSourceFinalScale := lConversion;\n      ATag.fResultScale := ATag.fResultScale * lConversion;\n    end\n    else\n    begin\n      ATag.AddCalibrationWarning('Incompatible output units: ' + lResultUnit +\n        ' -> ' + ATag.UnitName);\n      ATag.fUnitName := lResultUnit;\n    end;\n  end;\n  ATag.fCalibrationScaleBuilt := True;\nend;\n\nfunction TRecorderTagRegistry.FindTagThermocoupleCalibration(\n  ATag: TRecorderTag): TRecorderCalibration;\nvar\n  I: Integer;\n  lName: string;\nbegin\n  Result := nil;\n  if (ATag = nil) or (not ATag.ChannelCalibrationEnabled) or\n    (ATag.CalibrationNames = nil) then\n    Exit;\n  for I := 0 to ATag.CalibrationNames.Count - 1 do\n  begin\n    if not RecorderCalibrationStepEnabled(ATag.CalibrationNames, I) then\n      Continue;\n    lName := Trim(ATag.CalibrationNames[I]);\n    if StartsText('TC ', lName) then\n      Exit(FindCalibrationByName(lName));\n  end;\nend;\n\nfunction TRecorderTagRegistry.TransformTagHardwareValue(ATag: TRecorderTag;\n  AValue: Double): Double;\nvar\n  lCalibration: TRecorderCalibration;\nbegin\n  Result := AValue;\n  if ATag = nil then\n    Exit;\n  RebuildScales(ATag);\n  if ATag.fSourceTransformError <> '' then\n    raise ERecorderTagError.Create(ATag.fSourceTransformError);\n  if ATag.fCalibrationScaleLinear and (ATag.SourceHardwareOutputUnitName = '') then\n    Exit(AValue * ATag.fHardwareScale);\n  if ATag.SourceHardwareOutputUnitName <> '' then\n  begin\n    { Source-owned hardware stage is not part of the generic prepared plan. }\n    lCalibration := FindTagHardwareCalibration(ATag);\n    if lCalibration <> nil then Result := lCalibration.Transform(Result);\n    Exit(Result);\n  end;\n  if ATag.fPreparedHardwareCalibration <> nil then\n    Result := ATag.fPreparedHardwareCalibration.Transform(\n      Result * ATag.fPreparedHardwareInputScale);\nend;\n\nfunction TRecorderTagRegistry.TransformTagThermocoupleValue(ATag: TRecorderTag;\n  AValue: Double): Double;\nvar\n  lCalibration: TRecorderCalibration;\nbegin\n  Result := AValue;\n  if ATag = nil then\n    Exit;\n  lCalibration := FindTagThermocoupleCalibration(ATag);\n  if lCalibration <> nil then\n    Result := lCalibration.Transform(Result);\nend;\n\nfunction TRecorderTagRegistry.InvertTagThermocoupleValue(ATag: TRecorderTag;\n  ATemperatureC: Double; out AMillivolts: Double): Boolean;\nvar\n  I: Integer;\n  lCalibration: TRecorderCalibration;\n  lHi: Double;\n  lLo: Double;\n  lMid: Double;\n  lMidValue: Double;\n  lReverse: Boolean;\nbegin\n  Result := False;\n  AMillivolts := 0.0;\n  lCalibration := FindTagThermocoupleCalibration(ATag);\n  if lCalibration = nil then\n    Exit;\n\n  lLo := CTagThermocoupleInverseMinMv;\n  lHi := CTagThermocoupleInverseMaxMv;\n  lReverse := lCalibration.Transform(lLo) > lCalibration.Transform(lHi);\n  for I := 0 to CTagThermocoupleInverseIterations - 1 do\n  begin\n    lMid := (lLo + lHi) * 0.5;\n    lMidValue := lCalibration.Transform(lMid);\n    if (lMidValue < ATemperatureC) xor lReverse then\n      lLo := lMid\n    else\n      lHi := lMid;\n  end;\n  AMillivolts := (lLo + lHi) * 0.5;\n  Result := True;\nend;\n\nfunction TRecorderTagRegistry.TransformTagValue(ATag: TRecorderTag; AValue: Double): Double;\nvar\n  I: Integer;\nbegin\n  if ATag <> nil then\n  begin\n    RebuildScales(ATag);\n    if ATag.fSourceTransformError <> '' then\n      raise ERecorderTagError.Create(ATag.fSourceTransformError);\n    if ATag.SourceHardwareOutputUnitName <> '' then\n      Exit(TransformTagSourceOutput(ATag, AValue));\n    if ATag.fCalibrationScaleLinear and not CalibrationCaptureActive(ATag) then\n      Exit(AValue * ATag.fResultScale);\n  end;\n  if ATag = nil then\n    Exit(AValue);\n  Result := AValue;\n  if ATag.fPreparedHardwareCalibration <> nil then\n    Result := ATag.fPreparedHardwareCalibration.Transform(\n      Result * ATag.fPreparedHardwareInputScale);\n  { Интерактивная градуировка видит только вход канальной цепочки. Обычный\n    runtime не платит за снимки и вычисления; активен лишь короткий append в\n    заранее выделенный буфер одной выбранной сессии. }\n  CaptureCalibrationValue(ATag, Result);\n  for I := 0 to ATag.fSourceStepCount - 1 do\n    Result := ATag.fSourceSteps[I].Calibration.Transform(\n      Result * ATag.fSourceSteps[I].InputScale);\n  Result := Result * ATag.fSourceFinalScale;\nend;\n\nfunction TRecorderTagRegistry.CalibrationCaptureActive(\n  ATag: TRecorderTag): Boolean;\nbegin\n  Result := (ATag <> nil) and (fCalibrationCaptureTag = ATag);\nend;\n\nprocedure TRecorderTagRegistry.CaptureCalibrationValue(ATag: TRecorderTag;\n  AValue: Double);\nbegin\n  if not CalibrationCaptureActive(ATag) then\n    Exit;\n  EnterCriticalSection(fCalibrationCaptureLock);\n  try\n    if (fCalibrationCaptureTag = ATag) and\n      (fCalibrationCaptureCount < Length(fCalibrationCaptureValues)) then\n    begin\n      fCalibrationCaptureValues[fCalibrationCaptureCount] := AValue;\n      Inc(fCalibrationCaptureCount);\n    end;\n  finally\n    LeaveCriticalSection(fCalibrationCaptureLock);\n  end;\nend;\n\nprocedure TRecorderTagRegistry.BeginCalibrationCapture(ATag: TRecorderTag;\n  ADurationSec: Double);\nvar\n  lCapacity: Integer;\nbegin\n  if (ATag = nil) or not ContainsTag(ATag) then\n    raise ERecorderTagError.Create('Calibration capture tag is not registered');\n  if ADurationSec <= 0 then\n    ADurationSec := 1.0;\n  lCapacity := Max(32, Ceil(Max(1.0, ATag.PollFrequencyHz) *\n    ADurationSec * 1.25));\n  EnterCriticalSection(fCalibrationCaptureLock);\n  try\n    fCalibrationCaptureTag := nil;\n    SetLength(fCalibrationCaptureValues, lCapacity);\n    fCalibrationCaptureCount := 0;\n    fCalibrationCaptureTag := ATag;\n  finally\n    LeaveCriticalSection(fCalibrationCaptureLock);\n  end;\nend;\n\nfunction TRecorderTagRegistry.EnsureCalibrationData(ATag: TRecorderTag;\n  out AStartedByCalibration: Boolean; out AError: string): Boolean;\nbegin\n  AStartedByCalibration := False;\n  AError := '';\n  if not ContainsTag(ATag) then\n  begin\n    AError := 'Выбранный тег больше не зарегистрирован.';\n    Exit(False);\n  end;\n  if not Assigned(fOnEnsureCalibrationData) then\n  begin\n    AError := 'Запуск просмотра для градуировки недоступен.';\n    Exit(False);\n  end;\n  Result := fOnEnsureCalibrationData(ATag, AStartedByCalibration, AError);\n  if (not Result) and (Trim(AError) = '') then\n    AError := 'Не удалось запустить просмотр данных.';\nend;\n\nprocedure TRecorderTagRegistry.ReleaseCalibrationData(ATag: TRecorderTag);\nbegin\n  if ContainsTag(ATag) and Assigned(fOnReleaseCalibrationData) then\n    fOnReleaseCalibrationData(ATag);\nend;\n\nfunction TRecorderTagRegistry.CalibrationCaptureSampleCount(\n  ATag: TRecorderTag): Integer;\nbegin\n  Result := 0;\n  EnterCriticalSection(fCalibrationCaptureLock);\n  try\n    if (ATag <> nil) and (fCalibrationCaptureTag = ATag) then\n      Result := fCalibrationCaptureCount;\n  finally\n    LeaveCriticalSection(fCalibrationCaptureLock);\n  end;\nend;\n\nfunction TRecorderTagRegistry.FinishCalibrationCapture(ATag: TRecorderTag;\n  out ASnapshot: TRecorderSignalSnapshot): Boolean;\nvar\n  I: Integer;\nbegin\n  ASnapshot.Count := 0;\n  SetLength(ASnapshot.Times, 0);\n  SetLength(ASnapshot.Values, 0);\n  EnterCriticalSection(fCalibrationCaptureLock);\n  try\n    Result := (ATag <> nil) and (fCalibrationCaptureTag = ATag) and\n      (fCalibrationCaptureCount > 0);\n    fCalibrationCaptureTag := nil;\n    if Result then\n    begin\n      ASnapshot.Count := fCalibrationCaptureCount;\n      SetLength(ASnapshot.Times, ASnapshot.Count);\n      SetLength(ASnapshot.Values, ASnapshot.Count);\n      for I := 0 to ASnapshot.Count - 1 do\n      begin\n        ASnapshot.Times[I] := I;\n        ASnapshot.Values[I] := fCalibrationCaptureValues[I];\n      end;\n    end;\n    fCalibrationCaptureCount := 0;\n  finally\n    LeaveCriticalSection(fCalibrationCaptureLock);\n  end;\nend;\n\nprocedure TRecorderTagRegistry.CancelCalibrationCapture(ATag: TRecorderTag);\nbegin\n  EnterCriticalSection(fCalibrationCaptureLock);\n  try\n    if (ATag = nil) or (fCalibrationCaptureTag = ATag) then\n    begin\n      fCalibrationCaptureTag := nil;\n      fCalibrationCaptureCount := 0;\n    end;\n  finally\n    LeaveCriticalSection(fCalibrationCaptureLock);\n  end;\nend;\nprocedure TRecorderTagRegistry.RegisterActiveSource(const ASourceId: string);\nvar\n  lSourceId: string;\nbegin\n  lSourceId := Trim(ASourceId);\n  if lSourceId = '' then\n    Exit;\n  if fActiveSourceIds.IndexOf(lSourceId) < 0 then\n    fActiveSourceIds.Add(lSourceId);\nend;\n\nprocedure TRecorderTagRegistry.UnregisterActiveSource(const ASourceId: string);\nvar\n  lIndex: Integer;\nbegin\n  lIndex := fActiveSourceIds.IndexOf(Trim(ASourceId));\n  if lIndex >= 0 then\n    fActiveSourceIds.Delete(lIndex);\nend;\n\nprocedure TRecorderTagRegistry.ClearActiveSources;\nbegin\n  fActiveSourceIds.Clear;\nend;\n\nfunction RecorderNormalizeTagSourceId(const ASourceId: string): string;\nbegin\n  Result := Trim(ASourceId);\n  if Pos(CDetachedTagSourcePrefix, Result) = 1 then\n    Result := Trim(Copy(Result, Length(CDetachedTagSourcePrefix) + 1, MaxInt));\nend;\n\nfunction RecorderIsDetachedTagSource(const ASourceId: string): Boolean;\nbegin\n  Result := Pos(CDetachedTagSourcePrefix, Trim(ASourceId)) = 1;\nend;\n\nfunction RecorderIsVirtualTagSource(const ASourceId: string): Boolean;\nbegin\n  Result := Pos(CMeraTagSourcePrefix, RecorderNormalizeTagSourceId(ASourceId)) = 1;\nend;\n\nfunction RecorderIsHardwareTagSource(const ASourceId: string): Boolean;\nvar\n  lSourceId: string;\nbegin\n  lSourceId := RecorderNormalizeTagSourceId(ASourceId);\n  Result := (lSourceId <> '') and\n    (not RecorderIsDetachedTagSource(ASourceId)) and\n    (not RecorderIsVirtualTagSource(lSourceId)) and\n    (not SameText(lSourceId, 'manual')) and\n    (not SameText(lSourceId, 'debug.diagnostics'));\nend;\n\nfunction RecorderHardwareTreeShowsSourceId(const ASourceId: string): Boolean;\nvar\n  lNorm: string;\nbegin\n  lNorm := RecorderNormalizeTagSourceId(ASourceId);\n  if lNorm = '' then\n    Exit(False);\n  Result := RecorderIsVirtualTagSource(lNorm) or RecorderIsHardwareTagSource(lNorm);\nend;\n\nfunction RecorderTagSourceIsVisible(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag): Boolean;\nvar\n  lPath: string;\n  lSourceId: string;\nbegin\n  Result := ATag <> nil;\n  if not Result then\n    Exit;\n  if RecorderIsDetachedTagSource(ATag.SourceId) then\n    Exit(False);\n  { Explicit operator disable overrides cached link/activity, virtual flags\n    and an existing MERA file. Keep the tags/configuration, hide their views. }\n  if (ARegistry <> nil) and not RecorderConfiguredDataSourceEnabled(ARegistry,\n    ATag.SourceId) then Exit(False);\n  { Виртуальность задаётся явно при создании тега. Такой тег не должен\n    исчезать из представлений только потому, что его SourceId не является\n    зарегистрированным аппаратным источником. }\n  if ATag.IsVirtual then\n    Exit(True);\n  if ARegistry = nil then\n    Exit;\n\n  lSourceId := RecorderNormalizeTagSourceId(ATag.SourceId);\n  if lSourceId = '' then\n    Exit;\n  if RecorderIsVirtualTagSource(lSourceId) then\n  begin\n    if ARegistry.IsSourceActive(lSourceId) then\n      Exit(True);\n    lPath := Trim(Copy(lSourceId, Length(CMeraTagSourcePrefix) + 1, MaxInt));\n    Result := (lPath <> '') and\n      (FileExists(lPath) or FileExists(ExpandFileName(lPath)));\n    Exit;\n  end;\n  if RecorderIsHardwareTagSource(lSourceId) then\n    Result := ARegistry.IsSourceActive(lSourceId);\nend;\n\nprocedure TRecorderTagRegistry.RefreshActiveSourcesFromTags;\nvar\n  I: Integer;\n  lSourceId: string;\n  lTag: TRecorderTag;\nbegin\n  ClearActiveSources;\n  RegisterActiveSource('manual');\n  RegisterActiveSource('debug.diagnostics');\n  for I := 0 to TagCount - 1 do\n  begin\n    lTag := Tags[I];\n    if RecorderIsDetachedTagSource(lTag.SourceId) then\n      Continue;\n    lSourceId := Trim(lTag.SourceId);\n    if lSourceId = '' then\n      Continue;\n    if Pos(CMeraTagSourcePrefix, lSourceId) = 1 then\n      RegisterActiveSource(lSourceId);\n  end;\nend;\n\nfunction TRecorderTagRegistry.IsSourceActive(const ASourceId: string): Boolean;\nvar\n  lSourceId,s: string;\n  ind:integer;\nbegin\n  lSourceId := Trim(ASourceId);\n  ind:=fActiveSourceIds.IndexOf(lSourceId);\n  if ind>=0 then\n    s:=fActiveSourceIds.Strings[ind];\n  Result := (lSourceId = '') or (ind >= 0);\nend;\n\nprocedure TRecorderTagRegistry.PublishValue(const ATagName: string; ATimeSec,\n  AValue: Double);\nvar\n  lTag: TRecorderTag;\nbegin\n  lTag := FindByName(ATagName);\n  if lTag = nil then\n    raise ERecorderTagError.CreateFmt('Tag not found: %s', [ATagName]);\n  PublishValue(lTag, ATimeSec, AValue);\nend;\n\nprocedure TRecorderTagRegistry.PublishValue(ATag: TRecorderTag; ATimeSec,\n  AValue: Double);\nbegin\n  PublishValueInternal(ATag, ATimeSec, AValue, True);\nend;\n\nprocedure TRecorderTagRegistry.PublishValueInternal(ATag: TRecorderTag;\n  ATimeSec, AValue: Double; AIsInput: Boolean);\nvar\n  lEvent: TRecorderEvent;\n  lEventData: TRecorderTagUpdateEventData;\n  lValue: Double;\nbegin\n  if ATag = nil then\n    raise ERecorderTagError.Create('Tag is nil');\n  if not ContainsTag(ATag) then\n    Exit;\n\n  ATimeSec := ResolvePublishTime(ATimeSec);\n  if (ATag.SourceHardwareOutputUnitName = '') and ATag.fSourceInputIsRaw then\n    ATag.StageRawValue(ATimeSec, AValue);\n  lValue := TransformTagValue(ATag, AValue);\n  ATag.AddSample(ATimeSec, lValue);\n  MarkRuntimeDataUpdated(ATag, ATimeSec);\n  if AIsInput then MarkInputDataUpdated;\n\n  if Assigned(fOnValuePublished) then\n    fOnValuePublished(fValuePublishedTarget, ATag, ATimeSec, lValue);\n  if Assigned(fOnAlarmValuePublished) then\n    fOnAlarmValuePublished(fAlarmValuePublishedTarget, ATag, ATimeSec, lValue);\n\n  if fEventBus <> nil then\n  begin\n    lEventData := TRecorderTagUpdateEventData.Create(ATag, ATimeSec, lValue);\n    try\n      lEvent := TRecorderEventBus.MakeEvent(rceDataUpdated, Self, ATag.Name,\n        ATag.TextValue, 1, lEventData);\n      fEventBus.Publish(lEvent);\n    finally\n      lEventData.Free;\n    end;\n  end;\nend;\n\nprocedure TRecorderTagRegistry.SetBlockPublishedHandler(ATarget: TObject;\n  AHandler: TRecorderTagBlockPublishedEvent);\nbegin\n  fBlockPublishedTarget := ATarget;\n  fOnBlockPublished := AHandler;\nend;\n\nprocedure TRecorderTagRegistry.SetValuePublishedHandler(ATarget: TObject;\n  AHandler: TRecorderTagValuePublishedEvent);\nbegin\n  fValuePublishedTarget := ATarget;\n  fOnValuePublished := AHandler;\nend;\n\nprocedure TRecorderTagRegistry.SetAlarmValuePublishedHandler(ATarget: TObject;\n  AHandler: TRecorderTagValuePublishedEvent);\nbegin\n  fAlarmValuePublishedTarget := ATarget;\n  fOnAlarmValuePublished := AHandler;\nend;\n\nprocedure TRecorderTagRegistry.AddBlockSamples(const ATagName: string;\n  const ATimes, AValues: array of Double; ACount: Integer;\n  AValuesAlreadyTransformed: Boolean);\nvar\n  lTag: TRecorderTag;\nbegin\n  lTag := FindByName(ATagName);\n  if lTag = nil then\n    raise ERecorderTagError.CreateFmt('Tag not found: %s', [ATagName]);\n  AddBlockSamples(lTag, ATimes, AValues, ACount, AValuesAlreadyTransformed);\nend;\n\nprocedure TRecorderTagRegistry.AddBlockSamples(ATag: TRecorderTag;\n  const ATimes, AValues: array of Double; ACount: Integer;\n  AValuesAlreadyTransformed: Boolean);\nvar\n  lValues: TRecorderDoubleArray;\n  I: Integer;\nbegin\n  if ACount <= 0 then\n    Exit;\n  if (ACount > Length(ATimes)) or (ACount > Length(AValues)) then\n    raise ERecorderTagError.Create('Publish block count exceeds data length');\n\n  if ATag = nil then\n    raise ERecorderTagError.Create('Tag is nil');\n  if not ContainsTag(ATag) then\n    Exit;\n\n  if AValuesAlreadyTransformed then\n    ATag.AddSamples(ATimes, AValues, ACount)\n  else\n  begin\n    if (ATag.SourceHardwareOutputUnitName = '') and ATag.fSourceInputIsRaw then\n      ATag.StageRawValue(ATimes[ACount - 1], AValues[ACount - 1]);\n    SetLength(lValues, ACount);\n    for I := 0 to ACount - 1 do\n      lValues[I] := TransformTagValue(ATag, AValues[I]);\n    ATag.AddSamples(ATimes, lValues, ACount);\n  end;\n  MarkRuntimeDataUpdated(ATag, ATimes[ACount - 1]);\n  MarkInputDataUpdated;\nend;\n\nprocedure TRecorderTagRegistry.PublishValue(const ATagName: string;\n  AValue: Double);\nbegin\n  PublishValue(ATagName, 0.0, AValue);\nend;\n\nprocedure TRecorderTagRegistry.PublishValue(ATag: TRecorderTag; AValue: Double);\nbegin\n  PublishValue(ATag, 0.0, AValue);\nend;\n\nprocedure TRecorderTagRegistry.SetSqlBlockPublishedHandler(ATarget: TObject;\n  AHandler: TRecorderTagSqlBlockPublishedEvent);\nbegin\n  fSqlBlockPublishedTarget := ATarget;\n  fOnSqlBlockPublished := AHandler;\nend;\n\nprocedure TRecorderTagRegistry.PublishExternalValue(const ATagName: string;\n  AValue: Double);\nvar\n  lTag: TRecorderTag;\nbegin\n  lTag := FindByName(ATagName);\n  if lTag = nil then\n    raise ERecorderTagError.CreateFmt('Tag not found: %s', [ATagName]);\n  PublishExternalValue(lTag, AValue);\nend;\n\nprocedure TRecorderTagRegistry.PublishExternalValue(ATag: TRecorderTag;\n  AValue: Double);\nbegin\n  if (ATag = nil) or not ATag.ExternalWriteAllowed then Exit;\n  BeginExternalWriteBatch;\n  try\n    PublishValueInternal(ATag, 0.0, AValue, False);\n    ATag.QueueExternalWrite(AValue);\n  finally\n    EndExternalWriteBatch;\n  end;\nend;\n\nprocedure TRecorderTagRegistry.BeginExternalWriteBatch;\nbegin\n  EnterCriticalSection(fExternalWriteBatchLock);\nend;\n\nprocedure TRecorderTagRegistry.EndExternalWriteBatch;\nbegin\n  LeaveCriticalSection(fExternalWriteBatchLock);\nend;\n\nfunction TRecorderTagRegistry.ResolvePublishTime(ATimeSec: Double): Double;\nbegin\n  if ATimeSec > 0 then Exit(ATimeSec);\n  if fTimeSystem <> nil then\n    Result := fTimeSystem.Snapshot.ElapsedSec\n  else\n    Result := (GetTickCount64 - fFallbackStartTickMs) / 1000.0;\nend;\n\nprocedure TRecorderTagRegistry.NotifyBlockTail(const ATagName: string;\n  ATimeSec, AValue: Double);\nvar\n  lTag: TRecorderTag;\nbegin\n  lTag := FindByName(ATagName);\n  if lTag = nil then\n    raise ERecorderTagError.CreateFmt('Tag not found: %s', [ATagName]);\n  if Assigned(fOnAlarmValuePublished) then\n    fOnAlarmValuePublished(fAlarmValuePublishedTarget, lTag, ATimeSec, AValue);\nend;\n\nprocedure TRecorderTagRegistry.PublishBlockNotifications(const ATagName: string);\nvar\n  lTag: TRecorderTag;\nbegin\n  lTag := FindByName(ATagName);\n  PublishBlockNotifications(lTag);\nend;\n\nprocedure TRecorderTagRegistry.PublishBlockNotifications(ATag: TRecorderTag);\nvar\n  lSnapshot: TRecorderSignalSnapshot;\nbegin\n  if ATag = nil then\n    Exit;\n  lSnapshot := ATag.LastBlockSnapshot;\n  PublishBlockNotifications(ATag, lSnapshot.Times, lSnapshot.Values,\n    lSnapshot.Count);\nend;\n\nprocedure TRecorderTagRegistry.PublishBlockNotifications(ATag: TRecorderTag;\n  const ATimes, AValues: array of Double; ACount: Integer);\nvar\n  lEvent: TRecorderEvent;\n  lEventData: TRecorderTagUpdateEventData;\nbegin\n  if (ATag = nil) or (ACount <= 0) or (ACount > Length(ATimes)) or\n    (ACount > Length(AValues)) then\n    Exit;\n  { SQL persistence is the first block consumer. Algorithm and alarm handlers\n    are allowed to do substantially more work and must not delay or suppress\n    the measurement that has already been accepted into the tag buffer. }\n  if Assigned(fOnSqlBlockPublished) then\n    try\n      fOnSqlBlockPublished(fSqlBlockPublishedTarget, ATag,\n        ATimes[ACount - 1], AValues[ACount - 1]);\n    except\n      on E: Exception do\n        RecorderDebugLog(Format(\n          '[Tags] SQL block consumer failed for %s: %s: %s',\n          [ATag.Name, E.ClassName, E.Message]));\n    end;\n  if Assigned(fOnBlockPublished) then\n    try\n      fOnBlockPublished(fBlockPublishedTarget, ATag.Name, ATimes, AValues,\n        ACount);\n    except\n      on E: Exception do\n        RecorderDebugLog(Format(\n          '[Tags] block consumer failed for %s: %s: %s',\n          [ATag.Name, E.ClassName, E.Message]));\n    end;\n  if Assigned(fOnAlarmValuePublished) then\n    try\n      fOnAlarmValuePublished(fAlarmValuePublishedTarget, ATag,\n        ATimes[ACount - 1], AValues[ACount - 1]);\n    except\n      on E: Exception do\n        RecorderDebugLog(Format(\n          '[Tags] alarm consumer failed for %s: %s: %s',\n          [ATag.Name, E.ClassName, E.Message]));\n    end;\n  { Для медленных потребителей публикуется только хвост блока. Сами массивы\n    остаются в буфере тега, поэтому acquisition-путь не получает лишнего копирования. }\n  if fEventBus <> nil then\n  begin\n    lEventData := TRecorderTagUpdateEventData.CreateBlockTailNotify(ATag,\n      ATimes[ACount - 1], AValues[ACount - 1]);\n    try\n      lEvent := TRecorderEventBus.MakeEvent(rceDataUpdated, Self, ATag.Name,\n        ATag.TextValue, 1, lEventData);\n      try\n        fEventBus.Publish(lEvent);\n      except\n        on E: Exception do\n          RecorderDebugLog(Format(\n            '[Tags] event consumer failed for %s: %s: %s',\n            [ATag.Name, E.ClassName, E.Message]));\n      end;\n    finally\n      lEventData.Free;\n    end;\n  end;\n  { Массивы измерений через EventBus не передаются. Потребители по своему\n    настраиваемому периоду читают непрочитанный хвост кольца по курсору. }\nend;\n\nprocedure TRecorderTagRegistry.PublishBlock(const ATagName: string; const ATimes,\n  AValues: array of Double; ACount: Integer; AValuesAlreadyTransformed: Boolean);\nvar\n  lTag: TRecorderTag;\nbegin\n  lTag := FindByName(ATagName);\n  if lTag = nil then\n    raise ERecorderTagError.CreateFmt('Tag not found: %s', [ATagName]);\n  PublishBlock(lTag, ATimes, AValues, ACount, AValuesAlreadyTransformed);\nend;\n\nprocedure TRecorderTagRegistry.PublishBlock(ATag: TRecorderTag;\n  const ATimes, AValues: array of Double; ACount: Integer;\n  AValuesAlreadyTransformed: Boolean);\nvar\n  I: Integer;\n  lValues: TRecorderDoubleArray;\nbegin\n  if ACount <= 0 then Exit;\n  if ATag = nil then\n    raise ERecorderTagError.Create('Tag is required for block publication');\n  if AValuesAlreadyTransformed then\n    ATag.AddSamples(ATimes, AValues, ACount)\n  else\n  begin\n    SetLength(lValues, ACount);\n    for I := 0 to ACount - 1 do\n      lValues[I] := TransformTagValue(ATag, AValues[I]);\n    ATag.AddSamples(ATimes, lValues, ACount);\n  end;\n  MarkRuntimeDataUpdated(ATag, ATimes[ACount - 1]);\n  MarkInputDataUpdated;\n  // This method is in the acquisition hot path. Per-tag disk logging turns a\n  // 48-channel hardware block into dozens of synchronous writes and can delay\n  // the next device read. Device-level diagnostics log block summaries.\n  { Для уже преобразованных данных можно передать исходный массив напрямую.\n    Иначе уведомление должно получить значения после ГХ из последнего блока. }\n  if AValuesAlreadyTransformed then\n    PublishBlockNotifications(ATag, ATimes, AValues, ACount)\n  else\n    PublishBlockNotifications(ATag, ATimes, lValues, ACount);\nend;\n\nprocedure TRecorderTagRegistry.RemoveTagReferences(ATag: TRecorderTag);\nvar\n  I, J: Integer;\n  lBand: TRecorderFrequencyBand;\n  lName: string;\n  lNode: TRecorderSpectrumConfigNode;\nbegin\n  if ATag = nil then\n    Exit;\n\n  lName := ATag.Name;\n  if SameText(fSelectedTagName, lName) then\n    fSelectedTagName := '';\n\n  if fSpectrumConfigs <> nil then\n    for I := 0 to fSpectrumConfigs.NodeCount - 1 do\n    begin\n      lNode := fSpectrumConfigs.Nodes[I];\n      for J := lNode.BindingCount - 1 downto 0 do\n        if SameText(lNode.Bindings[J].SourceTagName, lName) then\n          lNode.DeleteBinding(J);\n    end;\n\n  if fFrequencyBands <> nil then\n    for I := fFrequencyBands.BandCount - 1 downto 0 do\n    begin\n      lBand := fFrequencyBands.Bands[I];\n      for J := lBand.TermCount - 1 downto 0 do\n        if SameText(lBand.Terms[J].TagName, lName) then\n          lBand.DeleteTerm(J);\n      if (lBand.Kind = fbkFormula) and (lBand.TermCount = 0) then\n        fFrequencyBands.DeleteBand(I);\n    end;\nend;\n\nprocedure TRecorderTagRegistry.RemoveTag(ATag: TRecorderTag);\nbegin\n  if ATag <> nil then\n  begin\n    RemoveTagReferences(ATag);\n    RemoveLoadedTagAliases(ATag);\n    fTags.Remove(ATag);\n    ATag.Free;\n    Inc(fStructureRevision);\n  end;\nend;\n\nprocedure TRecorderTagRegistry.RemoveLoadedTagAliases(ATag: TRecorderTag);\nvar\n  I: Integer;\nbegin\n  for I := fLoadedTagIdAliases.Count - 1 downto 0 do\n    if fLoadedTagIdAliases.Objects[I] = ATag then\n      fLoadedTagIdAliases.Delete(I);\n  for I := fLoadedTagNameAliases.Count - 1 downto 0 do\n    if fLoadedTagNameAliases.Objects[I] = ATag then\n      fLoadedTagNameAliases.Delete(I);\nend;\n\nprocedure TRecorderTagRegistry.RemoveTagsBySourceId(const ASourceId: string);\nvar\n  I: Integer;\n  lSourceId: string;\n  lTag: TRecorderTag;\nbegin\n  lSourceId := RecorderNormalizeTagSourceId(ASourceId);\n  if lSourceId = '' then\n    Exit;\n  for I := fTags.Count - 1 downto 0 do\n  begin\n    lTag := TRecorderTag(fTags[I]);\n    if SameText(RecorderNormalizeTagSourceId(lTag.SourceId), lSourceId) then\n      RemoveTag(lTag);\n  end;\nend;\n\nprocedure TRecorderTagRegistry.DetachTagsBySourceId(const ASourceId: string);\nvar\n  I: Integer;\n  lSourceId: string;\n  lTag: TRecorderTag;\nbegin\n  lSourceId := RecorderNormalizeTagSourceId(ASourceId);\n  if lSourceId = '' then\n    Exit;\n  for I := 0 to fTags.Count - 1 do\n  begin\n    lTag := TRecorderTag(fTags[I]);\n    if SameText(RecorderNormalizeTagSourceId(lTag.SourceId), lSourceId) then\n      lTag.SourceId := CDetachedTagSourcePrefix + ' ' + lSourceId;\n  end;\nend;\n\nprocedure TRecorderTagRegistry.Clear;\nvar\n  I: Integer;\nbegin\n  fLoadedTagIdAliases.Clear;\n  fLoadedTagNameAliases.Clear;\n  for I := 0 to fTags.Count - 1 do\n    TObject(fTags[I]).Free;\n  fTags.Clear;\n  Inc(fStructureRevision);\n  fSourceSpecificConfigs.Clear;\n  fConfiguredDataSources.Clear;\n  fTagGroupPaths.Clear;\n  fSelectedTagName := '';\nend;\n\n\n{ TRecorderCalibrationPoint }\n\nconstructor TRecorderCalibrationPoint.Create(AX, AY: Double);\nbegin\n  X := AX;\n  Y := AY;\nend;\n\n{ TRecorderCalibration }\n\nconstructor TRecorderCalibration.Create(AKind: TRecorderCalibrationKind);\nbegin\n  inherited Create;\n  fKind := AKind;\n  fPoints := TList.Create;\n  fScale := 1.0;\n  fOffset := 0.0;\n  fK1 := 1.0;\n  fK2 := 0.0;\n  fExtrapolation := True;\nend;\n\ndestructor TRecorderCalibration.Destroy;\nbegin\n  ClearPoints;\n  fPoints.Free;\n  inherited Destroy;\nend;\n\nprocedure TRecorderCalibration.AddPoint(AX, AY: Double);\nbegin\n  fPoints.Add(TRecorderCalibrationPoint.Create(AX, AY));\nend;\n\n\nprocedure TRecorderCalibration.Assign(ASource: TRecorderCalibration);\nvar\n  I: Integer;\n  lPoint: TRecorderCalibrationPoint;\nbegin\n  if ASource = nil then\n    Exit;\n  fName := ASource.Name;\n  fDescription := ASource.Description;\n  fUnitIn := ASource.UnitIn;\n  fUnitOut := ASource.UnitOut;\n  fExtrapolation := ASource.Extrapolation;\n  fKind := ASource.Kind;\n  fScale := ASource.Scale;\n  fOffset := ASource.Offset;\n  fK1 := ASource.K1;\n  fK2 := ASource.K2;\n  fModuleData := ASource.ModuleData;\n  fSdbKey := ASource.SdbKey;\n  fSourceFileName := ASource.SourceFileName;\n  ClearPoints;\n  for I := 0 to ASource.PointCount - 1 do\n  begin\n    lPoint := ASource.PointAt(I);\n    if lPoint <> nil then\n      AddPoint(lPoint.X, lPoint.Y);\n  end;\nend;\n\nfunction TRecorderCalibration.Clone: TRecorderCalibration;\nbegin\n  Result := TRecorderCalibration.Create(fKind);\n  Result.Assign(Self);\nend;\n\nfunction RecorderResolveTagReference(ARegistry:TRecorderTagRegistry;\n  ATagId:TRecorderTagId; const ATagName:string):TRecorderTag;\nbegin\n  Result:=nil;\n  if ARegistry=nil then\n    Exit;\n  if Trim(ATagName)<>'' then\n    Result:=ARegistry.FindByName(Trim(ATagName))\n  else if ATagId<>0 then\n    Result:=ARegistry.FindById(ATagId);\nend;\n\nfunction RecorderTryReadScalarValue(ATag:TRecorderTag;\n  AUseDefaultEstimate:Boolean; AEstimateKind:TRecorderTagEstimateKind;\n  out AValue:Double):Boolean;\nvar\n  lEstimate:TRecorderTagEstimate;\nbegin\n  Result:=False;\n  AValue:=NaN;\n  if ATag=nil then\n    Exit;\n  if ATag.IsVector then\n  begin\n    if AUseDefaultEstimate then\n      AEstimateKind:=ATag.EstimateSettings.DefaultKind;\n    lEstimate:=ATag.Estimate(AEstimateKind);\n    if not lEstimate.Valid then\n      Exit;\n    AValue:=lEstimate.Value;\n  end\n  else\n  begin\n    if ATag.SignalBuffer.Count=0 then\n      Exit;\n    AValue:=ATag.SignalBuffer.LatestValue;\n  end;\n  Result:=not IsNan(AValue) and not IsInfinite(AValue);\nend;\n\nfunction TRecorderCalibration.ConvertInputUnit(\n  const AUnitName: string): Boolean;\nvar\n  I: Integer;\n  lDegree: Integer;\n  lFactor: Double;\n  lPoint: TRecorderCalibrationPoint;\nbegin\n  Result := False;\n  if (Trim(fUnitIn) = '') or (Trim(AUnitName) = '') then\n    Exit;\n  if SameText(Trim(fUnitIn), Trim(AUnitName)) then\n    Exit(True);\n  if not RecorderUnitManager.TryGetConversionFactor(fUnitIn, AUnitName,\n    lFactor) then\n    Exit;\n\n  case fKind of\n    rckScale:\n      fScale := fScale / lFactor;\n    rckLinear:\n      fScale := fScale / lFactor;\n    rckStrain:\n      begin\n        fK1 := fK1 / lFactor;\n        fK2 := fK2 / Sqr(lFactor);\n      end;\n    rckPiecewiseLinear:\n      for I := 0 to fPoints.Count - 1 do\n      begin\n        lPoint := PointAt(I);\n        if lPoint <> nil then\n          lPoint.X := lPoint.X * lFactor;\n      end;\n    rckPolynomial:\n      for I := 0 to fPoints.Count - 1 do\n      begin\n        lPoint := PointAt(I);\n        if lPoint <> nil then\n        begin\n          lDegree := Max(0, Round(lPoint.X));\n          lPoint.Y := lPoint.Y / IntPower(lFactor, lDegree);\n        end;\n      end;\n  end;\n  fUnitIn := Trim(AUnitName);\n  Result := True;\nend;\n\nfunction TRecorderCalibration.ConvertOutputUnit(\n  const AUnitName: string): Boolean;\nvar\n  I: Integer;\n  lFactor: Double;\n  lPoint: TRecorderCalibrationPoint;\nbegin\n  Result := False;\n  if (Trim(fUnitOut) = '') or (Trim(AUnitName) = '') then\n    Exit;\n  if SameText(Trim(fUnitOut), Trim(AUnitName)) then\n    Exit(True);\n  if not RecorderUnitManager.TryGetConversionFactor(fUnitOut, AUnitName,\n    lFactor) then\n    Exit;\n\n  case fKind of\n    rckScale:\n      fScale := fScale * lFactor;\n    rckLinear:\n      begin\n        fScale := fScale * lFactor;\n        fOffset := fOffset * lFactor;\n      end;\n    rckStrain:\n      begin\n        fOffset := fOffset * lFactor;\n        fK1 := fK1 * lFactor;\n        fK2 := fK2 * lFactor;\n      end;\n    rckPiecewiseLinear, rckPolynomial:\n      for I := 0 to fPoints.Count - 1 do\n      begin\n        lPoint := PointAt(I);\n        if lPoint <> nil then\n          lPoint.Y := lPoint.Y * lFactor;\n      end;\n  end;\n  fUnitOut := Trim(AUnitName);\n  Result := True;\nend;\n\nfunction TRecorderCalibration.GetUnits: string;\nbegin\n  Result := UnitOut;\nend;\n\nfunction TRecorderCalibration.Transform(AValue: Double): Double;\nvar\n  I: Integer;\n  lA: TRecorderCalibrationPoint;\n  lB: TRecorderCalibrationPoint;\n  lX1: Double;\n  lX2: Double;\nbegin\n  Result := AValue;\n  case fKind of\n    rckScale:\n      Result := AValue * fScale;\n    rckLinear:\n      Result := AValue * fScale + fOffset;\n    rckStrain:\n      Result := fOffset + fK1 * AValue + fK2 * AValue * AValue;\n    rckPiecewiseLinear:\n      begin\n        if fPoints.Count = 0 then\n          Exit;\n        if fPoints.Count = 1 then\n        begin\n          lA := PointAt(0);\n          if lA <> nil then\n            Result := lA.Y;\n          Exit;\n        end;\n\n        for I := 0 to fPoints.Count - 2 do\n        begin\n          lA := PointAt(I);\n          lB := PointAt(I + 1);\n          if (lA = nil) or (lB = nil) then\n            Continue;\n          lX1 := Min(lA.X, lB.X);\n          lX2 := Max(lA.X, lB.X);\n          if (AValue >= lX1) and (AValue <= lX2) then\n          begin\n            if SameValue(lA.X, lB.X) then\n              Result := lB.Y\n            else\n              Result := lA.Y + (AValue - lA.X) * (lB.Y - lA.Y) / (lB.X - lA.X);\n            Exit;\n          end;\n        end;\n\n        if (not fExtrapolation) and (AValue < PointAt(0).X) then\n        begin\n          Result := PointAt(0).Y;\n          Exit;\n        end;\n        if (not fExtrapolation) and (AValue > PointAt(fPoints.Count - 1).X) then\n        begin\n          Result := PointAt(fPoints.Count - 1).Y;\n          Exit;\n        end;\n\n        if AValue < PointAt(0).X then\n        begin\n          lA := PointAt(0);\n          lB := PointAt(1);\n        end\n        else\n        begin\n          lA := PointAt(fPoints.Count - 2);\n          lB := PointAt(fPoints.Count - 1);\n        end;\n        if SameValue(lA.X, lB.X) then\n          Result := lB.Y\n        else\n          Result := lA.Y + (AValue - lA.X) * (lB.Y - lA.Y) / (lB.X - lA.X);\n      end;\n    rckPolynomial:\n      begin\n        Result := 0.0;\n        for I := 0 to fPoints.Count - 1 do\n        begin\n          lA := PointAt(I);\n          if lA <> nil then\n            Result := Result + lA.Y * IntPower(AValue,\n              Max(0, Round(lA.X)));\n        end;\n      end;\n  end;\nend;\n\nfunction TRecorderCalibration.InverseTransform(AValue: Double;\n  out AInputValue: Double): Boolean;\nvar\n  lAscending: Boolean;\n  lA: TRecorderCalibrationPoint;\n  lB: TRecorderCalibrationPoint;\n  lFirst: TRecorderCalibrationPoint;\n  lLast: TRecorderCalibrationPoint;\n  lLeft: Integer;\n  lMid: Integer;\n  lRight: Integer;\n  lDiscriminant: Double;\n  lLinearEstimate: Double;\n  lRoot1: Double;\n  lRoot2: Double;\nbegin\n  Result := False;\n  AInputValue := 0.0;\n  case fKind of\n    rckScale:\n      begin\n        if SameValue(fScale, 0.0) then\n          Exit;\n        AInputValue := AValue / fScale;\n        Exit(True);\n      end;\n    rckLinear:\n      begin\n        if SameValue(fScale, 0.0) then\n          Exit;\n        AInputValue := (AValue - fOffset) / fScale;\n        Exit(True);\n      end;\n    rckStrain:\n      begin\n        if SameValue(fK2, 0.0) then\n        begin\n          if SameValue(fK1, 0.0) then Exit;\n          AInputValue := (AValue - fOffset) / fK1;\n          Exit(True);\n        end;\n        { Выбираем корень, ближайший к линейной оценке. }\n        lDiscriminant := Sqr(fK1) - 4 * fK2 * (fOffset - AValue);\n        if lDiscriminant < 0 then Exit;\n        lRoot1 := (-fK1 + Sqrt(lDiscriminant)) / (2 * fK2);\n        lRoot2 := (-fK1 - Sqrt(lDiscriminant)) / (2 * fK2);\n        if not SameValue(fK1, 0.0) then\n          lLinearEstimate := (AValue - fOffset) / fK1\n        else\n          lLinearEstimate := 0.0;\n        if Abs(lRoot1 - lLinearEstimate) <= Abs(lRoot2 - lLinearEstimate) then\n          AInputValue := lRoot1\n        else\n          AInputValue := lRoot2;\n        Result := True;\n      end;\n    rckPiecewiseLinear:\n      begin\n        if fPoints.Count < 2 then\n          Exit;\n        lFirst := PointAt(0);\n        lLast := PointAt(fPoints.Count - 1);\n        if (lFirst = nil) or (lLast = nil) then\n          Exit;\n        lAscending := lFirst.Y <= lLast.Y;\n        lLeft := 0;\n        lRight := fPoints.Count - 1;\n        while lRight - lLeft > 1 do\n        begin\n          lMid := (lLeft + lRight) div 2;\n          lA := PointAt(lMid);\n          if lA = nil then\n            Exit;\n          if (lA.Y < AValue) = lAscending then\n            lLeft := lMid\n          else\n            lRight := lMid;\n        end;\n\n        if (AValue < Min(lFirst.Y, lLast.Y)) or\n          (AValue > Max(lFirst.Y, lLast.Y)) then\n        begin\n          if not fExtrapolation then\n          begin\n            if Abs(AValue - lFirst.Y) <= Abs(AValue - lLast.Y) then\n              AInputValue := lFirst.X\n            else\n              AInputValue := lLast.X;\n            Exit(True);\n          end;\n          if ((AValue < lFirst.Y) = lAscending) then\n          begin\n            lLeft := 0;\n            lRight := 1;\n          end\n          else\n          begin\n            lLeft := fPoints.Count - 2;\n            lRight := fPoints.Count - 1;\n          end;\n        end;\n\n        lA := PointAt(lLeft);\n        lB := PointAt(lRight);\n        if (lA = nil) or (lB = nil) then\n          Exit;\n        if SameValue(lA.Y, lB.Y) then\n          AInputValue := lA.X\n        else\n          AInputValue := lA.X + (AValue - lA.Y) *\n            (lB.X - lA.X) / (lB.Y - lA.Y);\n        Result := True;\n      end;\n    rckPolynomial:\n      Exit;\n  end;\nend;\n\nprocedure TRecorderCalibration.ClearPoints;\nvar\n  I: Integer;\nbegin\n  for I := 0 to fPoints.Count - 1 do\n    TObject(fPoints[I]).Free;\n  fPoints.Clear;\nend;\n\nfunction TRecorderCalibration.PointAt(AIndex: Integer): TRecorderCalibrationPoint;\nbegin\n  Result := GetPoint(AIndex);\nend;\n\nfunction TRecorderCalibration.GetPoint(AIndex: Integer): TRecorderCalibrationPoint;\nbegin\n  if (AIndex >= 0) and (AIndex < fPoints.Count) then\n    Result := TRecorderCalibrationPoint(fPoints[AIndex])\n  else\n    Result := nil;\nend;\n\nfunction TRecorderCalibration.GetPointCount: Integer;\nbegin\n  Result := fPoints.Count;\nend;\n\n{ TRecorderCalibrationList }\n\nconstructor TRecorderCalibrationList.Create;\nbegin\n  inherited Create;\n  fList := TList.Create;\nend;\n\ndestructor TRecorderCalibrationList.Destroy;\nbegin\n  Clear;\n  fList.Free;\n  inherited Destroy;\nend;\n\nprocedure TRecorderCalibrationList.Add(ACalibration: TRecorderCalibration);\nbegin\n  fList.Add(ACalibration);\nend;\n\nprocedure TRecorderCalibrationList.AddCopy(ACalibration: TRecorderCalibration);\nbegin\n  if ACalibration <> nil then\n    Add(ACalibration.Clone);\nend;\n\nprocedure TRecorderCalibrationList.Delete(AIndex: Integer);\nbegin\n  if (AIndex >= 0) and (AIndex < fList.Count) then\n  begin\n    TObject(fList[AIndex]).Free;\n    fList.Delete(AIndex);\n  end;\nend;\n\nprocedure TRecorderCalibrationList.Exchange(AIndex1, AIndex2: Integer);\nbegin\n  fList.Exchange(AIndex1, AIndex2);\nend;\n\nprocedure TRecorderCalibrationList.Clear;\nvar\n  I: Integer;\nbegin\n  for I := 0 to fList.Count - 1 do\n    TObject(fList[I]).Free;\n  fList.Clear;\nend;\n\nfunction TRecorderCalibrationList.GetCount: Integer;\nbegin\n  Result := fList.Count;\nend;\n\nfunction TRecorderCalibrationList.GetItem(AIndex: Integer): TRecorderCalibration;\nbegin\n  if (AIndex >= 0) and (AIndex < fList.Count) then\n    Result := TRecorderCalibration(fList[AIndex])\n  else\n    Result := nil;\nend;\n\nend.\n", "sha256": "a2306124290fd5687f05e1c3e424cbd3b886a5265cb3cf4a0d016399dfa62f3b"}, "Core/uRecorderDataSources.pas": {"text": "unit uRecorderDataSources;\n\n{\n  Модуль uRecorderDataSources\n\n  Назначение:\n    Базовый слой источников данных RecorderLnx. Источник данных создает свои теги,\n    запускается/останавливается и по вызову Tick публикует новые значения в\n    TRecorderTagRegistry.\n\n  Место в архитектуре:\n    Core/domain. Модуль не зависит от LCL, устройств, файлов записи и потоков UI.\n    Поточный сбор данных надстроен отдельным runner-классом: рабочий поток\n    вызывает Tick источника с его UpdateTimeMs и не знает деталей устройства.\n\n  Владение:\n    Manager хранит источники и при ConfigureTags передаёт тегам resolver для\n    GetSource. Registry используется как фабрика тегов, но не маршрутизирует\n    запросы источника. Clear снимает привязки до уничтожения контекстов; замена\n    источника сохраняет manager и возвращает актуальный экземпляр по SourceId.\n    Настройки источника доступны в Stop без подключения к оборудованию.\n    GetUnits/GetUnitNames читают метаданные; CanSetUnits проверяет запрос без\n    изменения тега. SetUnits меняет режим конкретного канала, UpdateScales\n    обновляет подготовленный расчёт без подключения и сброса устройства.\n    Эти операции принадлежат общему интерфейсу и virtual/override базового\n    класса. Частные интерфейсы единиц и проверки единиц не добавлять.\n}\n\n{$mode objfpc}{$H+}\n{$codepage UTF8}\n\ninterface\n\nuses\n  Classes, SysUtils,\n  uRecorderTags, uRecorderMessages, uMeraFile, uRecorderDebugLog;\n\ntype\n  TRecorderZeroBalanceTraceEvent = procedure(const AText: string) of object;\n\n  { Базовый класс исключения для источников данных }\n  ERecorderDataSourceError = class(Exception);\n\n  { Состояние источника данных. }\n  TRecorderDataSourceState = (\n    dssStopped,  { Источник остановлен }\n    dssRunning   { Источник запущен и опрашивается }\n  );\n\n  { IRecorderDataSource\n    Минимальный интерфейс источника данных.\n    SourceId     - идентификатор источника (свойство; у MIC-140 из host:port).\n    Name         - человекочитаемое имя для логов и UI.\n    UpdateTimeMs - период опроса/генерации данных в миллисекундах.\n    State        - текущее состояние источника. }\n  IRecorderDataSource = interface\n    ['{B955E78D-DA62-48CC-8B3D-93372C82A06F}']\n    { Возвращает стабильный идентификатор источника }\n    function GetSourceId: string;\n    { Возвращает отображаемое имя источника }\n    function GetName: string;\n    { Возвращает период опроса/обновления данных в мс }\n    function GetUpdateTimeMs: Cardinal;\n    { Возвращает текущее состояние источника }\n    function GetState: TRecorderDataSourceState;\n    { Создает/подключает теги источника в общем registry.\n      ARegistry - общий реестр тегов проекта. Владение не передается. }\n    procedure ConfigureTags(ARegistry: TRecorderTagRegistry);\n    { Меняет runtime-параметры существующего источника без замены объекта.\n      Вызывается только после остановки worker-потока. }\n    function Reconfigure(AUpdateTimeMs: Cardinal;\n      out AErrorText: string): Boolean;\n    procedure RefreshRuntimeTransforms;\n    { Переводит источник в рабочее состояние. Теги должны быть настроены заранее. }\n    procedure Start;\n    { Подготовка железа/транспорта до старта потока сбора. Метод не обращается\n      к UI и может выполняться в отдельном подготовительном потоке. }\n    procedure PrepareHardware;\n    { Останавливает источник. Вызывается только из worker-thread в конце суперцикла. }\n    procedure Stop;\n    { Запрос остановки из внешнего потока: только флаг TryStop, без смены State\n      и без освобождения ресурсов (AGrav: состояние потока меняет сам поток). }\n    procedure RequestStop;\n    { Публикует один шаг данных. В потоковой версии будет вызываться worker-thread. }\n    procedure Tick;\n    { Флаг запрошенной остановки, выставленный RequestStop. }\n    function GetTryStop: Boolean;\n\n    { Единицы — часть общего источника. Специфика реализуется overrides,\n      а не дополнительными интерфейсами под отдельные приборы. }\n    function GetUnits(ATag: TRecorderTag): string;\n    procedure GetUnitNames(ATag: TRecorderTag; AUnitNames: TStrings);\n    function CanSetUnits(ATag: TRecorderTag; const AUnitName: string;\n      out AErrorText: string): Boolean;\n    function SetUnits(ATag: TRecorderTag; const AUnitName: string;\n      out AErrorText: string): Boolean;\n    procedure UpdateScales(ATag: TRecorderTag);\n\n    property SourceId: string read GetSourceId;\n    property Name: string read GetName;\n    property UpdateTimeMs: Cardinal read GetUpdateTimeMs;\n    property State: TRecorderDataSourceState read GetState;\n    property TryStop: Boolean read GetTryStop;\n  end;\n\n  { IRecorderZeroBalanceSupport\n    Опциональный интерфейс источника данных для аппаратной/программной балансировки нуля. }\n  IRecorderZeroBalanceSupport = interface\n    ['{E4C9A1B2-7D3F-4E5A-9B8C-1A2B3C4D5E6F}']\n    function ZeroBalanceTags(AOwner: TComponent; ATags: TList;\n      AMessages: TStrings): Boolean;\n  end;\n\n  // интерфейс для аппаратной балансировки источника данных - Умею стримить прогресс в UI\n  // IRecorderDevice.ExecuteDeviceAction(rdaZeroBalance) - Низкоуровневое действие драйвера\n  IRecorderZeroBalanceTraceSupport = interface\n    ['{7317C81E-5834-4BD5-AAB4-F12B53F08D8A}']\n    procedure SetZeroBalanceTrace(AHandler: TRecorderZeroBalanceTraceEvent);\n  end;\n\n  { Optional capability for sources which publish non-numeric messages. }\n  IRecorderMessageSource = interface\n    ['{6CBB9F18-3192-40FD-91DE-574919821CBD}']\n    procedure ConfigureMessages(ARegistry: TRecorderMessageRegistry);\n  end;\n\n  { TRecorderDataSourceBase\n    Базовый класс источника данных. Потомки реализуют создание тегов и один\n    шаг генерации/опроса данных в DoCreateTags/DoTick.\n    SourceId — свойство: по умолчанию из fSourceId, потомок может переопределить\n    BuildSourceId (например MIC-140 из host:port). }\n  TRecorderDataSourceBase = class(TInterfacedObject, IRecorderDataSource)\n  private\n    fName: string;                          { Имя источника }\n    fRegistry: TRecorderTagRegistry;        { Ссылка на реестр тегов }\n    fSourceId: string;                      { Базовый/сохранённый идентификатор }\n    fState: TRecorderDataSourceState;       { Состояние источника }\n    fTryStop: Boolean;                      { Запрос остановки из внешнего потока }\n    fUpdateTimeMs: Cardinal;                { Период опроса в мс }\n  protected\n    { Вычисляет SourceId. База — fSourceId; MIC-140 и др. — из endpoint. }\n    function BuildSourceId: string; virtual;\n    function GetSourceId: string; virtual;\n    function GetName: string;\n    function GetUpdateTimeMs: Cardinal;\n    function GetState: TRecorderDataSourceState;\n    function GetTryStop: Boolean;\n    { Точка проверки в DoTick: True, если суперцикл должен завершиться. }\n    function ShouldStop: Boolean;\n\n    { Проверяет, что registry уже подключен, и возвращает его. }\n    function RequireRegistry: TRecorderTagRegistry;\n\n    { Потомок создает или находит нужные ему теги. }\n    procedure DoCreateTags(ARegistry: TRecorderTagRegistry); virtual; abstract;\n\n    { Потомок публикует один шаг данных. }\n    procedure DoTick; virtual; abstract;\n\n    property Registry: TRecorderTagRegistry read fRegistry;\n  public\n    { Конструктор базового класса\n      ASourceId     - стабильный идентификатор источника.\n      AName         - имя источника для UI/логов.\n      AUpdateTimeMs - период обновления, должен быть больше нуля. }\n    constructor Create(const ASourceId, AName: string; AUpdateTimeMs: Cardinal);\n\n    { Настройка реестра тегов }\n    procedure ConfigureTags(ARegistry: TRecorderTagRegistry); virtual;\n    function Reconfigure(AUpdateTimeMs: Cardinal;\n      out AErrorText: string): Boolean; virtual;\n    procedure RefreshRuntimeTransforms; virtual;\n    function GetUnits(ATag: TRecorderTag): string; virtual;\n    procedure GetUnitNames(ATag: TRecorderTag; AUnitNames: TStrings); virtual;\n    function CanSetUnits(ATag: TRecorderTag; const AUnitName: string;\n      out AErrorText: string): Boolean; virtual;\n    function SetUnits(ATag: TRecorderTag; const AUnitName: string;\n      out AErrorText: string): Boolean; virtual;\n    procedure UpdateScales(ATag: TRecorderTag); virtual;\n    { Запуск источника }\n    procedure Start; virtual;\n    { Подготовка железа/транспорта до старта потока сбора. UI использовать нельзя. }\n    procedure PrepareHardware; virtual;\n    { Остановка источника (только из worker-thread) }\n    procedure Stop; virtual;\n    { Запрос остановки из внешнего потока }\n    procedure RequestStop; virtual;\n    { Выполнение одного шага опроса/генерации }\n    procedure Tick; virtual;\n\n    property SourceId: string read GetSourceId;\n    property Name: string read GetName;\n    property UpdateTimeMs: Cardinal read GetUpdateTimeMs;\n    property State: TRecorderDataSourceState read GetState;\n    property TryStop: Boolean read GetTryStop;\n  end;\n\n  { TMockSineDataSource\n    Отладочный источник синусоидального сигнала. Он нужен как первый\n    контролируемый поставщик данных для UI, плагинов, записи и тестов. }\n  TMockSineDataSource = class(TRecorderDataSourceBase)\n  private\n    fAmplitude: Double;          { Амплитуда генерируемого сигнала }\n    fFrequencyHz: Double;        { Частота сигнала в герцах }\n    fPhaseRad: Double;           { Начальная фаза в радианах }\n    fSampleIndex: Int64;         { Индекс текущего семпла }\n    fTagName: string;            { Имя целевого тега }\n    fTimeSec: Double;            { Модельное время генератора в секундах }\n    fTag: TRecorderTag;\n    function GetTagName: string;\n  protected\n    { Создание тега синусоиды }\n    procedure DoCreateTags(ARegistry: TRecorderTagRegistry); override;\n    { Вычисление и публикация очередного значения синусоиды }\n    procedure DoTick; override;\n  public\n    { Конструктор генератора синуса\n      ASourceId     - стабильный идентификатор источника.\n      ATagName      - имя тега, куда источник будет писать сигнал.\n      AUpdateTimeMs - период генерации точки.\n      AAmplitude    - амплитуда синусоиды.\n      AFrequencyHz  - частота синусоиды в герцах.\n      APhaseRad     - начальная фаза в радианах. }\n    constructor Create(const ASourceId, ATagName: string; AUpdateTimeMs: Cardinal;\n      AAmplitude, AFrequencyHz: Double; APhaseRad: Double = 0);\n    procedure Start; override;\n\n    property TagName: string read GetTagName;\n    property Amplitude: Double read fAmplitude write fAmplitude;\n    property FrequencyHz: Double read fFrequencyHz write fFrequencyHz;\n    property PhaseRad: Double read fPhaseRad write fPhaseRad;\n    property TimeSec: Double read fTimeSec;\n  end;\n\n  { TRecorderDiagnosticsDataSource }\n  TRecorderDiagnosticsDataSource = class(TRecorderDataSourceBase)\n  private\n    fCpuTagName: string;\n    fLastCpuTime100Ns: QWord;\n    fLastWallTickMs: QWord;\n    {$IFDEF LINUX}\n    fProcSelfStat: TFileStream;\n    fProcSelfStatus: TFileStream;\n    fProcSystemStat: TFileStream;\n    fLastProcessTicks: QWord;\n    fLastSystemTicks: QWord;\n    fMetricsSampleCount: Integer;\n    {$ENDIF}\n    fMemoryTagName: string;\n    fTimeSec: Double;\n    fMemoryTag: TRecorderTag;\n    fCpuTag: TRecorderTag;\n    function GetMemoryTagName: string;\n    function GetCpuTagName: string;\n    function GetProcessCpuUsagePercent: Double;\n    function GetProcessMemoryMb: Double;\n  protected\n    procedure DoCreateTags(ARegistry: TRecorderTagRegistry); override;\n    procedure DoTick; override;\n  public\n    constructor Create(const ASourceId: string; AUpdateTimeMs: Cardinal;\n      const AMemoryTagName: string = 'MemTag'; const ACpuTagName: string = 'CpuUsage');\n    destructor Destroy; override;\n    procedure Start; override;\n\n    property MemoryTagName: string read GetMemoryTagName;\n    property CpuTagName: string read GetCpuTagName;\n  end;\n\n  { TRecorderMeraFileDataSource\n    Встроенный источник воспроизведения файлов MERA. Заменяет старый плагин:\n    выбранные каналы MERA мапятся на теги регистратора, и Tick публикует семплы\n    из файла в TRecorderTagRegistry. }\n  TRecorderMeraFileDataSource = class(TRecorderDataSourceBase)\n  private\n    fBlockLength: Cardinal;               { Размер блока для векторных данных }\n    fFileName: string;                    { Путь к файлу MERA }\n    fLoop: Boolean;                       { Флаг циклического воспроизведения }\n    fPlayRangeMinSec: Double;             { Минимальное время старта среди сигналов }\n    fPlaybackSpeed: Cardinal;             { Коэффициент скорости воспроизведения }\n    fPlaybackSignals: TList;              { Список проигрываемых сигналов TMeraPlaybackSignal }\n    fFirstBlockLogged: Boolean;            { Однократная диагностика фактической публикации }\n    fStartTickMs: QWord;                  { Системное время старта воспроизведения }\n    fSelectedTagNames: TStringList;       { Список выбранных адресов каналов }\n    function IsSignalSelected(ASignal: TMeraSignalInfo): Boolean;\n    function IsSignalTagSelected(const ATagName: string): Boolean;\n  protected\n    { Создание тегов для всех выбранных сигналов MERA }\n    procedure DoCreateTags(ARegistry: TRecorderTagRegistry); override;\n    { Считывание очередных порций данных и публикация в реестр тегов }\n    procedure DoTick; override;\n  public\n    { Конструктор источника воспроизведения файлов MERA }\n    constructor Create(const ASourceId, AFileName: string; AUpdateTimeMs: Cardinal;\n      ASelectedTagNames: TStrings = nil; ABlockLength: Cardinal = 128;\n      APlaybackSpeed: Cardinal = 1);\n    { Деструктор закрывает файлы и очищает структуры }\n    destructor Destroy; override;\n    { Открытие файлов и подготовка воспроизведения }\n    procedure Start; override;\n    { Закрытие файлов и очистка проигрывателей }\n    procedure Stop; override;\n\n    property FileName: string read fFileName;\n    property BlockLength: Cardinal read fBlockLength;\n    property LoopPlayback: Boolean read fLoop write fLoop;\n    property PlaybackSpeed: Cardinal read fPlaybackSpeed;\n  end;\n\n  { TRecorderDataSourceThread\n    Рабочий поток одного источника данных. Поток хранит interface-ссылку на\n    источник, вызывает Start, затем Tick с паузой UpdateTimeMs до Terminate.\n    Все события данных публикуются в потоке источника; UI обязан принимать их\n    через будущий dispatcher, а не менять LCL-компоненты напрямую. }\n  TRecorderDataSourceThread = class(TThread)\n  private\n    fLastErrorMessage: string;         { Текст последней ошибки потока }\n    fSource: IRecorderDataSource;      { Ссылка на источник данных }\n    fTickCount: Int64;                 { Счетчик выполненных тиков }\n    procedure SleepInterruptible(AMilliseconds: Cardinal);\n  protected\n    { Главный цикл потока }\n    procedure Execute; override;\n  public\n    { Конструктор потока\n      ASource - источник данных. Поток хранит interface-ссылку, поэтому объект\n      источника нельзя освобождать вручную, пока thread существует. }\n    constructor Create(const ASource: IRecorderDataSource);\n\n    property Source: IRecorderDataSource read fSource;\n    property TickCount: Int64 read fTickCount;\n    property LastErrorMessage: string read fLastErrorMessage;\n  end;\n\n  { TRecorderDataSourceManager\n    Реестр и групповой runner источников данных. Manager хранит interface-ссылки\n    на источники, настраивает их теги, запускает отдельный TRecorderDataSourceThread\n    на каждый источник и останавливает все потоки как одну группу.\n    Важно: manager не является владельцем TRecorderTagRegistry и не занимается UI.\n    Его задача - lifecycle источников сбора данных. }\n  TRecorderDataSourceManager = class\n  private type\n    { Внутренний контекст источника данных }\n    TSourceContext = class\n    public\n      Source: IRecorderDataSource;       { Ссылка на источник }\n      Thread: TRecorderDataSourceThread; { Поток-опрашиватель источника }\n      Enabled: Boolean;                  { Разрешён ли сбор с источника }\n      PrepareError: string;              { Ошибка подготовки без исключения в UI }\n      Prepared: Boolean;\n      function NeedsPrepareHardware: Boolean;\n      procedure PrepareHardware;\n    end;\n  private\n    fLastErrors: TStringList;           { Ошибки потоков после останова }\n    fRegistry: TRecorderTagRegistry;    { Ссылка на реестр тегов }\n    fMessageRegistry: TRecorderMessageRegistry;\n    fRunning: Boolean;                  { Флаг активности опроса }\n    fSources: TList;                    { Список контекстов источников (TSourceContext) }\n    function ResolveTagSource(const ASourceId: string): IInterface;\n    function GetLastError(AIndex: Integer): string;\n    function GetLastErrorCount: Integer;\n    function GetSource(AIndex: Integer): IRecorderDataSource;\n    function GetSourceContext(AIndex: Integer): TSourceContext;\n    function GetSourceCount: Integer;\n  public\n    { Создание менеджера }\n    constructor Create;\n    { Уничтожение менеджера с остановкой всех потоков }\n    destructor Destroy; override;\n\n    { Добавляет источник в manager.\n      ASource - источник данных. Manager хранит interface-ссылку. }\n    procedure AddSource(const ASource: IRecorderDataSource;\n      AEnabled: Boolean = True);\n    procedure SetSourceEnabled(const ASourceId: string; AEnabled: Boolean);\n    procedure ReplaceSource(const ASource: IRecorderDataSource;\n      AEnabled: Boolean = True; APrepareNow: Boolean = True);\n    procedure RemoveSource(const ASourceId: string);\n\n    { Ищет источник по SourceId без учета регистра. }\n    function FindSource(const ASourceId: string): IRecorderDataSource;\n\n    { Настраивает теги всех источников в общем registry.\n      ARegistry - общий реестр тегов проекта. Владение не передается. }\n    procedure ConfigureTagsAll(ARegistry: TRecorderTagRegistry;\n      AMessageRegistry: TRecorderMessageRegistry = nil);\n\n    { Подключает и программирует оборудование после полной загрузки конфигурации. }\n    procedure PrepareHardwareAll;\n    { Подключает и программирует только явно указанные источники. }\n    procedure PrepareHardwareSources(ASourceIds: TStrings);\n    function ReconfigureAll(AUpdateTimeMs: Cardinal;\n      AErrors: TStrings = nil): Boolean;\n    procedure RefreshSourceRuntimeTransforms(const ASourceId: string);\n\n    { Запускает все источники, создавая отдельный thread-runner на каждый. }\n    procedure StartAll;\n\n    { Останавливает все thread-runner-ы через Terminate/WaitFor и собирает ошибки. }\n    procedure StopAll;\n\n    { Останавливает источники и очищает список. }\n    procedure Clear;\n\n    property Running: Boolean read fRunning;\n    property SourceCount: Integer read GetSourceCount;\n    property Sources[AIndex: Integer]: IRecorderDataSource read GetSource;\n    property LastErrorCount: Integer read GetLastErrorCount;\n    property LastErrors[AIndex: Integer]: string read GetLastError;\n  end;\n\n{ Преобразует состояние источника в строковое представление }\nfunction RecorderDataSourceStateToString(AState: TRecorderDataSourceState): string;\n\nimplementation\n\nuses\n  {$IFDEF MSWINDOWS}\n  Windows,\n  {$ENDIF}\n  Math, LazFileUtils, uRecorderConfiguredDataSources, uSharedAsync,\n  uRecorderHardwareLiveDevices, uRecorderUnitManager;\n\n{$IFDEF MSWINDOWS}\ntype\n  { WinAPI-счетчики процесса нужны только для Windows-диагностики памяти. }\n  TProcessMemoryCounters = record\n    cb: DWORD;\n    PageFaultCount: DWORD;\n    PeakWorkingSetSize: PtrUInt;\n    WorkingSetSize: PtrUInt;\n    QuotaPeakPagedPoolUsage: PtrUInt;\n    QuotaPagedPoolUsage: PtrUInt;\n    QuotaPeakNonPagedPoolUsage: PtrUInt;\n    QuotaNonPagedPoolUsage: PtrUInt;\n    PagefileUsage: PtrUInt;\n    PeakPagefileUsage: PtrUInt;\n  end;\n\nfunction GetProcessMemoryInfo(Process: THandle; var Counters: TProcessMemoryCounters;\n  Size: DWORD): BOOL; stdcall; external 'psapi.dll';\n{$ENDIF}\n\n{$IFDEF LINUX}\ntype\n  TProcBuffer = array[0..4095] of Char;\n\nfunction ReadProcBuffer(AStream: TFileStream; out ABuffer: TProcBuffer;\n  out ALength: Integer): Boolean;\nbegin\n  Result := False;\n  ALength := 0;\n  if AStream = nil then\n    Exit;\n  try\n    AStream.Position := 0;\n    ALength := AStream.Read(ABuffer[0], SizeOf(ABuffer) - 1);\n    ABuffer[ALength] := #0;\n    Result := ALength > 0;\n  except\n    ALength := 0;\n  end;\nend;\n\nfunction ParseProcUnsigned(var ACursor: PChar; AEnd: PChar;\n  out AValue: QWord): Boolean;\nbegin\n  AValue := 0;\n  while (ACursor < AEnd) and (ACursor^ in [' ', #9]) do Inc(ACursor);\n  Result := (ACursor < AEnd) and (ACursor^ in ['0'..'9']);\n  while (ACursor < AEnd) and (ACursor^ in ['0'..'9']) do\n  begin\n    AValue := AValue * 10 + Ord(ACursor^) - Ord('0');\n    Inc(ACursor);\n  end;\nend;\n{$ENDIF}\n\nfunction RecorderDataSourceStateToString(AState: TRecorderDataSourceState): string;\nbegin\n  case AState of\n    dssStopped:\n      Result := 'Stopped';\n    dssRunning:\n      Result := 'Running';\n  else\n    Result := 'Unknown';\n  end;\nend;\n\n{ TRecorderDataSourceBase }\n\nconstructor TRecorderDataSourceBase.Create(const ASourceId, AName: string;\n  AUpdateTimeMs: Cardinal);\nbegin\n  inherited Create;\n  if ASourceId = '' then\n    raise ERecorderDataSourceError.Create('Data source id cannot be empty');\n  if AName = '' then\n    raise ERecorderDataSourceError.Create('Data source name cannot be empty');\n  if AUpdateTimeMs = 0 then\n    raise ERecorderDataSourceError.Create('Data source update time must be positive');\n\n  fSourceId := ASourceId;\n  fName := AName;\n  fUpdateTimeMs := AUpdateTimeMs;\n  fState := dssStopped;\nend;\n\nfunction TRecorderDataSourceBase.BuildSourceId: string;\nbegin\n  Result := fSourceId;\nend;\n\nfunction TRecorderDataSourceBase.GetSourceId: string;\nbegin\n  Result := BuildSourceId;\nend;\n\nfunction TRecorderDataSourceBase.GetName: string;\nbegin\n  Result := fName;\nend;\n\nfunction TRecorderDataSourceBase.GetUpdateTimeMs: Cardinal;\nbegin\n  Result := fUpdateTimeMs;\nend;\n\nfunction TRecorderDataSourceBase.GetState: TRecorderDataSourceState;\nbegin\n  Result := fState;\nend;\n\nfunction TRecorderDataSourceBase.GetTryStop: Boolean;\nbegin\n  Result := fTryStop;\nend;\n\nfunction TRecorderDataSourceBase.ShouldStop: Boolean;\nbegin\n  Result := fTryStop;\nend;\n\nfunction TRecorderDataSourceBase.RequireRegistry: TRecorderTagRegistry;\nbegin\n  if fRegistry = nil then\n    raise ERecorderDataSourceError.CreateFmt(\n      'Data source %s tags are not configured', [fSourceId]);\n  Result := fRegistry;\nend;\n\nprocedure TRecorderDataSourceBase.ConfigureTags(ARegistry: TRecorderTagRegistry);\nbegin\n  if ARegistry = nil then\n    raise ERecorderDataSourceError.Create('Tag registry cannot be nil');\n  if fState <> dssStopped then\n    raise ERecorderDataSourceError.CreateFmt(\n      'Data source %s cannot configure tags while running', [fSourceId]);\n\n  fRegistry := ARegistry;\n  DoCreateTags(ARegistry);\nend;\n\nfunction TRecorderDataSourceBase.Reconfigure(AUpdateTimeMs: Cardinal;\n  out AErrorText: string): Boolean;\nbegin\n  AErrorText := '';\n  if AUpdateTimeMs = 0 then\n  begin\n    AErrorText := 'Data source update period must be positive';\n    Exit(False);\n  end;\n  if fState <> dssStopped then\n  begin\n    AErrorText := 'Stop data source before reconfiguration';\n    Exit(False);\n  end;\n  fUpdateTimeMs := AUpdateTimeMs;\n  Result := True;\nend;\n\nprocedure TRecorderDataSourceBase.Start;\nbegin\n  RequireRegistry;\n  fTryStop := False;\n  fState := dssRunning;\nend;\n\nprocedure TRecorderDataSourceBase.PrepareHardware;\nbegin\nend;\n\nprocedure TRecorderDataSourceBase.RequestStop;\nbegin\n  fTryStop := True;\nend;\n\nprocedure TRecorderDataSourceBase.Stop;\nbegin\n  fState := dssStopped;\n  fTryStop := False;\nend;\n\nprocedure TRecorderDataSourceBase.Tick;\nbegin\n  if fState <> dssRunning then\n    raise ERecorderDataSourceError.CreateFmt(\n      'Data source %s tick called while stopped', [fSourceId]);\n  if fTryStop then\n    Exit;\n\n  DoTick;\nend;\n\n{ TMockSineDataSource }\n\nconstructor T
