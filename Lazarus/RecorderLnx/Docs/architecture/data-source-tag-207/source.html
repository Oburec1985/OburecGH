 in the per-channel dialog instead of imposing the mode\n    // inferred from the first source tag on every channel.\n    if Trim(lTag.SourceValueMode) = '' then\n      lTag.SourceValueMode := RecorderMic140OutputModeToConfigName(fOutputMode);\n    if Trim(lTag.UnitName) = '' then\n      lTag.UnitName := RecorderMic140OutputModeUnitName(fOutputMode);\n    lTag.ModuleType := lChannel.ModuleType;\n    lTag.PollFrequencyHz := lChannel.PollFrequencyHz;\n    lTag.SourceId := SourceId;\n    if RecorderMic140TryGetChannelSettings(ARegistry, lTag, lChannelNumber,\n      lSettings) then\n      RecorderMic140ApplyTagOutputPresentation(lTag, lSettings)\n    else\n    begin\n      if SameText(lTag.SourceValueMode, 'degC') then\n        lTag.SourceHardwareOutputUnitName := 'degC'\n      else lTag.SourceHardwareOutputUnitName := 'mV';\n      lTag.SourceUnitName := lTag.SourceHardwareOutputUnitName;\n    end;\n    if lCreated or (Trim(lTag.Description) = '') then\n      lTag.Description := Format('MIC-140 channel %s; freq=%s Hz; mode=%s',\n        [lChannel.Address, FormatFloat('0.######', lChannel.PollFrequencyHz),\n         lTag.SourceValueMode]);\n    fChannelTagNames[I] := lTag.Name;\n  end;\nend;\n\nprocedure TRecorderMic140DataSource.PrepareHardware;\nvar\n  I: Integer;\n  lChannelNumber: Integer;\n  lCalibrationName: string;\n  lFirmware: TRecorderMic140LegacyFirmware;\n  lSettings: TRecorderMic140ChannelSettings;\n  lConfig: TRecorderMic140SourceConfig;\n  lTag: TRecorderTag;\n  lTestError: string;\n  lHost: string;\n  lPort: Word;\nbegin\n  if RecorderHardwareConsumeSourceResetRequest(SourceId) then\n  begin\n    fHardwarePrepared := False;\n    fHardwarePrepareAttempted := False;\n    fConfigured := False;\n  end;\n  if fHardwarePrepared then\n  begin\n    if RecorderHardwareSafeTestDeviceLink(fDevice, lTestError) then\n    begin\n      RecorderHardwareClearSourceOffline(SourceId);\n      Exit;\n    end;\n    { Потерянная сессия не должна участвовать в опросе. Повторная тяжёлая\n      инициализация разрешена только после явного сброса устройства. }\n    fHardwarePrepared := False;\n    fConfigured := False;\n    fHardwarePrepareAttempted := True;\n    RecorderHardwareMarkSourceOffline(SourceId, lTestError);\n    PublishDiagnostics(CMic140StatusError, 'connection test failed: ' +\n      lTestError, True);\n    Exit;\n  end;\n  if fHardwarePrepareAttempted then\n    Exit;\n  fHardwarePrepareAttempted := True;\n  PublishDiagnostics(CMic140StatusDisconnected, 'connecting', True);\n  { Connect is the link test for the new session. MIC-140 accepts one owner;\n    a separate TCP probe here races with the immediately following working\n    connection and can make an available controller look offline. }\n  fDevice.Connect;\n  if fDevice.State = rdsDisconnected then\n  begin\n    lTestError := 'connection failed';\n    if RecorderMic140ResolveEndpoint(Registry, SourceId, lHost, lPort) then\n      lTestError := Format('connection failed for %s:%d', [lHost, lPort]);\n    RecorderHardwareMarkSourceOffline(SourceId, lTestError);\n    PublishDiagnostics(CMic140StatusError, lTestError, True);\n    Mic140LogWarning(Format('[DataSource:%s] MIC-140 %s',\n      [SourceId, lTestError]));\n    Exit;\n  end;\n  RecorderHardwareClearSourceOffline(SourceId);\n  PublishDiagnostics(CMic140StatusConnected, 'connected', True);\n  RecorderHardwareRegisterLiveDevice(Self, SourceId, fDevice);\n  fDevice.InitializeDevice;\n\n  fDeviceSerial := fMic.GetDeviceSerial;\n  if fMic.GetLegacyFirmware(lFirmware) then\n    Mic140LogWarning(Format(\n      '[DataSource:%s] MIC-140 firmware devSerNo=%u ccSerNo=%u ccType=%u -> hardware calibr serial=%d',\n      [SourceId, lFirmware.DevSerNo, lFirmware.CCSerNo, lFirmware.CCType,\n       fDeviceSerial]))\n  else\n  if fDeviceSerial > 0 then\n    Mic140LogWarning(Format('[DataSource:%s] MIC-140 hardware calibr serial=%d',\n      [SourceId, fDeviceSerial]));\n  if fDeviceSerial > 0 then\n    RecorderMic140SetDeviceSerialForSource(Registry, SourceId, fDeviceSerial);\n  RebuildTemperatureTagNames;\n  if (fDeviceSerial > 0) and (Registry <> nil) then\n  begin\n    RecorderMic140ApplyHardwareCalibrations(Registry, SourceId, fDeviceSerial);\n    RecorderMic140ApplyTInHardwareCalibrations(Registry, SourceId,\n      fDeviceSerial, CMic140Mic140SubRev1, fTemperatureTagNames);\n  end;\n\n  { Serial/GH/channel props (per-tag settings). }\n  if Registry <> nil then\n    for I := 0 to Registry.TagCount - 1 do\n    begin\n      lTag := Registry.Tags[I];\n      if not SameText(lTag.SourceId, SourceId) or\n        (not ParseMic140ChannelNumber(lTag.Address, lChannelNumber)) then\n        Continue;\n      if not RecorderMic140TryGetChannelSettings(Registry, lTag,\n        lChannelNumber, lSettings) then\n      begin\n        RecorderMic140InitChannelSettings(lSettings, lChannelNumber - 1,\n          CMic140Mic140SubRev1);\n        RecorderMic140RestoreChannelSettingsFromTag(Registry, lTag, lSettings);\n      end;\n      fDevice.TrySetDeviceProperty(rdpMic140RangeIndex, lSettings.RangeIndex,\n        lChannelNumber - 1);\n      fDevice.TrySetDeviceProperty(rdpMic140CommutIndex, lSettings.CommutIndex,\n        lChannelNumber - 1);\n      RecorderMic140ApplyTagOutputPresentation(lTag, lSettings);\n      if not RecorderMic140ChannelUsesTemperature(lSettings) then\n        Continue;\n      RecorderMic140EnsureThermoCompensationForSource(Registry, SourceId);\n      lCalibrationName := RecorderMic140EnsureThermocoupleCalibration(Registry,\n        lSettings);\n      if lCalibrationName = '' then\n      begin\n        Mic140LogWarning(Format(\n          '[DataSource:%s] MIC-140 thermocouple curve was not loaded: tag=%s SDB=%s csv=%s',\n          [SourceId, lTag.Name, lSettings.ThermocoupleScalePath,\n           RecorderMeraThermocoupleCsvPath(lSettings.ThermocoupleScalePath)]));\n        Continue;\n      end;\n      RecorderMic140UpdateChannelSettings(Registry, lTag, lSettings);\n      lTag.SourceValueMode := RecorderMic140OutputModeToConfigName(momTemperatureC);\n      if lTag.AutoUnit then\n        lTag.UnitName := RecorderMic140OutputModeUnitName(momTemperatureC);\n      Mic140LogWarning(Format('[DataSource:%s] MIC-140 thermocouple curve ready: tag=%s SDB=%s',\n        [SourceId, lTag.Name, lSettings.ThermocoupleScalePath]));\n    end;\n\n  { Device-level (source config) channel props. }\n  lConfig := FindRecorderMic140DeviceConfig(Registry, SourceId);\n  if (lConfig <> nil) and (fMic <> nil) then\n  begin\n    for I := 0 to lConfig.ChannelCount - 1 do\n    begin\n      if I <= High(lConfig.ChannelSettings) then\n        lSettings := lConfig.ChannelSettings[I]\n      else\n        RecorderMic140InitChannelSettings(lSettings, I, CMic140Mic140SubRev1);\n      fMic.TrySetDeviceProperty(rdpMic140RangeIndex, lSettings.RangeIndex, I);\n      fMic.TrySetDeviceProperty(rdpMic140CommutIndex, lSettings.CommutIndex, I);\n      fMic.TrySetDeviceProperty(rdpMic140BoardCommutIndex, lConfig.BoardCommutIndex, I);\n    end;\n  end;\n\n  { ConfigureDevice runs exactly once per Connect/Disconnect cycle. Start is\n    intentionally not called here - the worker thread calls Start() itself. }\n  if not fConfigured then\n  begin\n    fDevice.ConfigureDevice;\n    fConfigured := fDevice.State = rdsProgrammed;\n  end;\n  if not fConfigured then\n  begin\n    PublishDiagnostics(CMic140StatusError, 'programming failed', True);\n    Exit;\n  end;\n  PublishDiagnostics(CMic140StatusProgrammed, 'programmed', True);\n  fHardwarePrepared := True;\nend;\n\nprocedure TRecorderMic140DataSource.Start;\nbegin\n  inherited Start;\n  fGoodBlockCount := 0;\n  fReadFailCount := 0;\n  fCjcActiveLogWritten := False;\n  fCjcCorrectLogWritten := False;\n  fTemperatureModeWarningLogged := False;\n  fPublishedCorruptCount := 0;\n  fLastAuxRevision := 0;\n  fLastPublishedUtsGeneration := 0;\n  fLastPublishedBlockEndTimeSec := -1.0;\n  ResetLogicalBlock;\n  if (not fHardwarePrepared) or (fDevice = nil) then\n  begin\n    if fHardwarePrepareAttempted then\n      Mic140LogWarning(Format(\n        '[DataSource:%s] MIC-140 source is not prepared; preview will continue without device samples',\n        [SourceId]));\n    Exit;\n  end;\n  if fDevice.State <> rdsProgrammed then\n    Exit;\n  { Rebuild on every acquisition start, including a previously prepared or\n    explicitly reset device. GX errors belong to this logical phase, outside\n    the device.Start error handler and hardware status reporting. }\n  BuildRuntimeCache;\n  try\n    fDevice.Start;\n  except\n    on E: Exception do\n    begin\n      RecorderHardwareMarkSourceOffline(SourceId, E.Message);\n      PublishDiagnostics(CMic140StatusError, 'start failed: ' + E.Message, True);\n      Exit;\n    end;\n  end;\n  if fDevice.State = rdsStarted then\n    PublishDiagnostics(CMic140StatusStarted, 'started', True)\n  else\n  begin\n    RecorderHardwareMarkSourceOffline(SourceId, 'start failed');\n    PublishDiagnostics(CMic140StatusError, 'start failed', True);\n    Mic140LogWarning(Format(\n      '[DataSource:%s] MIC-140 source is not started; preview will continue without device samples',\n      [SourceId]));\n  end;\nend;\n\nfunction TRecorderMic140DataSource.Reconfigure(AUpdateTimeMs: Cardinal;\n  out AErrorText: string): Boolean;\nbegin\n  Result := inherited Reconfigure(AUpdateTimeMs, AErrorText);\n  if not Result then\n    Exit;\n  if fDevice = nil then\n    Exit(True);\n  try\n    if not fDevice.TrySetDeviceProperty(rdpUpdateTimeMs,\n      Integer(UpdateTimeMs)) then\n    begin\n      AErrorText := 'MIC-140 update period is not supported';\n      Exit(False);\n    end;\n    if not fHardwarePrepared then\n      Exit(True);\n    fDevice.ConfigureDevice;\n    fConfigured := fDevice.State = rdsProgrammed;\n    if not fConfigured then\n    begin\n      AErrorText := 'MIC-140 reconfiguration failed';\n      Exit(False);\n    end;\n    Result := True;\n  except\n    on E: Exception do\n    begin\n      AErrorText := E.ClassName + ': ' + E.Message;\n      Result := False;\n    end;\n  end;\nend;\n\nprocedure TRecorderMic140DataSource.RequestStop;\nbegin\n  inherited RequestStop;\n  if fMic <> nil then\n    fMic.RequestStopAcquisition;\nend;\n\nprocedure TRecorderMic140DataSource.Stop;\nbegin\n  if (fMic <> nil) and (fGoodBlockCount > 0) then\n    Mic140LogWarning(Format(\n      '[DataSource:%s] MIC-140 stream stop: published=%d read=%d readGaps=%d dupRead=%d corruptRead=%d corruptPublish=%d mdpResync=%d',\n      [SourceId, fGoodBlockCount, fMic.LegacyStreamReadCount,\n       fMic.LegacyNumBuffGapCount, fMic.LegacyDuplicateNumBuffCount,\n       fMic.LegacyCorruptReadCount, fPublishedCorruptCount,\n       fMic.LegacyMdpResyncByteCount]));\n  if fDevice <> nil then\n  begin\n    try\n      fDevice.Stop;\n    except\n      on E: Exception do\n        PublishDiagnostics(CMic140StatusError, 'device stop failed: ' + E.Message, True);\n    end;\n  end;\n  inherited Stop;\n  { Stop завершает только сбор. TCP-сессия, Init и применённая конфигурация\n    сохраняются для следующего Preview. Disconnect выполняется в Destroy либо\n    при явном сбросе устройства. }\n  if (fDevice <> nil) and (fDevice.State = rdsProgrammed) then\n    PublishDiagnostics(CMic140StatusProgrammed, 'stopped; programmed', True);\nend;\n\nfunction TRecorderMic140DataSource.Mic140PublishedCodeInRecorderRange(\n  AChannelIndex: Integer; AValue: Double): Boolean;\nbegin\n  if AChannelIndex < 48 then\n    Result := Mic140v2CodeInRecorderProfile(Round(AValue), AChannelIndex)\n  else\n    Result := True;\nend;\n\nprocedure TRecorderMic140DataSource.CheckPublishedRecorderCodes(\n  const ABlock: TRecorderDeviceSampleBlock);\nvar\n  lChannel: Integer;\n  lSample: Integer;\n  lBad: Integer;\n  lFirstChannel: Integer;\n  lFirstSample: Integer;\n  lFirstValue: Double;\n  lExpectedCode: Integer;\n  lExpected: string;\nbegin\n  if ABlock.SampleCount <= 0 then\n    Exit;\n  lBad := 0;\n  lFirstChannel := -1;\n  lFirstSample := -1;\n  lFirstValue := 0.0;\n  for lChannel := 0 to Min(ABlock.ChannelCount, 48) - 1 do\n  begin\n    if lChannel >= Length(ABlock.Values) then\n      Break;\n    for lSample := 0 to ABlock.SampleCount - 1 do\n    begin\n      if lSample >= Length(ABlock.Values[lChannel]) then\n        Break;\n      if not Mic140PublishedCodeInRecorderRange(lChannel,\n        ABlock.Values[lChannel][lSample]) then\n      begin\n        Inc(lBad);\n        if lFirstChannel < 0 then\n        begin\n          lFirstChannel := lChannel;\n          lFirstSample := lSample;\n          lFirstValue := ABlock.Values[lChannel][lSample];\n        end;\n      end;\n    end;\n  end;\n\n  if lBad <= 0 then\n    Exit;\n  Inc(fPublishedCorruptCount);\n  if Mic140v2RecorderReferenceCode(lFirstChannel, lExpectedCode) then\n    lExpected := Format('%d +/-20', [lExpectedCode])\n  else\n    lExpected := 'Recorder reference +/-20';\n  if (fPublishedCorruptCount <= 20) or ((fPublishedCorruptCount mod 20) = 0) then\n    Mic140LogWarning(Format(\n      '[DataSource:%s] MIC-140 code quality violation: publish=%d bad=%d first=ch%d sample=%d raw=%.0f expected=%s',\n      [SourceId, fGoodBlockCount, lBad, lFirstChannel + 1, lFirstSample,\n       lFirstValue, lExpected]));\nend;\n\nprocedure TRecorderMic140DataSource.CheckPublishedTinCodes(\n  const AAux: TMic140AuxTemperatureBlock);\nconst\n  CTinRefCount = 2;\n  CTinRecorderReference: array[0..CTinRefCount - 1] of Integer = (7650, 7800);\n  CTolerance = 400;\nvar\n  lChannel: Integer;\n  lSample: Integer;\n  lBad: Integer;\n  lFirstChannel: Integer;\n  lFirstSample: Integer;\n  lFirstValue: Double;\n  lPreview: string;\nbegin\n  if AAux.SampleCount <= 0 then\n    Exit;\n  lBad := 0;\n  lFirstChannel := -1;\n  lFirstSample := -1;\n  lFirstValue := 0.0;\n  for lChannel := 0 to Min(AAux.ChannelCount, CTinRefCount) - 1 do\n  begin\n    if lChannel >= Length(AAux.Values) then\n      Break;\n    for lSample := 0 to AAux.SampleCount - 1 do\n    begin\n      if lSample >= Length(AAux.Values[lChannel]) then\n        Break;\n      if (lChannel >= Length(AAux.Valid)) or\n        (lSample >= Length(AAux.Valid[lChannel])) or\n        (not AAux.Valid[lChannel][lSample]) or\n        (Abs(Round(AAux.Values[lChannel][lSample]) -\n          CTinRecorderReference[lChannel]) > CTolerance) then\n      begin\n        Inc(lBad);\n        if lFirstChannel < 0 then\n        begin\n          lFirstChannel := lChannel;\n          lFirstSample := lSample;\n          lFirstValue := AAux.Values[lChannel][lSample];\n        end;\n      end;\n    end;\n  end;\n\n  if (fGoodBlockCount = 1) and (AAux.ChannelCount > 0) then\n  begin\n    lPreview := '';\n    for lChannel := 0 to Min(AAux.ChannelCount,\n      MIC140v3VisibleTemperatureChannelCount) - 1 do\n    begin\n      if lChannel >= Length(AAux.Values) then\n        Break;\n      if Length(AAux.Values[lChannel]) <= 0 then\n        Continue;\n      if lPreview <> '' then\n        lPreview := lPreview + ',';\n      lPreview := lPreview + Format('T%d=%.0f', [lChannel + 1,\n        AAux.Values[lChannel][0]]);\n    end;\n    if lPreview <> '' then\n      Mic140LogWarning(Format('[DataSource:%s] MIC-140 block1 TIn raw=[%s]',\n        [SourceId, lPreview]));\n  end;\n\n  if lBad <= 0 then\n    Exit;\n  Inc(fPublishedCorruptCount);\n  if (fPublishedCorruptCount <= 20) or ((fPublishedCorruptCount mod 20) = 0) then\n    Mic140LogWarning(Format(\n      '[DataSource:%s] MIC-140 code quality violation: TIn bad=%d first=T%d sample=%d raw=%.0f expected=%d +/-20',\n      [SourceId, lBad, lFirstChannel + 1, lFirstSample, lFirstValue,\n       CTinRecorderReference[lFirstChannel]]));\nend;\n\nprocedure TRecorderMic140DataSource.ProcessAndPublishBlock(\n  const ABlock: TRecorderDeviceSampleBlock);\nvar\n  lChannels: TRecorderDeviceChannelArray;\n  lCount: Integer;\n  lI: Integer;\n  lJ: Integer;\n  lTag: TRecorderTag;\n  lCjcChannel: Integer;\n  lCjcTemperatureC: Double;\n  lCjcPipelineActive: Boolean;\n  lCjcMillivolts: Double;\n  lCjcOffsetC: Double;\n  lHardwareCalibration: TRecorderCalibration;\n  lThermocoupleCalibration: TRecorderCalibration;\n  lUseCjc: Boolean;\n  {$IFDEF MIC140_RUNTIME_DIAGNOSTICS}\n  lSum: Double;\n  lPreview: string;\n  lAll48: string;\n  lAll48S1: string;\n  lGood48: Integer;\n  lGood48S1: Integer;\n  {$ENDIF}\n  lRaw: Double;\nbegin\n  EnterCriticalSection(fTransformLock);\n  try\n  { Защита общего тракта от повторной либо переставленной порции. Кольцо\n    устройства обязано отдавать FIFO; перекрывающий блок нельзя второй раз\n    добавлять в теги под новыми границами логической порции. }\n  if (fLastPublishedBlockEndTimeSec >= 0.0) and\n    (ABlock.FirstTimeSec < fLastPublishedBlockEndTimeSec -\n      0.25 / Max(1.0, ABlock.SampleRateHz)) then\n  begin\n    Mic140LogWarning(Format(\n      '[DataSource:%s] MIC-140 out-of-order block skipped: first=%.9f previousEnd=%.9f samples=%d',\n      [SourceId, ABlock.FirstTimeSec, fLastPublishedBlockEndTimeSec,\n       ABlock.SampleCount]));\n    Exit;\n  end;\n  if ABlock.SampleCount > 0 then\n    fLastPublishedBlockEndTimeSec := ABlock.FirstTimeSec +\n      ABlock.SampleCount / Max(1.0, ABlock.SampleRateHz);\n\n  lChannels := fRuntimeChannels;\n  lCount := Min(ABlock.ChannelCount, Length(lChannels));\n  if lCount <= 0 then\n    Exit;\n  Inc(fGoodBlockCount);\n  fReadFailCount := 0;\n  {$IFDEF MIC140_RUNTIME_DIAGNOSTICS}\n  { Полный просмотр каждого кода — диагностика протокола, а не штатная\n    обработка. Он включается только специальной диагностической сборкой. }\n  if (fGoodBlockCount <= 5) or ((fGoodBlockCount mod 100) = 0) then\n    CheckPublishedRecorderCodes(ABlock);\n  {$ENDIF}\n  PublishDiagnostics(CMic140StatusStarted, 'started; data ok', False);\n  PublishBlockCounter(fGoodBlockCount);\n  {$IFDEF MIC140_RUNTIME_DIAGNOSTICS}\n  if (fGoodBlockCount = 1) or ((fGoodBlockCount mod 20) = 0) then\n    Mic140LogWarning(Format('[DataSource:%s] MIC-140 block=%d samples=%d stride=%d rate=%.3f Hz',\n      [SourceId, fGoodBlockCount, ABlock.SampleCount, ABlock.ChannelCount,\n       ABlock.SampleRateHz]));\n  if fGoodBlockCount = 1 then\n  begin\n    lPreview := '';\n    lAll48 := '';\n    lAll48S1 := '';\n    lGood48 := 0;\n    lGood48S1 := 0;\n    for lI := 0 to lCount - 1 do\n    begin\n      if lI < 48 then\n      begin\n        if lI < Length(ABlock.Values) then\n        begin\n          lRaw := ABlock.Values[lI][0];\n          if Mic140PublishedCodeInRecorderRange(lI, lRaw) then\n            Inc(lGood48);\n          if lAll48 <> '' then\n            lAll48 := lAll48 + ',';\n          lAll48 := lAll48 + IntToStr(Trunc(lRaw));\n          if (ABlock.SampleCount > 1) and (Length(ABlock.Values[lI]) > 1) then\n          begin\n            lRaw := ABlock.Values[lI][1];\n            if Mic140PublishedCodeInRecorderRange(lI, lRaw) then\n              Inc(lGood48S1);\n            if lAll48S1 <> '' then\n              lAll48S1 := lAll48S1 + ',';\n            lAll48S1 := lAll48S1 + IntToStr(Trunc(lRaw));\n          end;\n        end;\n      end;\n      if (lI > 7) and (lI <> 11) and (lI <> 23) then\n        Continue;\n      if lI >= fChannelTagNames.Count then\n        Break;\n      if lI < Length(fRuntimeChannelTags) then\n        lTag := fRuntimeChannelTags[lI]\n      else\n        lTag := nil;\n      if lTag = nil then\n        Continue;\n      lRaw := Mic140RawSample(ABlock, lI, 0, lTag);\n      if RecorderMic140TagHardwareCalibrationEnabled(Registry, lTag) then\n        lSum := Registry.TransformTagHardwareValue(lTag, lRaw)\n      else\n        lSum := lRaw;\n      if lPreview <> '' then\n        lPreview := lPreview + '; ';\n      lPreview := lPreview + Format('%s raw=%.0f mV=%.1f',\n        [lTag.Name, lRaw, lSum]);\n    end;\n    if lPreview <> '' then\n      Mic140LogWarning(Format('[DataSource:%s] MIC-140 block1 channels: %s',\n        [SourceId, lPreview]));\n    if lAll48 <> '' then\n      Mic140LogWarning(Format(\n        '[DataSource:%s] MIC-140 block1 sample0 all48 good=%d/48 raw=[%s]',\n        [SourceId, lGood48, lAll48]));\n    if lAll48S1 <> '' then\n      Mic140LogWarning(Format(\n        '[DataSource:%s] MIC-140 block1 sample1 all48 good=%d/48 raw=[%s]',\n        [SourceId, lGood48S1, lAll48S1]));\n  end\n  else if fGoodBlockCount <= CMic140LegacyScanDetailLogBlocks then\n  begin\n    lPreview := '';\n    for lI := 0 to Min(lCount - 1, 3) do\n    begin\n      if lI >= Length(ABlock.Values) then\n        Break;\n      if lPreview <> '' then\n        lPreview := lPreview + ',';\n      lPreview := lPreview + IntToStr(Trunc(ABlock.Values[lI][0]));\n    end;\n    Mic140LogWarning(Format(\n      '[DataSource:%s] MIC-140 block%d published d0=[%s]',\n      [SourceId, fGoodBlockCount, lPreview]));\n  end;\n  {$ENDIF}\n\n  EnsureRuntimeScratch(ABlock.SampleCount,\n    Max(0, ABlock.ChannelCount - lCount));\n  for lJ := 0 to ABlock.SampleCount - 1 do\n    fRuntimeTimes[lJ] := RecorderBlockSampleTime(ABlock, 0, lJ);\n\n  { TIn находятся в том же атомарном FIFO-блоке после основных AIn.\n    Общий LastAuxTemperatureBlock использовать здесь нельзя: при асинхронном\n    чтении он уже может принадлежать следующему сетевому пакету. }\n  fRuntimeAuxTemperature.Revision := fGoodBlockCount;\n  fRuntimeAuxTemperature.ChannelCount := Max(0, ABlock.ChannelCount - lCount);\n  fRuntimeAuxTemperature.SampleCount := ABlock.SampleCount;\n  if fRuntimeAuxTemperature.ChannelCount > 0 then\n  begin\n    for lI := 0 to fRuntimeAuxTemperature.ChannelCount - 1 do\n    begin\n      for lJ := 0 to ABlock.SampleCount - 1 do\n      begin\n        fRuntimeAuxTemperature.Valid[lI][lJ] :=\n          (lCount + lI < Length(ABlock.Values)) and\n          (lJ < Length(ABlock.Values[lCount + lI]));\n        if fRuntimeAuxTemperature.Valid[lI][lJ] then\n          fRuntimeAuxTemperature.Values[lI][lJ] :=\n            ABlock.Values[lCount + lI][lJ]\n        else\n          fRuntimeAuxTemperature.Values[lI][lJ] := 0;\n      end;\n    end;\n  end\n  else\n  begin\n    fRuntimeAuxTemperature.ChannelCount := 0;\n    fRuntimeAuxTemperature.SampleCount := 0;\n  end;\n  {$IFDEF MIC140_RUNTIME_DIAGNOSTICS}\n  if (fGoodBlockCount <= 5) or ((fGoodBlockCount mod 100) = 0) then\n    CheckPublishedTinCodes(fRuntimeAuxTemperature);\n  {$ENDIF}\n  { Вызываем и для блока без TIn: метод сбросит validity предыдущего блока и\n    не позволит применить устаревшую температуру ХТС к новым AIn. }\n  UpdateCjcTemperatures(fRuntimeAuxTemperature);\n  if fRuntimeAuxTemperature.SampleCount > 0 then\n  begin\n    { Внутренний тракт КХС обрабатывает все TIn. Пользовательские теги для\n      этого не требуются; PublishTemperatureBlocks сам отфильтрует публикацию. }\n    PublishTemperatureBlocks(fRuntimeAuxTemperature, fRuntimeTimes);\n    fLastAuxRevision := fRuntimeAuxTemperature.Revision;\n  end;\n\n  { fRuntimeCjcTemperatures уже содержит средние физические значения всех TIn,\n    рассчитанные напрямую из атомарного блока независимо от публикации тегов. }\n\n  for lI := 0 to lCount - 1 do\n  begin\n    if ShouldStop then\n      Exit;\n    if lI >= fChannelTagNames.Count then\n      Continue;\n    if lI < Length(fRuntimeChannelTags) then\n      lTag := fRuntimeChannelTags[lI]\n    else\n      lTag := nil;\n    if (lTag = nil) or (not SameText(lTag.SourceId, SourceId)) then\n      Continue;\n\n    for lJ := 0 to ABlock.SampleCount - 1 do\n      fRuntimeTimes[lJ] := RecorderBlockSampleTime(ABlock, lI, lJ);\n\n    { Preserve the actual ADC tail before software balance, hardware GX and TC.\n      One scalar per channel/block; no second sample buffer is required. }\n    lTag.StageRawValue(fRuntimeTimes[ABlock.SampleCount - 1],\n      ABlock.Values[lI][ABlock.SampleCount - 1]);\n\n    if lI < Length(fRuntimeHardwareCalibrations) then\n      lHardwareCalibration := fRuntimeHardwareCalibrations[lI]\n    else\n      lHardwareCalibration := nil;\n    if lI < Length(fRuntimeThermocoupleCalibrations) then\n      lThermocoupleCalibration := fRuntimeThermocoupleCalibrations[lI]\n    else\n      lThermocoupleCalibration := nil;\n\n    { Calibration pointers are published at the cold refresh boundary. }\n    if lTag.HardwareCalibrationEnabled and (lHardwareCalibration = nil) then\n      raise ERecorderDataSourceError.CreateFmt(\n        'MIC-140 tag %s: hardware calibration was not prepared', [lTag.Name]);\n\n    if (not lTag.HardwareCalibrationEnabled) or\n      (lHardwareCalibration = nil) then\n    begin\n      for lJ := 0 to ABlock.SampleCount - 1 do\n        fRuntimeValues[lJ] := Mic140RawSample(ABlock, lI, lJ, lTag);\n      Registry.TransformTagSourceBlock(lTag, fRuntimeValues, ABlock.SampleCount);\n      Registry.AddBlockSamples(lTag, fRuntimeTimes, fRuntimeValues,\n        ABlock.SampleCount, True);\n      Registry.PublishBlockNotifications(lTag, fRuntimeTimes, fRuntimeValues,\n        ABlock.SampleCount);\n      Continue;\n    end;\n\n    if lThermocoupleCalibration = nil then\n    begin\n      for lJ := 0 to ABlock.SampleCount - 1 do\n      begin\n        lRaw := Mic140RawSample(ABlock, lI, lJ, lTag);\n        fRuntimeValues[lJ] := lHardwareCalibration.Transform(lRaw);\n      end;\n      Registry.TransformTagSourceBlock(lTag, fRuntimeValues, ABlock.SampleCount);\n      Registry.AddBlockSamples(lTag, fRuntimeTimes, fRuntimeValues,\n        ABlock.SampleCount, True);\n      Registry.PublishBlockNotifications(lTag, fRuntimeTimes, fRuntimeValues,\n        ABlock.SampleCount);\n      Continue;\n    end;\n\n    if lI < Length(fRuntimeCjcChannels) then\n      lCjcChannel := fRuntimeCjcChannels[lI]\n    else\n      lCjcChannel := RecorderMic140DefaultCjcChannel(lI,\n        CMic140Mic140SubRev1);\n    lUseCjc := fRuntimeThermoCompensation and\n      (lI < Length(fRuntimeTemperatureMode)) and fRuntimeTemperatureMode[lI];\n    if lUseCjc and (lCjcChannel >= 1) and\n      (lCjcChannel <= Length(fRuntimeCjcTemperatures)) then\n    begin\n      lCjcTemperatureC := fRuntimeCjcTemperatures[lCjcChannel - 1];\n      lUseCjc := fRuntimeCjcTemperatureValid[lCjcChannel - 1];\n    end\n    else\n      lUseCjc := False;\n    if lUseCjc and (not fCjcActiveLogWritten) then\n    begin\n      Mic140LogWarning(Format('[DataSource:%s] MIC-140 CJC active: tag=%s T%d=%.3f degC',\n        [SourceId, lTag.Name, lCjcChannel, lCjcTemperatureC]));\n      fCjcActiveLogWritten := True;\n    end;\n    if (not lUseCjc) and fRuntimeThermoCompensation and\n      (lI < Length(fRuntimeTemperatureMode)) and fRuntimeTemperatureMode[lI] and\n      (not fTemperatureModeWarningLogged) then\n    begin\n      Mic140LogWarning(Format('[DataSource:%s] MIC-140 CJC T%d unavailable (TIn cal missing or junction temp invalid, block tin=%d); channel will use thermocouple curve without compensation',\n        [SourceId, lCjcChannel, fRuntimeAuxTemperature.ChannelCount]));\n      fTemperatureModeWarningLogged := True;\n    end;\n\n    lCjcOffsetC := 0.0;\n    if lI < Length(fRuntimeChannelSettings) then\n      lCjcOffsetC := fRuntimeChannelSettings[lI].CjcTemperOffsetC;\n    lCjcPipelineActive := lUseCjc and Mic140InvertCalibration(\n      lThermocoupleCalibration, lCjcTemperatureC + lCjcOffsetC,\n      lCjcMillivolts);\n    for lJ := 0 to ABlock.SampleCount - 1 do\n    begin\n      lRaw := Mic140RawSample(ABlock, lI, lJ, lTag);\n      if lCjcPipelineActive then\n        fRuntimeValues[lJ] := lThermocoupleCalibration.Transform(\n          lHardwareCalibration.Transform(lRaw) + lCjcMillivolts)\n      else\n        fRuntimeValues[lJ] := lThermocoupleCalibration.Transform(\n          lHardwareCalibration.Transform(lRaw));\n    end;\n    if lUseCjc and (not lCjcPipelineActive) and (not fCjcCorrectLogWritten) then\n    begin\n      Mic140LogWarning(Format(\n        '[DataSource:%s] MIC-140 CJC correction skipped for tag=%s: thermocouple curve is missing or cannot be inverted',\n        [SourceId, lTag.Name]));\n      fCjcCorrectLogWritten := True;\n    end;\n    { Hardware/TC/CJC belong to this source. Apply only the prepared external\n      channel stages afterwards, without repeating the ADC conversion. }\n    Registry.TransformTagSourceBlock(lTag, fRuntimeValues, ABlock.SampleCount);\n    Registry.AddBlockSamples(lTag, fRuntimeTimes, fRuntimeValues,\n      ABlock.SampleCount, True);\n    Registry.PublishBlockNotifications(lTag, fRuntimeTimes, fRuntimeValues,\n      ABlock.SampleCount);\n  end;\n  finally\n    LeaveCriticalSection(fTransformLock);\n  end;\nend;\n\nprocedure TRecorderMic140DataSource.DoTick;\nvar\n  lBlock: TRecorderDeviceSampleBlock;\n  lTimeoutMs: Cardinal;\n  lExpectedSamples: Integer;\n  lGotSamples: Integer;\n  lReads: Integer;\nbegin\n  if ShouldStop then\n    Exit;\n  if (fDevice = nil) or (fMic = nil) or (fDevice.State <> rdsStarted) then\n    Exit;\n  { Период опроса = UpdateTimeMs источника (0.1 / 0.2 / … с) — без фиксации.\n    Ожидаемо ≈ freq×dt точек; FIFO отдаёт меньшими порциями → после первого\n    ReadBlock осушаем кольцо (timeout 0), ничего не обрезаем и не теряем. }\n  lExpectedSamples := Max(1, Round(fPollFrequencyHz * Max(1, Integer(UpdateTimeMs)) /\n    1000.0));\n  lGotSamples := 0;\n  lReads := 0;\n  try\n    lTimeoutMs := Max(Cardinal(1), UpdateTimeMs);\n    if fGoodBlockCount = 0 then\n      lTimeoutMs := Max(lTimeoutMs, Cardinal(CMic140ReadTimeoutMinMs));\n\n    if fMic.ReadBlock(lTimeoutMs, lBlock) then\n    begin\n      fReadFailCount := 0;\n      Inc(lReads);\n      AppendAndPublishBlock(lBlock);\n      if lBlock.SampleCount > 0 then\n        Inc(lGotSamples, lBlock.SampleCount)\n      else\n        Inc(lGotSamples);\n\n      while (not ShouldStop) and (lReads < 256) and\n        fMic.ReadBlock(0, lBlock) do\n      begin\n        Inc(lReads);\n        AppendAndPublishBlock(lBlock);\n        if lBlock.SampleCount > 0 then\n          Inc(lGotSamples, lBlock.SampleCount)\n        else\n          Inc(lGotSamples);\n      end;\n\n      if (lGotSamples > 0) and (lGotSamples < lExpectedSamples) and\n        (fGoodBlockCount <= 5) then\n        Mic140LogWarning(Format(\n          '[DataSource:%s] MIC-140 tick short: got %d of ~%d samples (freq=%.3f Hz upd=%d ms reads=%d)',\n          [SourceId, lGotSamples, lExpectedSamples, fPollFrequencyHz,\n           UpdateTimeMs, lReads]));\n    end\n    else\n    begin\n      Inc(fReadFailCount);\n      if fReadFailCount = 1 then\n        Mic140LogWarning(Format(\n          '[DataSource:%s] MIC-140 read timeout after %d published blocks (read=%d mdpResync=%d expected~%d)',\n          [SourceId, fGoodBlockCount, fMic.LegacyStreamReadCount,\n           fMic.LegacyMdpResyncByteCount, lExpectedSamples]));\n      if fReadFailCount = CMic140NoDataFailThreshold then\n        PublishDiagnostics(CMic140StatusError, 'no scan data', True);\n    end;\n    PublishUtsIfNew;\n  except\n    on E: Exception do\n    begin\n      Mic140LogWarning(Format('[DataSource:%s] MIC-140 read failed: %s: %s',\n        [SourceId, E.ClassName, E.Message]));\n      PublishDiagnostics(CMic140StatusError, 'read exception: ' + E.Message, True);\n      try\n        fDevice.Stop;\n      except\n      end;\n    end;\n  end;\nend;\n\ninitialization\n  RecorderRegisterHardwareSourceLinkProbe(@RecorderMic140HardwareLinkProbe);\n\nend.\n", "sha256": "bb5324514b72041578f9992d76838537b22396145b6e85e2ca78ac57c3fd9ae0"}, "Device/MIC140/UI/uRecorderMic140ChannelDialog.pas": {"text": "unit uRecorderMic140ChannelDialog;\n\n{\n  Per-channel MIC-140 properties (range, thermocouple GH, CJC), like CchanMic140pp.\n}\n\n{$mode objfpc}{$H+}\n{$codepage UTF8}\n\ninterface\n\nuses\n  Classes, SysUtils, Forms, Controls, StdCtrls, ExtCtrls,\n  uRecorderMic140DataSource, uRecorderMeraSdbThermocouples, uRecorderMeraPaths,\n  uRecorderSdbSelectDialog, uRecorderMic140StreamTypes, uRecorderMic140DeviceConfig,\n  uRecorderMic140Utils;\n\nfunction ShowRecorderMic140ChannelDialog(AOwner: TComponent; AChannelNumber: Integer;\n  ADeviceSerial, ADevSubRev: Integer;\n  var ASettings: TRecorderMic140ChannelSettings;\n  ABulkChannelCount: Integer = 0): Boolean;\nfunction CreateRecorderMic140ChannelGuideForm(AOwner: TComponent): TForm;\n\nimplementation\n\nuses\n  uRecorderSdbStore;\n\ntype\n  TRecorderMic140ChannelDialog = class(TForm)\n    lbRange: TLabel;\n    fRangeCombo: TComboBox;\n    lbOutputMode: TLabel;\n    fOutputModeCombo: TComboBox;\n    lbThermocouple: TLabel;\n    fThermocoupleCombo: TComboBox;\n    btnSelectThermocouple: TButton;\n    btnClearThermocouple: TButton;\n    lbCjc: TLabel;\n    fCjcCombo: TComboBox;\n    fDefaultCjcCheck: TCheckBox;\n    lbTempRange: TLabel;\n    fTempRangeEdit: TEdit;\n    lbSoftBalance: TLabel;\n    fSoftBalanceEdit: TEdit;\n    pnButtons: TPanel;\n    btnOk: TButton;\n    btnCancel: TButton;\n    procedure FormCreate(Sender: TObject);\n    procedure RangeChange(Sender: TObject);\n    procedure ThermocoupleChange(Sender: TObject);\n    procedure ThermocoupleDblClick(Sender: TObject);\n    procedure SelectThermocoupleClick(Sender: TObject);\n    procedure ClearThermocoupleClick(Sender: TObject);\n    procedure DefaultCjcChange(Sender: TObject);\n  private\n    fChannelNumber: Integer;\n    fDeviceSerial: Integer;\n    fDevSubRev: Integer;\n    fBulkChannelCount: Integer;\n    fSettings: TRecorderMic140ChannelSettings;\n    procedure InitCombos;\n    procedure LoadFromSettings;\n    procedure StoreToSettings;\n    procedure UpdateTempRange;\n    procedure UpdateCjcEnabled;\n  public\n    function Execute(AChannelNumber, ADeviceSerial, ADevSubRev: Integer;\n      var ASettings: TRecorderMic140ChannelSettings;\n      ABulkChannelCount: Integer = 0): Boolean;\n  end;\n\nfunction CreateRecorderMic140ChannelGuideForm(AOwner: TComponent): TForm;\nbegin\n  Result := TRecorderMic140ChannelDialog.Create(AOwner);\nend;\n\n{$R *.lfm}\n\nfunction ShowRecorderMic140ChannelDialog(AOwner: TComponent; AChannelNumber: Integer;\n  ADeviceSerial, ADevSubRev: Integer;\n  var ASettings: TRecorderMic140ChannelSettings;\n  ABulkChannelCount: Integer): Boolean;\nvar\n  lDialog: TRecorderMic140ChannelDialog;\nbegin\n  lDialog := TRecorderMic140ChannelDialog.Create(AOwner);\n  try\n    Result := lDialog.Execute(AChannelNumber, ADeviceSerial, ADevSubRev, ASettings,\n      ABulkChannelCount);\n  finally\n    lDialog.Free;\n  end;\nend;\n\nprocedure TRecorderMic140ChannelDialog.FormCreate(Sender: TObject);\nbegin\n  InitCombos;\nend;\n\nprocedure TRecorderMic140ChannelDialog.InitCombos;\nvar\n  I: Integer;\nbegin\n  fRangeCombo.Items.Clear;\n  for I := 0 to CMic140RangeCount - 1 do\n    fRangeCombo.Items.Add(RecorderMic140RangeComboLabel(I));\n\n  fOutputModeCombo.Items.Clear;\n  fOutputModeCombo.Items.Add('мВ');\n  fOutputModeCombo.Items.Add('°C');\n\n  RecorderMeraResetThermocoupleCache;\n  fThermocoupleCombo.Items.BeginUpdate;\n  try\n    fThermocoupleCombo.Items.Clear;\n    fThermocoupleCombo.Items.Add('');\n    RecorderMeraListThermocoupleScales(fThermocoupleCombo.Items);\n    if fThermocoupleCombo.Items.Count = 1 then\n      fThermocoupleCombo.Text := '';\n  finally\n    fThermocoupleCombo.Items.EndUpdate;\n  end;\n\n  fCjcCombo.Items.Clear;\n  for I := 1 to RecorderMic140VisibleTemperatureCount(fDevSubRev) do\n    fCjcCombo.Items.Add(RecorderMic140TemperatureDisplayText(I, fDevSubRev));\nend;\n\nprocedure TRecorderMic140ChannelDialog.LoadFromSettings;\nvar\n  lIndex: Integer;\nbegin\n  if (fSettings.RangeIndex >= 0) and (fSettings.RangeIndex < fRangeCombo.Items.Count) then\n    fRangeCombo.ItemIndex := fSettings.RangeIndex\n  else\n    fRangeCombo.ItemIndex := CMic140Range100mV;\n\n  if RecorderMic140ChannelUsesTemperature(fSettings) then\n    fOutputModeCombo.ItemIndex := 1\n  else\n    fOutputModeCombo.ItemIndex := 0;\n\n  if (Trim(fSettings.ThermocoupleScalePath) = '') and\n    (Trim(fSettings.ThermocoupleScaleName) <> '') then\n    fSettings.ThermocoupleScalePath :=\n      RecorderMeraThermocoupleRelativePath(fSettings.ThermocoupleScaleName);\n\n  lIndex := fThermocoupleCombo.Items.IndexOf(fSettings.ThermocoupleScaleName);\n  if (lIndex < 0) and (Trim(fSettings.ThermocoupleScaleName) <> '') then\n  begin\n    fThermocoupleCombo.Items.Add(fSettings.ThermocoupleScaleName);\n    lIndex := fThermocoupleCombo.Items.Count - 1;\n  end;\n  if lIndex >= 0 then\n    fThermocoupleCombo.ItemIndex := lIndex\n  else\n    fThermocoupleCombo.ItemIndex := 0;\n\n  fDefaultCjcCheck.Checked := fSettings.DefaultCjc;\n  fSoftBalanceEdit.Text := FormatFloat('0.000', fSettings.SoftBalance);\n  if (fSettings.CjcChannel >= 1) and\n    (fSettings.CjcChannel <= RecorderMic140VisibleTemperatureCount(fDevSubRev)) then\n    fCjcCombo.ItemIndex := fSettings.CjcChannel - 1\n  else\n    fCjcCombo.ItemIndex := 0;\n  UpdateCjcEnabled;\n  UpdateTempRange;\nend;\n\nprocedure TRecorderMic140ChannelDialog.StoreToSettings;\nvar\n  lName: string;\n  lPath: string;\n  lValue: Double;\nbegin\n  if not TryStrToFloat(StringReplace(fSoftBalanceEdit.Text, ',', '.', [rfReplaceAll]),\n    lValue) then\n    lValue := fSettings.SoftBalance;\n  fSettings.SoftBalance := lValue;\n\n  if fRangeCombo.ItemIndex >= 0 then\n    fSettings.RangeIndex := fRangeCombo.ItemIndex\n  else\n    fSettings.RangeIndex := CMic140Range100mV;\n\n  lName := Trim(fThermocoupleCombo.Text);\n  if lName = '' then\n  begin\n    fSettings.ThermocoupleScaleName := '';\n    fSettings.ThermocoupleScalePath := '';\n  end\n  else\n  begin\n    fSettings.ThermocoupleScaleName := lName;\n    lPath := Trim(fSettings.ThermocoupleScalePath);\n    if (lPath = '') or (\n      not SameText(RecorderMeraThermocoupleDisplayName(lPath), lName) and\n      not SameText(ChangeFileExt(ExtractFileName(StringReplace(lPath, '\\',\n        PathDelim, [rfReplaceAll])), ''), lName)) then\n      lPath := RecorderMeraThermocoupleRelativePath(lName);\n    lPath := RecorderMeraResolveThermocoupleScaleKey(lPath, lName);\n    fSettings.ThermocoupleScalePath := lPath;\n  end;\n\n  if fOutputModeCombo.ItemIndex = 1 then\n    fSettings.OutputMode := 'degC'\n  else\n    fSettings.OutputMode := 'mV';\n\n  fSettings.DefaultCjc := fDefaultCjcCheck.Checked;\n  if fCjcCombo.ItemIndex >= 0 then\n    fSettings.CjcChannel := fCjcCombo.ItemIndex + 1\n  else\n    fSettings.CjcChannel := 1;\nend;\n\nprocedure TRecorderMic140ChannelDialog.UpdateTempRange;\nbegin\n  StoreToSettings;\n  if RecorderMic140ChannelUsesTemperature(fSettings) then\n    fTempRangeEdit.Text := RecorderMic140ChannelGradRangeText(fSettings)\n  else\n    fTempRangeEdit.Text := '';\nend;\n\nprocedure TRecorderMic140ChannelDialog.UpdateCjcEnabled;\nbegin\n  fCjcCombo.Enabled := not fDefaultCjcCheck.Checked;\n  if fDefaultCjcCheck.Checked then\n  begin\n    if fCjcCombo.Items.Count > 0 then\n    begin\n      if RecorderMic140DefaultCjcChannel(fChannelNumber - 1, fDevSubRev) - 1 >= 0 then\n        fCjcCombo.ItemIndex := RecorderMic140DefaultCjcChannel(fChannelNumber - 1,\n          fDevSubRev) - 1;\n    end;\n  end;\nend;\n\nprocedure TRecorderMic140ChannelDialog.RangeChange(Sender: TObject);\nbegin\n  UpdateTempRange;\nend;\n\nprocedure TRecorderMic140ChannelDialog.ThermocoupleChange(Sender: TObject);\nbegin\n  if Sender = fThermocoupleCombo then\n  begin\n    if Trim(fThermocoupleCombo.Text) <> '' then\n      fOutputModeCombo.ItemIndex := 1\n    else\n      fOutputModeCombo.ItemIndex := 0;\n  end;\n  UpdateTempRange;\nend;\n\nprocedure TRecorderMic140ChannelDialog.ThermocoupleDblClick(Sender: TObject);\nbegin\n  SelectThermocoupleClick(Sender);\nend;\n\nprocedure TRecorderMic140ChannelDialog.SelectThermocoupleClick(Sender: TObject);\nvar\n  lIndex: Integer;\n  lKey: string;\n  lName: string;\nbegin\n  if not ShowRecorderSdbSelectDialog(Self, fSettings.ThermocoupleScalePath,\n    lKey) then\n    Exit;\n  lName := RecorderMeraThermocoupleDisplayName(lKey);\n  if Trim(lName) = '' then\n    lName := RecorderSdbNormalizeKey(lKey);\n  lIndex := fThermocoupleCombo.Items.IndexOf(lName);\n  if lIndex < 0 then\n  begin\n    fThermocoupleCombo.Items.Add(lName);\n    lIndex := fThermocoupleCombo.Items.Count - 1;\n  end;\n  fThermocoupleCombo.ItemIndex := lIndex;\n  { Programmatic ItemIndex assignment does not fire OnChange in LCL. Keep the\n    explicit source output mode in sync with a curve selected via the button. }\n  fOutputModeCombo.ItemIndex := 1;\n  fSettings.ThermocoupleScaleName := lName;\n  fSettings.ThermocoupleScalePath := lKey;\n  UpdateTempRange;\nend;\n\nprocedure TRecorderMic140ChannelDialog.ClearThermocoupleClick(Sender: TObject);\nbegin\n  fThermocoupleCombo.ItemIndex := 0;\n  fOutputModeCombo.ItemIndex := 0;\n  UpdateTempRange;\nend;\n\nprocedure TRecorderMic140ChannelDialog.DefaultCjcChange(Sender: TObject);\nbegin\n  UpdateCjcEnabled;\nend;\n\nfunction TRecorderMic140ChannelDialog.Execute(AChannelNumber, ADeviceSerial,\n  ADevSubRev: Integer; var ASettings: TRecorderMic140ChannelSettings;\n  ABulkChannelCount: Integer): Boolean;\nbegin\n  fChannelNumber := AChannelNumber;\n  fDeviceSerial := ADeviceSerial;\n  fDevSubRev := ADevSubRev;\n  fBulkChannelCount := ABulkChannelCount;\n  fSettings := ASettings;\n  InitCombos;\n  if fBulkChannelCount > 1 then\n  begin\n    Caption := Format('Свойства каналов (%d шт.)', [fBulkChannelCount]);\n    lbThermocouple.Caption := 'ГХ термопары (для всех)';\n  end\n  else\n    Caption := Format('Свойства канала MIC140 %d-%2.2d',\n      [MIC140DefaultNodeNumber, AChannelNumber]);\n  LoadFromSettings;\n  Result := ShowModal = mrOk;\n  if Result then\n  begin\n    StoreToSettings;\n    ASettings := fSettings;\n  end;\nend;\n\nend.\n", "sha256": "3256100e2ff78234c34c105a4e7ffa5fef81b17262b39096f6b2bbd79ab47a27"}, "Device/mic185/uRecorderMic185DataSource.pas": {"text": "unit uRecorderMic185DataSource;\n\n{\n  MIC183/185 data source for RecorderLnx.\n\n  The protocol/device units in this folder are copies of the standalone\n  Tests/mic185 implementation. This adapter binds them to RecorderLnx tags and\n  data-source lifecycle.\n\n  Tag settings and unit-mode capabilities belong to this datasource.\n  ReadState only inspects the model and registered curves; construction and\n  ConfigureTags must not resolve device identity or perform hardware I/O.\n  Unit-mode edits during acquisition require Stop until a live transaction\n  is explicitly implemented here. No MIC183/185 provider adapter is used.\n\n  Hardware lifecycle boundary: PrepareHardware, Reconfigure and channel\n  programming must not build or validate tag GX pipelines. A software unit/GX\n  error cannot make a successful device reset look like a hardware failure.\n  Start validates/prepares the runtime transformations before starting sample\n  acquisition; explicit runtime refresh/balance rebuilds remain separate.\n}\n\n{$mode objfpc}{$H+}\n{$codepage UTF8}\n\ninterface\n\nuses\n  Classes, SysUtils, fpjson,\n  uRecorderDataSources, uRecorderDeviceInterfaces, uRecorderAcquisitionTypes,\n  uRecorderTags, uRecorderTagSettingsProvider, uRecorderConfiguredDataSources,\n  uMic185Device, uMic185Constants, uMic185MebiusTypes;\n\nconst\n  { Endpoint стендового MIC-185 по умолчанию. }\n  MIC185DefaultHost = '192.168.9.142';\n  MIC185DefaultPort = 4000;\n  MIC185DefaultPollFrequencyHz = CMic185DefaultMeasFrequencyHz;\n\n{ Формирует SourceId RecorderLnx для MIC-185 endpoint. }\nfunction RecorderMic185SourceId(const AHost: string; APort: Word): string;\n{ Разбирает SourceId вида \"MIC-185: host:port\". }\nfunction TryParseRecorderMic185SourceId(const ASourceId: string;\n  out AHost: string; out APort: Word): Boolean;\nfunction RecorderIsHardwareMic185TagSource(const ASourceId: string): Boolean;\n{ Читает серийный номер/версию прибора через безопасный probe. }\nfunction RecorderMic185ReadDeviceInfo(const AHost: string; APort: Word;\n  out ASerialNumber: LongWord; out AVersionText: string;\n  out AErrorText: string; ATimeoutMs: Cardinal = 700): Boolean;\n{ Проверяет, что endpoint отвечает на идентификационный запрос. }\nfunction RecorderMic185IsEndpointLive(const AHost: string; APort: Word): Boolean;\n{ Проверяет live-device кэш активного источника. }\nfunction RecorderMic185IsLiveDeviceConnected(const AHost: string; APort: Word): Boolean;\n{ Проверяет живость источника по SourceId. }\nfunction RecorderMic185IsSourceLinkOk(const ASourceId: string): Boolean;\n{ Быстрая TCP/Mebius проба для дерева оборудования. }\nfunction RecorderMic185TcpProbe(const AHost: string; APort: Word;\n  ATimeoutMs: Cardinal): Boolean;\nfunction RecorderMic185CleanupEndpoint(const AHost: string; APort: Word;\n  out AErrorText: string; ATimeoutMs: Cardinal = 1500): Boolean;\n{ Текст режима канала по умолчанию для хранения в старых проектах. }\nfunction RecorderMic185DefaultChannelModeText(AFrequencyHz: Double): string;\nfunction RecorderMic185NormalizeFrequency(AFrequencyHz: Double): Double;\nprocedure RecorderMic185ApplySourceFrequency(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; AFrequencyHz: Double; ADataUpdateMs: Cardinal = 300);\n{ Сериализует настройки канала MIC-185 в компактную строку. }\nfunction RecorderMic185FormatChannelMode(\n  const ASettings: TMic185ChannelProgramSettings): string;\n{ Десериализует строку режима канала с fallback на defaults. }\nprocedure RecorderMic185ReadChannelMode(const AMode: string; AFrequencyHz: Double;\n  out ASettings: TMic185ChannelProgramSettings);\n{ Получает аппаратные настройки канала из конфигурации источника. }\nfunction RecorderMic185GetSourceChannelMode(ARegistry: TRecorderTagRegistry;\n  const ASourceId, AAddress: string; AFrequencyHz: Double;\n  out ASettings: TMic185ChannelProgramSettings): Boolean;\n{ Сохраняет аппаратные настройки канала в конфигурации источника. }\nprocedure RecorderMic185SetSourceChannelMode(ARegistry: TRecorderTagRegistry;\n  const ASourceId, AAddress: string; AFrequencyHz: Double;\n  const ASettings: TMic185ChannelProgramSettings);\n{ Возвращает физическую единицу канала из конфигурации источника. }\nfunction RecorderMic185GetSourceChannelUnitName(ARegistry: TRecorderTagRegistry;\n  const ASourceId, AAddress: string): string;\n{ Сохраняет физическую единицу канала в конфигурации источника. }\nprocedure RecorderMic185SetSourceChannelUnitName(ARegistry: TRecorderTagRegistry;\n  const ASourceId, AAddress: string; AFrequencyHz: Double;\n  const AUnitName: string);\n{ Возвращает код тока питания датчика из конфигурации источника. }\nfunction RecorderMic185GetSourcePowerMaCode(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string): LongWord;\n{ Сохраняет код тока питания датчика в конфигурации источника. }\nprocedure RecorderMic185SetSourcePowerMaCode(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; APollFrequencyHz: Double; APowerMaCode: LongWord);\n{ Возвращает модульные настройки MIC-185 из конфигурации источника. }\nprocedure RecorderMic185GetSourceModuleSettings(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; out ASettings: TMic185ModuleProgramSettings);\n{ Сохраняет модульные настройки MIC-185 в конфигурации источника. }\nprocedure RecorderMic185SetSourceModuleSettings(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; APollFrequencyHz: Double;\n  const ASettings: TMic185ModuleProgramSettings);\n{ Возвращает выбранные входы-компенсаторы для четырех групп по 16 каналов. }\nprocedure RecorderMic185GetSourceGroupAddition(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; out AGroupAddition: TMic185GroupAdditionArray);\n{ Меняет вход-компенсатор только для группы указанного измерительного канала. }\nprocedure RecorderMic185SetSourceChannelAddition(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; APollFrequencyHz: Double; AChannelIndex,\n  AAdditionIndex: Integer);\n{ Возвращает флаг аппаратной термокомпенсации из конфигурации источника. }\nfunction RecorderMic185GetSourceTemperatureCompensation(\n  ARegistry: TRecorderTagRegistry; const ASourceId: string): Boolean;\n{ Сохраняет флаг термокомпенсации, не меняя назначение входов дополнений. }\nprocedure RecorderMic185SetSourceTemperatureCompensation(\n  ARegistry: TRecorderTagRegistry; const ASourceId: string;\n  APollFrequencyHz: Double; ATemperatureCompensation: Boolean);\n{ Программирует уже настроенный MIC-185 source без открытия общего диалога. }\nfunction RecorderMic185ProgramConfiguredSource(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; out AErrorText: string;\n  const ATraceId: string = ''): Boolean;\nfunction RecorderMic185ZeroBalanceChannels(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; const AChannelIndices: array of Integer;\n  AMessages: TStrings): Boolean;\n{ Текст номинального входного диапазона для UI. }\nfunction RecorderMic185RangeText(ARangeIndex: LongWord): string;\n{ Единица по умолчанию для выбранного диапазона. }\nfunction RecorderMic185RangeUnitText(ARangeIndex: LongWord): string;\n{ Верхняя граница номинального диапазона в мВ. }\nfunction RecorderMic185RangeMax(ARangeIndex: LongWord): Double;\n{ Преобразования балансировки MIC-185: в пакете прибора баланс хранится\n  кодами, а в UI original Recorder программная балансировка задается\n  физическим значением канала. }\nfunction RecorderMic185SoftBalanceCodeToMv(ASoftBalance: LongInt;\n  ARangeIndex: LongWord): Double;\nfunction RecorderMic185SoftBalanceMvToCode(ASoftBalanceMv: Double;\n  ARangeIndex: LongWord): LongInt;\nfunction RecorderMic185HardBalanceCodeToMv(AHardBalance: LongWord): Double;\nfunction RecorderMic185HardBalanceMvToCode(AHardBalanceMv: Double): LongWord;\n{ Верхняя граница диапазона в выбранной пользователем единице. }\nfunction RecorderMic185EffectiveRangeMax(\n  const ASettings: TMic185ChannelProgramSettings; const AUnitName: string): Double;\nfunction RecorderMic185EffectiveRangeMaxForTag(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; const ASettings: TMic185ChannelProgramSettings;\n  const AUnitName: string): Double;\n{ Текст фактического диапазона для диалога канала. }\nfunction RecorderMic185EffectiveRangeText(\n  const ASettings: TMic185ChannelProgramSettings; const AUnitName: string): string;\nfunction RecorderMic185EffectiveRangeTextForTag(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; const ASettings: TMic185ChannelProgramSettings;\n  const AUnitName: string): string;\n{ Текст сводной линейной ГХ для текущего отображения тега. Сохраненная\n  аппаратная ГХ остается исходной; здесь пересчитываются только K/B для UI. }\nfunction RecorderMic185EffectiveTransformText(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; const ASettings: TMic185ChannelProgramSettings;\n  const AUnitName: string): string;\n{ Пересчитывает измеренное MIC-185 значение в выбранную единицу тега. Основной\n  поток MIC-185 отдаёт Single уже в мВ; аппаратная ГХ, если включена, уточняет\n  это входное значение. }\nfunction RecorderMic185ConvertValue(AValueMv: Double;\n  const ASettings: TMic185ChannelProgramSettings; const AUnitName: string;\n  AHardwareCalibration: TRecorderCalibration = nil;\n  AEffectivePowerMa: Double = 0.0): Double;\n{ Пересчитывает уже выраженное в мВ служебное значение в единицу канала,\n  учитывая индивидуальную калибровку тока питания. }\nfunction RecorderMic185ConvertUnitValueForTag(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; AValueMv: Double;\n  const ASettings: TMic185ChannelProgramSettings;\n  const AUnitName: string): Double;\n{ Текст коммутации канала для таблицы настройки. }\nfunction RecorderMic185CommutationText(ACommutIndex: LongWord): string;\n{ Текст схемы включения датчика для таблицы настройки. }\nfunction RecorderMic185SensorSchemeText(ASensorScheme: LongWord): string;\n{ Возвращает индекс измерительного канала из адресов 155-3,\n  185-(155-3) и старых MIC183_185-(3-3). }\nfunction RecorderMic185ChannelAddressToIndex(const AAddress: string): Integer;\nfunction RecorderMic185MeasurementAddressText(ADeviceIndex,\n  AChannelNumber: Integer): string;\nfunction RecorderMic185TemperatureAddressText(ADeviceIndex,\n  ATemperatureIndex: Integer): string;\nfunction RecorderMic185UtsAddressText(ADeviceIndex: Integer): string;\n{ Сравнивает разные допустимые записи одного канала MIC-185, например\n  155-3, 185-(155-3) и старую MIC183_185-(3-3). Источник данных должен\n  сравниваться вызывающим кодом отдельно. }\nfunction RecorderMic185SameChannelAddress(const ALeft, ARight: string): Boolean;\nfunction RecorderMic185SourceDeviceIndex(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string): Integer;\n{ Создает или возвращает конфигурацию источника MIC-185. }\nfunction RecorderMic185EnsureConfiguredSource(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; APollFrequencyHz: Double): TRecorderConfiguredDataSource;\nprocedure RecorderMic185SetKnownIdentity(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; ASerialNumber, ASoftVersion: LongWord);\nfunction RecorderMic185GetKnownIdentity(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; out ASerialNumber, ASoftVersion: LongWord): Boolean;\n{ Сохраняет MIC-185 секции dataSources[].mic185 в проект. }\nprocedure SaveMic185DataSourceConfigs(AJson: TJSONObject;\n  ARegistry: TRecorderTagRegistry);\n{ Загружает MIC-185 секции dataSources[].mic185 из проекта. }\nprocedure LoadMic185DataSourceConfigs(AJson: TJSONObject;\n  ARegistry: TRecorderTagRegistry);\n{ Берет идентификацию из активного live-device или runtime кэша. }\nfunction RecorderMic185TryGetLiveDeviceInfo(const AHost: string; APort: Word;\n  out ASerialNumber: LongWord; out AVersionText: string;\n  out AAcquiring: Boolean): Boolean;\n{ Возвращает активный MIC-185 device, если endpoint уже принадлежит runtime. }\nfunction RecorderMic185FindLiveDevice(const AHost: string; APort: Word): TRecorderMic185Device;\n{ Регистрирует активный MIC-185 device для UI/probe без второго TCP-клиента. }\nprocedure RecorderMic185RegisterLiveDevice(AOwner: TObject; const AHost: string;\n  APort: Word; ADevice: IRecorderDevice);\n{ Снимает регистрацию live-device владельца. }\nprocedure RecorderMic185UnregisterLiveDevice(AOwner: TObject);\n{ Пишет строку в MIC-185 runtime/debug log. }\nprocedure RecorderMic185Log(const AMessage: string);\nfunction RecorderMic185NewLifecycleTraceId(const AOperation: string): string;\nprocedure RecorderMic185LifecycleLog(const ATraceId, ASourceId, APhase,\n  AState, ADetails: string; AElapsedMs: QWord = 0);\n\ntype\n  TRecorderMic185RuntimeUnit = (mruMillivolts, mruOhm, mruStrain);\n  TRecorderCalibrationArray = array of TRecorderCalibration;\n\n  TRecorderMic185ValueTransform = record\n    Valid: Boolean;\n    IsLinear: Boolean;\n    K: Double;\n    B: Double;\n    Settings: TMic185ChannelProgramSettings;\n    UnitMode: TRecorderMic185RuntimeUnit;\n    HardwareCalibration: TRecorderCalibration;\n    ChannelCalibrations: TRecorderCalibrationArray;\n    ChannelConversions: array of Double;\n    PowerMa: Double;\n    OutputScale: Double;\n  end;\n  TRecorderMic185ValueTransformArray = array of TRecorderMic185ValueTransform;\n\nfunction RecorderMic185ApplyValueTransform(AValueCode: Double;\n  const ATransform: TRecorderMic185ValueTransform): Double;\nfunction RecorderMic185BuildValueTransform(ARegistry: TRecorderTagRegistry;\n  ATag: TRecorderTag; const ASettings: TMic185ChannelProgramSettings;\n  AHardwareCalibration: TRecorderCalibration): TRecorderMic185ValueTransform;\nfunction RecorderMic185ResolveHardwareCalibrationForTransform(\n  ARegistry: TRecorderTagRegistry; ATag: TRecorderTag): TRecorderCalibration;\n\ntype\n  TRecorderMic185DataSource = class(TRecorderDataSourceBase,\n    IRecorderZeroBalanceSupport, IRecorderZeroBalanceTraceSupport,\n    IRecorderTagSettingsProvider)\n  private\n    fChannelTagNames: TStringList;\n    fChannelTags: array of TRecorderTag;\n    fValueTransforms: TRecorderMic185ValueTransformArray;\n    fValueTransformsLock: TRTLCriticalSection;\n    fTempTags: array of TRecorderTag;\n    fTimes: TRecorderDoubleArray;\n    fUtsTag: TRecorderTag;\n    fValues: TRecorderDoubleArray;\n    fDevice: IRecorderDevice;\n    fHost: string;\n    fHardwarePrepared: Boolean;\n    fHardwarePrepareAttempted: Boolean;\n    fPort: Word;\n    fPollFrequencyHz: Double;\n    fDiagTick: QWord;\n    fDiagBlocks: QWord;\n    fLastRxPackets: QWord;\n    fLastRxBlocks: QWord;\n    fLastRxTick: QWord;\n    fLastBlockTick: QWord;\n    fRxWarning: Boolean;\n    fLastPublishedUtsGeneration: QWord;\n    fUtsPublishLogCount: Integer;\n    fRuntimeChannelSettings: TMic185ChannelProgramSettingsArray;\n    fSelectedNames: TStringList;\n    fZeroBalanceTrace: TRecorderZeroBalanceTraceEvent;\n    function OwnsSettingsTag(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag): Boolean;\n    function ChannelSelected(const AChannel: TRecorderDeviceChannel): Boolean;\n    function FindTagBySourceAddress(ARegistry: TRecorderTagRegistry;\n      const AAddress: string): TRecorderTag;\n    procedure ApplyChannelProgramSettings;\n    procedure BuildRuntimeTransforms(\n      out ATransforms: TRecorderMic185ValueTransformArray);\n    procedure CacheRuntimeChannels;\n    procedure PublishRuntimeTransforms(\n      var ATransforms: TRecorderMic185ValueTransformArray);\n    procedure ConfigureDevice;\n    procedure PublishMeasurementBlock(const ABlock: TRcAcquisitionBlock);\n    procedure PublishAuxChannels(ATimeSec: Double);\n    procedure TraceZeroBalance(const AText: string);\n  protected\n    procedure DoCreateTags(ARegistry: TRecorderTagRegistry); override;\n    procedure DoTick; override;\n    procedure PrepareHardware; override;\n  public\n    function ReadState(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      out AState: TRecorderTagSettingsState): Boolean;\n    function NormalizeDraft(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      var ADraft: TRecorderTagSettingsDraft; out AErrorText: string): Boolean;\n    function ApplyDraft(ARegistry: TRecorderTagRegistry; ATag: TRecorderTag;\n      const ADraft: TRecorderTagSettingsDraft;\n      out AResult: TRecorderTagSettingsApplyResult;\n      out AErrorText: string): Boolean;\n    function DownloadHardwareCalibration(ARegistry: TRecorderTagRegistry;\n      ATag: TRecorderTag; out AResult: TRecorderHardwareCalibrationResult;\n      out AErrorText: string): Boolean;\n    function GetUnits(ATag: TRecorderTag): string; override;\n    procedure GetUnitNames(ATag: TRecorderTag; AUnitNames: TStrings); override;\n    procedure UpdateScales(ATag: TRecorderTag); override;\n    function CanSetUnits(ATag: TRecorderTag;\n      const AUnitName: string; out AErrorText: string): Boolean; override;\n    function SetUnits(ATag: TRecorderTag;\n      const AUnitName: string; out AErrorText: string): Boolean; override;\n    constructor Create(const ASourceId, AHost: string; APort: Word;\n      APollFrequencyHz: Double; AUpdateTimeMs: Cardinal;\n      ASelectedNames: TStrings = nil);\n    destructor Destroy; override;\n    function Reconfigure(AUpdateTimeMs: Cardinal;\n      out AErrorText: string): Boolean; override;\n    procedure RefreshRuntimeTransforms; override;\n    procedure RequestStop; override;\n    procedure Start; override;\n    procedure Stop; override;\n    function ZeroBalanceTags(AOwner: TComponent; ATags: TList;\n      AMessages: TStrings): Boolean;\n    procedure SetZeroBalanceTrace(AHandler: TRecorderZeroBalanceTraceEvent);\n  end;\n\nimplementation\n\nuses\n  Math, StrUtils, Variants,\n  jsonparser, uMic185MebiusTcpProtocol, uRecorderMic185Runtime,\n  uRecorderHardwareLiveDevices, uRecorderMic140Utils, uRecorderMic185Calibration,\n  uRecorderProjectFiles, uRecorderHardwareTree, uRecorderNetworkBinding,\n  uRecorderDebugLog, uRecorderDeviceConfigSignature, uRecorderFrequencyGrids,\n  uRecorderUnitManager;\n\nconst\n  CMic185SourcePrefix = 'MIC-185: ';\n  CMic185ModuleName = 'MIC183/185';\n  CMic185ChannelModePrefix = 'mic185:';\n  { Fallback scale when no real hardware characteristic is loaded:\n    32768 ADC codes correspond to 100% of the selected nominal input range. }\n  CMic185NominalAdcFullScale = 32768.0;\n  CMic185ParallelStartSlotMs = 150;\n  CMic185PrepareCommandSlots = 2;\n  CMic185ZeroBalanceFineDiscardBlocks = 1;\n  CMic185ZeroBalanceFineBlocks = 4;\n  CMic185ZeroBalanceFineReadTimeoutMs = 700;\n  CMic185ZeroBalanceFineSettleMs = 150;\n  CMic185ZeroBalanceFineTotalWaitMs = 2200;\n  CMic185ZeroBalanceFinePollMs = 50;\n  CMic185Frequencies: array[0..4] of Double =\n    (1.0, 10.0, 25.0, 50.0, 100.0);\n\nvar\n  gMic185PrepareLock: TRTLCriticalSection;\n  gMic185PrepareCommandActive: Integer = 0;\n\nfunction Mic185RuntimeUnitFromName(const AUnitName: string;\n  ARangeIndex: LongWord): TRecorderMic185RuntimeUnit; forward;\nprocedure Mic185ApplyUnitLine(var AK, AB: Double;\n  const ASettings: TMic185ChannelProgramSettings;\n  AUnitMode: TRecorderMic185RuntimeUnit; APowerMa: Double); forward;\n\nprocedure Mic185EnterPrepareCommandSlot(const ATraceId, ASourceId: string);\nvar\n  lStartedAt: QWord;\n  lLoggedWait: Boolean;\nbegin\n  lStartedAt := GetTickCount64;\n  lLoggedWait := False;\n  while True do\n  begin\n    EnterCriticalSection(gMic185PrepareLock);\n    try\n      if gMic185PrepareCommandActive < CMic185PrepareCommandSlots then\n      begin\n        Inc(gMic185PrepareCommandActive);\n        RecorderMic185LifecycleLog(ATraceId, ASourceId, 'prepare-command-slot',\n          'OK', Format('active=%d limit=%d',\n            [gMic185PrepareCommandActive, CMic185PrepareCommandSlots]),\n          GetTickCount64 - lStartedAt);\n        Exit;\n      end;\n    finally\n      LeaveCriticalSection(gMic185PrepareLock);\n    end;\n\n    if not lLoggedWait then\n    begin\n      RecorderMic185LifecycleLog(ATraceId, ASourceId, 'prepare-command-slot',\n        'BEGIN', Format('limit=%d', [CMic185PrepareCommandSlots]));\n      lLoggedWait := True;\n    end;\n    Sleep(50);\n  end;\nend;\n\nprocedure Mic185LeavePrepareCommandSlot;\nbegin\n  EnterCriticalSection(gMic185PrepareLock);\n  try\n    if gMic185PrepareCommandActive > 0 then\n      Dec(gMic185PrepareCommandActive);\n  finally\n    LeaveCriticalSection(gMic185PrepareLock);\n  end;\nend;\n\nfunction Mic185EndpointStartDelayMs(const AHost: string): Cardinal;\nvar\n  lLastDot: Integer;\n  lOctet: Integer;\nbegin\n  Result := 0;\n  lLastDot := RPos('.', Trim(AHost));\n  if (lLastDot > 0) and TryStrToInt(Copy(Trim(AHost), lLastDot + 1,\n    MaxInt), lOctet) then\n    Result := Cardinal((lOctet mod 10) * CMic185ParallelStartSlotMs);\nend;\n\nfunction Mic185CanonicalAddress(const AAddress: string): string;\nvar\n  lStart: Integer;\n  lDash: Integer;\n  lChannelNumber: Integer;\n  lTail: string;\nbegin\n  Result := Trim(AAddress);\n  if Pos('MIC183_185-', UpperCase(Result)) = 1 then\n    Result := Copy(Result, Length('MIC183_185-') + 1, MaxInt)\n  else if Pos('185-', UpperCase(Result)) = 1 then\n    Result := Copy(Result, Length('185-') + 1, MaxInt);\n  lStart := Pos('{', Result);\n  if lStart > 0 then\n    Delete(Result, lStart, 1);\n  if (Result <> '') and (Result[Length(Result)] = '}') then\n    Delete(Result, Length(Result), 1);\n  lDash := RPos('-', Result);\n  if lDash <= 0 then\n    Exit;\n  lTail := Copy(Result, lDash + 1, MaxInt);\n  if (lTail = '') or (Pos('t', LowerCase(lTail)) > 0) or\n    SameText(lTail, 'uts') then\n    Exit;\n  if TryStrToInt(lTail, lChannelNumber) then\n    Result := Copy(Result, 1, lDash) + Format('%2.2d', [lChannelNumber]);\nend;\n\nfunction Mic185ConfiguredChannelAddress(ARegistry: TRecorderTagRegistry;\n  const ASourceId, ANativeAddress: string): string;\nvar\n  lDash: Integer;\n  lPrefix: string;\nbegin\n  Result := Mic185CanonicalAddress(ANativeAddress);\n  lPrefix := RecorderConfiguredSourceAddress(ARegistry, ASourceId);\n  lDash := RPos('-', Result);\n  if (lPrefix <> '') and (lDash > 0) then\n    Result := lPrefix + Copy(Result, lDash, MaxInt);\nend;\n\nfunction RecorderMic185MeasurementAddressText(ADeviceIndex,\n  AChannelNumber: Integer): string;\nbegin\n  Result := Format('%d-%2.2d', [ADeviceIndex, AChannelNumber]);\nend;\n\nfunction RecorderMic185TemperatureAddressText(ADeviceIndex,\n  ATemperatureIndex: Integer): string;\nbegin\n  Result := Format('%d-t%d', [ADeviceIndex, ATemperatureIndex]);\nend;\n\nfunction RecorderMic185UtsAddressText(ADeviceIndex: Integer): string;\nbegin\n  Result := Format('%d-uts', [ADeviceIndex]);\nend;\n\nfunction SameMic185Address(const ALeft, ARight: string): Boolean;\nvar\n  lLeft: string;\n  lRight: string;\n  lLeftDash: Integer;\n  lRightDash: Integer;\nbegin\n  lLeft := Mic185CanonicalAddress(ALeft);\n  lRight := Mic185CanonicalAddress(ARight);\n  Result := SameText(lLeft, lRight);\n  if Result then\n    Exit;\n  lLeftDash := RPos('-', lLeft);\n  lRightDash := RPos('-', lRight);\n  if (lLeftDash <= 0) or (lRightDash <= 0) then\n    Exit(False);\n  Result := SameText(Copy(lLeft, lLeftDash + 1, MaxInt),\n    Copy(lRight, lRightDash + 1, MaxInt));\nend;\n\nfunction RecorderMic185SourceDeviceIndex(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string): Integer;\nvar\n  lHost: string;\n  lPort: Word;\n  lPos: Integer;\nbegin\n  Result := 3;\n  if not TryParseRecorderMic185SourceId(\n    RecorderNormalizeTagSourceId(ASourceId), lHost, lPort) then\n    Exit;\n  lPos := RPos('.', lHost);\n  if (lPos > 0) and TryStrToInt(Copy(lHost, lPos + 1, MaxInt), Result) and\n    (Result >= 0) and (Result <= 255) then\n    Exit;\n  Result := 3;\nend;\n\nfunction RecorderIsHardwareMic185TagSource(const ASourceId: string): Boolean;\nbegin\n  Result := Pos(CMic185SourcePrefix,\n    RecorderNormalizeTagSourceId(ASourceId)) = 1;\nend;\n\nfunction RecorderMic185HardwareLinkProbe(const ASourceId: string): Boolean;\nbegin\n  Result := RecorderMic185IsSourceLinkOk(ASourceId);\nend;\n\nfunction Mic185FloatToText(AValue: Double): string;\nbegin\n  Result := StringReplace(FormatFloat('0.######', AValue), ',', '.', []);\nend;\n\nfunction Mic185TextToFloatDef(const AText: string; ADefault: Double): Double;\nvar\n  lText: string;\nbegin\n  lText := Trim(AText);\n  if TryStrToFloat(lText, Result) then\n    Exit;\n  lText := StringReplace(lText, '.', DefaultFormatSettings.DecimalSeparator, []);\n  lText := StringReplace(lText, ',', DefaultFormatSettings.DecimalSeparator, []);\n  if not TryStrToFloat(lText, Result) then\n    Result := ADefault;\nend;\n\nfunction Mic185TextToIntDef(const AText: string; ADefault: Integer): Integer;\nbegin\n  if not TryStrToInt(Trim(AText), Result) then\n    Result := ADefault;\nend;\n\nfunction RecorderMic185FormatChannelMode(\n  const ASettings: TMic185ChannelProgramSettings): string;\nbegin\n  Result := Format(\n    '%srange=%d;commut=%d;scheme=%d;soft=%d;softFine=%s;shunt=%d;eval=%d;sens=%s;res=%s;block=%d;power=%d',\n    [CMic185ChannelModePrefix, ASettings.MeasRangeIndex, ASettings.CommutIndex,\n     ASettings.SensorScheme, ASettings.SoftBalance,\n     Mic185FloatToText(ASettings.SoftBalanceFine), ASettings.ShuntOn,\n     ASettings.EvalType, Mic185FloatToText(ASettings.TensoSensitivity),\n     Mic185FloatToText(ASettings.Resistance), ASettings.BlockSize,\n     ASettings.PowerMaCode]);\nend;\n\nfunction RecorderMic185DefaultChannelModeText(AFrequencyHz: Double): string;\nvar\n  lSettings: TMic185ChannelProgramSettings;\nbegin\n  Mic185DefaultChannelProgramSettings(AFrequencyHz, lSettings);\n  Result := RecorderMic185FormatChannelMode(lSettings);\nend;\n\nfunction RecorderMic185NormalizeFrequency(AFrequencyHz: Double): Double;\nvar\n  I: Integer;\n  lBestDelta: Double;\n  lDelta: Double;\nbegin\n  Result := CMic185Frequencies[0];\n  lBestDelta := Abs(AFrequencyHz - Result);\n  for I := 1 to High(CMic185Frequencies) do\n  begin\n    lDelta := Abs(AFrequencyHz - CMic185Frequencies[I]);\n    if lDelta < lBestDelta then\n    begin\n      Result := CMic185Frequencies[I];\n      lBestDelta := lDelta;\n    end;\n  end;\nend;\n\nprocedure RecorderMic185ApplySourceFrequency(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; AFrequencyHz: Double; ADataUpdateMs: Cardinal);\nvar\n  I: Integer;\n  lCapacity: Integer;\n  lFrequencyHz: Double;\n  lOldFrequencyHz: Double;\n  lSettings: TMic185ChannelProgramSettings;\n  lSourceId: string;\n  lTag: TRecorderTag;\nbegin\n  if (ARegistry = nil) or (Trim(ASourceId) = '') then\n    Exit;\n\n  lSourceId := RecorderNormalizeTagSourceId(ASourceId);\n  lFrequencyHz := RecorderMic185NormalizeFrequency(AFrequencyHz);\n  lCapacity := Ceil(Max(4096, lFrequencyHz * 4));\n  RecorderConfiguredDataSourcesEnsure(ARegistry, lSourceId,\n    CMic185ModuleName, lFrequencyHz);\n\n  for I := 0 to ARegistry.TagCount - 1 do\n  begin\n    lTag := ARegistry.Tags[I];\n    if (not SameText(RecorderNormalizeTagSourceId(lTag.SourceId),\n      lSourceId)) or (RecorderMic185ChannelAddressToIndex(lTag.Address) < 0)\n      then\n      Continue;\n\n    lOldFrequencyHz := lTag.PollFrequencyHz;\n    if lOldFrequencyHz <= 0 then\n      lOldFrequencyHz := lFrequencyHz;\n    RecorderMic185GetSourceChannelMode(ARegistry, lSourceId, lTag.Address,\n      lOldFrequencyHz, lSettings);\n    lSettings.FrequencyHz := lFrequencyHz;\n    lTag.PollFrequencyHz := lFrequencyHz;\n    RecorderTagUpdateAutoEstimatePortion(lTag, lOldFrequencyHz,\n      ADataUpdateMs, ADataUpdateMs);\n    lTag.EnsureBufferCapacity(lCapacity);\n    RecorderMic185SetSourceChannelMode(ARegistry, lSourceId, lTag.Address,\n      lFrequencyHz, lSettings);\n  end;\nend;\n\nfunction Mic185ModeValue(const AMode, AKey: string; const ADefault: string): string;\nvar\n  I, lPos: Integer;\n  lItems: TStringList;\n  lName: string;\nbegin\n  Result := ADefault;\n  lItems := TStringList.Create;\n  try\n    lItems.Delimiter := ';';\n    lItems.StrictDelimiter := True;\n    lItems.DelimitedText := AMode;\n    for I := 0 to lItems.Count - 1 do\n    begin\n      lPos := Pos('=', lItems[I]);\n      if lPos <= 0 then\n        Continue;\n      lName := Trim(Copy(lItems[I], 1, lPos - 1));\n      if SameText(lName, AKey) then\n      begin\n        Result := Trim(Copy(lItems[I], lPos + 1, MaxInt));\n        Exit;\n      end;\n    end;\n  finally\n    lItems.Free;\n  end;\nend;\n\nprocedure RecorderMic185ReadChannelMode(const AMode: string; AFrequencyHz: Double;\n  out ASettings: TMic185ChannelProgramSettings);\nvar\n  lMode: string;\nbegin\n  Mic185DefaultChannelProgramSettings(AFrequencyHz, ASettings);\n  lMode := Trim(AMode);\n  if SameText(Copy(lMode, 1, Length(CMic185ChannelModePrefix)),\n    CMic185ChannelModePrefix) then\n  begin\n    Delete(lMode, 1, Length(CMic185ChannelModePrefix));\n    ASettings.MeasRangeIndex :=\n      LongWord(Mic185TextToIntDef(Mic185ModeValue(lMode, 'range',\n      IntToStr(CMic185Range5mV)), CMic185Range5mV));\n    ASettings.CommutIndex :=\n      LongWord(Mic185TextToIntDef(Mic185ModeValue(lMode, 'commut',\n      IntToStr(CMic185CommutInput)), CMic185CommutInput));\n    ASettings.SensorScheme :=\n      LongWord(Mic185TextToIntDef(Mic185ModeValue(lMode, 'scheme',\n      IntToStr(CMic185SensorSchemeTenzo)), CMic185SensorSchemeTenzo));\n    ASettings.SoftBalance :=\n      Mic185TextToIntDef(Mic185ModeValue(lMode, 'soft', '0'), 0);\n    ASettings.SoftBalanceFine :=\n      Mic185TextToFloatDef(Mic185ModeValue(lMode, 'softFine', '0'), 0);\n    ASettings.ShuntOn :=\n      LongWord(Mic185TextToIntDef(Mic185ModeValue(lMode, 'shunt', '0'), 0));\n    ASettings.EvalType :=\n      LongWord(Mic185TextToIntDef(Mic185ModeValue(lMode, 'eval', '0'), 0));\n    ASettings.TensoSensitivity :=\n      Mic185TextToFloatDef(Mic185ModeValue(lMode, 'sens', '2'), 2);\n    ASettings.Resistance :=\n      Mic185TextToFloatDef(Mic185ModeValue(lMode, 'res', '200'), 200);\n    ASettings.BlockSize :=\n      Word(Mic185TextToIntDef(Mic185ModeValue(lMode, 'block', '1'), 1));\n    ASettings.PowerMaCode :=\n      LongWord(Mic185TextToIntDef(Mic185ModeValue(lMode, 'power',\n      IntToStr(CMic185DefaultPowerMaCode)), CMic185DefaultPowerMaCode));\n    if ASettings.BlockSize = 0 then\n      ASettings.BlockSize := 1;\n    Exit;\n  end;\n\n  if lMode <> '' then\n  begin\n    if (Pos('49', lMode) > 0) or (Pos('39', lMode) > 0) then\n      ASettings.CommutIndex := CMic185CommutCalibr\n    else if Pos('Зем', lMode) > 0 then\n      ASettings.CommutIndex := CMic185CommutGround\n    else\n      ASettings.CommutIndex := CMic185CommutInput;\n  end;\nend;\n\nfunction Mic185SourceConfigObject(AEntry: TRecorderConfiguredDataSource;\n  ACreate: Boolean): TJSONObject;\nvar\n  lData: TJSONData;\nbegin\n  Result := nil;\n  if AEntry = nil then\n    Exit;\n  if Trim(AEntry.SpecificConfigText) = '' then\n  begin\n    if ACreate then\n      Result := TJSONObject.Create;\n    Exit;\n  end;\n  try\n    lData := GetJSON(AEntry.SpecificConfigText);\n  except\n    lData := nil;\n  end;\n  if lData is TJSONObject then\n    Result := TJSONObject(lData)\n  else\n  begin\n    lData.Free;\n    if ACreate then\n      Result := TJSONObject.Create;\n  end;\nend;\n\nprocedure Mic185StoreSourceConfigObject(AEntry: TRecorderConfiguredDataSource;\n  AConfig: TJSONObject);\nbegin\n  if (AEntry = nil) or (AConfig = nil) then\n    Exit;\n  AEntry.SpecificConfigText := AConfig.AsJSON;\nend;\n\nfunction Mic185ConfigChannels(AConfig: TJSONObject;\n  ACreate: Boolean): TJSONArray;\nvar\n  lData: TJSONData;\nbegin\n  Result := nil;\n  if AConfig = nil then\n    Exit;\n  lData := AConfig.Find('channels');\n  if lData is TJSONArray then\n    Exit(TJSONArray(lData));\n  if not ACreate then\n    Exit;\n  Result := TJSONArray.Create;\n  AConfig.Add('channels', Result);\nend;\n\nfunction RecorderMic185GetSourceChannelMode(ARegistry: TRecorderTagRegistry;\n  const ASourceId, AAddress: string; AFrequencyHz: Double;\n  out ASettings: TMic185ChannelProgramSettings): Boolean;\nvar\n  I: Integer;\n  lChannels: TJSONArray;\n  lConfig: TJSONObject;\n  lEntry: TRecorderConfiguredDataSource;\n  lItem: TJSONObject;\n  lMode: string;\nbegin\n  Result := False;\n  Mic185DefaultChannelProgramSettings(AFrequencyHz, ASettings);\n  lEntry := RecorderConfiguredDataSourcesFind(ARegistry, ASourceId);\n  lConfig := Mic185SourceConfigObject(lEntry, False);\n  try\n    lChannels := Mic185ConfigChannels(lConfig, False);\n    if lChannels = nil then\n      Exit;\n    for I := 0 to lChannels.Count - 1 do\n    begin\n      if not (lChannels.Items[I] is TJSONObject) then\n        Continue;\n      lItem := TJSONObject(lChannels.Items[I]);\n      if not SameMic185Address(lItem.Get('address', ''), AAddress) then\n        Continue;\n      lMode := lItem.Get('sourceValueMode', '');\n      RecorderMic185ReadChannelMode(lMode, AFrequencyHz, ASettings);\n      Result := Trim(lMode) <> '';\n      Exit;\n    end;\n  finally\n    lConfig.Free;\n  end;\nend;\n\nprocedure RecorderMic185SetSourceChannelMode(ARegistry: TRecorderTagRegistry;\n  const ASourceId, AAddress: string; AFrequencyHz: Double;\n  const ASettings: TMic185ChannelProgramSettings);\nvar\n  I: Integer;\n  lIndex: Integer;\n  lChannels: TJSONArray;\n  lConfig: TJSONObject;\n  lEntry: TRecorderConfiguredDataSource;\n  lItem: TJSONObject;\nbegin\n  lEntry := RecorderConfiguredDataSourcesEnsure(ARegistry, ASourceId,\n    CMic185ModuleName, AFrequencyHz);\n  lConfig := Mic185SourceConfigObject(lEntry, True);\n  try\n    lChannels := Mic185ConfigChannels(lConfig, True);\n    lItem := nil;\n    for I := 0 to lChannels.Count - 1 do\n      if (lChannels.Items[I] is TJSONObject) and\n        SameMic185Address(TJSONObject(lChannels.Items[I]).Get('address', ''),\n          AAddress) then\n      begin\n        lItem := TJSONObject(lChannels.Items[I]);\n        Break;\n      end;\n    if lItem = nil then\n    begin\n      lItem := TJSONObject.Create;\n      lChannels.Add(lItem);\n      lItem.Add('address', AAddress);\n    end;\n    lIndex := lItem.IndexOfName('sourceValueMode');\n    if lIndex >= 0 then\n      lItem.Delete(lIndex);\n    lIndex := lItem.IndexOfName('pollFrequencyHz');\n    if lIndex >= 0 then\n      lItem.Delete(lIndex);\n    lItem.Add('sourceValueMode', RecorderMic185FormatChannelMode(ASettings));\n    lItem.Add('pollFrequencyHz', AFrequencyHz);\n    Mic185StoreSourceConfigObject(lEntry, lConfig);\n  finally\n    lConfig.Free;\n  end;\nend;\n\nfunction RecorderMic185GetSourceChannelUnitName(ARegistry: TRecorderTagRegistry;\n  const ASourceId, AAddress: string): string;\nvar\n  I: Integer;\n  lChannels: TJSONArray;\n  lConfig: TJSONObject;\n  lEntry: TRecorderConfiguredDataSource;\n  lItem: TJSONObject;\nbegin\n  Result := '';\n  lEntry := RecorderConfiguredDataSourcesFind(ARegistry, ASourceId);\n  lConfig := Mic185SourceConfigObject(lEntry, False);\n  try\n    lChannels := Mic185ConfigChannels(lConfig, False);\n    if lChannels = nil then\n      Exit;\n    for I := 0 to lChannels.Count - 1 do\n    begin\n      if not (lChannels.Items[I] is TJSONObject) then\n        Continue;\n      lItem := TJSONObject(lChannels.Items[I]);\n      if SameMic185Address(lItem.Get('address', ''), AAddress) then\n        Exit(Trim(lItem.Get('unitName', '')));\n    end;\n  finally\n    lConfig.Free;\n  end;\nend;\n\nprocedure RecorderMic185SetSourceChannelUnitName(ARegistry: TRecorderTagRegistry;\n  const ASourceId, AAddress: string; AFrequencyHz: Double;\n  const AUnitName: string);\nvar\n  I: Integer;\n  lChannels: TJSONArray;\n  lConfig: TJSONObject;\n  lEntry: TRecorderConfiguredDataSource;\n  lIndex: Integer;\n  lItem: TJSONObject;\n  lUnitName: string;\n  lTag: TRecorderTag;\nbegin\n  lUnitName := Trim(AUnitName);\n  if (ARegistry = nil) or (lUnitName = '') or SameText(lUnitName, 'код') or\n    SameText(lUnitName, 'code') then\n    Exit;\n  lEntry := RecorderConfiguredDataSourcesEnsure(ARegistry, ASourceId,\n    CMic185ModuleName, AFrequencyHz);\n  lConfig := Mic185SourceConfigObject(lEntry, True);\n  try\n    lChannels := Mic185ConfigChannels(lConfig, True);\n    lItem := nil;\n    for I := 0 to lChannels.Count - 1 do\n      if (lChannels.Items[I] is TJSONObject) and\n        SameMic185Address(TJSONObject(lChannels.Items[I]).Get('address', ''),\n          AAddress) then\n      begin\n        lItem := TJSONObject(lChannels.Items[I]);\n        Break;\n      end;\n    if lItem = nil then\n    begin\n      lItem := TJSONObject.Create;\n      lChannels.Add(lItem);\n      lItem.Add('address', AAddress);\n    end;\n    lIndex := lItem.IndexOfName('unitName');\n    if lIndex >= 0 then\n      lItem.Delete(lIndex);\n    lItem.Add('unitName', lUnitName);\n    Mic185StoreSourceConfigObject(lEntry, lConfig);\n    for I := 0 to ARegistry.TagCount - 1 do\n    begin\n      lTag := ARegistry.Tags[I];\n      if SameText(lTag.SourceId, ASourceId) and\n        SameMic185Address(lTag.Address, AAddress) then\n      begin\n        lTag.SourceUnitName := lUnitName;\n        lTag.SourceHardwareOutputUnitName := lUnitName;\n      end;\n    end;\n  finally\n    lConfig.Free;\n  end;\nend;\n\nfunction RecorderMic185GetSourcePowerMaCode(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string): LongWord;\nvar\n  lConfig: TJSONObject;\n  lEntry: TRecorderConfiguredDataSource;\nbegin\n  Result := CMic185DefaultPowerMaCode;\n  lEntry := RecorderConfiguredDataSourcesFind(ARegistry, ASourceId);\n  lConfig := Mic185SourceConfigObject(lEntry, False);\n  try\n    if lConfig <> nil then\n      Result := LongWord(lConfig.Get('powerMaCode',\n        Integer(CMic185DefaultPowerMaCode)));\n  finally\n    lConfig.Free;\n  end;\nend;\n\nprocedure RecorderMic185SetSourcePowerMaCode(ARegistry: TRecorderTagRegistry;\n  const ASourceId: string; APollFrequencyHz: Double; APowerMaCode: LongWord);\nvar\n  lConfig: TJSONObject;\n  lEntry: TRecorderConfiguredDataSource;\n  lIndex: Integer;\nbegin\n  lEntry := RecorderConfiguredDataSourcesEnsure(ARegistry, ASourceId,\n    CMic185ModuleName, APollFrequencyHz);\n  lConfig := Mic185SourceConfigObject(lEntry, True);\n  try\n    lIndex := lConfig.IndexOfName('powerMaCode');\n    if lIndex >= 0 then\n      lConfig.Delete(lIndex);\n    if APowerMaCode = 0 then\n      APowerMaCode := CMic185DefaultPowerMaCode;\n    lConfig.Add('powerMaCode', Integer(APowerMaCode));\n    Mic185StoreSourceConfigObject(lEntry, lConfig);\n  finally\n    lConfig.Free;\n  end;\nend;\n\nprocedure RecorderMic185GetSourceModuleSettings(ARegistry: TRecorderTagRegistry;\n  const ASourceId: st
